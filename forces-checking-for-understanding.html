<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forces: Checking for Understanding</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg classes */
    svg { overflow: visible; display: block; }
    .obj { fill: var(--blank); stroke: var(--navy); stroke-width: 4; }
    .oname { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .flbl { font-family: var(--cond); font-size: 24px; font-weight: 800; fill: var(--navy); }
    .spd { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; fill: var(--mid-grey); }
    .leg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }
    .gnd { stroke: #c9ccd6; stroke-width: 4; }
    .fig line, .fig polyline { stroke: var(--navy); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .fig circle { fill: var(--navy); }
    .sball { fill: #fff; stroke: var(--navy); stroke-width: 4; }
    .spent { fill: var(--navy); }
    .pole { font-family: var(--cond); font-size: 26px; font-weight: 900; text-anchor: middle; }
    .clip { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opts.g2 { grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opts.g2 .opt { min-height: 104px; font-size: 30px; font-weight: 700; padding: 16px 24px; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }
    .gly { flex-shrink: 0; }
    .gd { fill: #b5b9c6; } .go { fill: var(--navy); } .gs { fill: none; stroke: var(--navy); stroke-width: 3; }
    .opt.right .gd { fill: rgba(255,255,255,.6); } .opt.right .go { fill: #fff; } .opt.right .gs { stroke: #fff; }
    .opt.right .gsf { fill: #fff; }
    .pred .opts { width: 380px; }
    .pred .opt { min-height: 76px; font-size: 26px; font-weight: 700; padding: 10px 18px; }

    /* picture choices */
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
    .pgrid.g22 { grid-template-columns: 1fr 1fr; gap: 14px; width: 500px; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 16px 4px 12px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .2s; }
    .pgrid.g22 .pcard { padding: 12px 8px 8px; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; }
    .pcard .cap { font-size: 22px; font-weight: 700; line-height: 1.2; text-align: center; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .quote b { font-style: normal; font-weight: 800; color: var(--pink); }
    .col { display: flex; flex-direction: column; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .replay { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.sm { font-size: 22px; padding: 6px 12px; white-space: normal; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }

    /* sort */
    .sort { display: grid; grid-template-columns: 1fr 360px 1fr; gap: 18px; width: 100%; height: 100%; }
    .bin { border: 3px solid var(--navy); border-radius: 8px; display: flex; flex-direction: column; overflow: visible; transition: box-shadow .2s; }
    .bin.pk { border-color: var(--pink); }
    .bin h3 { margin: 0; padding: 8px 16px 7px; font-family: var(--cond); font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--navy); }
    .bin.pk h3 { background: var(--pink); }
    .bin .sub { font-size: 18px; font-weight: 600; color: var(--mid-grey); padding: 8px 16px 0; }
    .bin .area { flex: 1; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; border-radius: 0 0 6px 6px; transition: background-color .2s; }
    .bin.hover .area, .bin.armed:hover .area { background: rgba(234,0,138,.06); }
    .bin.armed { box-shadow: 0 0 0 4px rgba(234,0,138,.15); cursor: pointer; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }
    .pool.col1 { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 8px; }

    /* force diagram builder */
    .bwrap { position: relative; width: 806px; height: 336px; border: 3px solid var(--navy); border-radius: 8px; flex-shrink: 0; }
    .bwrap > svg { position: absolute; left: 0; top: 0; }
    .slot { position: absolute; width: 200px; height: 50px; border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .slot.armed { border-color: #e7a3c9; cursor: pointer; }
    .slot.filled { border-color: transparent; background: none; }
    .slot.wrong { animation: shake .4s; }
    .slot .tile { box-shadow: none; padding: 5px 14px; font-size: 23px; }
    .bside { width: 320px; display: flex; flex-direction: column; gap: 10px; height: 336px; }
    .bside .pool { flex: 1; flex-direction: column; flex-wrap: nowrap; align-items: center; justify-content: center; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 30px 60px; text-align: center; }
    .scorecard .big { font-family: var(--cond); font-size: 120px; font-weight: 900; color: var(--pink); line-height: 1; }
    .scorecard .dlbl { margin-top: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Checking <span>forces</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', DT = '#b5b9c6', LT = '#f0f3f6';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }

/* ---------- drawing helpers ---------- */
const DIR = { r: 0, l: Math.PI, u: -Math.PI / 2, d: Math.PI / 2 };
function arrowSVG(x, y, ang, len, o = {}) {
    const c = o.c || PK, sw = o.sw || 8, hw = o.hw || 13, hl = Math.min(o.hl || 22, len);
    if (len < 1) return '';
    const ux = Math.cos(ang), uy = Math.sin(ang), ex = x + ux * len, ey = y + uy * len, bx = ex - ux * hl, by = ey - uy * hl, px = -uy * hw, py = ux * hw;
    const f = v => v.toFixed(1);
    let s = len > hl ? `<line x1="${f(x)}" y1="${f(y)}" x2="${f(bx)}" y2="${f(by)}" stroke="${c}" stroke-width="${sw}"/>` : '';
    s += `<polygon points="${f(ex)},${f(ey)} ${f(bx + px)},${f(by + py)} ${f(bx - px)},${f(by - py)}" fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/>`;
    if (o.label) {
        const fs = o.fs || 24, est = o.label.length * fs * .48, full = o.full || len, op = o.lop === undefined ? 1 : o.lop;
        let tx, ty, an;
        if (Math.abs(ux) > .9) {
            ty = y + (o.below ? (o.dy || 34) : -16);
            if (est <= full - 6) { tx = x + ux * full / 2; an = 'middle'; } else { tx = x + ux * 4; an = ux > 0 ? 'start' : 'end'; }
        } else if (Math.abs(uy) > .9) { tx = x + (o.left ? -18 : 18); ty = y + uy * full / 2 + 8; an = o.left ? 'end' : 'start'; }
        else { tx = x + ux * full / 2 + 20; ty = y + uy * full / 2 + 8; an = 'start'; }
        s += `<text class="flbl" x="${f(tx)}" y="${f(ty)}" text-anchor="${an}" opacity="${op}" style="font-size:${fs}px">${o.label}</text>`;
    }
    return s;
}
function ghostArrow(x, y, ang, len) {
    const ux = Math.cos(ang), uy = Math.sin(ang), hl = 20, hw = 12, ex = x + ux * len, ey = y + uy * len, bx = ex - ux * hl, by = ey - uy * hl, px = -uy * hw, py = ux * hw;
    return `<line x1="${x}" y1="${y}" x2="${bx}" y2="${by}" stroke="${GR}" stroke-width="4" stroke-dasharray="7 7"/><polygon points="${ex},${ey} ${bx + px},${by + py} ${bx - px},${by - py}" fill="#fff" stroke="${GR}" stroke-width="3" stroke-linejoin="round"/>`;
}
function growArrow(g, x, y, ang, len, o = {}, dur = 450) {
    const tok = g._tok = (g._tok || 0) + 1;
    return play(dur, k => { g.innerHTML = arrowSVG(x, y, ang, len * easeOut(k), { ...o, full: len, lop: k }); }, () => g._tok === tok && document.body.contains(g));
}
function clearArrow(g) { g._tok = (g._tok || 0) + 1; g.innerHTML = ''; }

const POSE = {
    push: { f1: [-30, 0], f2: [10, 0], hip: [-8, -58], sh: [14, -100], hd: [22, -118], h: [52, -82] },
    pull: { f1: [20, 0], f2: [-18, 0], hip: [-6, -58], sh: [-20, -100], hd: [-27, -117], h: [22, -72] },
    keep: { f1: [-24, 0], f2: [18, 0], hip: [-6, -50], sh: [12, -90], hd: [22, -106], h: [44, -28] }
};
function fig(x, gy, pose, flip, gloves) {
    const p = POSE[pose], q = a => a.join(','), h2 = [p.h[0] - 5, p.h[1] + 7];
    const gl = gloves ? `<circle cx="${p.h[0]}" cy="${p.h[1]}" r="10"/><circle cx="${h2[0]}" cy="${h2[1]}" r="10"/>` : '';
    return `<g class="fig" transform="translate(${x} ${gy}) scale(${flip ? -1 : 1} 1)"><polyline points="${q(p.f1)} ${q(p.hip)} ${q(p.f2)}"/><line x1="${p.hip[0]}" y1="${p.hip[1]}" x2="${p.sh[0]}" y2="${p.sh[1]}"/><polyline points="${q(p.sh)} ${q(h2)}"/><polyline points="${q(p.sh)} ${q(p.h)}"/><circle cx="${p.hd[0]}" cy="${p.hd[1]}" r="14"/>${gl}</g>`;
}
function soccer(r) {
    const k = r / 26, pts = [0, 1, 2, 3, 4].map(i => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return (Math.cos(a) * 10 * k).toFixed(1) + ',' + (Math.sin(a) * 10 * k).toFixed(1); }).join(' ');
    let seams = ''; [0, 1, 2, 3, 4].forEach(i => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; seams += `<line x1="${(Math.cos(a) * 10 * k).toFixed(1)}" y1="${(Math.sin(a) * 10 * k).toFixed(1)}" x2="${(Math.cos(a) * (r - 2)).toFixed(1)}" y2="${(Math.sin(a) * (r - 2)).toFixed(1)}" stroke="${NV}" stroke-width="2"/>`; });
    return `<circle class="sball" r="${r}"/>${seams}<polygon class="spent" points="${pts}"/>`;
}
const clipPath = `<path class="clip" d="M4 2 H30 A5 5 0 0 1 30 12 H6 A3.5 3.5 0 0 1 6 5 H26"/>`;
function uMagnet(x, y, s = 1) {
    return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M40 -32 H0 A32 32 0 0 0 0 32 H40" fill="none" stroke="#b8bcc8" stroke-width="22"/>
        <rect x="34" y="-43" width="28" height="22" fill="${NV}"/><text class="pole" x="48" y="-24" fill="#fff" style="font-size:18px">N</text>
        <rect x="34" y="21" width="28" height="22" fill="${LT}" stroke="${NV}" stroke-width="2"/><text class="pole" x="48" y="39" fill="${NV}" style="font-size:18px">S</text></g>`;
}
const legend = (x, y) => `<circle cx="${x}" cy="${y - 6}" r="6" fill="${DT}"/><text class="leg" x="${x + 14}" y="${y}">Dots show where it was every quarter of a second</text>`;
const ground = (gy, w = 740) => `<line class="gnd" x1="0" x2="${w}" y1="${gy + 2}" y2="${gy + 2}"/>`;
const replayIcon = `<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>`;

/* option glyphs: grey dots are earlier positions, navy dot is the object */
function glyph(k) {
    const D = x => `<circle class="gd" cx="${x}" cy="20" r="3.6"/>`, O = (x, y = 20) => `<circle class="go" cx="${x}" cy="${y}" r="7"/>`;
    let s = '';
    if (k === 'faster') { [4, 13, 27, 48].forEach(x => s += D(x)); s += O(78); }
    else if (k === 'slower') { [4, 34, 56, 70].forEach(x => s += D(x)); s += O(80); }
    else if (k === 'stops') { [4, 28, 45, 56].forEach(x => s += D(x)); s += O(64) + `<rect class="go" x="78" y="7" width="5" height="26" rx="2"/>`; }

        },
        done: extra.done

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sel = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sel) sel.classList.remove('sel'); sel = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sel && !z.locked) put(sel, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(text) {
        const t = el('span', 'tile', text);
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right')) return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { put(t, pool); return; }
            if (sel === t) { deselect(); return; }
            deselect(); sel = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

    const ob = svg.querySelector('.ob'), sq = svg.querySelector('.sq'), rot = svg.querySelector('.rot'), arr = svg.querySelector('.arr'), mv = svg.querySelector('.mv');
    const set = (x, dirTxt) => { ob.setAttribute('transform', `translate(${x.toFixed(1)} ${GY - r})`); rot.setAttribute('transform', `rotate(${(x / r * 57.3).toFixed(1)})`); mv.setAttribute('x', x); mv.setAttribute('y', GY - 2 * r - 22); if (dirTxt) mv.innerHTML = dirTxt; };
    const squash = k => { const s = 1 - .18 * Math.sin(k * Math.PI); sq.setAttribute('transform', `translate(${(r * (1 - s)).toFixed(2)} ${(r * (1 - (1 + (1 - s) * .6))).toFixed(2)}) scale(${s.toFixed(3)} ${(1 + (1 - s) * .6).toFixed(3)})`); };
    return {
        async loop() {
            const id = runId;
            while (id === runId) {
                mv.setAttribute('opacity', 1);
                await play((xw - xs) / sp, k => set(xs + (xw - xs) * k, 'Moving &rarr;'));
                mv.setAttribute('opacity', 0);
                await play(220, squash);
                mv.setAttribute('opacity', 1);
                await play((xw - xs) / sp, k => set(xw - (xw - xs) * k, '&larr; Moving'));
                await wait(700);
            }
        },
        final() {
            set(xw); mv.setAttribute('opacity', 0);
            squash(.25);
            growArrow(arr, -r * .82, 0, DIR.l, 90, { label: 'Push from wall' });
        }
    };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); render(); });
</script>
</body>
