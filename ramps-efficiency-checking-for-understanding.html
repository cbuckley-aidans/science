<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramps and Efficiency: Checking for Understanding</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .body.colb { flex-direction: column; gap: 16px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg classes */
    svg { overflow: visible; display: block; }
    .obj { fill: var(--blank); stroke: var(--navy); stroke-width: 4; }
    .oname { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .flbl { font-family: var(--cond); font-size: 24px; font-weight: 800; fill: var(--navy); }
    .spd { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; fill: var(--mid-grey); }
    .leg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }
    .lbl { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .03em; fill: var(--navy); }
    .lbl.mid { text-anchor: middle; } .lbl.end { text-anchor: end; }
    .lbl.pk { fill: var(--pink); } .lbl.gr { fill: var(--mid-grey); } .lbl.wh { fill: #fff; }
    .lbl.sm { font-size: 18px; } .lbl.lg { font-size: 34px; font-weight: 900; }
    .gnd { stroke: #c9ccd6; stroke-width: 4; }
    .ln { stroke: var(--navy); stroke-width: 5; stroke-linecap: round; fill: none; }
    .load { fill: var(--blank); stroke: var(--navy); stroke-width: 3; }
    .solid, .fulc, .plank { fill: var(--navy); }
    .rampp { fill: var(--blank); stroke: var(--navy); stroke-width: 4; stroke-linejoin: round; }
    .fa line { stroke: var(--pink); stroke-width: 7; } .fa polygon { fill: var(--pink); }
    .fn line { stroke: var(--navy); stroke-width: 7; } .fn polygon { fill: var(--navy); }
    .fg line { stroke: #c3c6d0; stroke-width: 5; } .fg polygon { fill: #c3c6d0; }
    .ti line { stroke-width: 4; }
    .heat { fill: none; stroke: var(--pink); stroke-width: 4; stroke-linecap: round; }
    .axis { stroke: var(--navy); stroke-width: 3; }
    .grid { stroke: #e3e5ec; stroke-width: 1.5; }
    .grid.mn { stroke: #f0f1f5; }
    .angarc { fill: none; stroke: var(--pink); stroke-width: 3; }
    .sball { fill: #fff; stroke: var(--navy); stroke-width: 4; }
    .spent { fill: var(--navy); }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opts.g2 { grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opts.g2 .opt { min-height: 104px; font-size: 27px; font-weight: 700; padding: 16px 24px; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }
    .mcs .opts { flex: 1; }
    .mcs .opt { font-size: 24px; font-weight: 700; padding: 10px 16px; min-height: 72px; }

    /* picture choices */
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 16px 4px 12px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .2s; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; z-index: 1; }
    .pcard .cap { font-size: 22px; font-weight: 700; line-height: 1.2; text-align: center; padding: 0 8px; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .col { display: flex; flex-direction: column; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .replay { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.sm { font-size: 22px; padding: 6px 12px; white-space: normal; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }
    .tile svg { pointer-events: none; }

    /* generic drop zones */
    .dz { border: 3px dashed #c3c6d0; border-radius: 8px; transition: border-color .2s, background-color .2s; }
    .dz.hover, .dz.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .dz.armed { border-color: #e7a3c9; cursor: pointer; }
    .dz.filled { border-color: transparent; background: none; }
    .dz.wrong { animation: shake .4s; }
    .dz .tile { box-shadow: none; }

    /* sort */
    .sort { display: grid; grid-template-columns: 1fr 360px 1fr; gap: 18px; width: 100%; height: 100%; }
    .bin { border: 3px solid var(--navy); border-radius: 8px; display: flex; flex-direction: column; overflow: visible; transition: box-shadow .2s; }
    .bin.pk { border-color: var(--pink); }
    .bin h3 { margin: 0; padding: 8px 16px 7px; font-family: var(--cond); font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--navy); }
    .bin.pk h3 { background: var(--pink); }
    .bin .sub { font-size: 18px; font-weight: 600; color: var(--mid-grey); padding: 8px 16px 0; }
    .bin .area { flex: 1; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; border-radius: 0 0 6px 6px; transition: background-color .2s; }
    .bin.hover .area, .bin.armed:hover .area { background: rgba(234,0,138,.06); }
    .bin.armed { box-shadow: 0 0 0 4px rgba(234,0,138,.15); cursor: pointer; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }
    .pool.col1 { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 8px; }
    .pool.bank { width: 100%; min-height: 76px; flex: none; }

    /* force diagram builder */
    .bwrap { position: relative; width: 806px; height: 336px; border: 3px solid var(--navy); border-radius: 8px; flex-shrink: 0; }
    .bwrap > svg { position: absolute; left: 0; top: 0; }
    .slot { position: absolute; width: 200px; height: 50px; border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .slot.armed { border-color: #e7a3c9; cursor: pointer; }
    .slot.filled { border-color: transparent; background: none; }
    .slot.wrong { animation: shake .4s; }
    .slot .tile { box-shadow: none; padding: 5px 14px; font-size: 23px; }
    .bside { width: 320px; display: flex; flex-direction: column; gap: 10px; height: 336px; }
    .bside .pool { flex: 1; flex-direction: column; flex-wrap: nowrap; align-items: center; justify-content: center; }

    /* cloze */
    .cloze { width: 100%; font-size: 30px; font-weight: 600; line-height: 2.2; }
    .blank { display: inline-flex; vertical-align: middle; align-items: center; justify-content: center; min-width: 172px; height: 56px; margin: 0 6px; padding: 0 2px; }
    .blank .tile { padding: 4px 14px; }
    .blank.filled { min-width: 0; }

    /* label cards */
    .lgrid { display: grid; gap: 14px; width: 100%; }
    .lcard { border: 3px solid var(--navy); border-radius: 8px; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: #fff; }
    .lcard .nm { font-family: var(--cond); font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; text-align: center; line-height: 1.05; }
    .slot2 { width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: center; padding: 3px; }
    .slot2 .tile { font-size: 21px; padding: 5px 10px; white-space: normal; }

    /* rank */
    .rwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .rrow { display: flex; gap: 16px; justify-content: center; }
    .rslot { position: relative; display: flex; align-items: center; justify-content: center; }
    .rslot::before { content: attr(data-n); position: absolute; font-family: var(--cond); font-size: 64px; font-weight: 900; color: #e3e5ec; }
    .rscale { display: flex; align-items: center; gap: 14px; width: 100%; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--navy); }
    .rscale i { flex: 1; height: 4px; background: var(--navy); position: relative; }
    .rscale i::after { content: ''; position: absolute; right: -2px; top: -8px; border-left: 16px solid var(--navy); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
    .tile.rt { padding: 6px; white-space: normal; }
    .rc { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 19px; font-weight: 600; line-height: 1.2; padding: 4px 10px; }
    .rc b { font-family: var(--cond); font-size: 25px; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; }
    .rv { display: none; font-family: var(--cond); font-size: 28px; font-weight: 900; font-style: normal; margin-top: 2px; }
    .tile.right .rv { display: block; }
    .tile.right .rampp { fill: #fff; stroke: #fff; }
    .tile.right .lbl { fill: #fff; }
    .tile.right .gnd { stroke: rgba(255,255,255,.5); }
    .tile.right .solid { fill: #fff; }

    /* calculate */
    .cpanel { flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
    .fchip { background: var(--blank); border-radius: 8px; padding: 10px 16px; font-size: 22px; font-weight: 600; line-height: 1.3; }
    .fchip b { color: var(--pink); font-weight: 800; }
    .eq { font-family: var(--cond); font-size: 36px; font-weight: 800; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .eq small { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; color: var(--mid-grey); width: 100%; margin-bottom: -8px; }
    .num { width: 116px; height: 60px; font-family: var(--cond); font-size: 34px; font-weight: 800; color: var(--navy); text-align: center; border: 3px solid var(--navy); border-radius: 8px; background: #fff;
        -webkit-user-select: text; user-select: text; transition: background-color .2s, border-color .2s, color .2s; }
    .num:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.18); }
    .num.right, .num:disabled { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; -webkit-text-fill-color: #fff; }
    .num.wrong { border-style: dashed; background: var(--tint); animation: shake .4s; }

    /* true or false */
    .tf { width: 100%; }
    .tfh, .tfrow { display: grid; grid-template-columns: 1fr 136px 136px; gap: 14px; align-items: center; }
    .tfh { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mid-grey); padding-bottom: 6px; border-bottom: 4px solid var(--navy); }
    .tfh span:not(:first-child) { text-align: center; }
    .tfrow { font-size: 25px; font-weight: 600; padding: 10px 0; border-bottom: 2px solid var(--light-grey); line-height: 1.25; }
    .tfb { font-family: var(--cond); font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; height: 54px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; color: var(--navy); cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .tfb:hover:not(:disabled) { background: #f6f7fb; }
    .tfb.sel { background: var(--tint); border-color: var(--pink); }
    .tfb.right, .tfb.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .tfb.wrong { border-style: dashed; opacity: .45; animation: shake .4s; }
    .tfb:disabled { cursor: default; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 30px 60px; text-align: center; }
    .scorecard .big { font-family: var(--cond); font-size: 120px; font-weight: 900; color: var(--pink); line-height: 1; }
    .scorecard .dlbl { margin-top: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Checking <span>ramps and efficiency</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', DT = '#b5b9c6', LT = '#f0f3f6';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }
function loop(fn) { const id = runId, st = performance.now(); const f = n => { if (id !== runId) return; fn(n - st); requestAnimationFrame(f); }; requestAnimationFrame(f); }
/* eased 0 to 1, hold, then snap back to 0 */
function cycle(t, period = 3800, move = 2200) { const k = t % period; return k < move ? easeInOut(k / move) : (k < period - 500 ? 1 : 0); }

/* ---------- drawing helpers ---------- */
const f1 = v => (+v).toFixed(1), deg = a => a * Math.PI / 180;
const T = (x, y, s, c = '') => `<text class="lbl ${c}" x="${f1(x)}" y="${f1(y)}">${s}</text>`;

function mcCore(els, q, extra = {}) {
    let sel = null;
    els.forEach((b, i) => b.onclick = () => {
        if (mode !== 'check' || b.classList.contains('wrong')) return;
        els.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = i; refresh();
    });
    return {
        instr: extra.instr || 'Choose an answer, then press <b>Check</b>.',
        ready: () => sel !== null,
        check() {
            const b = els[sel];
            b.classList.remove('sel');
            if (sel === q.answer) { b.classList.add('right'); els.forEach(x => x.disabled = true); return { ok: true }; }
            b.classList.add('wrong'); b.disabled = true;
            const h = q.opts[sel].hint; sel = null; return { ok: false, hint: h };
        },
        done: extra.done
    };
}

            gh.insertAdjacentHTML('beforeend', `<g data-d="${d}">${ghostArrow(A[d][0], A[d][1], DIR[d], len)}</g>`);
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); ar.appendChild(g);
            const s = el('div', 'slot'); s.style.left = SL[d][0] + 'px'; s.style.top = SL[d][1] + 'px'; s.tabIndex = 0; s.setAttribute('aria-label', { u: 'Up arrow', d: 'Down arrow', l: 'Left arrow', r: 'Right arrow' }[d]);
            wrap.appendChild(s);
            const ghost = gh.querySelector(`[data-d="${d}"]`);
            return { el: s, box: s, cap: 1, dir: d,
                onPut: () => { s.classList.add('filled'); ghost.style.display = 'none'; growArrow(g, A[d][0], A[d][1], DIR[d], len); },
                onTake: () => { s.classList.remove('filled'); ghost.style.display = ''; clearArrow(g); } };
        });
        const zPool = { el: pool, box: pool, cap: Infinity, pool: true };
        const D = dnd(zPool, zones, () => { zones.forEach(z => z.el.classList.remove('wrong')); refresh(); });
        shuffle(q.tiles).forEach(t => pool.appendChild(D.tile(t)));
        return {
            instr: 'Drag forces onto the arrows. Leave any arrow empty if no force acts that way.',
            ready: () => zones.some(z => z.box.querySelector('.tile')),
            check() {
                let hint = null, bad = 0;
                zones.forEach(z => {
                    const t = z.box.querySelector('.tile'); z.el.classList.remove('wrong');
                    if (!t) return;
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (q.answer[z.dir] === t.k) { t.classList.add('right'); z.locked = true; }
                    else { bad++; t.classList.add('wrong'); z.el.classList.add('wrong'); if (!hint) hint = q.hints[t.k] || q.wrongDir[t.k]; }
                });
                if (bad) return { ok: false, hint: (bad > 1 ? `${bad} labels need changing. ` : '') + hint };
                const miss = Object.keys(q.answer).find(d => !zones.find(z => z.dir === d).box.querySelector('.tile'));
                if (miss) return { ok: false, hint: 'Good so far, but a force is missing. ' + q.missing[miss] };
                return { ok: true };
            }
        };
    },
    cloze(q, body) {
        body.classList.add('colb');
        const txt = el('div', 'cloze');
        txt.innerHTML = q.text.replace(/\{(\d+)\}/g, (m, n) => `<span class="blank dz" data-i="${n}" tabindex="0" role="button" aria-label="Gap ${+n + 1}"></span>`);
        const pool = el('div', 'pool bank');
        body.append(txt, pool);
        const zones = [...txt.querySelectorAll('.blank')].map(s => ({ el: s, box: s, cap: 1, i: +s.dataset.i,
            onPut: () => s.classList.add('filled'), onTake: () => s.classList.remove('filled') }));
        const zPool = { el: pool, box: pool, cap: Infinity, pool: true };
        const D = dnd(zPool, zones, () => { zones.forEach(z => z.el.classList.remove('wrong')); refresh(); });
        shuffle(q.bank).forEach(w => pool.appendChild(D.tile(w)));
        const acc = i => [].concat(q.answer[i]);
        return {
            instr: 'Drag a word into each gap (or tap a word, then a gap), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check() {
                let hint = null, bad = 0;
                zones.forEach(z => {
                    const t = z.box.querySelector('.tile'); if (z.locked) return;
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (acc(z.i).includes(t.k)) { t.classList.add('right'); z.locked = true; }
                    else { bad++; t.classList.add('wrong'); z.el.classList.add('wrong'); if (!hint) hint = q.hints[z.i]; }
                });
                return bad ? { ok: false, hint: (bad > 1 ? `${bad} gaps need changing. ` : '') + hint } : { ok: true };
            }
        };
    },
    label(q, body) {
        body.classList.add('colb');
        const grid = el('div', 'lgrid'); grid.style.gridTemplateColumns = `repeat(${q.cards.length}, 1fr)`;
        const zones = q.cards.map((c, i) => {
            const card = el('div', 'lcard', c.pic);
            const s = el('div', 'slot2 dz'); s.tabIndex = 0; s.setAttribute('role', 'button'); s.setAttribute('aria-label', `Card ${i + 1}`);
            card.appendChild(s); grid.appendChild(card);
            return { el: s, box: s, cap: 1, ans: c.a, onPut: () => s.classList.add('filled'), onTake: () => s.classList.remove('filled') };
        });
        const pool = el('div', 'pool bank');
        body.append(grid, pool);
        const zPool = { el: pool, box: pool, cap: Infinity, pool: true };
        const D = dnd(zPool, zones, () => { zones.forEach(z => z.el.classList.remove('wrong')); refresh(); });
        shuffle(q.tiles).forEach(w => { const t = D.tile(w); t.classList.add('sm'); pool.appendChild(t); });
        if (q.anim) q.anim(grid);
        return {
            instr: 'Drag each label onto a card (or tap a label, then a card), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check() {
                let hint = null, bad = 0;
                zones.forEach(z => {
                    const t = z.box.querySelector('.tile'); if (z.locked) return;
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.k === z.ans) { t.classList.add('right'); z.locked = true; }
                    else { bad++; t.classList.add('wrong'); z.el.classList.add('wrong'); if (!hint) hint = q.hints[t.k]; }
                });
                return bad ? { ok: false, hint: (bad > 1 ? `${bad} labels need moving. ` : '') + hint } : { ok: true };
            }
        };
    },
    rank(q, body) {
        body.classList.add('colb');
        const [sw, sh] = q.slot;
        const wrap = el('div', 'rwrap');
        const row = el('div', 'rrow');
        const zones = q.order.map((_, i) => {
            const s = el('div', 'rslot dz'); s.dataset.n = i + 1; s.style.width = sw + 'px'; s.style.height = sh + 'px';
            s.tabIndex = 0; s.setAttribute('role', 'button'); s.setAttribute('aria-label', `Position ${i + 1}`);
            row.appendChild(s);
            return { el: s, box: s, cap: 1, i, onPut: () => s.classList.add('filled'), onTake: () => s.classList.remove('filled') };
        });
        const scale = el('div', 'rscale', `<span>${q.ends[0]}</span><i></i><span>${q.ends[1]}</span>`);
        scale.style.width = (q.order.length * (sw + 16) - 16) + 'px';
        wrap.append(row, scale);
        const pool = el('div', 'pool bank');
        body.append(wrap, pool);
        const zPool = { el: pool, box: pool, cap: Infinity, pool: true };
        const D = dnd(zPool, zones, () => refresh());
        shuffle(q.items).forEach(it => { const t = D.tile(it.html, it.k); t.classList.add('rt'); pool.appendChild(t); });
        return {
            instr: 'Drag the cards into order (or tap a card, then a space), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check() {
                let bad = 0;
                zones.forEach(z => {
                    const t = z.box.querySelector('.tile'); if (z.locked) return;
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.k === q.order[z.i]) { t.classList.add('right'); z.locked = true; }
                    else { bad++; t.classList.add('wrong'); }
                });
                return bad ? { ok: false, hint: `${bad} cards are in the wrong place. ${q.hint}` } : { ok: true };
            },
            done: () => q.done && q.done(zones.map(z => z.box.querySelector('.tile')))
        };
    },
    calc(q, body) {
        const sc = sceneBox(q.sw || 560, q.sw || 560);
        const pnl = el('div', 'cpanel');
        (q.chips || []).forEach(c => pnl.appendChild(el('div', 'fchip', c)));
        q.lines.forEach((line, li) => { pnl.appendChild(el('div', 'eq', line.replace(/\[\]/g, () => `<input class="num" inputmode="decimal" autocomplete="off" spellcheck="false">`))); });
        body.append(sc, pnl);
        const ins = [...pnl.querySelectorAll('input')];
        ins.forEach((inp, i) => {
            inp.setAttribute('aria-label', `Answer ${i + 1}`);
            inp.addEventListener('input', () => { inp.classList.remove('wrong'); refresh(); });
            inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) { e.preventDefault(); btn.click(); } });
        });
        const S = SCENES[q.scene](sc.querySelector('svg'), q);
        S.start();
        const val = inp => parseFloat(inp.value.replace(/,/g, '.').replace(/[^0-9.\-]/g, ''));
        return {
            instr: 'Type your answers in the boxes, then press <b>Check</b>.',
            ready: () => ins.every(i => i.value.trim() !== ''),
            check() {
                let hint = null, bad = 0;
                const vals = ins.map(val);
                ins.forEach((inp, i) => {
                    if (inp.disabled) return;
                    const a = q.ans[i], v = vals[i], lo = a.min !== undefined ? a.min : a.v, hi = a.max !== undefined ? a.max : a.v;
                    inp.classList.remove('wrong'); void inp.offsetWidth;
                    if (!isNaN(v) && v >= lo - 1e-9 && v <= hi + 1e-9) { inp.classList.add('right'); inp.disabled = true; }
                    else { bad++; inp.classList.add('wrong'); if (!hint) hint = typeof a.hint === 'function' ? a.hint(v, vals) : a.hint; }
                });
                if (bad) { const f = ins.find(i => !i.disabled); if (f) f.focus(); return { ok: false, hint: (bad > 1 ? `${bad} answers need changing. ` : '') + hint }; }
                return { ok: true };
            },
            done: () => S.done && S.done()
        };
    },
    tf(q, body) {
        body.classList.add('colb');
        const wrap = el('div', 'tf', '<div class="tfh"><span>Statement</span><span>True</span><span>False</span></div>');
        const rows = q.rows.map(r => {
            const row = el('div', 'tfrow', `<span>${r[0]}</span>`);
            const bt = el('button', 'tfb', 'True'), bf = el('button', 'tfb', 'False');
            row.append(bt, bf); wrap.appendChild(row);
            const R = { row, bt, bf, ans: r[1], hint: r[2], sel: null, locked: false };
            const pick = (v, b) => { if (mode !== 'check' || R.locked || b.disabled) return; R.sel = v; bt.classList.toggle('sel', v === true); bf.classList.toggle('sel', v === false); refresh(); };
            bt.onclick = () => pick(true, bt); bf.onclick = () => pick(false, bf);
            return R;
        });
        body.appendChild(wrap);
        return {
            instr: 'Choose true or false for each statement, then press <b>Check</b>.',
            ready: () => rows.every(R => R.locked || R.sel !== null),
            check() {
                let hint = null, bad = 0;
                rows.forEach(R => {
                    if (R.locked) return;
                    const b = R.sel ? R.bt : R.bf; b.classList.remove('sel');
                    if (R.sel === R.ans) { b.classList.add('right'); R.locked = true; R.bt.disabled = R.bf.disabled = true; }
                    else { bad++; b.classList.add('wrong'); b.disabled = true; R.sel = null; if (!hint) hint = R.hint; }
                });
                return bad ? { ok: false, hint: (bad > 1 ? `${bad} statements need changing. ` : '') + hint } : { ok: true };
            }
        };
    }
};

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sel = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sel) sel.classList.remove('sel'); sel = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sel && !z.locked) put(sel, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(html, key) {
        const t = el('span', 'tile', html);
        t.k = key === undefined ? html : key;
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right')) return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { put(t, pool); return; }
            if (sel === t) { deselect(); return; }
            deselect(); sel = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); render(); });
