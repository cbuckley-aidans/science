<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levers and Net Force: Checking for Understanding</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg classes */
    svg { overflow: visible; display: block; }
    .obj { fill: var(--blank); stroke: var(--navy); stroke-width: 4; }
    .oname { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .flbl { font-family: var(--cond); font-size: 24px; font-weight: 800; fill: var(--navy); }
    .spd { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; fill: var(--mid-grey); }
    .leg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }
    .gnd { stroke: #c9ccd6; stroke-width: 4; }
    .fig line, .fig polyline { stroke: var(--navy); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .fig circle { fill: var(--navy); }
    .sball { fill: #fff; stroke: var(--navy); stroke-width: 4; }
    .spent { fill: var(--navy); }
    .pole { font-family: var(--cond); font-size: 26px; font-weight: 900; text-anchor: middle; }
    .clip { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opts.g2 { grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opts.g2 .opt { min-height: 104px; font-size: 30px; font-weight: 700; padding: 16px 24px; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }
    .gly { flex-shrink: 0; }
    .gd { fill: #b5b9c6; } .go { fill: var(--navy); } .gs { fill: none; stroke: var(--navy); stroke-width: 3; }
    .opt.right .gd { fill: rgba(255,255,255,.6); } .opt.right .go { fill: #fff; } .opt.right .gs { stroke: #fff; }
    .opt.right .gsf { fill: #fff; }
    .pred .opts { width: 380px; }
    .pred .opt { min-height: 76px; font-size: 26px; font-weight: 700; padding: 10px 18px; }

    /* picture choices */
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
    .pgrid.g22 { grid-template-columns: 1fr 1fr; gap: 14px; width: 500px; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 16px 4px 12px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .2s; }
    .pgrid.g22 .pcard { padding: 12px 8px 8px; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; }
    .pcard .cap { font-size: 22px; font-weight: 700; line-height: 1.2; text-align: center; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .quote b { font-style: normal; font-weight: 800; color: var(--pink); }
    .col { display: flex; flex-direction: column; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .replay { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.sm { font-size: 22px; padding: 6px 12px; white-space: normal; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }

    /* sort */
    .sort { display: grid; grid-template-columns: 1fr 360px 1fr; gap: 18px; width: 100%; height: 100%; }
    .bin { border: 3px solid var(--navy); border-radius: 8px; display: flex; flex-direction: column; overflow: visible; transition: box-shadow .2s; }
    .bin.pk { border-color: var(--pink); }
    .bin h3 { margin: 0; padding: 8px 16px 7px; font-family: var(--cond); font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--navy); }
    .bin.pk h3 { background: var(--pink); }
    .bin .sub { font-size: 18px; font-weight: 600; color: var(--mid-grey); padding: 8px 16px 0; }
    .bin .area { flex: 1; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; border-radius: 0 0 6px 6px; transition: background-color .2s; }
    .bin.hover .area, .bin.armed:hover .area { background: rgba(234,0,138,.06); }
    .bin.armed { box-shadow: 0 0 0 4px rgba(234,0,138,.15); cursor: pointer; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }
    .pool.col1 { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 8px; }

    /* force diagram builder */
    .bwrap { position: relative; width: 806px; height: 336px; border: 3px solid var(--navy); border-radius: 8px; flex-shrink: 0; }
    .bwrap > svg { position: absolute; left: 0; top: 0; }
    .slot { position: absolute; width: 200px; height: 50px; border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .slot.armed { border-color: #e7a3c9; cursor: pointer; }
    .slot.filled { border-color: transparent; background: none; }
    .slot.wrong { animation: shake .4s; }
    .slot .tile { box-shadow: none; padding: 5px 14px; font-size: 23px; }
    .bside { width: 320px; display: flex; flex-direction: column; gap: 10px; height: 336px; }
    .bside .pool { flex: 1; flex-direction: column; flex-wrap: nowrap; align-items: center; justify-content: center; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 30px 60px; text-align: center; }
    .scorecard .big { font-family: var(--cond); font-size: 120px; font-weight: 900; color: var(--pink); line-height: 1; }
    .scorecard .dlbl { margin-top: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }

    /* lever markers and brackets */
    .mkr circle { stroke-width: 3; }
    .mkr text { font-family: var(--cond); font-size: 20px; font-weight: 900; text-anchor: middle; }
    .mF circle { fill: var(--navy); stroke: var(--navy); } .mF text { fill: #fff; }
    .mL circle { fill: #fff; stroke: var(--navy); } .mL text { fill: var(--navy); }
    .mE circle { fill: var(--pink); stroke: var(--pink); } .mE text { fill: #fff; }
    .br line { stroke: #9a9a9a; stroke-width: 5; stroke-linecap: round; transition: stroke .4s; }
    .br.pk line { stroke: var(--pink); }
    .br.e.on line { stroke: var(--pink); } .br.r.on line { stroke: var(--navy); }
    .gdl { stroke: #c3c6d0; stroke-width: 2; stroke-dasharray: 5 6; }
    .tagt { font-family: var(--cond); font-size: 24px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; fill: var(--pink); }
    .lbl { font-family: var(--cond); font-size: 21px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; fill: var(--mid-grey); }
    .lbl.nv { fill: var(--navy); } .lbl.pk { fill: var(--pink); }
    .fadein { animation: capIn .45s var(--ease) both; }

    /* hotspots */
    .hs { cursor: pointer; outline: none; }
    .hs .halo { fill: transparent; }
    .hs .ring { fill: #fff; stroke: var(--navy); stroke-width: 3.5; transition: fill .2s, stroke .2s; }
    .hs .lead { stroke: var(--navy); stroke-width: 2.5; }
    .hs .dot { fill: var(--navy); stroke: #fff; stroke-width: 2; transition: fill .2s; }
    .hs text { font-family: var(--cond); font-size: 25px; font-weight: 900; fill: var(--navy); text-anchor: middle; pointer-events: none; }
    .hs .pulse { fill: none; stroke: var(--pink); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; animation: hsPulse 2.4s var(--ease) infinite; }
    @keyframes hsPulse { 0% { opacity: .7; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.6); } }
    .hs:hover .ring { fill: var(--tint); }
    .hs.sel .ring { fill: var(--pink); stroke: var(--pink); } .hs.sel text { fill: #fff; } .hs.sel .dot { fill: var(--pink); } .hs.sel .lead { stroke: var(--pink); }
    .hs:focus-visible .ring { stroke: var(--pink); stroke-width: 6; }
    .hs.wrong { opacity: .3; cursor: default; } .hs.wrong .ring { stroke-dasharray: 5 4; }
    .hs.right .ring { fill: var(--pink); stroke: var(--pink); } .hs.right text { fill: #fff; } .hs.right .dot { fill: var(--pink); } .hs.right .lead { stroke: var(--pink); }
    .hs.done { cursor: default; } .hs.done .pulse, .hs.wrong .pulse { display: none; }
    .hs.fade { opacity: .25; }

    /* three-group sort */
    .sort3 { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr; gap: 14px 18px; width: 100%; height: 100%; }
    .sort3 .pool { grid-column: 1 / -1; min-height: 130px; padding: 12px; }
    .sort3 .bin.alt { border-color: var(--navy); }

    /* cloze */
    .cloze { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .ccard { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 24px; border: 3px solid var(--navy); border-radius: 8px; padding: 10px 24px; }
    .ccard.pk { border-color: var(--pink); }
    .chd2 { font-family: var(--cond); font-size: 32px; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .ccard.pk .chd2 { color: var(--pink); }
    .ctext { font-size: 26px; font-weight: 600; line-height: 2.05; }
    .blank { display: inline-flex; vertical-align: middle; align-items: center; justify-content: center; min-width: 150px; height: 50px; margin: 0 4px; border: 3px dashed #c3c6d0; border-radius: 8px; line-height: 1;
        transition: border-color .2s, background-color .2s; }
    .blank.hover, .blank.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .blank.armed { border-color: #e7a3c9; cursor: pointer; }
    .blank.filled { border-color: transparent; }
    .blank.wrong { animation: shake .4s; }
    .blank .tile { box-shadow: none; padding: 4px 14px; font-size: 24px; }
    .pool.row { min-height: 74px; }

    /* calculate */
    .calcrow { display: flex; align-items: center; gap: 14px; }
    .clbl { font-family: var(--cond); font-size: 34px; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; margin-right: 4px; }
    .num { width: 150px; height: 64px; font-family: var(--cond); font-size: 40px; font-weight: 900; color: var(--navy); text-align: center; background: #fff;
        border: 3px solid var(--navy); border-radius: 8px; outline: none; user-select: text; -webkit-user-select: text; transition: background-color .2s, border-color .2s, color .2s; }
    .num:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.18); }
    .num.wrong { animation: shake .4s; border-style: dashed; }
    .num.right { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: none; }
    .unit { font-family: var(--cond); font-size: 34px; font-weight: 900; margin-right: 22px; }
    .seg { display: flex; gap: 10px; }
    .dirb { display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px;
        height: 64px; padding: 0 20px; cursor: pointer; transition: background-color .2s, border-color .2s, color .2s; }
    .dirb svg { width: 34px; height: 20px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .dirb:hover:not(:disabled) { background: #f6f7fb; }
    .dirb.sel { background: var(--tint); border-color: var(--pink); }
    .dirb.right { background: var(--pink); border-color: var(--pink); color: #fff; }
    .dirb:disabled { cursor: default; }

    /* slider */
    .slwrap { display: flex; flex-direction: column; align-items: center; }
    .slrow { display: flex; align-items: center; gap: 18px; width: 720px; margin-top: 10px; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mid-grey); }
    .slrow input { flex: 1; accent-color: var(--pink); height: 30px; cursor: pointer; }
    .slrow input:disabled { cursor: default; }
    .grab { cursor: ew-resize; }
    .sort { grid-template-columns: 1fr 400px 1fr; grid-template-rows: minmax(0, 1fr); }
    .sort .tile { font-size: 22px; padding: 6px 13px; }
    .br polygon { fill: #9a9a9a; transition: fill .4s; }
    .br.e.on polygon { fill: var(--pink); } .br.r.on polygon { fill: var(--navy); }
    .ldr { stroke: var(--navy); stroke-width: 2.5; }
    .ldot { fill: var(--navy); stroke: #fff; stroke-width: 2.5; }
    .slot .tile { width: 100%; }

    /* classify pictures */
    .cgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; width: 100%; }
    .ccl { display: flex; align-items: center; gap: 10px; border: 3px solid var(--navy); border-radius: 8px; padding: 8px 10px; background: #fff; transition: border-color .2s, box-shadow .2s; }
    .ccl svg { flex-shrink: 0; }
    .ccl .side { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
    .ccl .nm { white-space: nowrap; font-family: var(--cond); font-size: 19px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; line-height: 1; margin-bottom: 4px; }
    .cb { font-family: inherit; font-size: 19px; font-weight: 700; color: var(--navy); background: #fff; border: 2.5px solid var(--navy); border-radius: 6px; height: 32px; cursor: pointer; transition: background-color .2s, border-color .2s, color .2s; }
    .cb:hover:not(:disabled) { background: #f6f7fb; }
    .cb.sel { background: var(--tint); border-color: var(--pink); }
    .cb.right { background: var(--pink); border-color: var(--pink); color: #fff; }
    .cb:disabled { cursor: default; }
    .ccl.right { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.15); }
    .ccl.wrong { border-style: dashed; animation: shake .4s; }
    .mks text { font-size: 16px; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Checking <span>levers and net force</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', DT = '#b5b9c6', LT = '#f0f3f6', MG = '#9a9a9a';
const NS = 'http://www.w3.org/2000/svg';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function sel(tag, cls, html) { const e = document.createElementNS(NS, tag); if (cls) e.setAttribute('class', cls); if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeIn = t => t * t, easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }

/* ---------- drawing helpers ---------- */
const f1 = v => (Math.round(v * 10) / 10).toString();
const DIR = { r: 0, l: Math.PI, u: -Math.PI / 2, d: Math.PI / 2 };
function arrowSVG(x, y, ang, len, o = {}) {
    const c = o.c || PK, sw = o.sw || 8, hw = o.hw || 13, hl = Math.min(o.hl || 22, len);
    if (len < 1) return '';
    const ux = Math.cos(ang), uy = Math.sin(ang), ex = x + ux * len, ey = y + uy * len, bx = ex - ux * hl, by = ey - uy * hl, px = -uy * hw, py = ux * hw;
    let s = len > hl ? `<line x1="${f1(x)}" y1="${f1(y)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="${c}" stroke-width="${sw}"/>` : '';
    s += `<polygon points="${f1(ex)},${f1(ey)} ${f1(bx + px)},${f1(by + py)} ${f1(bx - px)},${f1(by - py)}" fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/>`;
    if (o.label) {
        const fs = o.fs || 24, est = o.label.length * fs * .48, full = o.full || len, op = o.lop === undefined ? 1 : o.lop;
        let tx, ty, an;
        if (Math.abs(ux) > .9) {
            ty = y + (o.below ? (o.dy || 34) : -16);
            if (est <= full - 6) { tx = x + ux * full / 2; an = 'middle'; } else { tx = x + ux * 4; an = ux > 0 ? 'start' : 'end'; }
        } else if (Math.abs(uy) > .9) { tx = x + (o.left ? -18 : 18); ty = y + uy * full / 2 + 8; an = o.left ? 'end' : 'start'; }
        else { tx = x + ux * full / 2 + 20; ty = y + uy * full / 2 + 8; an = 'start'; }
        s += `<text class="flbl" x="${f1(tx)}" y="${f1(ty)}" text-anchor="${an}" opacity="${op}" style="font-size:${fs}px${o.lc ? ';fill:' + o.lc : ''}">${o.label}</text>`;
    }
    return s;
}
function growArrow(g, x, y, ang, len, o = {}, dur = 450) {
    const tok = g._tok = (g._tok || 0) + 1;
    return play(dur, k => { g.innerHTML = arrowSVG(x, y, ang, len * easeOut(k), { ...o, full: len, lop: k }); }, () => g._tok === tok && document.body.contains(g));
}
function clearArrow(g) { g._tok = (g._tok || 0) + 1; g.innerHTML = ''; }
const mark = (x, y, t) => `<g class="mkr m${t}"><circle cx="${f1(x)}" cy="${f1(y)}" r="17"/><text x="${f1(x)}" y="${f1(y + 7)}">${t}</text></g>`;
const bracket = (x1, x2, y, cls) => `<g class="br ${cls}"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y - 9}" x2="${x1}" y2="${y + 9}"/><line x1="${x2}" y1="${y - 9}" x2="${x2}" y2="${y + 9}"/></g>`;
const guide = (x, y1, y2) => `<line class="gdl" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`;
const ground = (gy, w = 740, x0 = 0) => `<line class="gnd" x1="${x0}" x2="${w}" y1="${gy + 2}" y2="${gy + 2}"/>`;
const replayIcon = `<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>`;
const legend = (x, y) => `<circle cx="${x}" cy="${y - 6}" r="6" fill="${DT}"/><text class="leg" x="${x + 14}" y="${y}">Dots show where it was every quarter of a second</text>`;

const POSE = {
    pull: { f1: [20, 0], f2: [-18, 0], hip: [-6, -58], sh: [-20, -100], hd: [-27, -117], h: [22, -72] }
};
function fig(x, gy, pose, flip, k = 1) {
    const p = POSE[pose], q = a => a.join(','), h2 = [p.h[0] - 5, p.h[1] + 7];
    return `<g class="fig" transform="translate(${x} ${gy}) scale(${flip ? -k : k} ${k})"><polyline points="${q(p.f1)} ${q(p.hip)} ${q(p.f2)}"/><line x1="${p.hip[0]}" y1="${p.hip[1]}" x2="${p.sh[0]}" y2="${p.sh[1]}"/><polyline points="${q(p.sh)} ${q(h2)}"/><polyline points="${q(p.sh)} ${q(p.h)}"/><circle cx="${p.hd[0]}" cy="${p.hd[1]}" r="14"/></g>`;
}

/* option glyphs: grey dots are earlier positions, navy dot is the object */
function glyph(k) {
    const D = x => `<circle class="gd" cx="${x}" cy="20" r="3.6"/>`, O = (x, y = 20) => `<circle class="go" cx="${x}" cy="${y}" r="7"/>`;
    let s = '';
    if (k === 'faster') { [4, 13, 27, 48].forEach(x => s += D(x)); s += O(78); }
    else if (k === 'slower') { [4, 34, 56, 70].forEach(x => s += D(x)); s += O(80); }
    else if (k === 'steady') { [4, 22, 40, 58].forEach(x => s += D(x)); s += O(76); }
    else if (k === 'stops') { [4, 28, 45, 56].forEach(x => s += D(x)); s += O(64) + `<rect class="go" x="78" y="7" width="5" height="26" rx="2"/>`; }
    return `<svg class="gly" viewBox="0 0 88 40" width="74" height="34">${s}</svg>`;
}
const EFFECT = { faster: 'Speeds up', slower: 'Slows down', steady: 'Steady speed', stops: 'Stops' };

/* =========================================================
   PICTURES AND STATIC SCENES
   ========================================================= */

/* Q1: label a class 1 lever */
/* dimension line with a gap for a label box, arrowheads at both ends */
const dim = (x1, x2, y, g1, g2, cls) => `<g class="br ${cls}"><line x1="${x1 + 10}" y1="${y}" x2="${g1 - 6}" y2="${y}"/><line x1="${g2 + 6}" y1="${y}" x2="${x2 - 10}" y2="${y}"/>
    <polygon points="${x1},${y} ${x1 + 16},${y - 8} ${x1 + 16},${y + 8}"/><polygon points="${x2},${y} ${x2 - 16},${y - 8} ${x2 - 16},${y + 8}"/></g>`;
const leader = (x1, y1, x2, y2) => `<line class="ldr" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle class="ldot" cx="${x2}" cy="${y2}" r="7"/>`;
const LABEL_SCENE = `<line class="gnd" x1="20" x2="780" y1="232" y2="232"/>
    <rect x="50" y="140" width="740" height="14" rx="3" fill="${NV}"/>
    <polygon points="420,154 382,230 458,230" fill="${NV}"/>
    <path class="obj" d="M674 140 L666 104 L690 78 L732 72 L765 90 L774 140 Z" stroke-linejoin="round"/>
    ${arrowSVG(90, 24, DIR.d, 110)}
    ${guide(90, 160, 290)}${guide(420, 238, 290)}${guide(720, 160, 290)}
    ${dim(90, 420, 278, 155, 355, 'e')}${dim(420, 720, 278, 470, 670, 'r')}
    ${leader(130, 65, 96, 65)}${leader(640, 95, 692, 112)}${leader(370, 195, 420, 202)}`;

/* Q2: which bracket is the effort arm of a class 3 lever */
function armPic(a, b) {
    const y = 80, F = 36, E = 104, Lx = 200, by = 160;
    const top = x => x === F ? 140 : x === E ? 142 : 86;
    return `<svg viewBox="0 0 250 175" width="254" height="178">
        <rect x="16" y="${y - 10}" width="218" height="10" rx="2" fill="${NV}"/>
        <polygon points="${F},${y} ${F - 17},${y + 30} ${F + 17},${y + 30}" fill="${NV}"/>
        <rect class="obj" x="${Lx - 22}" y="${y - 50}" width="44" height="40" rx="3" style="stroke-width:3"/>
        ${arrowSVG(E, 138, DIR.u, 54, { sw: 6, hl: 16, hw: 10 })}
        <text class="leg" x="${F}" y="132" text-anchor="middle">Fulcrum</text>
        <text class="leg" x="${E + 12}" y="128">Effort</text>
        <text class="leg" x="${Lx}" y="22" text-anchor="middle">Load</text>
        ${guide(a, top(a), by - 10)}${guide(b, top(b), by - 10)}
        ${bracket(a, b, by, 'pk')}</svg>`;
}

/* Q3: claw hammer pulling a nail
   The hammer is drawn in its own coordinates (eye of the head at 0,0, handle pointing up),
   then rotated and placed so the curved back of the claw rests on the board. */
const HAM = (() => {
    const DEG = -3, S = .95, th = DEG * Math.PI / 180, c = Math.cos(th), s = Math.sin(th), CY = 300, FX = 380, VW = 800, VH = 365;
    const R = ([x, y]) => [S * (x * c - y * s), S * (x * s + y * c)];
    const cub = (a, b, d, e, t) => { const u = 1 - t; return [0, 1].map(i => u * u * u * a[i] + 3 * u * u * t * b[i] + 3 * u * t * t * d[i] + t * t * t * e[i]); };
    const BACK = [[-18, 17], [-40, 19], [-70, 34], [-92, 12]];
    let low = R([24, 17]);
    for (let i = 0; i <= 40; i++) { const p = R(cub(...BACK, i / 40)); if (p[1] > low[1]) low = p; }
    const tx = FX - low[0], ty = CY - low[1];
    const W = p => { const r = R(p); return [r[0] + tx, r[1] + ty]; };
    const sw = v => f1(v / S);
    const P = p => f1(p[0]) + ' ' + f1(p[1]);

    /* hammer in local coordinates */
    const head = `M-22 -17 L22 -17 Q31 -17 35 -11 L60 -11 L65 -16 L88 -16 Q93 -16 93 -11 L93 11 Q93 16 88 16 L65 16 L60 11 L35 11 Q31 17 22 17 L-18 17
        C-40 19 -70 34 -92 12 C-102 6 -109 -5 -112 -15 Q-112 -19 -108 -19 L-105 -18 C-98 -7 -82 -1 -62 -3 C-45 -4 -33 -10 -22 -17 Z`;
    const handle = `M-11 -15 L-9.5 -150 Q-10.5 -190 -13.5 -212 L-14 -258 Q-14 -274 0 -274 Q14 -274 14 -258 L13.5 -212 Q10.5 -190 9.5 -150 L11 -15 Z`;
    const grip = `M-13 -206 L-14 -258 Q-14 -274 0 -274 Q14 -274 14 -258 L13 -206 Q0 -200 -13 -206 Z`;
    let ridges = ''; for (let y = -216; y >= -258; y -= 9) ridges += `<line x1="-12" y1="${y}" x2="12" y2="${y}" stroke="#3d4477" stroke-width="${sw(2.5)}" stroke-linecap="round"/>`;
    const local = `<g transform="translate(${f1(tx)} ${f1(ty)}) rotate(${DEG}) scale(${S})">
        <path d="${handle}" fill="#ecd7b4" stroke="${NV}" stroke-width="${sw(4)}" stroke-linejoin="round"/>
        <path d="M-3 -24 Q-1 -90 -4 -150 Q-6 -175 -5 -198 M4 -30 Q6 -100 3 -160 Q1 -185 4 -200" fill="none" stroke="#d2b789" stroke-width="${sw(2)}" stroke-linecap="round"/>
        <path d="${grip}" fill="${NV}"/>${ridges}
        <path d="${head}" fill="#dfe2ea" stroke="${NV}" stroke-width="${sw(4)}" stroke-linejoin="round"/>
        <rect x="65" y="-16" width="28" height="32" rx="5" fill="#c9cedb" stroke="${NV}" stroke-width="${sw(4)}"/>
        <line x1="70" y1="-10" x2="70" y2="10" stroke="#fff" stroke-width="${sw(3)}" stroke-linecap="round" opacity=".8"/>
        <path d="M-16 -11 L22 -11 Q28 -11 31 -7" fill="none" stroke="#fff" stroke-width="${sw(3.5)}" stroke-linecap="round" opacity=".85"/>
        <path d="M-30 6 C-56 13 -84 10 -101 -9" fill="none" stroke="#9aa0b5" stroke-width="${sw(2.5)}" stroke-linecap="round"/>
        <path d="M-11 -17 L11 -17" stroke="${NV}" stroke-width="${sw(4)}"/>
    </g>`;

    /* nail: vertical in the world, head tucked over the claw tip */
    const nh = W([-100, -15.5]), nx = nh[0];
    const nail = `<line x1="${f1(nx)}" y1="${f1(nh[1])}" x2="${f1(nx)}" y2="${CY}" stroke="${NV}" stroke-width="5"/>
        <line x1="${f1(nx)}" y1="${CY + 4}" x2="${f1(nx)}" y2="${CY + 46}" stroke="${MG}" stroke-width="4" stroke-dasharray="5 5"/>
        <path d="M${f1(nx)} ${CY + 46} l-2.5 -2 h5 z" fill="${MG}"/>`;
    const nailHead = `<rect x="${f1(nx - 14)}" y="${f1(nh[1] - 3)}" width="28" height="6" rx="3" fill="${NV}"/>`;

    /* board */
    let grain = '';
    [[20, 320, 180], [250, 328, 140], [500, 318, 200], [90, 344, 160], [420, 350, 220], [660, 338, 110]].forEach(([x, y, w]) =>
        grain += `<path d="M${x} ${y} q${w / 4} -5 ${w / 2} 0 t${w / 2} 0" fill="none" stroke="#dcc7a2" stroke-width="2" stroke-linecap="round"/>`);
    const board = `<rect x="0" y="${CY}" width="${VW}" height="${VH - CY}" fill="#f4e9d6"/>${grain}<line x1="0" x2="${VW}" y1="${CY}" y2="${CY}" stroke="${NV}" stroke-width="3"/>`;

    /* pull: a curved arrow around the point the hammer rocks on */
    const top = W([0, -232]), F = [FX, CY], rr = Math.hypot(top[0] - F[0], top[1] - F[1]), a0 = Math.atan2(top[1] - F[1], top[0] - F[0]) + .1, a1 = a0 + .24;
    const ap = a => [F[0] + rr * Math.cos(a), F[1] + rr * Math.sin(a)];
    const pe = ap(a1), tg = a1 + Math.PI / 2;
    const pull = `<path d="M${P(ap(a0))} A${f1(rr)} ${f1(rr)} 0 0 1 ${P(ap(a1 - .03))}" fill="none" stroke="${PK}" stroke-width="7" stroke-linecap="round"/>
        ${arrowSVG(pe[0] - Math.cos(tg) * 8, pe[1] - Math.sin(tg) * 8, tg, 24, { sw: 7, hl: 22, hw: 13 })}
        <text class="lbl pk" x="${f1(pe[0] + 18)}" y="${f1(pe[1] + 6)}">Pull</text>`;

    /* close-up of the claw, nail and board */
    const ZC = [(nx + FX) / 2 - 4, CY - 20], K = 2, IC = [190, 150], IR = 112, zr = IR / K;
    const Z = p => [IC[0] + K * (p[0] - ZC[0]), IC[1] + K * (p[1] - ZC[1])];
    const dx = IC[0] - ZC[0], dy = IC[1] - ZC[1], dl = Math.hypot(dx, dy), ux = dx / dl, uy = dy / dl;
    const inset = `<defs><clipPath id="hamzc"><circle cx="${IC[0]}" cy="${IC[1]}" r="${IR}"/></clipPath></defs>
        <circle cx="${f1(ZC[0])}" cy="${f1(ZC[1])}" r="${f1(zr)}" fill="none" stroke="${NV}" stroke-width="2.5" stroke-dasharray="6 5"/>
        <line x1="${f1(ZC[0] + ux * zr)}" y1="${f1(ZC[1] + uy * zr)}" x2="${f1(IC[0] - ux * IR)}" y2="${f1(IC[1] - uy * IR)}" stroke="${NV}" stroke-width="2.5" stroke-dasharray="6 5"/>
        <circle cx="${IC[0]}" cy="${IC[1]}" r="${IR}" fill="#fff"/>
        <g clip-path="url(#hamzc)"><use href="#hamsc" transform="translate(${f1(IC[0])} ${f1(IC[1])}) scale(${K}) translate(${f1(-ZC[0])} ${f1(-ZC[1])})"/></g>
        <circle cx="${IC[0]}" cy="${IC[1]}" r="${IR}" fill="none" stroke="${NV}" stroke-width="4"/>
        <text class="lbl" x="${IC[0]}" y="${IC[1] - IR - 12}" text-anchor="middle" style="font-size:18px">Close-up</text>`;

    const svg = `<g id="hamsc">${board}${nail}${local}${nailHead}</g>${pull}${inset}
        <text class="lbl" x="${f1(Z([nx, 0])[0] - 16)}" y="${f1(Z([0, CY])[1] - 14)}" text-anchor="end">Nail</text>
        <text class="lbl" x="${VW - 24}" y="${VH - 20}" text-anchor="end">Wood</text>`;

    const eye = W([0, -17]), gp = W([0, -236]), zA = Z([nx, nh[1] - 3]), zB = Z([FX, CY]);
    const spots = [
        { x: zA[0], y: zA[1], lx: 46, ly: 86, word: 'Load', wx: 46, wy: 50 },
        { x: zB[0], y: zB[1], lx: 80, ly: 272, word: 'Fulcrum', wx: 112, wy: 296, an: 'start' },
        { x: eye[0], y: eye[1], lx: eye[0] + 88, ly: eye[1] - 50 },
        { x: gp[0], y: gp[1], lx: gp[0] - 76, ly: gp[1] + 4, word: 'Effort', wx: gp[0] - 76, wy: gp[1] - 30 }
    ];
    return { svg, spots, VW, VH };
})();

/* Q4: pictures of everyday levers to classify */
const mks = (x, y, t) => `<g class="mkr mks m${t}"><circle cx="${x}" cy="${y}" r="12"/><text x="${x}" y="${y + 5.5}">${t}</text></g>`;
const smallArrow = (x, y, ang, len) => arrowSVG(x, y, ang, len, { sw: 5, hl: 14, hw: 9 });
const metal = (pts, w = 10) => `<polyline points="${pts}" fill="none" stroke="${NV}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#dfe2ea" stroke-width="${w - 6}" stroke-linecap="round" stroke-linejoin="round"/>`;
const LEVER_PICS = [
    { name: 'Seesaw', ans: 1, hint: 'Seesaw: the pivot sits between the push and the load. Which part is in the middle?',
      svg: `<line class="gnd" x1="6" x2="214" y1="122" y2="122"/>
        <rect x="14" y="78" width="192" height="9" rx="2" fill="${NV}"/>
        <polygon points="110,87 92,120 128,120" fill="${NV}"/>
        <path class="obj" d="M164 78 L160 58 L174 44 L196 46 L204 60 L202 78 Z" style="stroke-width:3" stroke-linejoin="round"/>
        ${smallArrow(32, 28, DIR.d, 46)}`,
      marks: [[140, 106, 'F'], [182, 26, 'L'], [56, 46, 'E']] },
    { name: 'Scissors', ans: 1, hint: 'Scissors: the pivot screw sits between your fingers and the paper. Which part is in the middle?',
      svg: `<rect x="150" y="72" width="66" height="7" fill="#fff" stroke="${MG}" stroke-width="2"/>
        <path d="M104 71 L208 56 L203 66 L112 81 Z" fill="#dfe2ea" stroke="${NV}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M104 81 L208 96 L203 86 L112 71 Z" fill="#dfe2ea" stroke="${NV}" stroke-width="3" stroke-linejoin="round"/>
        <line x1="108" y1="76" x2="66" y2="56" stroke="${NV}" stroke-width="7" stroke-linecap="round"/><line x1="108" y1="76" x2="66" y2="96" stroke="${NV}" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="48" cy="50" rx="19" ry="12" fill="none" stroke="${NV}" stroke-width="6"/><ellipse cx="48" cy="102" rx="19" ry="12" fill="none" stroke="${NV}" stroke-width="6"/>
        <circle cx="108" cy="76" r="6" fill="#fff" stroke="${NV}" stroke-width="3"/>
        ${smallArrow(48, 8, DIR.d, 26)}${smallArrow(48, 144, DIR.u, 26)}`,
      marks: [[108, 46, 'F'], [182, 106, 'L'], [80, 20, 'E']] },
    { name: 'Wheelbarrow', ans: 2, hint: 'Wheelbarrow: the wheel is the fulcrum at one end and you lift at the other end. What sits in the middle?',
      svg: `<line class="gnd" x1="6" x2="214" y1="134" y2="134"/>
        <line x1="40" y1="110" x2="198" y2="74" stroke="${NV}" stroke-width="6" stroke-linecap="round"/>
        <line x1="140" y1="88" x2="146" y2="132" stroke="${NV}" stroke-width="6" stroke-linecap="round"/>
        <path d="M64 60 Q86 36 104 46 Q124 34 148 60 Z" fill="#c9cedb" stroke="${NV}" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="58,60 154,60 140,98 76,98" fill="${LT}" stroke="${NV}" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="40" cy="110" r="22" fill="#fff" stroke="${NV}" stroke-width="6"/><circle cx="40" cy="110" r="4" fill="${NV}"/>
        ${smallArrow(198, 124, DIR.u, 46)}`,
      marks: [[22, 74, 'F'], [106, 22, 'L'], [176, 112, 'E']] },
    { name: 'Nutcracker', ans: 2, hint: 'Nutcracker: the hinge is at one end and your hand squeezes at the other end. What sits in the middle?',
      svg: `<circle cx="80" cy="75" r="14" fill="#e8d3b0" stroke="${NV}" stroke-width="3"/><path d="M70 67 Q80 75 70 84 M90 67 Q80 75 90 84" fill="none" stroke="#b08c5c" stroke-width="2"/>
        ${metal('26,70 206,40')}${metal('26,80 206,110')}
        <circle cx="26" cy="75" r="10" fill="${NV}"/><circle cx="26" cy="75" r="3.5" fill="#fff"/>
        ${smallArrow(188, 6, DIR.d, 30)}${smallArrow(188, 146, DIR.u, 30)}`,
      marks: [[26, 46, 'F'], [80, 120, 'L'], [160, 20, 'E']] },
    { name: 'Tweezers', ans: 3, hint: 'Tweezers: the joined end is the fulcrum and the bead is at the tips. Where do your fingers squeeze?',
      svg: `${metal('22,71 110,59 199,73', 8)}${metal('22,79 110,91 199,77', 8)}
        <path d="M14 70 Q8 75 14 80 L24 80 L24 70 Z" fill="${NV}"/>
        <circle cx="206" cy="75" r="7" fill="${LT}" stroke="${NV}" stroke-width="3"/>
        ${smallArrow(110, 22, DIR.d, 30)}${smallArrow(110, 128, DIR.u, 30)}`,

function mcCore(els, q, extra = {}) {

        els.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); s = i; refresh();

    return {
        instr: extra.instr || 'Choose an answer, then press <b>Check</b>.',
        ready: () => s !== null,
        check() {
            const b = els[s];
            b.classList.remove('sel');
            if (s === q.answer) { b.classList.add('right'); els.forEach(x => x.disabled = true); return { ok: true }; }
            b.classList.add('wrong'); b.disabled = true;
            const h = q.opts[s].hint; s = null; return { ok: false, hint: h };
        },
        done: extra.done
    };

function sortCore(q, pool, zones) {
    const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
    shuffle(q.items).forEach(([t, k, h]) => { const tl = D.tile(t); tl.k = k; tl.h = h; pool.appendChild(tl); });
    return {
        instr: 'Drag each tile into a group (or tap a tile, then a group), then press <b>Check</b>.',
        ready: () => !pool.querySelector('.tile'),
        check() {
            const wrong = [];
            zones.forEach(z => z.box.querySelectorAll('.tile').forEach(t => {
                t.classList.remove('wrong'); void t.offsetWidth;
                if (t.k === z.key) t.classList.add('right'); else { t.classList.add('wrong'); wrong.push(t.h); }
            }));

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let s = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (s) s.classList.remove('sel'); s = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (s && !z.locked) put(s, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(text) {
        const t = el('span', 'tile', text);
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right')) return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool && s && s !== t) { if (!z.locked) put(s, z); return; }
            if (z !== pool) { put(t, pool); return; }
            if (s === t) { deselect(); return; }
            deselect(); s = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

/* =========================================================
   ANIMATED SCENES
   ========================================================= */
function arcPath(cx, cy, r, a0, a1) {
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    return `M${f1(x0)} ${f1(y0)} A${f1(r)} ${f1(r)} 0 0 ${a1 > a0 ? 1 : 0} ${f1(x1)} ${f1(y1)}`;
}

    svg.innerHTML = `${ground(GY, 900)}<g class="tg"><rect class="obj" x="380" y="104" width="140" height="66" rx="6"/><text class="oname" x="450" y="144" text-anchor="middle">Trolley</text>
        <circle cx="412" cy="182" r="13" fill="${NV}"/><circle cx="488" cy="182" r="13" fill="${NV}"/><circle cx="412" cy="182" r="4" fill="#fff"/><circle cx="488" cy="182" r="4" fill="#fff"/>
        ${arrowSVG(520, 137, DIR.r, 35 * K, { label: '35 N' })}${arrowSVG(380, 137, DIR.l, 50 * K, { c: NV, label: '50 N' })}<g class="net"></g></g>`;
    const tg = svg.querySelector('.tg'), net = svg.querySelector('.net');
    return {
        async done() {
            const id = runId;
            await growArrow(net, 450, 64, DIR.l, 15 * K, { label: 'Net force 15 N', fs: 22 });
            await wait(400);
            await play(1500, k => tg.setAttribute('transform', `translate(${f1(-160 * easeIn(k))} 0)`), () => id === runId);
        }
    };
}

/* Q11: tug of war */
function tugScene(svg) {
    const GY = 224, K = 1.15, RY = GY - 72 * K + 2;
    const L = [[190, 160], [320, 140]], R = [[780, 95], [880, 100], [980, 90]];
    let s = `${ground(GY, 1100)}<line x1="550" x2="550" y1="${GY - 14}" y2="${GY + 14}" stroke="${PK}" stroke-width="4"/><g class="tw">`;
    s += `<line x1="150" x2="1030" y1="${RY}" y2="${RY}" stroke="#b58b5a" stroke-width="7" stroke-linecap="round"/>`;
    s += `<polygon points="550,${RY + 4} 538,${RY + 30} 562,${RY + 30}" fill="${PK}"/>`;
    L.forEach(([x, n]) => { s += fig(x, GY, 'pull', false, K); s += `<text class="flbl" x="${x - 12}" y="36" text-anchor="middle">${n} N</text>` + arrowSVG(x + 12, 52, DIR.l, 48, { c: NV, sw: 5, hl: 15, hw: 9 }); });
    R.forEach(([x, n]) => { s += fig(x, GY, 'pull', true, K); s += `<text class="flbl" x="${x + 12}" y="36" text-anchor="middle">${n} N</text>` + arrowSVG(x - 12, 52, DIR.r, 48, { sw: 5, hl: 15, hw: 9 }); });
    s += `</g><text class="lbl" x="255" y="${GY + 32}" text-anchor="middle">Left team</text><text class="lbl" x="880" y="${GY + 32}" text-anchor="middle">Right team</text>`;
    svg.innerHTML = s;
    const tw = svg.querySelector('.tw');
    return {
        async done() {
            const id = runId;
            await wait(300);
            await play(1800, k => tw.setAttribute('transform', `translate(${f1(-90 * easeIn(k))} 0)`), () => id === runId);
        }
    };
}

/* Q12: crate with a missing friction force */
function crateScene(svg) {
    const GY = 200, K = 2.9;
    let hatch = ''; for (let i = 0; i < 34; i++) hatch += `<line x1="${60 + i * 24}" y1="${GY + 4}" x2="${48 + i * 24}" y2="${GY + 16}" stroke="${GR}" stroke-width="2"/>`;
    svg.innerHTML = `<line x1="40" x2="860" y1="${GY + 2}" y2="${GY + 2}" stroke="${NV}" stroke-width="4"/>${hatch}
        <rect class="obj" x="390" y="110" width="130" height="90" rx="4"/><line x1="402" y1="122" x2="508" y2="188" stroke="${NV}" stroke-width="2"/><line x1="508" y1="122" x2="402" y2="188" stroke="${NV}" stroke-width="2"/>
        <rect x="425" y="140" width="60" height="30" fill="${LT}"/><text class="oname" x="455" y="162" text-anchor="middle">Crate</text>
        ${arrowSVG(240, 155, DIR.r, 50 * K, { label: 'Push 50 N' })}
        ${arrowSVG(394, 62, DIR.r, 20 * K, { c: MG, sw: 6, hl: 18, hw: 11 })}<text class="lbl" x="${394 + 20 * K + 12}" y="70">Net force 20 N right</text>
        <g class="mys"><circle cx="575" cy="155" r="26" fill="#fff" stroke="${NV}" stroke-width="3" stroke-dasharray="6 5"/><text class="flbl" x="575" y="164" text-anchor="middle" style="font-size:28px">?</text>
        <text class="lbl nv" x="612" y="163">Friction</text></g><g class="fr"></g>`;
    const mys = svg.querySelector('.mys'), fr = svg.querySelector('.fr');
    return {
        async done() {
            await play(300, k => mys.setAttribute('opacity', 1 - k));
            await growArrow(fr, 520, 222, DIR.l, 30 * K, { c: NV, label: 'Friction 30 N', below: true, dy: 30, fs: 22 });
        }
    };
}

function mkTrail(layer, pos, y, every = 250) {
    let next = 0;
    return {
        reset() { layer.innerHTML = ''; next = 0; },
        upto(T) { while (next <= T + .5) { const p = pos(next); layer.insertAdjacentHTML('beforeend', `<circle cx="${p.x.toFixed(1)}" cy="${(y === undefined ? p.y : y).toFixed(1)}" r="5.5" fill="${DT}"/>`); next += every; } }
    };
}
const phase = (T0, T1, dur, apply) => play(dur, k => apply(T0 + (T1 - T0) * k));

const SCENES = {
    kayak(svg) {
        const WY = 220, I = 2000, O = 2000, x0 = 140, v = .1, HL = 96;
        let wave = `M0 ${WY}`; for (let x = 0; x <= 740; x += 40) wave += ` q10 -6 20 0 t20 0`;
        svg.innerHTML = `<g class="ob">
                <g class="pad"><line x1="-70" y1="-104" x2="66" y2="18" stroke="${NV}" stroke-width="5" stroke-linecap="round"/>
                    <ellipse cx="-74" cy="-108" rx="9" ry="20" transform="rotate(-48 -74 -108)" fill="${NV}"/><ellipse cx="70" cy="22" rx="9" ry="20" transform="rotate(-48 70 22)" fill="${NV}"/></g>
                <line x1="2" y1="-14" x2="6" y2="-62" stroke="${NV}" stroke-width="8" stroke-linecap="round"/><circle cx="8" cy="-78" r="13" fill="${NV}"/>
                <polyline points="6,-56 -12,-58 -18,-62" fill="none" stroke="${NV}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="6,-52 20,-40 22,-30" fill="none" stroke="${NV}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M${-HL} -14 Q-50 18 0 18 Q60 18 ${HL} -16 Q40 -22 0 -18 Q-50 -20 ${-HL} -14 Z" fill="${LT}" stroke="${NV}" stroke-width="4" stroke-linejoin="round"/>
                <g class="af"></g><g class="ab"></g>
            </g>
            <path d="${wave} V330 H0 Z" fill="#e6ebf3"/><path d="${wave}" fill="none" stroke="#9fb0cc" stroke-width="3"/><g class="tr"></g>
            <text class="spd mv" text-anchor="middle">Moving &rarr;</text>
            <text class="spd st" x="724" y="40" text-anchor="end" opacity="0">Net force 0 N</text>
            ${legend(16, 318)}`;
        const ob = svg.querySelector('.ob'), pad = svg.querySelector('.pad'), af = svg.querySelector('.af'), ab = svg.querySelector('.ab'), mv = svg.querySelector('.mv'), st = svg.querySelector('.st');
        const pos = T => ({ x: x0 + v * T });
        const tr = mkTrail(svg.querySelector('.tr'), pos, 282);
        const set = T => {
            const x = pos(T).x;
            ob.setAttribute('transform', `translate(${f1(x)} ${WY - 4})`);
            pad.setAttribute('transform', `rotate(${f1(18 * Math.sin(T / 260))} 2 -42)`);
            mv.setAttribute('x', f1(x)); mv.setAttribute('y', WY - 132);
            tr.upto(T);
        };
        return {
            async run(full, skipIntro) {
                if (!skipIntro) {
                    this.introDone = false;
                    tr.reset(); clearArrow(af); clearArrow(ab); mv.setAttribute('opacity', 1); st.setAttribute('opacity', 0);
                    await phase(0, I, I, set);
                    mv.setAttribute('opacity', 0);
                    growArrow(ab, -HL, -8, DIR.l, 70, { c: NV, label: 'Water resistance 80 N', fs: 20 });
                    await growArrow(af, HL, -8, DIR.r, 70, { label: 'Paddling force 80 N', fs: 20 });
                    this.introDone = true;
                }
                if (!full) return;
                await wait(skipIntro ? 100 : 500);
                await phase(I, I + O, O, set);
                await play(300, k => st.setAttribute('opacity', k));
            }
        };
    }
};

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); render(); });

</script>
