<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact and Non-Contact Forces</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --white: #ffffff;
        --off-white: #f5f5f5;
        --light-grey: #e8e8e8;
        --mid-grey: #9a9a9a;
        --blank: #f0f3f6;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif;
        margin: 0; background: #eaeaea; color: var(--navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }
    .viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .stage {
        width: 1280px; height: 720px; background: var(--white); border-top: 6px solid var(--navy);
        position: relative; padding: 0; transform-origin: center center; flex-shrink: 0; overflow: hidden;
    }
    .ui-zoomer { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; padding: 36px 64px 0 64px; transform-origin: 0 0; }
    .ui-spot { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease); }
    .ui-spot.on { opacity: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; min-height: 72px; }
    .sheet-title { white-space: nowrap; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .topr { display: flex; align-items: center; gap: 20px; }
    .counter { white-space: nowrap; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: var(--mid-grey); }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption {
        position: absolute; left: 64px; right: 64px; bottom: 30px;
        font-size: 27px; font-weight: 500; line-height: 1.35;
        display: flex; align-items: center; gap: 16px; min-height: 60px;
    }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption b { font-weight: 800; color: var(--pink); }
    .caption.in { animation: capIn .45s var(--ease); }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; }

    .hide { opacity: 0; transform: translateY(14px); }
    .rev { transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .35s, color .35s, border-color .35s; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .stack { display: flex; flex-direction: column; justify-content: center; height: 100%; }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }

    /* check for understanding badge */
    .cfu { display: none; align-items: center; gap: 9px; height: 46px; padding: 0 18px; border-radius: 23px; color: var(--white);
        font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
    .cfu.tt { display: flex; background: var(--pink); }
    .cfu.sj { display: flex; background: var(--navy); }
    .cfu svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .cfu .ar { opacity: .75; width: 20px; }
    .cfu.pop { animation: pop .6s var(--ease); }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: none; } }
    .cfu.big { height: 54px; border-radius: 27px; font-size: 24px; padding: 0 22px; }
    .cfu.big svg { width: 28px; height: 28px; }
    .cfu.tt, .cfu.sj { cursor: pointer; user-select: none; }
    .cfu:hover { filter: brightness(1.12); }
    .cfu:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .cfu.tt:focus-visible { outline-color: var(--navy); }
    .cfu .ct { display: inline-flex; align-items: center; gap: 5px; margin-left: 4px; padding: 3px 10px 3px 7px; border-radius: 14px; background: rgba(255,255,255,.22); font-variant-numeric: tabular-nums; }
    .cfu .ct svg { width: 18px; height: 18px; }
    .sctags { display: flex; gap: 8px; }
    .sctags span { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
        padding: 9px 12px 8px; border-radius: 6px; box-shadow: inset 0 0 0 3px var(--navy); color: var(--navy); }

    /* force diagrams */
    svg { overflow: visible; }
    .obj { fill: var(--blank); stroke: var(--navy); stroke-width: 4; }
    .oname { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--navy); }
    .flbl { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; fill: var(--navy); }
    .fa.hide { opacity: 0; transform: scale(.001); }
    .fig line, .fig polyline { stroke: var(--navy); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .fig circle { fill: var(--navy); }
    .ground { stroke: #c9ccd6; stroke-width: 4; }
    .rope { stroke: var(--navy); stroke-width: 5; stroke-linecap: round; }
    .whl { fill: var(--navy); }
    .mv { transition: transform 2.4s cubic-bezier(.45,0,.3,1); }
    .mv.go { transform: translateX(var(--dx)); }
    .carbody { fill: var(--pink); }
    .carwin { fill: #fff; }
    .wheel circle { fill: var(--navy); }
    .wheel line { stroke: #fff; stroke-width: 3; stroke-linecap: round; }
    .spin .spk { transform-box: fill-box; transform-origin: center; animation: spin .45s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sball { fill: #fff; stroke: var(--navy); stroke-width: 4; }
    .spent { fill: var(--navy); }

    /* panels and cards */
    .row2 { display: flex; gap: 30px; }
    .pan { border: 3px solid var(--navy); border-radius: 8px; padding: 14px 18px; }
    .pan.pink { border-color: var(--pink); }
    .pan svg { display: block; }
    .unit { margin-top: 20px; font-size: 26px; font-weight: 600; border: 3px solid var(--pink); border-radius: 8px; padding: 8px 26px; }
    .unit b { color: var(--pink); font-weight: 800; }
    .tag { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
        padding: 5px 14px; border-radius: 6px; background: var(--navy); color: #fff; }
    .tag.pk { background: var(--pink); }
    .tag.ol { background: none; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); }
    .ptag { display: flex; justify-content: center; margin-top: 8px; }

    /* title scene */
    .intro { display: grid; grid-template-columns: 1fr 360px; gap: 48px; align-items: center; height: 100%; }
    .libox { border-left: 8px solid var(--pink); padding: 4px 0 4px 22px; margin-bottom: 22px; }
    .libox .t { font-size: 32px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
    .sc { display: flex; gap: 18px; align-items: baseline; padding: 11px 0; border-top: 2px solid var(--light-grey); font-size: 23px; font-weight: 500; line-height: 1.3; }
    .sc b { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; color: var(--pink); min-width: 46px; }

    /* legend */
    .legend { display: flex; gap: 32px; }
    .lcard { width: 540px; border: 3px solid var(--pink); border-radius: 8px; padding: 26px 30px; }
    .lcard.nv { border-color: var(--navy); }
    .lcard .cfu.tt, .lcard .cfu.sj { display: inline-flex; }
    .lh { font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 900; text-transform: uppercase; margin: 20px 0 6px; line-height: 1; }
    .st { display: flex; gap: 14px; font-size: 24px; line-height: 1.3; font-weight: 500; margin-top: 12px; }
    .st b { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; color: var(--pink); min-width: 18px; }
    .nv .st b { color: var(--navy); }

    /* force arrow rules */
    .split { display: grid; grid-template-columns: 560px 1fr; gap: 40px; align-items: center; height: 100%; }
    .split.r { grid-template-columns: 1fr 440px; }
    .rules { display: flex; flex-direction: column; gap: 24px; }
    .rule { display: flex; gap: 18px; align-items: flex-start; font-size: 27px; font-weight: 500; line-height: 1.3; }
    .rule b { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--pink); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin-top: -3px; }
    .rule strong { font-weight: 800; color: var(--pink); }
    .mkr line { stroke: var(--pink); stroke-width: 2.5; }
    .mkr circle { fill: var(--pink); }
    .mkr text { fill: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 900; }
    .notes { border: 3px solid var(--navy); border-radius: 8px; padding: 22px 30px 26px; }
    .notes p { font-size: 25px; line-height: 1.35; margin: 14px 0 0; }
    .notes b { color: var(--pink); font-weight: 800; }
    .col2 { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    /* net force */
    .nwrap { display: flex; flex-direction: column; justify-content: center; gap: 12px; height: 100%; }
    .nline { display: flex; align-items: center; gap: 22px; }
    .na { width: 340px; }
    .nb { width: 300px; }
    .eqs { font-family: 'Barlow Condensed', sans-serif; font-size: 64px; font-weight: 900; color: var(--pink); }
    .eqt { font-size: 30px; font-weight: 600; }
    .eqt b { color: var(--pink); font-weight: 900; }
    .pill { align-self: flex-start; border: 3px solid var(--navy); border-radius: 8px; padding: 10px 24px; font-size: 26px; font-weight: 600; margin-top: 6px; }
    .pill b { color: var(--pink); font-weight: 800; }

    /* tug of war */
    .flag { fill: var(--pink); }
    .cline { stroke: var(--pink); stroke-width: 3; stroke-dasharray: 6 6; }
    .knot { fill: var(--navy); }
    .knotl { stroke: #c9ccd6; stroke-width: 2.5; stroke-dasharray: 5 6; }
    .tw { transition: transform 3s cubic-bezier(.5,0,.6,1); }
    .tw.wob { animation: wob .9s ease-in-out infinite alternate; }
    @keyframes wob { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
    .tw.gor { transform: translateX(70px); }
    .tw.gol { transform: translateX(-70px); }
    .readout { display: flex; gap: 28px; margin-top: 10px; justify-content: center; }
    .rbox { border: 3px solid var(--navy); border-radius: 8px; padding: 10px 30px; min-width: 300px; text-align: center; }
    .rbox .lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .rbox .num { font-family: 'Barlow Condensed', sans-serif; font-size: 50px; font-weight: 900; line-height: 1.1; letter-spacing: 0.02em; }
    .rbox.pink { border-color: var(--pink); }
    .rbox.pink .num { color: var(--pink); }

    /* questions */
    .qgrid { display: flex; gap: 10px; justify-content: center; }
    .qcard { position: relative; width: 280px; border: 3px solid var(--navy); border-radius: 8px; padding: 12px 3px 14px; display: flex; flex-direction: column; align-items: center; }
    .qcard .let { position: absolute; left: 10px; top: 10px; width: 42px; height: 42px; border-radius: 50%; background: var(--navy); color: #fff;
        font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; transition: background-color .35s; }
    .qcard.right { border-color: var(--pink); box-shadow: 0 0 0 5px rgba(234,0,138,.18); }
    .qcard.right .let { background: var(--pink); }
    .qcard .tag { margin-top: 4px; }
    .mov { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid-grey); height: 22px; margin-left: 40px; }
    .qrow { display: flex; align-items: center; gap: 30px; margin-top: 18px; }
    .qbox { flex: 1; border-left: 8px solid var(--pink); padding: 10px 0 10px 24px; font-size: 28px; font-weight: 600; line-height: 1.3; }
    .qbox.sj { border-color: var(--navy); }
    .qbox b { color: var(--pink); font-weight: 800; }
    .ans { font-size: 25px; font-weight: 500; line-height: 1.35; }
    .ans b { color: var(--pink); font-weight: 800; }
    .qa { padding: 12px 0; border-top: 2px solid var(--light-grey); }
    .qa .q { display: flex; gap: 14px; font-size: 26px; font-weight: 600; line-height: 1.3; }
    .qa .q b { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .qa .a { margin: 6px 0 0 48px; font-size: 25px; font-weight: 700; color: var(--pink); }

    /* timer */
    .tmr { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--navy); padding: 0; flex-shrink: 0; }
    .tmr:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; border-radius: 8px; }
    .tmr .ring { position: relative; width: 104px; height: 104px; }
    .tmr svg { width: 104px; height: 104px; transform: rotate(-90deg); display: block; }
    .tmr .tb { fill: none; stroke: var(--light-grey); stroke-width: 9; }
    .tmr .tf { fill: none; stroke: var(--pink); stroke-width: 9; stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
    .tmr.sj .tf { stroke: var(--navy); }
    .tmr .tv { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .tmr .tl { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid-grey); }
    .tmr.done .tv { color: var(--pink); }

    /* balanced motion */
    .tbl { fill: #d7dae2; }
    .tleg { stroke: #d7dae2; stroke-width: 10; }
    .road { fill: var(--light-grey); }
    .dash line { stroke: #fff; stroke-width: 5; }
    .dash.run { animation: road .5s linear infinite; }
    @keyframes road { to { transform: translateX(-60px); } }
    .spd { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--mid-grey); }
    .trail { fill: none; stroke: #c9ccd6; stroke-width: 3; stroke-dasharray: 6 7; }
    .ballc { fill: var(--pink); }
    .pan3 { width: 370px; padding: 12px 13px 14px; cursor: pointer; }

    /* effects */
    .lane { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; text-transform: uppercase; fill: var(--navy); }
    .lanel { stroke: var(--light-grey); stroke-width: 3; }
    .erow { display: flex; gap: 20px; justify-content: center; margin-top: 10px; }
    .ecard { width: 364px; border: 3px solid var(--navy); border-radius: 8px; padding: 12px 20px 16px; }
    .ecard svg { display: block; margin: 0 auto 6px; }
    .eh { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .et { font-size: 21px; font-weight: 500; margin-top: 4px; }
    .ea-speed { animation: easpd 1.8s cubic-bezier(.6,0,1,.6) infinite; }
    @keyframes easpd { from { transform: translate(24px, 88px); } to { transform: translate(296px, 88px); } }
    .ea-dir { animation: eadir 2.4s linear infinite; }
    @keyframes eadir { 0% { transform: translate(30px, 98px); } 50% { transform: translate(279px, 60px); } 100% { transform: translate(30px, 22px); } }
    .wall { fill: var(--navy); }
    .ea-squash { transform-box: fill-box; transform-origin: 50% 100%; animation: squash 2.4s ease-in-out infinite; }
    @keyframes squash { 0%, 25% { transform: none; } 50%, 70% { transform: scale(1.35, .6); } 100% { transform: none; } }
    .ea-press { animation: press 2.4s ease-in-out infinite; }
    @keyframes press { 0%, 25% { transform: none; } 50%, 70% { transform: translateY(27px); } 100% { transform: none; } }

    /* lab */
    .lab { display: flex; align-items: stretch; gap: 16px; justify-content: center; margin-top: 14px; }
    .stp { border: 3px solid var(--navy); border-radius: 8px; padding: 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .stp.pink { border-color: var(--pink); }
    .sr { display: flex; align-items: center; gap: 12px; }
    .sbtn { width: 44px; height: 44px; border: none; border-radius: 6px; background: var(--navy); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; cursor: pointer; line-height: 1; padding: 0; }
    .sbtn:focus-visible, .rst:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .sv { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 900; min-width: 84px; text-align: center; font-variant-numeric: tabular-nums; }
    .lab + .lab { margin-top: 12px; }
    .stp { width: 300px; }
    .stp .dlbl, .lab .rbox .lbl { white-space: nowrap; }
    .lab .rbox { min-width: 0; width: 260px; padding: 8px 18px; display: flex; flex-direction: column; justify-content: center; }
    .lab .rbox .num { font-size: 36px; white-space: nowrap; }
    .lab .rbox.mo { width: 360px; }
    .rst { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 0 18px; cursor: pointer; }

    /* summary and exit */
    .sumgrid { display: grid; grid-template-columns: repeat(2, 540px); gap: 22px 32px; }
    .dcard { border: 3px solid var(--navy); border-radius: 8px; padding: 20px 28px; }
    .dcard.pink { border-color: var(--pink); }
    .sct { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; color: var(--pink); letter-spacing: 0.06em; }
    .dex { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 900; margin: 2px 0 6px; line-height: 1; text-transform: uppercase; }
    .dhow { font-size: 23px; font-weight: 500; line-height: 1.3; }
    .xgrid { display: grid; grid-template-columns: 1fr; gap: 30px; align-items: center; }
    .xq { display: flex; gap: 18px; padding: 16px 0; border-top: 2px solid var(--light-grey); font-size: 27px; font-weight: 500; line-height: 1.3; }
    .xq b { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .xq strong { color: var(--pink); font-weight: 800; }


    /* contact and non-contact */
    svg.clipv { overflow: hidden; }
    .pole { fill: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 900; text-anchor: middle; }
    .clip { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; }
    .defn { border-left: 8px solid var(--pink); padding: 6px 0 6px 24px; font-size: 34px; font-weight: 700; line-height: 1.2; }
    .defn b { color: var(--pink); font-weight: 800; }
    .vig { width: 272px; border: 3px solid var(--navy); border-radius: 8px; padding: 10px 12px 12px; text-align: center; }
    .vig svg { display: block; margin: 0 auto; }
    .vh { font-size: 21px; font-weight: 700; margin-top: 4px; line-height: 1.2; }
    .ph { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .pan .pt { font-size: 24px; font-weight: 500; margin-top: 6px; }
    .pt b { color: var(--pink); font-weight: 800; }
    .notes.pinkb { border-color: var(--pink); }
    .ecard.big { width: 372px; padding: 16px 16px 20px; }
    .pan3 .et { font-size: 20px; margin-top: 6px; }
    .tbl2 { margin-top: 12px; }
    .tr { display: grid; grid-template-columns: 230px 1fr; gap: 16px; padding: 8px 0; border-top: 2px solid var(--light-grey); font-size: 23px; line-height: 1.3; }
    .tr b { color: var(--pink); font-weight: 800; }
    .earth2 { fill: var(--blank); stroke: var(--navy); stroke-width: 4; }
    .lat2 { fill: none; stroke: #c9ccd6; stroke-width: 2; }
    .chg { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; fill: var(--pink); text-anchor: middle; }
    .chg.w { fill: #fff; }
    .sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .scard { position: relative; display: flex; align-items: center; gap: 12px; border: 3px solid var(--navy); border-radius: 8px; padding: 10px 14px 10px 44px; }

/* ---------- drawing helpers ---------- */
function farrow(x, y, d, len, lbl, o = {}) {
    const c = o.c || PK, sw = o.sw || 8, hl = o.hl || 22, hw = o.hw || 13, fs = o.fs || 22;
    const v = { r: [1, 0], l: [-1, 0], u: [0, -1], d: [0, 1] }[d];
    const ex = x + v[0] * len, ey = y + v[1] * len, bx = ex - v[0] * hl, by = ey - v[1] * hl, px = -v[1] * hw, py = v[0] * hw;
    const hz = d === 'r' || d === 'l';
    let tx, ty, an;
    if (o.lp === 'end') { tx = hz ? ex + v[0] * 12 : x; ty = hz ? y + 8 : ey + (v[1] > 0 ? 28 : -12); an = hz ? (v[0] > 0 ? 'start' : 'end') : 'middle'; }
    else if (hz) {
        ty = o.lb ? y + 32 : y - 16;
        const est = lbl ? String(lbl).replace(/&[a-z]+;/g, 'x').length * fs * 0.5 : 0;
        if (est <= len - 8) { tx = x + v[0] * len / 2; an = 'middle'; }
        else { tx = x + v[0] * 4; an = v[0] > 0 ? 'start' : 'end'; }
    }
    else { tx = o.lb ? x - 16 : x + 16; ty = y + v[1] * len / 2 + 8; an = o.lb ? 'end' : 'start'; }
    const cls = 'fa' + (o.cls ? ' ' + o.cls : '') + (o.hide === false ? '' : ' rev hide');
    return `<g class="${cls}" style="transform-origin:${x}px ${y}px">` +
        (len > hl ? `<line x1="${x}" y1="${y}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${sw}"/>` : '') +
        `<polygon points="${ex},${ey} ${bx + px},${by + py} ${bx - px},${by - py}" fill="${c}"/>` +
        (lbl ? `<text class="flbl" x="${tx}" y="${ty}" text-anchor="${an}" style="font-size:${fs}px">${lbl}</text>` : '') + `</g>`;
}

function fdiag(forces, o = {}) {
    const w = o.w || 360, h = o.h || 300, s = o.size || 80, k = o.k || 3, cx = w / 2, cy = h / 2;
    const E = { r: [cx + s / 2, cy], l: [cx - s / 2, cy], u: [cx, cy - s / 2], d: [cx, cy + s / 2] };
    const arrows = forces.map(f => farrow(E[f.d][0], E[f.d][1], f.d, f.n * k, (f.lbl ? f.lbl + ' ' : '') + f.n + ' N', { hide: o.hide, c: f.c, lb: f.lb })).join('');
    const obj = `<rect class="obj" x="${cx - s / 2}" y="${cy - s / 2}" width="${s}" height="${s}" rx="6"/>` + (o.name ? `<text class="oname" x="${cx}" y="${cy + 7}" text-anchor="middle">${o.name}</text>` : '');
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${obj}${arrows}</svg>`;
}

}

function soccer(r) {
    const k = r / 26;

function tug(o) {
    const gy = o.gy, ry = gy - 72, ay = gy - 170, cx = 560;
    let s = `<svg viewBox="0 0 1152 ${o.h}" width="1152" height="${o.h}"><line class="ground" x1="0" x2="1152" y1="${gy + 2}" y2="${gy + 2}"/><line class="cline" x1="${cx}" x2="${cx}" y1="${gy - 40}" y2="${gy + 18}"/><g class="tw${o.wob ? ' wob' : ''}">`;
    s += `<line class="rope" x1="150" x2="${o.extra ? 1060 : 970}" y1="${ry}" y2="${ry}"/><path class="flag" d="M${cx} ${ry} L${cx - 12} ${ry + 34} L${cx + 12} ${ry + 34} Z"/>`;
    [170, 260, 350].forEach(x => s += fig(x, gy, 'pull'));
    [950, 860, 770].forEach((x, i) => s += `<g class="${o.leave && i === 0 ? 'leaver rev' : ''}">${fig(x, gy, 'pull', true)}</g>`);
    if (o.extra) s += `<g class="late rev hide">${fig(1040, gy, 'pull', true)}</g>`;
    s += `<line class="knotl" x1="${cx}" x2="${cx}" y1="${ay}" y2="${ry}"/><circle class="knot" cx="${cx}" cy="${ay}" r="7"/>`;
    s += farrow(cx - 8, ay, 'l', 180, '300 N', { cls: 'la' }) + farrow(cx + 8, ay, 'r', 180, '300 N', { cls: 'ra' }) + farrow(cx + 8, ay, 'r', o.alt * 0.6, o.alt + ' N', { cls: 'alt' });
    return s + '</g></svg>';
}

/* ---------- player ---------- */
const dots = $('#dots');
scenes.forEach((_, i) => { const d = el('button'); d.setAttribute('aria-label', 'Scene ' + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });

const stepLbl = $('#steplbl');
const dur = () => scenes[idx].dur;
const beatEnd = b => (b + 1 < beats.length ? beats[b + 1] : dur());
function label() { stepLbl.textContent = `Step ${beat + 1} of ${beats.length}`; }

function build(i) {
    clearTimers();
    stopInteractive();
    const ni = Math.max(0, Math.min(scenes.length - 1, i));
    if (ni !== idx) { saveInk(); idx = ni; loadInk(); zoomReset(); renderBadges(); }
    events = []; beats = [];
    const sc = scenes[idx];
    content.innerHTML = ''; caption.innerHTML = '';
    titleEl.innerHTML = sc.title;
    counter.innerHTML = `<b>${idx + 1}</b> / ${scenes.length}`;
    uiSetCfu(sc.cfu, sc.time); uiSetSC(sc.sc);
    [...dots.children].forEach((d, j) => d.classList.toggle('cur', j === idx));
    sc.run();
    beats = [...new Set(beats)].sort((a, b) => a - b);
}

function jumpTo(to) {
    stage.classList.add('instant');
    instantMode = true;
    events.filter(e => !e.done && e.t < to).sort((a, b) => a.t - b.t).forEach(e => { e.done = true; e.fn(); });
    instantMode = false;
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
}

function setProgress(from, to) {
    progress.style.transition = 'none';
    progress.style.width = (from / dur() * 100) + '%';
    void progress.offsetWidth;
    progress.style.transition = `width ${Math.max(0, to - from)}ms linear`;
    progress.style.width = (to / dur() * 100) + '%';
}

function play(from, to, onEnd) {
    clearTimers();
    segFrom = from; segTo = to; segStart = performance.now();
    events.filter(e => !e.done && e.t >= from && e.t < to)
        .forEach(e => timers.push(setTimeout(() => { e.done = true; e.fn(); }, e.t - from)));
    beats.forEach((bt, k) => { if (bt > from && bt < to) timers.push(setTimeout(() => { beat = k; label(); }, bt - from)); });
    if (onEnd) timers.push(setTimeout(onEnd, to - from));
    setProgress(from, to);
}

function now() { return Math.min(segTo, segFrom + performance.now() - segStart); }

function startBeat(b) {
    beat = b; label();
    jumpTo(beats[b]);
    if (autoplay) play(beats[b], dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    else play(beats[b], beatEnd(b));
}

function go(i, b = 0) {
    build(i);
    startBeat(b === 'last' ? beats.length - 1 : b);
}

function next() {
    if (autoplay) { if (idx < scenes.length - 1) go(idx + 1); return; }
    clearTimers();
    if (beat < beats.length - 1) { jumpTo(beatEnd(beat)); startBeat(beat + 1); }
    else if (idx < scenes.length - 1) go(idx + 1);
    else { jumpTo(dur()); setProgress(dur(), dur()); }
}

function back() {
    if (autoplay) { go(idx - 1); return; }
    if (beat > 0) go(idx, beat - 1);
    else if (idx > 0) go(idx - 1, 'last');
    else go(0);
}

function toggleAuto() {
    autoplay = !autoplay;
    autoBtn.classList.toggle('on', autoplay); autoBtn.setAttribute('aria-pressed', autoplay);
    const cur = now();
    clearTimers();
    if (autoplay) {
        play(cur, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    } else {
        let b = 0; beats.forEach((bt, k) => { if (bt <= cur) b = k; });
        beat = b; label();
        jumpTo(beatEnd(b));
        setProgress(beatEnd(b), beatEnd(b));
    }
}

const autoBtn = $('#auto');
$('#next').onclick = next;
$('#back').onclick = back;
$('#replay').onclick = () => { zoomReset(); go(idx); };
autoBtn.onclick = toggleAuto;
const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);
document.addEventListener('keydown', e => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (wbOpen) {
        if (e.key === 'ArrowRight') wbGo(wbPage + 1);
        if (e.key === 'ArrowLeft') wbGo(wbPage - 1);
        if (e.key === 'n' || e.key === 'N') wbNew();
        if (e.key === ' ') e.preventDefault();
        return;
    }
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') back();
    if (e.key === 'r' || e.key === 'R') { zoomReset(); go(idx); }
    if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

/* ---------- pen, highlighter and eraser ---------- */
const ink = $('#ink'), ctx = ink.getContext('2d'), hlc = $('#hl'), hctx = hlc.getContext('2d'), livec = $('#hllive'), lctx = livec.getContext('2d');
const penBtn = $('#pen'), hlBtn = $('#hlbtn'), eraserBtn = $('#eraser');
let tool = null, penColour = '#ea008a', hlColour = '#ffd60a', drawing = false, inkMarked = false, hlMarked = false, scaleK = 1, exporting = false;
const HL_ALPHA = 0.42, HL_W = 26;
const inkOps = {}, inkRedo = {};
const isTyping = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);
[ctx, hctx, lctx].forEach(c => { c.scale(2, 2); c.lineCap = 'round'; c.lineJoin = 'round'; });
let wbOpen = false, wbPage = 0, wbPages = 1;
const curKey = () => wbOpen ? 'wb' + wbPage : idx;
const opsOf = k => (inkOps[k] = inkOps[k] || []), redoOf = k => (inkRedo[k] = inkRedo[k] || []);
let curStroke = null;

function setTool(t) {
    tool = t;
    ink.classList.toggle('active', !!t);
    ink.classList.toggle('erase', t === 'eraser');
    [[penBtn, 'pen'], [hlBtn, 'hl'], [eraserBtn, 'eraser']].forEach(([b, n]) => { b.classList.toggle('on', t === n); b.setAttribute('aria-pressed', t === n); });
    syncSwatches(); syncMenus();
}
function syncSwatches() {
    const c = tool === 'hl' ? hlColour : penColour;
    document.querySelectorAll('.swatch').forEach(x => x.classList.toggle('cur', x.dataset.c === c));
}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const targetsOf = op => op.t === 'eraser' ? [ctx, hctx] : op.t === 'hl' ? [hctx] : [ctx];
function brush(c, op) {
    const er = op.t === 'eraser';
    c.globalCompositeOperation = er ? 'destination-out' : 'source-over';
    c.globalAlpha = op.t === 'hl' ? HL_ALPHA : 1;
    c.strokeStyle = c.fillStyle = er ? '#000' : op.c;
    c.lineWidth = op.w;
}
function unbrush(c) { c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
function dotOn(c, op) { const p = op.pts[0]; c.beginPath(); c.arc(p.x, p.y, op.w / 2, 0, Math.PI * 2); c.fill(); }
function segOn(c, op, i) {
    const P = op.pts, a = P[i - 1], m0 = i > 1 ? mid(P[i - 2], a) : a, m1 = mid(a, P[i]);
    c.beginPath(); c.moveTo(m0.x, m0.y); c.quadraticCurveTo(a.x, a.y, m1.x, m1.y); c.stroke();
}
function tailOn(c, op) {
    const P = op.pts, n = P.length; if (n < 2) return;
    const m = mid(P[n - 2], P[n - 1]);
    c.beginPath(); c.moveTo(m.x, m.y); c.lineTo(P[n - 1].x, P[n - 1].y); c.stroke();
}
function pathOn(c, op) {
    const P = op.pts;
    if (P.length < 2) { dotOn(c, op); return; }
    c.beginPath(); c.moveTo(P[0].x, P[0].y);
    for (let i = 1; i < P.length; i++) { const m = mid(P[i - 1], P[i]); c.quadraticCurveTo(P[i - 1].x, P[i - 1].y, m.x, m.y); }
    c.lineTo(P[P.length - 1].x, P[P.length - 1].y); c.stroke();
}
function redrawInk() {
    [ctx, hctx, lctx].forEach(c => { unbrush(c); c.clearRect(0, 0, 1280, 720); });
    let mi = false, mh = false;
    opsOf(curKey()).forEach(op => {
        if (op.t === 'clear') { ctx.clearRect(0, 0, 1280, 720); hctx.clearRect(0, 0, 1280, 720); mi = mh = false; return; }
        targetsOf(op).forEach(c => { brush(c, op); pathOn(c, op); unbrush(c); });
        if (op.t === 'pen') mi = true;
        if (op.t === 'hl') mh = true;
    });
    inkMarked = mi; hlMarked = mh;
}
function commit(op) { opsOf(curKey()).push(op); redoOf(curKey()).length = 0; }
function clearInk() { if (!inkMarked && !hlMarked) return; commit({ t: 'clear' }); redrawInk(); }
function saveInk() {}
function loadInk() { redrawInk(); }
function undoInk() { if (drawing) return; const o = opsOf(curKey()); if (!o.length) return; redoOf(curKey()).push(o.pop()); redrawInk(); }
function redoInk() { if (drawing) return; const r = redoOf(curKey()); if (!r.length) return; opsOf(curKey()).push(r.pop()); redrawInk(); }
function liveHL() { lctx.clearRect(0, 0, 1280, 720); brush(lctx, curStroke); pathOn(lctx, curStroke); unbrush(lctx); }
function pt(e) { const r = ink.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 1280, y: (e.clientY - r.top) / r.height * 720 }; }
ink.addEventListener('pointerdown', e => {
    if (!tool) return;
    drawing = true; ink.setPointerCapture(e.pointerId);
    const w = tool === 'eraser' ? 26 / (scaleK * Z.z) : tool === 'hl' ? HL_W : 5;
    curStroke = { t: tool, c: tool === 'hl' ? hlColour : penColour, w, pts: [pt(e)] };
    if (tool === 'hl') { liveHL(); hlMarked = true; return; }
    targetsOf(curStroke).forEach(c => { brush(c, curStroke); dotOn(c, curStroke); unbrush(c); });
    if (tool === 'pen') inkMarked = true;
});
ink.addEventListener('pointermove', e => {
    if (!drawing) return;
    curStroke.pts.push(pt(e));
    if (curStroke.t === 'hl') { liveHL(); return; }
    targetsOf(curStroke).forEach(c => { brush(c, curStroke); segOn(c, curStroke, curStroke.pts.length - 1); unbrush(c); });
});
['pointerup', 'pointercancel'].forEach(t => ink.addEventListener(t, () => {
    if (!drawing) return;
    if (curStroke.t === 'hl') { lctx.clearRect(0, 0, 1280, 720); brush(hctx, curStroke); pathOn(hctx, curStroke); unbrush(hctx); }
    else targetsOf(curStroke).forEach(c => { brush(c, curStroke); tailOn(c, curStroke); unbrush(c); });
    commit(curStroke); curStroke = null; drawing = false;
}));
penBtn.onclick = () => setTool(tool === 'pen' ? null : 'pen');
hlBtn.onclick = () => setTool(tool === 'hl' ? null : 'hl');
eraserBtn.onclick = () => setTool(tool === 'eraser' ? null : 'eraser');
$('#clear').onclick = clearInk;
document.querySelectorAll('.swatch').forEach(b => b.onclick = () => {
    if (tool === 'hl') hlColour = b.dataset.c; else { penColour = b.dataset.c; setTool('pen'); }

});

    document.body.classList.toggle('ui-wb', wbOpen);
    loadSurface(); syncWB(); fit();
    if (!wbOpen) {
        if (autoplay) play(wbPausedAt, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
        else play(wbPausedAt, beatEnd(beat));
    }
}
function wbGo(p) {
    p = clamp(p, 0, wbPages - 1); if (p === wbPage) return;
    if (document.activeElement) document.activeElement.blur();
    zoomReset(); wbPage = p; loadSurface(); syncWB();
}
function wbNew() { wbPages++; wbGo(wbPages - 1); }
wbBtn.onclick = () => { toggleWB(); wbBtn.blur(); };
$('#wbprev').onclick = () => wbGo(wbPage - 1);
$('#wbnext').onclick = () => wbGo(wbPage + 1);
$('#wbnew').onclick = () => { wbNew(); $('#wbnew').blur(); };
syncWB();

/* ---------- overlays: overview, shortcuts, blackout ---------- */
const modals = { ovw: $('#ovw'), keys: $('#keys'), blk: $('#blk') };
let modal = null;
function openModal(n) {
    if (modal) closeModal();
    closeMenus();
    if (document.activeElement) document.activeElement.blur();
    if (n === 'blk' && autoplay) toggleAuto();
    if (n === 'ovw') renderOverview();
    modal = n; modals[n].hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => modals[n].classList.add('on')));
    if (n === 'ovw') { const c = modals.ovw.querySelector('.ui-ovc.cur'); if (c) c.scrollIntoView({ block: 'center' }); }
}
function closeModal() {
    if (!modal) return;
    const m = modals[modal]; m.classList.remove('on'); m.hidden = true; modal = null;
}
window.addEventListener('keydown', e => {
    if (!modal || /^F\d+$/.test(e.key)) return;
    const k = e.key.toLowerCase();
    e.preventDefault(); e.stopImmediatePropagation();
    if (k === 'escape' || (modal === 'blk' && k === 'k') || (modal === 'ovw' && k === 'g') || (modal === 'keys' && (k === '?' || k === '/'))) closeModal();
}, true);
modals.blk.onclick = closeModal;
modals.keys.addEventListener('click', e => { if (!e.target.closest('.ui-kcard') || e.target.closest('#keysclose')) closeModal(); });
modals.ovw.addEventListener('click', e => { if (!e.target.closest('.ui-ovc')) closeModal(); });
$('#blkbtn').onclick = () => openModal('blk');
$('#keysbtn').onclick = () => openModal('keys');
$('#ovbtn').onclick = () => { openModal('ovw'); };

const thumbs = [];
function renderOverview() {
    const g = $('#ovg'); g.innerHTML = '';
    scenes.forEach((sc, i) => {
        const c = el('button', 'ui-ovc' + (i === idx ? ' cur' : ''));
        c.setAttribute('aria-label', 'Go to scene ' + (i + 1));
        const w = el('div', 'ui-thw'); if (thumbs[i]) w.appendChild(thumbs[i].cloneNode(true));
        c.append(w, el('div', 'ui-lb', `<span class="ui-n">${i + 1}</span><span class="ui-t">${sc.title}</span>`));
        c.onclick = () => { closeModal(); if (i !== idx) go(i); };
        g.appendChild(c);
    });
}

const SHORTCUTS = [
    ['Slides', [['&rarr;', 'Next'], ['&larr;', 'Previous'], ['R', 'Replay scene'], ['Space', 'Autoplay'], ['G', 'Slide overview']]],
    ['Draw', [['P', 'Pen'], ['Y', 'Highlighter'], ['E', 'Eraser'], ['B', 'Text box'], ['C', 'Clear ink'], ['Ctrl|Z', 'Undo'], ['Ctrl|Shift|Z', 'Redo']]],
    ['Focus', [['Z', 'Zoom (scroll to adjust)'], ['L', 'Lock zoom'], ['H', 'Spotlight (scroll to resize)'], ['K', 'Blackout']]],
    ['Engage', [['M', 'Engagement methods'], ['1|5', 'Choose a method'], ['T', 'Timer']]],
    ['Whiteboard', [['W', 'Open or close'], ['&larr;|&rarr;', 'Change page'], ['N', 'New page']]],
    ['View', [['F', 'Fullscreen'], ['U', 'Hide or show UI'], ['S', 'Subtitles'], ['?', 'Shortcuts'], ['Esc', 'Close or stop tool']]]
];
$('#kgrid').innerHTML = SHORTCUTS.map(([h, rows]) => `<div class="ui-kgrp"><h3>${h}</h3>${rows.map(([k, l]) => {
    const keys = k === '1|5' ? '<kbd>1</kbd>to<kbd>5</kbd>' : k.split('|').map(x => `<kbd>${x}</kbd>`).join(k.includes('Ctrl') ? '+' : '');
    return `<div class="ui-krow"><span class="ui-ks">${keys}</span><span>${l}</span></div>`;
}).join('')}</div>`).join('');

/* ---------- export PDF ---------- */
const printBox = $('#print');
let snapN = 0;
function snapStage(boardOnly) {
    stage.querySelectorAll('input').forEach(n => n.setAttribute('value', n.value));
    const page = stage.cloneNode(true), imgs = [];
    page.removeAttribute('id'); page.removeAttribute('style'); page.classList.remove('instant');
    const sfx = '-s' + (++snapN), ren = {};
    page.querySelectorAll('[id]').forEach(n => { if (n.closest('defs')) { ren[n.id] = n.id + sfx; n.id += sfx; } else n.removeAttribute('id'); });
    if (Object.keys(ren).length) page.querySelectorAll('*').forEach(e => [...e.attributes].forEach(a => {
        const v = a.value.replace(/url\(\s*['"]?#([^)'"\s]+)['"]?\s*\)/g, (m, k) => ren[k] ? `url(#${ren[k]})` : m).replace(/^#(.+)$/, (m, k) => ren[k] && /href$/.test(a.name) ? '#' + ren[k] : m);
        if (v !== a.value) e.setAttribute(a.name, v);
    }));
    page.querySelectorAll('.ui-spot, canvas.hllive').forEach(n => n.remove());
    [['canvas.ink', ink, inkMarked, 'ink'], ['canvas.hlmain', hlc, hlMarked, 'ui-hlc']].forEach(([sel, src, marked, cls]) => {
        const cv = page.querySelector(sel); if (!cv) return;
        if (marked) { const img = new Image(); img.className = cls; img.alt = ''; img.src = src.toDataURL(); cv.replaceWith(img); imgs.push(img); }
        else cv.remove();
    });
    if (boardOnly) page.querySelectorAll('.top, .content, .caption, .progress').forEach(n => n.remove());
    return { page, imgs };
}
function runScene(i) {
    build(i);
    events.slice().sort((a, b) => a.t - b.t).forEach(e => { if (!e.done) { e.done = true; e.fn(); } });
    progress.style.transition = 'none'; progress.style.width = '100%';
}
function buildThumbs() {
    exporting = true;
    for (let i = 0; i < scenes.length; i++) {
        runScene(i);
        const { page } = snapStage(false);
        page.querySelectorAll('canvas, img.ink, img.ui-hlc, .ui-blayer').forEach(n => n.remove());
        thumbs[i] = page;
    }
    exporting = false;
}
async function exportPDF() {
    if (document.activeElement) document.activeElement.blur();
    zoomReset();
    printBox.innerHTML = '';
    const imgs = [];
    if (wbOpen) {
        const keep = wbPage;
        for (let p = 0; p < wbPages; p++) {
            wbPage = p; loadSurface(); syncWB();
            const r = snapStage(true); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        wbPage = keep; loadSurface(); syncWB();
    } else {
        const keepIdx = idx, keepBeat = beat;
        exporting = true;
        for (let i = 0; i < scenes.length; i++) {
            runScene(i);
            const r = snapStage(false); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        exporting = false;
        go(keepIdx, keepBeat);
    }
    await Promise.all(imgs.map(im => im.decode().catch(() => {})));
    window.print();
}
$('#pdf').onclick = exportPDF;
$('#wbpdf').onclick = () => { $('#wbpdf').blur(); exportPDF(); };
window.addEventListener('afterprint', () => { printBox.innerHTML = ''; });

document.addEventListener('keydown', e => {
    if (isTyping(e)) return;
    if (e.ctrlKey || e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); e.shiftKey ? redoInk() : undoInk(); }
        else if (k === 'y') { e.preventDefault(); redoInk(); }
        return;
    }
    if (e.altKey) return;
    if (e.key === 'p' || e.key === 'P') setTool(tool === 'pen' ? null : 'pen');
    if (e.key === 'e' || e.key === 'E') setTool(tool === 'eraser' ? null : 'eraser');
    if (e.key === 'c' || e.key === 'C') clearInk();
    if (e.key === 's' || e.key === 'S') toggleSubs();
    if (e.key === 't' || e.key === 'T') ftShow(ftEl.hidden);
    if (e.key === 'u' || e.key === 'U') setUI(!document.body.classList.contains('noui'));
    if (e.key === 'z' || e.key === 'Z') setZoom(!Z.on);
    if (e.key === 'l' || e.key === 'L') setLock(!Z.locked);
    if (e.key === 'h' || e.key === 'H') setSpot(!SP.on);
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'm' || e.key === 'M') toggleMenu(engMenu);
    if (e.key === 'b' || e.key === 'B') { e.preventDefault(); closeMenus(); addText(true); }
    if (e.key === 'y' || e.key === 'Y') setTool(tool === 'hl' ? null : 'hl');
    if (e.key === 'w' || e.key === 'W') toggleWB();
    if (e.key === 'k' || e.key === 'K') openModal('blk');
    if ((e.key === 'g' || e.key === 'G') && !wbOpen) openModal('ovw');
    if (e.key === '?' || e.key === '/') { e.preventDefault(); openModal('keys'); }
    if (/^[1-5]$/.test(e.key) && engMenu.classList.contains('ui-open')) { addBadge(ENG_KEYS[+e.key - 1]); closeMenus(); }
    if (e.key === 'Escape') closeMenus();
    if (e.key === 'Escape') setTool(null);
});

const controlsEl = document.querySelector('.controls');
function fit() {
    const st = $('#stage'), noui = document.body.classList.contains('noui');
    const vw = window.innerWidth - (noui ? 0 : 40), vh = window.innerHeight - (noui ? 0 : controlsEl.offsetHeight + 20);
    const k = Math.min(vw / 1280, vh / 720);
    scaleK = k;
    st.style.transform = `scale(${k})`;
    st.style.margin = `${(720 * k - 720) / 2}px ${(1280 * k - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); buildThumbs(); go(0); });
</script>
