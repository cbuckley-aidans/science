<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Toss</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1b1f45;
    --secondary: #ea008a;
    --white: #ffffff;
    --light: #f0f0f0;
  }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--primary);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow-x: hidden;
  }

  header {
    border-top: 6px solid var(--secondary);
    padding: 2rem 3rem 0;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--primary);
  }

  .wordmark {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--primary);
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--primary);
    opacity: 0.45;
    text-transform: uppercase;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 3rem;
    gap: 0;
  }

  .instruction {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--primary);
    opacity: 0.4;
    margin-bottom: 3.5rem;
  }

  .coins-wrap {
    display: flex;
    gap: 4rem;
    margin-bottom: 4rem;
    align-items: center;
  }

  .coin-scene {
    width: 120px;
    height: 120px;
    perspective: 600px;
    cursor: pointer;
  }

  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 50%;
  }

  .coin.flipping {
    animation: flip 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .coin.heads { transform: rotateY(0deg); }
  .coin.tails { transform: rotateY(180deg); }

  @keyframes flip {
    0%   { transform: rotateY(var(--start)); }
    100% { transform: rotateY(var(--end)); }
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border: 2px solid transparent;
  }

  .face.front {
    background: var(--primary);
    color: var(--white);
  }

  .face.back {
    background: var(--secondary);
    color: var(--white);
    transform: rotateY(180deg);
  }

  .face-inner {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    letter-spacing: 0.2em;
  }

  .results {
    display: flex;
    gap: 4rem;
    margin-bottom: 3.5rem;
    min-height: 4.5rem;
    align-items: flex-end;
  }

  .result-item {
    width: 120px;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s ease 0.55s, transform 0.35s ease 0.55s;
  }

  .result-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .result-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--primary);
    opacity: 0.35;
    margin-bottom: 0.35rem;
  }

  .result-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--primary);
    text-transform: uppercase;
  }

  .result-value.tails {
    color: var(--secondary);
  }

  .toss-btn {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--primary);
    border: none;
    padding: 1rem 3rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .toss-btn:hover { background: #2a3066; }
  .toss-btn:active { transform: scale(0.98); }
  .toss-btn:disabled { opacity: 0.4; cursor: default; }

  .tally {
    display: flex;
    gap: 3rem;
    margin-top: 3rem;
  }

  .tally-item {
    text-align: center;
  }

  .tally-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.35;
    margin-bottom: 0.25rem;
  }

  .tally-val {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .tally-bar-wrap {
    width: 80px;
    height: 2px;
    background: var(--light);
    margin: 0.4rem auto 0;
  }

  .tally-bar {
    height: 100%;
    background: var(--secondary);
    transition: width 0.4s ease;
  }

  footer {
    border-top: 1px solid var(--primary);
    padding: 1.25rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-note {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.35;
  }

  .tosses-count {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.35;
  }
</style>
</head>
<body>

<header>
  <span class="wordmark">Double Coin Toss</span>
  
</header>

<main>
  <p class="instruction">Click to toss both coins</p>

  <div class="coins-wrap">
    <div class="coin-scene" onclick="toss()" title="Toss coins">
      <div class="coin heads" id="coin1">
        <div class="face front"><div class="face-inner">H</div></div>
        <div class="face back"><div class="face-inner">T</div></div>
      </div>
    </div>
    <div class="coin-scene" onclick="toss()" title="Toss coins">
      <div class="coin heads" id="coin2">
        <div class="face front"><div class="face-inner">H</div></div>
        <div class="face back"><div class="face-inner">T</div></div>
      </div>
    </div>
  </div>

  <div class="results">
    <div class="result-item" id="res1">
      <div class="result-label">Coin 1</div>
      <div class="result-value" id="val1">Heads</div>
    </div>
    <div class="result-item" id="res2">
      <div class="result-label">Coin 2</div>
      <div class="result-value" id="val2">Heads</div>
    </div>
  </div>

  <button class="toss-btn" id="btn" onclick="toss()">Toss</button>

  <div class="tally" id="tally" style="display:none">
    <div class="tally-item">
      <div class="tally-label">Both heads</div>
      <div class="tally-val" id="t-hh">0</div>
      <div class="tally-bar-wrap"><div class="tally-bar" id="b-hh" style="width:0%"></div></div>
    </div>
    <div class="tally-item">
      <div class="tally-label">One each</div>
      <div class="tally-val" id="t-mix">0</div>
      <div class="tally-bar-wrap"><div class="tally-bar" id="b-mix" style="width:0%"></div></div>
    </div>
    <div class="tally-item">
      <div class="tally-label">Both tails</div>
      <div class="tally-val" id="t-tt">0</div>
      <div class="tally-bar-wrap"><div class="tally-bar" id="b-tt" style="width:0%"></div></div>
    </div>
  </div>
</main>

<footer>
<span class="tosses-count" id="tcount"></span>
</footer>

<script>
  let state = { c1: null, c2: null };
  let tally = { hh: 0, mix: 0, tt: 0, total: 0 };
  let busy = false;

  function rand() {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] / 0x100000000;
  }

  function toss() {
    if (busy) return;
    busy = true;
    document.getElementById('btn').disabled = true;

    const r1 = rand() >= 0.5;
    const r2 = rand() >= 0.5;

    const c1 = document.getElementById('coin1');
    const c2 = document.getElementById('coin2');
    const res1 = document.getElementById('res1');
    const res2 = document.getElementById('res2');

    res1.classList.remove('visible');
    res2.classList.remove('visible');

    const spins = 3;
    const end1 = (r1 ? 0 : 180) + spins * 360;
    const end2 = (r2 ? 0 : 180) + spins * 360;
    const cur1 = state.c1 === null ? 0 : (state.c1 ? 0 : 180);
    const cur2 = state.c2 === null ? 0 : (state.c2 ? 0 : 180);

    c1.style.setProperty('--start', cur1 + 'deg');
    c1.style.setProperty('--end', end1 + 'deg');
    c2.style.setProperty('--start', cur2 + 'deg');
    c2.style.setProperty('--end', end2 + 'deg');

    c1.classList.remove('flipping', 'heads', 'tails');
    c2.classList.remove('flipping', 'heads', 'tails');
    void c1.offsetWidth;
    void c2.offsetWidth;
    c1.classList.add('flipping');
    c2.classList.add('flipping');

    setTimeout(() => {
      c1.classList.remove('flipping');
      c2.classList.remove('flipping');
      c1.classList.add(r1 ? 'heads' : 'tails');
      c2.classList.add(r2 ? 'heads' : 'tails');

      const v1 = document.getElementById('val1');
      const v2 = document.getElementById('val2');
      v1.textContent = r1 ? 'Heads' : 'Tails';
      v2.textContent = r2 ? 'Heads' : 'Tails';
      v1.className = 'result-value' + (r1 ? '' : ' tails');
      v2.className = 'result-value' + (r2 ? '' : ' tails');

      res1.classList.add('visible');
      res2.classList.add('visible');

      state.c1 = r1;
      state.c2 = r2;

      if (r1 && r2) tally.hh++;
      else if (!r1 && !r2) tally.tt++;
      else tally.mix++;
      tally.total++;

      document.getElementById('t-hh').textContent = tally.hh;
      document.getElementById('t-mix').textContent = tally.mix;
      document.getElementById('t-tt').textContent = tally.tt;
      const pct = v => Math.round((v / tally.total) * 100) + '%';
      document.getElementById('b-hh').style.width = pct(tally.hh);
      document.getElementById('b-mix').style.width = pct(tally.mix);
      document.getElementById('b-tt').style.width = pct(tally.tt);

      document.getElementById('tcount').textContent = tally.total + (tally.total === 1 ? ' toss' : ' tosses');
      document.getElementById('tally').style.display = 'flex';

      document.getElementById('btn').disabled = false;
      busy = false;
    }, 720);
  }
</script>
</body>
</html>
