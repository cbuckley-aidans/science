<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramps and Efficiency</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b1f45'/%3E%3Cpath d='M24 13L46 27L24 41Z' fill='%23fff'/%3E%3Crect x='12' y='50' width='40' height='5' rx='2.5' fill='%23fff' fill-opacity='.25'/%3E%3Crect x='12' y='50' width='26' height='5' rx='2.5' fill='%23ea008a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --white: #ffffff;
        --off-white: #f5f5f5;
        --light-grey: #e8e8e8;
        --mid-grey: #9a9a9a;
        --blank: #f0f3f6;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif;
        margin: 0; background: #eaeaea; color: var(--navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }
    .viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .stage {
        width: 1280px; height: 720px; background: var(--white); border-top: 6px solid var(--navy);
        position: relative; padding: 0; transform-origin: center center; flex-shrink: 0; overflow: hidden;
    }
    .ui-zoomer { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; padding: 36px 64px 0 64px; transform-origin: 0 0; }
    .ui-spot { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease); }
    .ui-spot.on { opacity: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: var(--mid-grey); }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption {
        position: absolute; left: 64px; right: 64px; bottom: 30px;
        font-size: 27px; font-weight: 500; line-height: 1.35;
        display: flex; align-items: center; gap: 16px; min-height: 60px;
    }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption b { font-weight: 800; color: var(--pink); }
    .caption.in { animation: capIn .45s var(--ease); }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; }

    .hide { opacity: 0; transform: translateY(14px); }
    .rev { transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .35s, color .35s, border-color .35s; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .hint { margin-top: 22px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg basics */
    .t { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: .03em; fill: var(--navy); }
    .t.mid { text-anchor: middle; } .t.end { text-anchor: end; }
    .t.pk { fill: var(--pink); } .t.gr { fill: var(--mid-grey); } .t.wh { fill: #fff; }
    .t.sm { font-size: 19px; } .t.lg { font-size: 34px; font-weight: 900; }
    .t.up2 { font-size: 18px; text-transform: uppercase; letter-spacing: .12em; }
    .gnd { stroke: var(--navy); stroke-width: 4; }
    .solid { fill: var(--navy); }
    .load { fill: var(--blank); stroke: var(--navy); stroke-width: 3; }
    .rampp { fill: var(--blank); stroke: var(--navy); stroke-width: 4; stroke-linejoin: round; transition: fill .35s, stroke .35s; }
    .fa line { stroke: var(--pink); stroke-width: 7; } .fa polygon { fill: var(--pink); }
    .fn line { stroke: var(--navy); stroke-width: 7; } .fn polygon { fill: var(--navy); }
    .ti line { stroke-width: 4; }
    .ln { fill: none; stroke: var(--navy); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .lnp { fill: none; stroke: var(--pink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .heat { fill: none; stroke: var(--pink); stroke-width: 3.5; stroke-linecap: round; }
    .angarc { fill: none; stroke: var(--pink); stroke-width: 3; }
    svg .rev.hide { transform: translateY(10px); }

    /* shared blocks */
    .card { border: 3px solid var(--navy); border-radius: 8px; padding: 18px 28px; }
    .card.pink { border-color: var(--pink); }
    .prompt { font-size: 30px; font-weight: 600; line-height: 1.3; text-align: center; max-width: 1060px; margin-bottom: 22px; }
    .prompt b { color: var(--pink); font-weight: 800; }
    .ans { margin-top: 14px; border-left: 6px solid var(--pink); padding: 4px 0 4px 16px; font-size: 22px; font-weight: 600; line-height: 1.35; }
    .ans b { color: var(--pink); font-weight: 800; }
    .atext { font-size: 27px; font-weight: 600; line-height: 1.3; margin-top: 6px; }
    .atext b { color: var(--pink); font-weight: 800; }
    .aex { font-size: 22px; color: var(--mid-grey); font-weight: 700; margin-top: 10px; line-height: 1.3; }
    .aex b { color: var(--navy); }
    .dex { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase; line-height: 1.05; }
    .qn { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 24px; display: flex; align-items: center; justify-content: center; }
    .qn.p { background: var(--pink); }
    .feq { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; letter-spacing: .02em; }
    .feq b { color: var(--pink); }
    .fnote { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mid-grey); }

    /* title + SC list */
    .lg { margin-top: 18px; border-left: 8px solid var(--pink); padding: 4px 0 4px 22px; max-width: 980px; }
    .lgt { font-size: 30px; font-weight: 700; margin-top: 4px; line-height: 1.25; }
    .sclist { display: flex; flex-direction: column; gap: 14px; width: 1020px; }
    .scrow { display: flex; align-items: center; gap: 22px; font-size: 30px; font-weight: 500; border-bottom: 2px solid var(--light-grey); padding-bottom: 14px; }
    .scrow .code { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 32px; color: var(--pink); width: 74px; flex-shrink: 0; }
    .scrow b { font-weight: 800; }

    /* incline (reused) */
    .ipl { display: flex; gap: 40px; align-items: flex-start; }
    .ipl svg { display: block; overflow: visible; }
    .srow { display: flex; align-items: center; gap: 18px; margin-top: 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .srow input { flex: 1; accent-color: var(--pink); height: 28px; cursor: pointer; }
    .srow .av { color: var(--pink); min-width: 52px; }
    .stats { display: flex; gap: 20px; }
    .stat { flex: 1; border: 3px solid var(--navy); border-radius: 8px; padding: 8px 18px; }
    .stat.pink { border-color: var(--pink); }
    .stat .num { font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .stat.pink .num { color: var(--pink); }
    .graph { margin-top: 14px; }
    .axis { stroke: var(--navy); stroke-width: 2.5; }
    .curve { fill: none; stroke: var(--pink); stroke-width: 4; }
    .gdot { fill: var(--pink); stroke: #fff; stroke-width: 3; }
    .note { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mid-grey); margin-top: 8px; }

    /* same job, different paths */
    .jpanels { display: flex; gap: 24px; }
    .jpanel { width: 368px; border: 3px solid var(--navy); border-radius: 8px; padding: 12px 20px 16px; }
    .jpanel svg { display: block; margin: 4px auto 8px; overflow: visible; }
    .jstats { display: flex; gap: 12px; }
    .jstat { flex: 1; border-top: 3px solid var(--light-grey); padding-top: 6px; }
    .jstat .dlbl { font-size: 17px; }
    .jstat .v { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; color: #c3c6d0; transition: color .3s; }
    .jstat.f .v.on2 { color: var(--pink); }
    .jstat.d .v.on2 { color: var(--navy); }
    .jnote { margin-top: 16px; }

    /* work trade-off */
    .wtile { fill: #fde3f2; stroke: var(--pink); stroke-width: 3; }
    .wtile.rev.hide { transform: scale(.6); transform-box: fill-box; transform-origin: center; }
    .wfrm { fill: none; stroke: var(--navy); stroke-width: 4; }
    .wrow { display: flex; gap: 24px; width: 1060px; margin-bottom: 14px; }
    .wrow .card { display: flex; align-items: center; justify-content: center; }
    .wsum { font-size: 26px; font-weight: 700; line-height: 1.3; }
    .wsum b { color: var(--pink); font-weight: 800; }

    /* predict */
    .rz .rampp { fill: var(--blank); }
    .rz.hl .rampp { fill: #fde3f2; stroke: var(--pink); }
    .rz .rnum circle { fill: var(--navy); transition: fill .35s; }
    .rz.hl .rnum circle { fill: var(--pink); }
    .qcards { display: flex; gap: 24px; margin-top: 14px; }
    .qcard { width: 368px; border: 3px solid var(--navy); border-radius: 8px; padding: 12px 18px; }
    .qcard .qh { display: flex; gap: 12px; align-items: flex-start; font-size: 22px; font-weight: 600; line-height: 1.3; }
    .qcard .qh b { color: var(--pink); font-weight: 800; }
    .qcard .qa { margin-top: 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: var(--pink); }

    /* zigzag */
    .zq { font-size: 30px; font-weight: 600; line-height: 1.3; text-align: center; }
    .zq b { color: var(--pink); font-weight: 800; }
    .zterms { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 10px 0 4px; }
    .zterms span { font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border: 3px solid var(--navy); border-radius: 30px; padding: 2px 16px; }
    .road { stroke: var(--navy); stroke-width: 8; stroke-linecap: round; fill: none; }
    .gd { stroke: #b4b8c4; stroke-width: 2.5; stroke-dasharray: 6 6; fill: none; }
    .fg line { stroke: #b4b8c4; stroke-width: 4; } .fg polygon { fill: #b4b8c4; }

    /* efficiency formula */
    .frm { display: flex; align-items: center; gap: 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 40px; line-height: 1.1; white-space: nowrap; }
    .frm.sm { font-size: 32px; gap: 12px; }
    .frm.xs { font-size: 17px; gap: 6px; font-weight: 800; }
    .frac { display: inline-flex; flex-direction: column; align-items: center; }
    .frac > span { padding: 2px 10px; }
    .frac .nu { border-bottom: 4px solid var(--navy); }
    .frm.xs .frac .nu { border-bottom-width: 2px; }
    .frm.xs .frac > span { padding: 1px 4px; }
    .frm b { font-weight: 900; }
    .w0 { color: var(--navy); } .w1 { color: var(--pink); }
    .fbig { margin: 18px 0 14px; }
    .exrow { display: flex; gap: 24px; align-items: center; }
    .expan { border: 3px solid var(--navy); border-radius: 8px; padding: 8px 14px 8px; display: flex; flex-direction: column; align-items: center; }
    .expan svg { display: block; overflow: visible; }
    .exv { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; line-height: 1; margin-top: 2px; }
    .excalc { padding-left: 10px; }
    .jpanel.best { border-color: var(--pink); }
    .jstats.three .dlbl { font-size: 15px; letter-spacing: .1em; }
    .jstats.three .v { font-size: 40px; }
    .jstat.e .v.on2 { color: var(--pink); }
    .jstat .v.pk2 { color: var(--pink); }
    .wrow .card .frm { justify-content: center; }

    /* lever */
    .lvw { display: flex; gap: 30px; align-items: center; }
    .lvw svg { display: block; overflow: visible; }
    .lvcol { width: 440px; display: flex; flex-direction: column; gap: 16px; }
    .lvst { display: flex; gap: 16px; }
    .lvcol .card { padding: 14px 22px; }
    .lvcol .wsum { font-size: 23px; }
    .ghost2 { fill: none; stroke: #b4b8c4; stroke-width: 2.5; stroke-dasharray: 6 5; }

    /* calculate and compare */
    .cstrip { display: flex; gap: 22px; align-items: flex-start; width: 1152px; margin-bottom: 16px; }
    .fmini { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; border: 2px solid var(--pink); border-radius: 6px; padding: 6px 12px; flex-shrink: 0; width: 250px; line-height: 1.2; }
    .qitem { flex: 1; display: flex; gap: 12px; font-size: 21px; font-weight: 600; line-height: 1.3; }
    .qitem b { color: var(--pink); font-weight: 800; }
    .mcards { display: flex; gap: 24px; }
    .mcard { position: relative; width: 368px; border: 3px solid var(--navy); border-radius: 8px; padding: 12px 22px 16px; transition: border-color .35s; }
    .mcard.best { border-color: var(--pink); }
    .mhead { display: flex; align-items: center; gap: 14px; }
    .mhead .dex { font-size: 30px; }
    .mhead svg { flex-shrink: 0; overflow: visible; }
    .pline { display: flex; justify-content: space-between; align-items: baseline; font-size: 21px; font-weight: 600; border-bottom: 2px solid var(--light-grey); padding: 5px 0; }
    .pline b { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; }
    .pres { margin-top: 10px; }
    .pcalc { font-size: 20px; font-weight: 600; color: var(--mid-grey); }
    .pbigp { font-family: 'Barlow Condensed', sans-serif; font-size: 50px; font-weight: 900; color: var(--pink); line-height: 1.05; }
    .mbar-unused { height: 14px; background: var(--light-grey); border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .mbar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width 1.4s var(--ease); }
    .rank { position: absolute; top: -18px; right: 16px; width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: #fff;
        font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .mcard.best .rank { background: var(--pink); }
    .cans { width: 1152px; }

    /* summary */
    .sumgrid { display: grid; grid-template-columns: repeat(2, 540px); gap: 24px 32px; }
    .scard { border: 3px solid var(--navy); border-radius: 8px; padding: 18px 28px; }
    .scard.pink { border-color: var(--pink); }
    .scard .dex { font-size: 40px; margin-bottom: 6px; }
    .scard.pink .dex { color: var(--pink); }
    .scard .dhow { font-size: 23px; font-weight: 600; line-height: 1.3; }
    .scard .tagsc { float: right; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); margin-top: 8px; }


    /* controls */
    .controls { position: relative; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 24px; padding: 12px 20px 16px; width: 100%; font-family: 'Barlow Condensed', sans-serif; }
    .grp { display: flex; align-items: center; gap: 8px; }
    .controls [hidden] { display: none !important; }
    .controls button {
        font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2;
        display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--navy); border: none; border-radius: 6px; padding: 9px 13px; cursor: pointer;
    }
    .controls button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .controls button.on { background: var(--pink); color: var(--white); }
    .controls button.ui-pri { background: var(--navy); color: var(--white); }
    .controls button.ui-fs { background: var(--pink); color: var(--white); }
    .controls button.ui-fs.ui-isfs { background: var(--white); color: var(--navy); }
    .controls button.ui-fs.ui-nudge { animation: nudge 1.6s ease-out 1s 4; }
    @keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(234,0,138,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(234,0,138,0); } }
    .controls svg.ui-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .controls svg.ui-chev { width: 13px; height: 13px; stroke-width: 3; opacity: .6; transition: transform .2s var(--ease); }
    .ui-menu.ui-open > .ui-mt svg.ui-chev { transform: rotate(180deg); }
    .ui-mt .ui-pdot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px var(--white); }
    .controls .dots { display: flex; gap: 8px; margin: 0 8px 0 12px; }
    .controls .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #c9ccd6; }
    .controls .dots button.cur { background: var(--pink); }
    .steplbl { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); margin-left: 6px; min-width: 110px; }
    .controls kbd { margin-left: 2px; }

    /* menus */
    .ui-menu { position: relative; }
    .ui-pop { display: none; position: absolute; left: 0; bottom: calc(100% + 10px); min-width: 260px; flex-direction: column; gap: 2px; padding: 4px 8px 8px;
        background: var(--white); border-top: 6px solid var(--navy); border-radius: 10px; box-shadow: 0 10px 30px rgba(27,31,69,.25), 0 0 0 1px rgba(27,31,69,.08); }
    .ui-menu.ui-r .ui-pop { left: auto; right: 0; }
    .ui-menu.ui-open .ui-pop { display: flex; animation: popIn .18s var(--ease); }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .ui-ph { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 10px 6px; }
    .ui-pop .ui-mi { width: 100%; padding: 9px 10px; background: transparent; white-space: nowrap; }
    .ui-pop .ui-mi:hover { background: var(--off-white); }
    .ui-pop .ui-mi kbd { margin-left: auto; padding-left: 5px; }
    .ui-pop .ui-mi .ui-ind { width: 14px; height: 14px; border: 2.5px solid var(--navy); border-radius: 3px; flex-shrink: 0; margin-right: 4px; }
    .ui-pop .ui-mi .ui-ind.ui-no { border-color: transparent; }
    .ui-pop .ui-mi.on { background: transparent; color: var(--pink); }
    .ui-pop .ui-mi.on:hover { background: var(--off-white); }
    .ui-pop .ui-mi.on .ui-ind { background: var(--pink); border-color: var(--pink); }
    .ui-pop .ui-mi:disabled { opacity: .35; cursor: default; background: transparent; }
    .ui-pop .ui-mi.ui-eng .ui-ind { border: none; border-radius: 50%; }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-pk { background: var(--pink); }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-nv { background: var(--navy); }
    .ui-pop .ui-swrow { display: flex; gap: 8px; padding: 4px 10px 10px 38px; }
    .ui-pop .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 3px solid var(--white); box-shadow: 0 0 0 1px #c9ccd6; }
    .ui-pop .swatch.cur { box-shadow: 0 0 0 3px var(--navy); }
    .ui-pop .ui-div { height: 1.5px; background: var(--light-grey); margin: 4px 6px; }



    /* highlighter and whiteboard surfaces */
    .ui-hlc { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; z-index: 4; mix-blend-mode: multiply; }
    .ui-wboard { display: none; position: absolute; left: 0; top: 0; width: 1280px; height: 714px; background: var(--white); z-index: 3; }
    body.ui-wb .ui-wboard { display: block; }
    .ui-wbl { position: absolute; right: 64px; top: 40px; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); }
    .ui-wbl b { color: var(--navy); }
    .ui-wbg { display: none; }
    body.ui-wb .ui-wbg { display: flex; }
    body.ui-wb .grp.ui-nav { display: none; }
    .ui-wbtag { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); background: var(--pink); border-radius: 6px; padding: 9px 13px; line-height: 1.2; }
    .controls button:disabled { opacity: .35; cursor: default; }

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), caption = $('#caption'), titleEl = $('#title'), counter = $('#counter'), progress = $('#progress');
let timers = [], events = [], beats = [], idx = 0, beat = 0, autoplay = false;
let segFrom = 0, segTo = 0, segStart = 0;
let ptimers = [], cleanups = [];
const stage = document.getElementById('stage');

function at(ms, fn) { events.push({ t: ms, fn, done: false }); }
function beatAt(ms, html) { beats.push(ms); at(ms, () => say(html)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function show(e) { e.classList.remove('hide'); }
function say(html) { caption.innerHTML = '<span>' + html + '</span>'; caption.classList.remove('in'); void caption.offsetWidth; caption.classList.add('in'); }
function stopInteractive() { ptimers.forEach(clearTimeout); ptimers = []; cleanups.forEach(f => f()); cleanups = []; }

/* ---------- deck helpers ---------- */
const deg = a => a * Math.PI / 180;
const f1 = n => String(Math.round(n * 10) / 10);
const svgBox = (w, h, inner, cls = '') => el('div', cls, `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${inner}</svg>`);
const tx = (x, y, s, cls = '') => `<text class="t ${cls}" x="${f1(x)}" y="${f1(y)}">${s}</text>`;
const heat = (x, y) => `<path class="heat" d="M${x} ${y} q6 -7 0 -14 q-6 -7 0 -14 q6 -7 0 -14"/>`;
const q1 = (r, s) => r.querySelector(s), qa = (r, s) => [...r.querySelectorAll(s)];
function arrow(x1, y1, x2, y2, cls = 'fa', hw = 12) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1), hl = Math.min(hw * 1.6, L * 0.6);
    const bx = x2 - Math.cos(a) * hl, by = y2 - Math.sin(a) * hl, px = Math.sin(a) * hw, py = -Math.cos(a) * hw;
    return `<g class="${cls}"><line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(bx + Math.cos(a))}" y2="${f1(by + Math.sin(a))}"/><polygon points="${f1(x2)},${f1(y2)} ${f1(bx + px)},${f1(by + py)} ${f1(bx - px)},${f1(by - py)}"/></g>`;
}
const easeIO = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
/* frame-driven motion that snaps to its end state when skipping, building thumbnails or exporting */
function mkTween() {
    let raf = 0;
    cleanups.push(() => cancelAnimationFrame(raf));
    return (D, fn, done) => {
        cancelAnimationFrame(raf);
        if (exporting || stage.classList.contains('instant')) { fn(1, false); if (done) done(); return; }
        const st = performance.now();
        const f = n => { const p = Math.min(1, (n - st) / D); fn(p, true); if (p < 1) raf = requestAnimationFrame(f); else if (done) done(); };
        raf = requestAnimationFrame(f);
    };
}

/* wheelchair, drawn with its wheels touching y = 0 */
const CHAIR = `<circle cx="-4" cy="-20" r="19" fill="#fff" stroke="#1b1f45" stroke-width="4"/><circle cx="-4" cy="-20" r="3" class="solid"/><circle cx="22" cy="-5" r="5" fill="#fff" stroke="#1b1f45" stroke-width="3"/><path class="ln" style="stroke-width:4" d="M-18 -64 L-14 -34 H14 L22 -10"/><circle cx="-8" cy="-80" r="8" style="fill:var(--pink)"/><path class="lnp" style="stroke-width:7" d="M-10 -68 L-6 -40 H12 L16 -20"/>`;

const MI = {
    lever: `<line class="ln" x1="8" y1="58" x2="112" y2="74"/><polygon points="62,69 48,92 76,92" style="fill:var(--pink)"/><rect class="load" x="14" y="36" width="26" height="22"/>${arrow(102, 20, 102, 66, 'fa ti', 7)}`,
    pulley: `<line class="ln" x1="28" y1="6" x2="92" y2="6"/><line class="ln" x1="60" y1="6" x2="60" y2="24"/><line class="ln" style="stroke-width:3" x1="43" y1="40" x2="43" y2="68"/><line class="ln" style="stroke-width:3" x1="77" y1="40" x2="77" y2="74"/><circle cx="60" cy="40" r="17" fill="#fff" stroke="#1b1f45" stroke-width="5"/><circle cx="60" cy="40" r="4" class="solid"/><rect class="load" x="31" y="68" width="24" height="22"/>${arrow(77, 72, 77, 98, 'fa ti', 7)}`,
    trolley: `<rect class="load" x="22" y="28" width="70" height="44" rx="3"/><rect class="solid" x="12" y="72" width="90" height="8" rx="2"/><circle cx="28" cy="88" r="9" fill="#fff" stroke="#1b1f45" stroke-width="4"/><circle cx="86" cy="88" r="9" fill="#fff" stroke="#1b1f45" stroke-width="4"/><line class="ln" style="stroke-width:4" x1="102" y1="76" x2="112" y2="26"/>`,
    incline: `<polygon class="rampp" points="8,92 112,92 112,32"/><g transform="rotate(-30 60 62)"><rect class="solid" x="47" y="40" width="26" height="22" rx="2"/></g>`
};

/* same job, different paths panel: lift straight up or a ramp, 1 m high, 100 N box */
function jobPanel(name, len, force, effPct) {
    const M = 60, GY = 178, PX = 252, BW = 36, BH = 30;
    const p = el('div', 'jpanel rev hide', `<div class="dlbl">${name}</div>`);
    let inner = `<line class="gnd" x1="0" y1="${GY}" x2="320" y2="${GY}"/><rect class="load" x="${PX}" y="${GY - M}" width="64" height="${M}"/>${tx(PX + 32, GY - M / 2 + 7, '1 m', 'mid sm')}`;
    let rb = null;
    const AL = force * 0.62;
    if (len > 1) {
        const base = Math.sqrt(len * len - 1) * M, x0 = PX - base;
        rb = rampBox(x0, GY, base, M);
        inner += `<polygon class="rampp" points="${f1(x0)},${GY} ${PX},${GY} ${PX},${GY - M}"/>
            <path class="angarc" d="M${f1(x0 + 34)} ${GY} A34 34 0 0 0 ${f1(x0 + 34 * Math.cos(rb.a))} ${f1(GY - 34 * Math.sin(rb.a))}"/>`;
    }
    const arr = len > 1 ? arrow(BW / 2 + 4, -BH / 2, BW / 2 + 4 + AL, -BH / 2, 'fa', 9) : arrow(0, -BH - 4, 0, -BH - 4 - AL, 'fa', 9);
    inner += `<g class="bx"><rect class="solid" x="${-BW / 2}" y="${-BH}" width="${BW}" height="${BH}" rx="3"/><g class="ea" style="opacity:0;transition:opacity .3s">${arr}</g></g>`;
    const svg = svgBox(320, 196, inner);
    const three = effPct !== undefined;
    const st = el('div', 'jstats' + (three ? ' three' : ''), `<div class="jstat f"><div class="dlbl">${three ? 'Effort' : 'Effort force'}</div><div class="v">? N</div></div><div class="jstat d"><div class="dlbl">Distance</div><div class="v">? m</div></div>` +
        (three ? `<div class="jstat e"><div class="dlbl">Efficiency</div><div class="v">? %</div></div>` : ''));
    p.append(svg, st);
    const bx = q1(svg, '.bx'), ea = q1(svg, '.ea'), [fv, dv, evv] = qa(st, '.v'), tw = mkTween();
    const place = q => {
        if (rb) bx.setAttribute('transform', rb.pos((BW / 2 + 2 + q * (rb.L - BW - 4)) / rb.L));
        else bx.setAttribute('transform', `translate(${PX - BW / 2 - 4} ${f1(GY - q * M)})`);
    };
    place(0);
    const on = () => { ea.style.opacity = 1; fv.textContent = force + ' N'; fv.classList.add('on2'); dv.classList.add('on2'); };
    return {
        p, svg, dv,
        run() { on(); tw(len * 1100 + 900, p => { const q = easeIO(p); place(q); dv.textContent = (q * len).toFixed(1) + ' m'; }, () => { dv.textContent = len + ' m'; }); },
        done() { on(); place(1); dv.textContent = len + ' m'; },
        eff() { evv.textContent = effPct + '%'; evv.classList.add('on2'); }
    };
}
/* efficiency formula as a stacked fraction */
const frm = (a, b, tail = '&times; 100', cls = '') => `<div class="frm ${cls}"><span>Efficiency =</span><span class="frac"><span class="nu">${a}</span><span class="de">${b}</span></span><span>${tail}</span></div>`;

/* a box that slides along a ramp: returns svg and a setter for progress 0 to 1 */
function rampBox(x0, gy, base, h, bw, bh) {
    const a = Math.atan2(h, base), L = Math.hypot(base, h);
    return {
        a, L,
        pos: p => `translate(${f1(x0 + p * L * Math.cos(a))} ${f1(gy - p * L * Math.sin(a))}) rotate(${f1(-a * 180 / Math.PI)})`
    };
}

/* ---------- scenes ---------- */
const scenes = [
{
    title: 'Ramps and <span>efficiency</span>',
    dur: 10500,
    run() {
        const c = el('div', 'center');
        const GY = 230, X0 = 120, B = 470, H = 150;
        const rb = rampBox(X0, GY, B, H);
        const s = svgBox(760, 250, `
            <line class="gnd" x1="40" y1="${GY}" x2="720" y2="${GY}"/>
            <polygon class="rampp" points="${X0},${GY} ${X0 + B},${GY} ${X0 + B},${GY - H}"/>
            <rect class="load" x="${X0 + B}" y="${GY - H}" width="110" height="${H}"/>
            <path class="angarc" d="M${X0 + 70} ${GY} A70 70 0 0 0 ${f1(X0 + 70 * Math.cos(rb.a))} ${f1(GY - 70 * Math.sin(rb.a))}"/>
            <g class="bx" transform="${rb.pos(0.12)}"><rect class="solid" x="-34" y="-50" width="68" height="50" rx="4"/>${arrow(40, -25, 110, -25, 'fa', 11)}${tx(75, -42, 'Effort', 'mid pk sm')}</g>`, 'rev hide');
        const lg = el('div', 'lg rev hide', '<div class="dlbl">Learning intention</div><div class="lgt">To investigate how the angle of a ramp affects effort force and distance, and how efficient different simple machines are.</div>');
        c.append(s, lg); content.appendChild(c);
        const bx = q1(s, '.bx'), tw = mkTween();
        beatAt(0, 'Today we are taking a closer look at <b>ramps</b> and the <b>efficiency</b> of simple machines.');
        at(400, () => show(s));
        at(1400, () => tw(3000, p => bx.setAttribute('transform', rb.pos(0.12 + easeIO(p) * 0.56))));
        beatAt(5000, 'We will find out why a gentle ramp makes a job easier, and how to calculate the efficiency of a simple machine.');
        at(5500, () => show(lg));
    }
},
{
    title: 'Success <span>criteria</span>',
    sc: ['SC10', 'SC11'],
    dur: 10000,
    run() {
        const c = el('div', 'center');
        const list = el('div', 'sclist');
        const SC = [
            ['SC10', 'I can <b>describe</b> the relationship between angle of inclination and effort force.'],
            ['SC11', 'I can <b>compare</b> the efficiency of different simple machines.']
        ];
        const rows = SC.map(([k, t]) => { const r = el('div', 'scrow rev hide', `<span class="code">${k}</span><span>${t}</span>`); list.appendChild(r); return r; });
        c.appendChild(list); content.appendChild(c);
        beatAt(0, 'Here are our <b>success criteria</b>. SC10 is about ramps and effort force.');
        at(500, () => show(rows[0]));
        beatAt(5000, 'SC11 is about comparing how <b>efficient</b> different simple machines are.');
        at(5400, () => show(rows[1]));
    }
},
{
    title: 'Same job, <span>different paths</span>',
    sc: ['SC10'],
    dur: 28500,
    run() {
        const c = el('div', 'center'), w = el('div', 'jpanels');
        const P = [jobPanel('Lift straight up', 1, 100), jobPanel('Steep ramp', 2, 50), jobPanel('Gentle ramp', 4, 25)];
        P.forEach(x => w.appendChild(x.p));
        const nt = el('div', 'fnote jnote rev hide', 'Load weight 100 N &middot; Height 1 m &middot; Assumes no friction');
        c.append(w, nt); content.appendChild(c);
        beatAt(0, 'Imagine you need to raise a <b>100 N box</b> onto a platform <b>1 metre</b> high. There is more than one way to do it.');
        P.forEach((x, i) => at(400 + i * 250, () => show(x.p)));
        beatAt(5500, 'You could <b>lift it straight up</b>. That needs an effort force of 100 N, over a distance of just 1 metre.');
        at(6200, P[0].run);
        beatAt(11500, 'Or you could push it up a <b>steep ramp</b>. The effort force halves to 50 N, but the box travels 2 metres.');
        at(12200, P[1].run);
        beatAt(17500, 'A <b>gentle ramp</b> needs only 25 N of effort force, but now the box travels 4 metres.');
        at(18200, P[2].run);
        beatAt(24000, 'Every path raises the box to the same height. A ramp <b>reduces the effort force</b>, but the load travels <b>further</b>.');
        at(24500, () => show(nt));
    }

/* ---------- player ---------- */
const dots = $('#dots');
scenes.forEach((_, i) => { const d = el('button'); d.setAttribute('aria-label', 'Scene ' + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });

const stepLbl = $('#steplbl');
const dur = () => scenes[idx].dur;
const beatEnd = b => (b + 1 < beats.length ? beats[b + 1] : dur());
function label() { stepLbl.textContent = `Step ${beat + 1} of ${beats.length}`; }

function build(i) {
    clearTimers();
    stopInteractive();
    const ni = Math.max(0, Math.min(scenes.length - 1, i));
    if (ni !== idx) { saveInk(); idx = ni; loadInk(); zoomReset(); renderBadges(); }
    events = []; beats = [];
    const sc = scenes[idx];
    content.innerHTML = ''; caption.innerHTML = '';
    titleEl.innerHTML = sc.title;
    counter.innerHTML = `<b>${idx + 1}</b> / ${scenes.length}`;
    uiSetCfu(sc.cfu, sc.time); uiSetSC(sc.sc);
    [...dots.children].forEach((d, j) => d.classList.toggle('cur', j === idx));
    sc.run();
    beats = [...new Set(beats)].sort((a, b) => a - b);
}

function jumpTo(to) {
    stage.classList.add('instant');
    events.filter(e => !e.done && e.t < to).sort((a, b) => a.t - b.t).forEach(e => { e.done = true; e.fn(); });
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
}

function setProgress(from, to) {
    progress.style.transition = 'none';
    progress.style.width = (from / dur() * 100) + '%';
    void progress.offsetWidth;
    progress.style.transition = `width ${Math.max(0, to - from)}ms linear`;
    progress.style.width = (to / dur() * 100) + '%';
}

function play(from, to, onEnd) {
    clearTimers();
    segFrom = from; segTo = to; segStart = performance.now();
    events.filter(e => !e.done && e.t >= from && e.t < to)
        .forEach(e => timers.push(setTimeout(() => { e.done = true; e.fn(); }, e.t - from)));
    beats.forEach((bt, k) => { if (bt > from && bt < to) timers.push(setTimeout(() => { beat = k; label(); }, bt - from)); });
    if (onEnd) timers.push(setTimeout(onEnd, to - from));
    setProgress(from, to);
}

function now() { return Math.min(segTo, segFrom + performance.now() - segStart); }

function startBeat(b) {
    beat = b; label();
    jumpTo(beats[b]);
    if (autoplay) play(beats[b], dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    else play(beats[b], beatEnd(b));
}

function go(i, b = 0) {
    build(i);
    startBeat(b === 'last' ? beats.length - 1 : b);
}

function next() {
    if (autoplay) { if (idx < scenes.length - 1) go(idx + 1); return; }
    clearTimers();
    if (beat < beats.length - 1) { jumpTo(beatEnd(beat)); startBeat(beat + 1); }
    else if (idx < scenes.length - 1) go(idx + 1);
    else { jumpTo(dur()); setProgress(dur(), dur()); }
}

function back() {
    if (autoplay) { go(idx - 1); return; }
    if (beat > 0) go(idx, beat - 1);
    else if (idx > 0) go(idx - 1, 'last');
    else go(0);
}

function toggleAuto() {
    autoplay = !autoplay;
    autoBtn.classList.toggle('on', autoplay); autoBtn.setAttribute('aria-pressed', autoplay);
    const cur = now();
    clearTimers();
    if (autoplay) {
        play(cur, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    } else {
        let b = 0; beats.forEach((bt, k) => { if (bt <= cur) b = k; });
        beat = b; label();
        jumpTo(beatEnd(b));
        setProgress(beatEnd(b), beatEnd(b));
    }
}

const autoBtn = $('#auto');
$('#next').onclick = next;
$('#back').onclick = back;
$('#replay').onclick = () => { zoomReset(); go(idx); };
autoBtn.onclick = toggleAuto;
const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);
document.addEventListener('keydown', e => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (wbOpen) {
        if (e.key === 'ArrowRight') wbGo(wbPage + 1);
        if (e.key === 'ArrowLeft') wbGo(wbPage - 1);
        if (e.key === 'n' || e.key === 'N') wbNew();
        if (e.key === ' ') e.preventDefault();
        return;
    }
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') back();
    if (e.key === 'r' || e.key === 'R') { zoomReset(); go(idx); }
    if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const targetsOf = op => op.t === 'eraser' ? [ctx, hctx] : op.t === 'hl' ? [hctx] : [ctx];

/* ---------- pasted images ---------- */

function readImage(file) {

}

/* ---------- export PDF ---------- */
const printBox = $('#print');
let snapN = 0;
function snapStage(boardOnly) {
    stage.querySelectorAll('input').forEach(n => n.setAttribute('value', n.value));
    const page = stage.cloneNode(true), imgs = [];
    page.removeAttribute('id'); page.removeAttribute('style'); page.classList.remove('instant');
    const sfx = '-s' + (++snapN), ren = {};
    page.querySelectorAll('[id]').forEach(n => { if (n.closest('defs')) { ren[n.id] = n.id + sfx; n.id += sfx; } else n.removeAttribute('id'); });
    if (Object.keys(ren).length) page.querySelectorAll('*').forEach(e => [...e.attributes].forEach(a => {
        const v = a.value.replace(/url\(\s*['"]?#([^)'"\s]+)['"]?\s*\)/g, (m, k) => ren[k] ? `url(#${ren[k]})` : m).replace(/^#(.+)$/, (m, k) => ren[k] && /href$/.test(a.name) ? '#' + ren[k] : m);
        if (v !== a.value) e.setAttribute(a.name, v);
    }));
    page.querySelectorAll('.ui-spot, canvas.hllive').forEach(n => n.remove());
    [['canvas.ink', ink, inkMarked, 'ink'], ['canvas.hlmain', hlc, hlMarked, 'ui-hlc']].forEach(([sel, src, marked, cls]) => {
        const cv = page.querySelector(sel); if (!cv) return;
        if (marked) { const img = new Image(); img.className = cls; img.alt = ''; img.src = src.toDataURL(); cv.replaceWith(img); imgs.push(img); }
        else cv.remove();
    });
    if (boardOnly) page.querySelectorAll('.top, .content, .caption, .progress').forEach(n => n.remove());
    return { page, imgs };
}
function runScene(i) {

    progress.style.transition = 'none'; progress.style.width = '100%';
}

        runScene(i);
        const { page } = snapStage(false);
        page.querySelectorAll('canvas, img.ink, img.ui-hlc, .ui-blayer').forEach(n => n.remove());

}
async function exportPDF() {
    if (document.activeElement) document.activeElement.blur();
    zoomReset();
    printBox.innerHTML = '';
    const imgs = [];
    if (wbOpen) {
        const keep = wbPage;
        for (let p = 0; p < wbPages; p++) {
            wbPage = p; loadSurface(); syncWB();
            const r = snapStage(true); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        wbPage = keep; loadSurface(); syncWB();
    } else {
        const keepIdx = idx, keepBeat = beat;
        exporting = true;
        for (let i = 0; i < scenes.length; i++) {
            runScene(i);
            const r = snapStage(false); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        exporting = false;

}
$('#pdf').onclick = exportPDF;

document.addEventListener('keydown', e => {
    if (isTyping(e)) return;
    if (e.ctrlKey || e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); e.shiftKey ? redoInk() : undoInk(); }
        else if (k === 'y') { e.preventDefault(); redoInk(); }

    }
    if (e.altKey) return;
    if (e.key === 'p' || e.key === 'P') setTool(tool === 'pen' ? null : 'pen');
    if (e.key === 'e' || e.key === 'E') setTool(tool === 'eraser' ? null : 'eraser');
    if (e.key === 'c' || e.key === 'C') clearInk();

const controlsEl = document.querySelector('.controls');
function fit() {
