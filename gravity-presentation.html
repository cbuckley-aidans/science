<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b1f45'/%3E%3Cpath d='M24 13L46 27L24 41Z' fill='%23fff'/%3E%3Crect x='12' y='50' width='40' height='5' rx='2.5' fill='%23fff' fill-opacity='.25'/%3E%3Crect x='12' y='50' width='26' height='5' rx='2.5' fill='%23ea008a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --white: #ffffff;
        --off-white: #f5f5f5;
        --light-grey: #e8e8e8;
        --mid-grey: #9a9a9a;
        --blank: #f0f3f6;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif;
        margin: 0; background: #eaeaea; color: var(--navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }
    .viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .stage {
        width: 1280px; height: 720px; background: var(--white); border-top: 6px solid var(--navy);
        position: relative; padding: 0; transform-origin: center center; flex-shrink: 0; overflow: hidden;
    }
    .ui-zoomer { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; padding: 36px 64px 0 64px; transform-origin: 0 0; }
    .ui-spot { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease); }
    .ui-spot.on { opacity: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: var(--mid-grey); }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption {
        position: absolute; left: 64px; right: 64px; bottom: 30px;
        font-size: 27px; font-weight: 500; line-height: 1.35;
        display: flex; align-items: center; gap: 16px; min-height: 60px;
    }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption b { font-weight: 800; color: var(--pink); }
    .caption.in { animation: capIn .45s var(--ease); }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; }

    .hide { opacity: 0; transform: translateY(14px); }
    .rev { transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .35s, color .35s, border-color .35s; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .hint { margin-top: 22px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }

    /* ---------- gravity deck ---------- */
    .gv-q { font-size: 30px; font-weight: 700; line-height: 1.25; }
    .gv-q b { color: var(--pink); font-weight: 800; }
    .gv-sub { font-size: 23px; font-weight: 600; line-height: 1.3; color: var(--navy); }
    .gv-sub b { color: var(--pink); font-weight: 800; }
    .gv-row { display: flex; align-items: center; justify-content: space-between; gap: 40px; height: 100%; }
    .gv-stack { display: flex; flex-direction: column; gap: 18px; }
    .gv-svg { display: block; overflow: visible; flex-shrink: 0; }
    .gv-svg text { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; fill: var(--navy); }
    .gv-svg .gv-t { font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; }
    .gv-svg .gv-ts { font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
    .gv-svg .gv-tg { fill: var(--mid-grey); }
    .gv-svg .gv-tp { fill: var(--pink); }
    .gv-svg .gv-tw { fill: #fff; }
    .gv-svg .gv-ln { stroke: var(--navy); stroke-width: 3; fill: none; }
    .gv-svg .gv-dash { stroke: #c3c6d0; stroke-width: 2.5; stroke-dasharray: 6 8; fill: none; }
    .gv-svg .gv-pdash { stroke: var(--pink); stroke-width: 3; stroke-dasharray: 8 8; fill: none; }
    .gv-arr { color: var(--navy); }
    .gv-arr.gv-pk { color: var(--pink); }
    .gv-arr line { stroke: currentColor; stroke-width: 6; stroke-linecap: round; }
    .gv-arr path { fill: currentColor; }
    .gv-fade { opacity: 0; transition: opacity .6s var(--ease); }
    .gv-fade.on { opacity: 1; }
    .gv-click { cursor: pointer; }

    /* option cards (finger vote and hinge questions) */
    .gv-opts { display: grid; gap: 14px; }
    .gv-opt { display: flex; align-items: center; gap: 18px; border: 3px solid var(--navy); border-radius: 8px; padding: 14px 20px; font-size: 24px; font-weight: 600; line-height: 1.25; min-height: 78px; }
    .gv-opt .gv-on { flex-shrink: 0; width: 42px; height: 42px; border-radius: 6px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center;
        font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; transition: background-color .35s; }
    .gv-opt.gv-ok { border-color: var(--pink); background: var(--pink); color: #fff; }
    .gv-opt.gv-ok .gv-on { background: #fff; color: var(--pink); }
    .gv-opt.gv-no { opacity: .3; }

    /* steps (think, pair, share) */
    .gv-steps { display: flex; gap: 14px; }
    .gv-step { white-space: nowrap; display: flex; align-items: center; gap: 12px; border: 3px solid var(--navy); border-radius: 8px; padding: 10px 18px; }
    .gv-step .gv-sn { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
    .gv-step .gv-st { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); }
    .gv-step.gv-pkb { border-color: var(--pink); }
    .gv-step.gv-pkb .gv-sn { color: var(--pink); }

    /* chips and cards */
    .gv-chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .gv-chip { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 8px 16px; border-radius: 6px; border: 3px solid var(--navy); }
    .gv-chip.gv-pkf { background: var(--pink); border-color: var(--pink); color: #fff; }
    .gv-card { border: 3px solid var(--navy); border-radius: 8px; padding: 16px 22px; }
    .gv-card.gv-pkb { border-color: var(--pink); }
    .gv-card h3 { margin: 0 0 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.05; }
    .gv-card.gv-pkb h3 { color: var(--pink); }
    .gv-card p { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.3; }
    .gv-card p b { color: var(--pink); font-weight: 800; }
    .gv-bar { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; line-height: 1.3; }
    .gv-bar b { color: var(--pink); font-weight: 800; }
    .gv-bar.gv-nvb { border-left-color: var(--navy); }

    /* title */
    .gv-hook { font-family: 'Barlow Condensed', sans-serif; font-size: 84px; font-weight: 900; text-transform: uppercase; line-height: .95; letter-spacing: 0.01em; }
    .gv-hook span { color: var(--pink); }

    /* success criteria */
    .gv-sclist { display: flex; flex-direction: column; gap: 22px; width: 1000px; }
    .gv-sc { display: flex; align-items: center; gap: 28px; border: 3px solid var(--navy); border-radius: 8px; padding: 18px 26px; }
    .gv-sc .gv-scn { flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; color: var(--pink); width: 110px; }
    .gv-sc .gv-sct { font-size: 28px; font-weight: 600; line-height: 1.3; }
    .gv-sc .gv-sct b { font-weight: 800; }
    .gv-sc .gv-scs { margin-top: 4px; font-size: 21px; font-weight: 600; color: var(--mid-grey); }

    /* tides */
    .gv-tides { display: flex; gap: 48px; }
    .gv-tpan { width: 552px; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; }
    .gv-tpan svg { display: block; }
    .gv-tname { display: flex; align-items: center; justify-content: center; height: 54px; margin: 0 16px; border-top: 3px dashed #c3c6d0;
        font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; color: var(--pink); }
    .gv-tname.gv-full { border-top-style: solid; border-top-color: var(--navy); }
    .gv-tblank { display: inline-block; width: 220px; height: 34px; border: 3px dashed #c3c6d0; border-radius: 6px; }
    .gv-tx { margin: 0 18px 14px; font-size: 20px; font-weight: 600; line-height: 1.3; min-height: 52px; }
    .gv-tx b { color: var(--pink); font-weight: 800; }
    .gv-water { fill: #cfe3f5; stroke: #0a7bd6; stroke-width: 2.5; }
    .gv-sun { transition: opacity .6s var(--ease); }
    .gv-sun.gv-dim { opacity: .2; }

    /* tables */
    .gv-table { display: grid; grid-template-columns: 300px 420px 420px; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; }
    .gv-table > div { padding: 18px 24px; font-size: 26px; font-weight: 600; line-height: 1.25; border-top: 2px solid var(--light-grey); }
    .gv-table .gv-th { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; background: var(--navy); color: #fff; border-top: none; }
    .gv-table .gv-th.gv-pkh { background: var(--pink); }
    .gv-table .gv-tp { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); }
    .gv-table .gv-tw { color: var(--pink); font-weight: 700; }

    /* mass or weight rows */
    .gv-mw { display: flex; flex-direction: column; gap: 10px; width: 1060px; }
    .gv-mwr { display: flex; align-items: center; gap: 20px; border: 3px solid var(--navy); border-radius: 8px; padding: 10px 18px; min-height: 64px; }
    .gv-mwr .gv-on { flex-shrink: 0; width: 40px; height: 40px; border-radius: 6px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center;
        font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; }
    .gv-mwr .gv-mws { flex: 1; font-size: 25px; font-weight: 600; }
    .gv-ans { flex-shrink: 0; width: 140px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em;
        padding: 6px 0; border-radius: 6px; color: #fff; background: var(--navy); }
    .gv-ans.gv-aw { background: var(--pink); }

    /* readouts */
    .gv-read { border: 3px solid var(--navy); border-radius: 8px; padding: 12px 24px; }
    .gv-read.gv-pkb { border-color: var(--pink); }
    .gv-read .gv-rl { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .gv-read .gv-rv { font-family: 'Barlow Condensed', sans-serif; font-size: 64px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .gv-read.gv-pkb .gv-rv { color: var(--pink); }
    .gv-read .gv-rd { font-size: 21px; font-weight: 600; }
    .gv-read.gv-flash { animation: gvFlash .9s var(--ease); }
    @keyframes gvFlash { 0% { box-shadow: 0 0 0 0 rgba(27,31,69,.45); } 100% { box-shadow: 0 0 0 18px rgba(27,31,69,0); } }
    .gv-loc { font-family: 'Barlow Condensed', sans-serif; font-size: 46px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; }
    .gv-loc span { color: var(--pink); }

    /* in-slide buttons */
    .gv-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .gv-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 6px 16px; cursor: pointer; }
    .gv-btn.on { background: var(--pink); border-color: var(--pink); color: #fff; }
    .gv-btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .gv-vid { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; background: var(--pink); color: #fff; border-radius: 8px; padding: 12px 22px 12px 16px;
        font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; }
    .gv-vid svg { width: 38px; height: 38px; flex-shrink: 0; }
    .gv-vid:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

    /* bar chart */
    .gv-bars rect.gv-b { fill: var(--navy); transition: opacity .4s; }
    .gv-bars rect.gv-b.gv-be { fill: var(--pink); }
    .gv-bars .gv-dim { opacity: .2; transition: opacity .4s; }
    .gv-bars g.gv-pg { transition: opacity .4s; }

    /* levers */
    .gv-lvrs { display: flex; gap: 36px; }
    .gv-lvr { width: 360px; }
    .gv-lvh { display: flex; align-items: center; justify-content: space-between; height: 46px; border-bottom: 3px solid var(--navy); margin-bottom: 8px; }
    .gv-lvl { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; }
    .gv-lvh .gv-ans { width: auto; padding: 6px 14px; font-size: 22px; }

    /* controls */
    .controls { position: relative; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 24px; padding: 12px 20px 16px; width: 100%; font-family: 'Barlow Condensed', sans-serif; }
    .grp { display: flex; align-items: center; gap: 8px; }
    .controls [hidden] { display: none !important; }
    .controls button {
        font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2;
        display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--navy); border: none; border-radius: 6px; padding: 9px 13px; cursor: pointer;
    }
    .controls button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .controls button.on { background: var(--pink); color: var(--white); }
    .controls button.ui-pri { background: var(--navy); color: var(--white); }
    .controls button.ui-fs { background: var(--pink); color: var(--white); }
    .controls button.ui-fs.ui-isfs { background: var(--white); color: var(--navy); }
    .controls button.ui-fs.ui-nudge { animation: nudge 1.6s ease-out 1s 4; }
    @keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(234,0,138,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(234,0,138,0); } }
    .controls svg.ui-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .controls svg.ui-chev { width: 13px; height: 13px; stroke-width: 3; opacity: .6; transition: transform .2s var(--ease); }
    .ui-menu.ui-open > .ui-mt svg.ui-chev { transform: rotate(180deg); }
    .ui-mt .ui-pdot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px var(--white); }
    .controls .dots { display: flex; gap: 8px; margin: 0 8px 0 12px; }
    .controls .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #c9ccd6; }
    .controls .dots button.cur { background: var(--pink); }
    .steplbl { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); margin-left: 6px; min-width: 110px; }
    .controls kbd { margin-left: 2px; }

    /* menus */
    .ui-menu { position: relative; }
    .ui-pop { display: none; position: absolute; left: 0; bottom: calc(100% + 10px); min-width: 260px; flex-direction: column; gap: 2px; padding: 4px 8px 8px;
        background: var(--white); border-top: 6px solid var(--navy); border-radius: 10px; box-shadow: 0 10px 30px rgba(27,31,69,.25), 0 0 0 1px rgba(27,31,69,.08); }
    .ui-menu.ui-r .ui-pop { left: auto; right: 0; }
    .ui-menu.ui-open .ui-pop { display: flex; animation: popIn .18s var(--ease); }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .ui-ph { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 10px 6px; }
    .ui-pop .ui-mi { width: 100%; padding: 9px 10px; background: transparent; white-space: nowrap; }
    .ui-pop .ui-mi:hover { background: var(--off-white); }
    .ui-pop .ui-mi kbd { margin-left: auto; padding-left: 5px; }
    .ui-pop .ui-mi .ui-ind { width: 14px; height: 14px; border: 2.5px solid var(--navy); border-radius: 3px; flex-shrink: 0; margin-right: 4px; }
    .ui-pop .ui-mi .ui-ind.ui-no { border-color: transparent; }
    .ui-pop .ui-mi.on { background: transparent; color: var(--pink); }
    .ui-pop .ui-mi.on:hover { background: var(--off-white); }
    .ui-pop .ui-mi.on .ui-ind { background: var(--pink); border-color: var(--pink); }
    .ui-pop .ui-mi:disabled { opacity: .35; cursor: default; background: transparent; }
    .ui-pop .ui-mi.ui-eng .ui-ind { border: none; border-radius: 50%; }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-pk { background: var(--pink); }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-nv { background: var(--navy); }
    .ui-pop .ui-swrow { display: flex; gap: 8px; padding: 4px 10px 10px 38px; }
    .ui-pop .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 3px solid var(--white); box-shadow: 0 0 0 1px #c9ccd6; }
    .ui-pop .swatch.cur { box-shadow: 0 0 0 3px var(--navy); }
    .ui-pop .ui-div { height: 1.5px; background: var(--light-grey); margin: 4px 6px; }



    /* highlighter and whiteboard surfaces */
    .ui-hlc { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; z-index: 4; mix-blend-mode: multiply; }
    .ui-wboard { display: none; position: absolute; left: 0; top: 0; width: 1280px; height: 714px; background: var(--white); z-index: 3; }
    body.ui-wb .ui-wboard { display: block; }
    .ui-wbl { position: absolute; right: 64px; top: 40px; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); }
    .ui-wbl b { color: var(--navy); }
    .ui-wbg { display: none; }
    body.ui-wb .ui-wbg { display: flex; }
    body.ui-wb .grp.ui-nav { display: none; }
    .ui-wbtag { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); background: var(--pink); border-radius: 6px; padding: 9px 13px; line-height: 1.2; }
    .controls button:disabled { opacity: .35; cursor: default; }
    #ovbtn { padding: 9px 11px; }

    /* overlays */
    .ui-ovw[hidden], .ui-keys[hidden], .ui-blk[hidden] { display: none !important; }
    .ui-ovw { position: fixed; inset: 0; z-index: 45; background: rgba(27,31,69,.96); overflow-y: auto; padding: 40px 48px 60px; opacity: 0; transition: opacity .2s; }
    .ui-ovw.on, .ui-keys.on, .ui-blk.on { opacity: 1; }
    .ui-ovh { display: flex; justify-content: space-between; align-items: flex-end; max-width: 1296px; margin: 0 auto 28px; padding-bottom: 12px; border-bottom: 4px solid var(--white); color: var(--white); }
    .ui-ovh h2 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .ui-ovh h2 span { color: var(--pink); }
    .ui-ovh .ui-hint, .ui-blk .ui-bh { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); }
    .ui-ovh kbd { display: inline-block; padding: 0 6px; border: 1.5px solid currentColor; border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 17px; }

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), caption = $('#caption'), titleEl = $('#title'), counter = $('#counter'), progress = $('#progress');
let timers = [], events = [], beats = [], idx = 0, beat = 0, autoplay = false;
let segFrom = 0, segTo = 0, segStart = 0;
let ptimers = [], cleanups = [];
const stage = document.getElementById('stage');

function at(ms, fn) { events.push({ t: ms, fn, done: false }); }
function beatAt(ms, html) { beats.push(ms); at(ms, () => say(html)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function show(e) { e.classList.remove('hide'); }
function say(html) { caption.innerHTML = '<span>' + html + '</span>'; caption.classList.remove('in'); void caption.offsetWidth; caption.classList.add('in'); }
function stopInteractive() { ptimers.forEach(clearTimeout); ptimers = []; cleanups.forEach(f => f()); cleanups = []; }

/* ---------- gravity helpers ---------- */
const easeIn = t => t * t, easeOut = t => 1 - (1 - t) * (1 - t);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeSpring = t => t >= 1 ? 1 : 1 - Math.exp(-6 * t) * Math.cos(11 * t);
function anim(ms, f, ease) {
    const e = ease || (t => t);
    if (exporting || stage.classList.contains('instant')) { f(1); return; }
    let raf = 0; const st = performance.now();
    const step = n => { const p = Math.max(0, Math.min(1, (n - st) / ms)); f(p >= 1 ? 1 : e(p)); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    cleanups.push(() => cancelAnimationFrame(raf));
}
const f1 = v => (+v).toFixed(1);
function arrowInner(x1, y1, x2, y2, h = 18) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1), hh = Math.min(h, L * 0.75);
    if (L < 0.5) return '';
    const bx = x2 - Math.cos(a) * hh, by = y2 - Math.sin(a) * hh, px = -Math.sin(a) * hh * 0.6, py = Math.cos(a) * hh * 0.6;
    return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(bx)}" y2="${f1(by)}"/><path d="M${f1(x2)} ${f1(y2)} L${f1(bx + px)} ${f1(by + py)} L${f1(bx - px)} ${f1(by - py)} Z"/>`;
}
const arrowSVG = (cls, x1, y1, x2, y2, h) => `<g class="gv-arr ${cls}">${arrowInner(x1, y1, x2, y2, h)}</g>`;
function setArrow(g, x1, y1, x2, y2, h) { g.innerHTML = arrowInner(x1, y1, x2, y2, h); }
function optGrid(list, cols, w) {
    const g = el('div', 'gv-opts'); g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; if (w) g.style.width = w + 'px';
    g.items = list.map((t, i) => { const o = el('div', 'gv-opt rev hide', `<span class="gv-on">${i + 1}</span><span>${t}</span>`); g.appendChild(o); return o; });
    return g;
}
function markRight(items, k) { items.forEach((o, i) => o.classList.add(i === k ? 'gv-ok' : 'gv-no')); }
function steps(list) {
    const s = el('div', 'gv-steps');
    s.items = list.map(([n, t], i) => { const x = el('div', 'gv-step rev hide' + (i === list.length - 1 ? ' gv-pkb' : ''), `<span class="gv-sn">${n}</span>${t ? `<span class="gv-st">${t}</span>` : ''}`); s.appendChild(x); return x; });
    return s;
}
const reveal = (list, start, gap = 160) => list.forEach((e, i) => at(start + i * gap, () => show(e)));
const svgWrap = (w, h, inner, cls = '') => `<svg class="gv-svg ${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${inner}</svg>`;
const TILT = 23.5, ST = Math.sin(TILT * Math.PI / 180), CT = Math.cos(TILT * Math.PI / 180);
function apple(x, y, r = 22) {
    return `<g transform="translate(${x} ${y})"><path d="M0 ${-r * .85} C ${-r * .2} ${-r * 1.15}, ${-r * .25} ${-r * 1.35}, ${-r * .05} ${-r * 1.5}" stroke="#1b1f45" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M${r * .05} ${-r * 1.2} C ${r * .5} ${-r * 1.55}, ${r * .95} ${-r * 1.3}, ${r * 1.05} ${-r * 1.05} C ${r * .6} ${-r * .85}, ${r * .25} ${-r * .95}, ${r * .05} ${-r * 1.2} Z" fill="#1b1f45"/>
        <path d="M0 ${-r * .7} C ${r * .55} ${-r * 1.15}, ${r * 1.1} ${-r * .7}, ${r} 0 C ${r * .95} ${r * .7}, ${r * .45} ${r * 1.05}, 0 ${r * .85} C ${-r * .45} ${r * 1.05}, ${-r * .95} ${r * .7}, ${-r} 0 C ${-r * 1.1} ${-r * .7}, ${-r * .55} ${-r * 1.15}, 0 ${-r * .7} Z" fill="#ea008a"/>
        <ellipse cx="${-r * .45}" cy="${-r * .25}" rx="${r * .14}" ry="${r * .26}" fill="#fff" opacity=".55" transform="rotate(20 ${-r * .45} ${-r * .25})"/></g>`;
}
function feather(s = 1) {
    return `<g transform="scale(${s}) rotate(-22)"><path d="M0 -52 C 22 -36, 24 8, 6 44 L 0 50 L -6 44 C -24 8, -22 -36, 0 -52 Z" fill="#fff" stroke="#1b1f45" stroke-width="3" stroke-linejoin="round"/>
        <path d="M0 -46 L0 64" stroke="#1b1f45" stroke-width="3" stroke-linecap="round"/>
        <path d="M0 -26 L14 -34 M0 -10 L17 -18 M0 6 L16 -2 M0 22 L11 14 M0 -26 L-14 -34 M0 -10 L-17 -18 M0 6 L-16 -2 M0 22 L-11 14" stroke="#c3c6d0" stroke-width="2" stroke-linecap="round"/></g>`;
}
function bowlingBall(r) {
    return `<circle r="${r}" fill="#1b1f45"/><circle cx="${-r * .3}" cy="${-r * .38}" r="${r * .12}" fill="#fff"/><circle cx="${r * .05}" cy="${-r * .5}" r="${r * .12}" fill="#fff"/><circle cx="${-r * .05}" cy="${-r * .1}" r="${r * .14}" fill="#fff"/>`;
}
function person(x, y, s = 1, cls = '') {
    return `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})" stroke="#1b1f45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="0" cy="-92" r="14" fill="#1b1f45" stroke="none"/><path d="M0 -74 L0 -30 M0 -64 L-22 -40 M0 -64 L22 -40 M0 -30 L-16 0 M0 -30 L16 0"/></g>`;
}

/* seasons: one Earth at a solstice position, axis tilted to the right */
function seasonEarth(cx, cy, R, sunRight, letter, showAngle) {
    const night = `M${cx} ${cy - R} A${R} ${R} 0 0 ${sunRight ? 0 : 1} ${cx} ${cy + R} Z`;
    const south = `M${cx - R} ${cy} A${R} ${R} 0 0 0 ${cx + R} ${cy} Z`;
    const ax = R + 36, tx = cx + ax * ST, ty = cy - ax * CT, bx = cx - ax * ST, by = cy + ax * CT;
    let rays = '';
    [-34, 0, 34].forEach(dy => {
        const ex = Math.sqrt(R * R - dy * dy);
        rays += sunRight ? `<line class="gv-pdash${dy ? '' : ' gv-mid'}" x1="508" y1="${cy + dy}" x2="${f1(cx + ex + 6)}" y2="${cy + dy}"/>`
            : `<line class="gv-pdash${dy ? '' : ' gv-mid'}" x1="644" y1="${cy + dy}" x2="${f1(cx - ex - 6)}" y2="${cy + dy}"/>`;
    });
    const eqx = R * CT, eqy = R * ST;
    const eqLbl = sunRight ? `<text class="gv-ts" x="${f1(cx - eqx - 12)}" y="${f1(cy - eqy + 6)}" text-anchor="end" style="fill:#ea008a">Equator</text>`
        : `<text class="gv-ts" x="${f1(cx + eqx + 14)}" y="${f1(cy + eqy - 6)}" text-anchor="start" style="fill:#ea008a">Equator</text>`;
    const arcR = R + 22;
    const ang = showAngle ? `<g><line class="gv-dash" x1="${cx}" y1="${cy - R - 4}" x2="${cx}" y2="${cy - R - 44}"/>
        <path d="M${cx} ${cy - arcR} A${arcR} ${arcR} 0 0 1 ${f1(cx + arcR * ST)} ${f1(cy - arcR * CT)}" fill="none" stroke="#1b1f45" stroke-width="2.5"/>
        <text class="gv-ts" x="${cx - 8}" y="${cy - R - 26}" text-anchor="end">23.5°</text></g>` : '';
    const side = sunRight ? -1 : 1, bxL = cx + side * (R + 56);
    return `<g class="gv-rays">${rays}</g>
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff"/>
        <path class="gv-fade gv-south" d="${south}" fill="#ea008a" fill-opacity=".38" transform="rotate(${TILT} ${cx} ${cy})"/>
        <path d="${night}" fill="#1b1f45" fill-opacity=".72"/>
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#1b1f45" stroke-width="4"/>
        <ellipse cx="${cx}" cy="${cy}" rx="${R}" ry="${R * 0.14}" fill="none" stroke="#ea008a" stroke-width="3" transform="rotate(${TILT} ${cx} ${cy})"/>
        <line x1="${f1(bx)}" y1="${f1(by)}" x2="${f1(tx)}" y2="${f1(ty)}" stroke="#1b1f45" stroke-width="4" stroke-linecap="round"/>
        <text class="gv-t" x="${f1(cx + (ax + 16) * ST)}" y="${f1(cy - (ax + 16) * CT)}" text-anchor="middle">N</text>
        <text class="gv-t" x="${f1(cx - (ax + 16) * ST)}" y="${f1(cy + (ax + 16) * CT + 16)}" text-anchor="middle">S</text>
        ${ang}${eqLbl}
        <text class="gv-ts" x="${cx}" y="${cy - R - 66}" text-anchor="middle">Northern hemisphere</text>
        <text class="gv-ts" x="${cx}" y="${cy + R + 82}" text-anchor="middle">Southern hemisphere</text>
        <circle cx="${bxL}" cy="${cy - R - 8}" r="22" fill="#1b1f45"/><text class="gv-t gv-tw" x="${bxL}" y="${cy - R}" text-anchor="middle" style="font-size:26px">${letter}</text>
        <g class="gv-fade gv-season"><rect x="${bxL - 64}" y="${cy + 44}" width="128" height="44" rx="6" fill="#ea008a"/>
        <text class="gv-t gv-tw" x="${bxL}" y="${cy + 74}" text-anchor="middle" style="font-size:26px">${sunRight ? 'Winter' : 'Summer'}</text></g>
        <circle class="gv-fade gv-sub" cx="${sunRight ? cx + R : cx - R}" cy="${cy}" r="9" fill="#ea008a" stroke="#fff" stroke-width="3"/>`;
}

const PLANETS = [
    { n: 'Mercury', r: 2440, g: 3.7, pc: 38, c: '#d6d7dc' }, { n: 'Venus', r: 6052, g: 8.9, pc: 90, c: '#ecdfc2' },
    { n: 'Earth', r: 6371, g: 9.8, pc: 100, c: '#cfe3f5' }, { n: 'Mars', r: 3390, g: 3.7, pc: 38, c: '#f0cbb9' },
    { n: 'Jupiter', r: 69911, g: 24.8, pc: 253, c: '#ecd9c3' }, { n: 'Saturn', r: 58232, g: 10.4, pc: 106, c: '#f0e5c6' },
    { n: 'Uranus', r: 25362, g: 8.7, pc: 89, c: '#cdeef0' }, { n: 'Neptune', r: 24622, g: 11.2, pc: 114, c: '#c9d7f5' }
];

/* levers: arms measured from the fulcrum, effort arm on level 1, resistance arm on level 2 */
function leverSVG(d) {
    const by = 130, eL = Math.abs(d.e - d.f), rL = Math.abs(d.l - d.f), effLong = eL > rL;
    const dim = (x1, x2, y, col, lbl, long) => {
        const a = Math.min(x1, x2), b = Math.max(x1, x2), m = (a + b) / 2, lw = lbl.length * 6.6 + 4;
        return `<line class="gv-dash" x1="${x1}" y1="${by + 8}" x2="${x1}" y2="${y + 10}"/><line class="gv-dash" x1="${x2}" y1="${by + 8}" x2="${x2}" y2="${y + 10}"/>
            <line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${col}" stroke-width="4"/>
            <line x1="${a}" y1="${y - 9}" x2="${a}" y2="${y + 9}" stroke="${col}" stroke-width="4"/><line x1="${b}" y1="${y - 9}" x2="${b}" y2="${y + 9}" stroke="${col}" stroke-width="4"/>
            <text class="gv-ts" x="${m}" y="${y + 26}" text-anchor="middle" style="fill:${col}">${lbl}</text>
            ${long ? `<g class="gv-fade gv-long"><rect x="${m + lw + 8}" y="${y + 9}" width="84" height="24" rx="4" fill="#ea008a"/><text class="gv-ts gv-tw" x="${m + lw + 50}" y="${y + 27}" text-anchor="middle" style="font-size:16px">Longer</text></g>` : ''}`;
    };

/* tides: one panel */
const TIDE = { spring: [89, 51], neap: [63, 77], mspring: [83, 57], mneap: [57, 83] };
function tidePanel(type) {
    const W = 552, H = 270, cy = 135, ex = 296, mo = 112;
    const moon = type === 'spring' ? [ex + mo, cy] : [ex, cy - mo];
    const mlab = type === 'spring' ? `<text class="gv-ts" x="${moon[0]}" y="${cy + 46}" text-anchor="middle">Moon</text>`
        : `<text class="gv-ts" x="${ex + 28}" y="${cy - mo + 7}">Moon</text>`;
    const [rx, ry] = TIDE[type];
    const extra = type === 'spring'
        ? `<line class="gv-pdash gv-fade gv-al" x1="80" y1="${cy}" x2="${W - 20}" y2="${cy}"/>`
        : `<g class="gv-fade gv-al"><line class="gv-pdash" x1="80" y1="${cy}" x2="${ex - 46}" y2="${cy}"/><line class="gv-pdash" x1="${ex}" y1="${cy - 46}" x2="${ex}" y2="${cy - mo + 20}"/>
            <path d="M${ex - 64} ${cy} L${ex - 64} ${cy - 64} L${ex} ${cy - 64}" fill="none" stroke="#ea008a" stroke-width="3"/></g>`;
    const p = el('div', 'gv-tpan rev hide');
    p.innerHTML = svgWrap(W, H, `
        <g class="gv-sun"><circle cx="0" cy="${cy}" r="96" fill="#ea008a" opacity=".15"/><circle cx="0" cy="${cy}" r="76" fill="#ea008a"/>
        <text class="gv-t gv-tw" x="38" y="${cy + 8}" text-anchor="middle">Sun</text></g>
        <circle class="gv-dash" cx="${ex}" cy="${cy}" r="${mo}"/>
        ${type === 'spring' ? extra : ''}
        <ellipse class="gv-water" cx="${ex}" cy="${cy}" rx="${rx}" ry="${ry}"/>
        <circle cx="${ex}" cy="${cy}" r="44" fill="#1b1f45"/><text class="gv-ts gv-tw" x="${ex}" y="${cy + 6}" text-anchor="middle">Earth</text>
        ${type === 'neap' ? extra : ''}
        <circle cx="${moon[0]}" cy="${moon[1]}" r="16" fill="#e3e6ee" stroke="#1b1f45" stroke-width="3"/>${mlab}`) +
        `<div class="gv-tname"><span class="gv-tblank"></span></div><div class="gv-tx rev hide"></div>`;
    p.water = p.querySelector('.gv-water'); p.sun = p.querySelector('.gv-sun'); p.al = p.querySelector('.gv-al');
    p.nameEl = p.querySelector('.gv-tname'); p.tx = p.querySelector('.gv-tx');
    p.setName = n => { p.nameEl.innerHTML = n; p.nameEl.classList.add('gv-full'); };
    p.cur = [rx, ry];
    p.morph = (to, ms = 1400) => { const from = p.cur.slice(); p.cur = to.slice(); anim(ms, k => { p.water.setAttribute('rx', f1(from[0] + (to[0] - from[0]) * k)); p.water.setAttribute('ry', f1(from[1] + (to[1] - from[1]) * k)); }, easeIO); };
    return p;
}

/* ---------- player ---------- */
const dots = $('#dots');
scenes.forEach((_, i) => { const d = el('button'); d.setAttribute('aria-label', 'Scene ' + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });

const stepLbl = $('#steplbl');
const dur = () => scenes[idx].dur;
const beatEnd = b => (b + 1 < beats.length ? beats[b + 1] : dur());
function label() { stepLbl.textContent = `Step ${beat + 1} of ${beats.length}`; }

function build(i) {
    clearTimers();
    stopInteractive();
    const ni = Math.max(0, Math.min(scenes.length - 1, i));
    if (ni !== idx) { saveInk(); idx = ni; loadInk(); zoomReset(); renderBadges(); }
    events = []; beats = [];
    const sc = scenes[idx];
    content.innerHTML = ''; caption.innerHTML = '';
    titleEl.innerHTML = sc.title;
    counter.innerHTML = `<b>${idx + 1}</b> / ${scenes.length}`;
    uiSetCfu(sc.cfu, sc.time); uiSetSC(sc.sc);
    [...dots.children].forEach((d, j) => d.classList.toggle('cur', j === idx));
    sc.run();
    beats = [...new Set(beats)].sort((a, b) => a - b);
}

function jumpTo(to) {
    stage.classList.add('instant');
    events.filter(e => !e.done && e.t < to).sort((a, b) => a.t - b.t).forEach(e => { e.done = true; e.fn(); });
    void stage.offsetWidth;

        const cv = page.querySelector(sel); if (!cv) return;
        if (marked) { const img = new Image(); img.className = cls; img.alt = ''; img.src = src.toDataURL(); cv.replaceWith(img); imgs.push(img); }
        else cv.remove();
    });
    if (boardOnly) page.querySelectorAll('.top, .content, .caption, .progress').forEach(n => n.remove());
    return { page, imgs };
}
function runScene(i) {
    build(i);
    events.slice().sort((a, b) => a.t - b.t).forEach(e => { if (!e.done) { e.done = true; e.fn(); } });
    progress.style.transition = 'none'; progress.style.width = '100%';
}
function buildThumbs() {
    exporting = true;
    for (let i = 0; i < scenes.length; i++) {
        runScene(i);
        const { page } = snapStage(false);
        page.querySelectorAll('canvas, img.ink, img.ui-hlc, .ui-blayer').forEach(n => n.remove());
        thumbs[i] = page;
    }
    exporting = false;
}
async function exportPDF() {
    if (document.activeElement) document.activeElement.blur();
    zoomReset();
    printBox.innerHTML = '';
    const imgs = [];
    if (wbOpen) {
        const keep = wbPage;
        for (let p = 0; p < wbPages; p++) {
            wbPage = p; loadSurface(); syncWB();
            const r = snapStage(true); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        wbPage = keep; loadSurface(); syncWB();
    } else {
        const keepIdx = idx, keepBeat = beat;
        exporting = true;
        for (let i = 0; i < scenes.length; i++) {
            runScene(i);
            const r = snapStage(false); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        exporting = false;
        go(keepIdx, keepBeat);
    }
    await Promise.all([...imgs, ...printBox.querySelectorAll('img')].map(im => im.decode().catch(() => {})));
    window.print();
}
$('#pdf').onclick = exportPDF;
$('#wbpdf').onclick = () => { $('#wbpdf').blur(); exportPDF(); };
window.addEventListener('afterprint', () => { printBox.innerHTML = ''; });

document.addEventListener('keydown', e => {
    if (isTyping(e)) return;
    if (e.ctrlKey || e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); e.shiftKey ? redoInk() : undoInk(); }
        else if (k === 'y') { e.preventDefault(); redoInk(); }
        return;
    }
    if (e.altKey) return;
    if (e.key === 'p' || e.key === 'P') setTool(tool === 'pen' ? null : 'pen');
    if (e.key === 'e' || e.key === 'E') setTool(tool === 'eraser' ? null : 'eraser');
    if (e.key === 'c' || e.key === 'C') clearInk();
    if (e.key === 's' || e.key === 'S') toggleSubs();
    if (e.key === 't' || e.key === 'T') ftShow(ftEl.hidden);
    if (e.key === 'u' || e.key === 'U') setUI(!document.body.classList.contains('noui'));
    if (e.key === 'z' || e.key === 'Z') setZoom(!Z.on);
    if (e.key === 'l' || e.key === 'L') setLock(!Z.locked);
    if (e.key === 'h' || e.key === 'H') setSpot(!SP.on);
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'm' || e.key === 'M') toggleMenu(engMenu);
    if (e.key === 'b' || e.key === 'B') { e.preventDefault(); closeMenus(); addText(true); }
    if (e.key === 'y' || e.key === 'Y') setTool(tool === 'hl' ? null : 'hl');
    if (e.key === 'w' || e.key === 'W') toggleWB();
    if (e.key === 'k' || e.key === 'K') openModal('blk');
    if ((e.key === 'g' || e.key === 'G') && !wbOpen) openModal('ovw');
    if (e.key === '?' || e.key === '/') { e.preventDefault(); openModal('keys'); }
    if (/^[1-5]$/.test(e.key) && engMenu.classList.contains('ui-open')) { addBadge(ENG_KEYS[+e.key - 1]); closeMenus(); }
    if (e.key === 'Escape') closeMenus();
    if (e.key === 'Escape') setTool(null);
});

const controlsEl = document.querySelector('.controls');
function fit() {
    const st = $('#stage'), noui = document.body.classList.contains('noui');
    const vw = window.innerWidth - (noui ? 0 : 40), vh = window.innerHeight - (noui ? 0 : controlsEl.offsetHeight + 20);
    const k = Math.min(vw / 1280, vh / 720);
    scaleK = k;
    st.style.transform = `scale(${k})`;
    st.style.margin = `${(720 * k - 720) / 2}px ${(1280 * k - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); buildThumbs(); go(0); });
</script>
