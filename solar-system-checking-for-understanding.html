<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System: Checking for Understanding</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .body.stack { flex-direction: column; gap: 14px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg classes */
    svg { overflow: visible; display: block; }
    .obj { fill: var(--blank); stroke: var(--navy); stroke-width: 4; }
    .oname { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .flbl { font-family: var(--cond); font-size: 24px; font-weight: 800; fill: var(--navy); }
    .spd { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; fill: var(--mid-grey); }
    .leg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }
    .tiny { font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .hand { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-style: italic; font-weight: 600; font-size: 25px; fill: var(--navy); }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opts.g2 { grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opts.g2 .opt { min-height: 104px; font-size: 30px; font-weight: 700; padding: 16px 24px; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }
    .gly { flex-shrink: 0; }
    .gd { fill: #b5b9c6; } .go { fill: var(--navy); } .gs { fill: none; stroke: var(--navy); stroke-width: 3; } .gsf { fill: var(--navy); }
    .opt.right .gd { fill: rgba(255,255,255,.6); } .opt.right .go { fill: #fff; } .opt.right .gs { stroke: #fff; } .opt.right .gsf { fill: #fff; }
    .pred .opts, .scol .opts { width: 440px; }
    .pred .opt { min-height: 72px; font-size: 22px; font-weight: 700; padding: 8px 16px; }
    .scol .opt { min-height: 66px; font-size: 22px; font-weight: 600; padding: 8px 16px; }

    /* picture choices */
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 16px 4px 12px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .2s; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; }
    .pcard .cap { font-size: 22px; font-weight: 700; line-height: 1.2; text-align: center; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .quote b { font-style: normal; font-weight: 800; color: var(--pink); }
    .col { display: flex; flex-direction: column; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .replay { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; z-index: 3; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.sm { font-size: 21px; padding: 5px 12px; white-space: normal; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }
    .tile.card { width: 244px; white-space: normal; font-size: 18px; font-weight: 600; line-height: 1.22; padding: 8px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .tile.card svg { pointer-events: none; }
    .tile.card.right { background: #fff; color: var(--navy); border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.18); }

    /* drop slots */
    .dslot { width: 200px; height: 50px; border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        transition: border-color .2s, background-color .2s; font-family: var(--cond); font-size: 22px; font-weight: 800; color: #c3c6d0; }
    .dslot.hover, .dslot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .dslot.armed { border-color: #e7a3c9; cursor: pointer; }
    .dslot.filled { border-color: transparent; background: none; }
    .dslot.wrong { animation: shake .4s; }
    .dslot .tile { box-shadow: none; }
    .dslot.ab { position: absolute; }
    .dslot.ab .tile, .dslot.mw .tile { font-size: 21px; padding: 4px 10px; }
    .dslot.cz { display: inline-flex; vertical-align: middle; width: 156px; height: 48px; margin: 0 4px; }
    .dslot.cz .tile { font-size: 22px; padding: 3px 12px; }
    .dslot.cz.filled { width: auto; }
    .dslot.big { width: 260px; height: 174px; font-size: 64px; font-weight: 900; }

    /* sort */
    .sort { display: grid; grid-template-columns: 1fr 400px 1fr; gap: 18px; width: 100%; height: 100%; }
    .sort3 { display: flex; flex-direction: column; gap: 14px; width: 100%; height: 100%; }
    .sort3 .bins { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; min-height: 0; }
    .bin { border: 3px solid var(--navy); border-radius: 8px; display: flex; flex-direction: column; overflow: visible; transition: box-shadow .2s; }
    .bin.pk { border-color: var(--pink); }
    .bin h3 { margin: 0; padding: 8px 16px 7px; font-family: var(--cond); font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--navy); }
    .bin.pk h3 { background: var(--pink); }
    .sort3 .bin h3 { font-size: 24px; white-space: nowrap; }
    .bin.ol h3 { background: #fff; color: var(--navy); border-bottom: 3px solid var(--navy); }
    .bin .sub { font-size: 18px; font-weight: 600; color: var(--mid-grey); padding: 8px 16px 0; }
    .bin .area { flex: 1; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; border-radius: 0 0 6px 6px; transition: background-color .2s; }
    .bin.hover .area, .bin.armed:hover .area { background: rgba(234,0,138,.06); }
    .bin.armed { box-shadow: 0 0 0 4px rgba(234,0,138,.15); cursor: pointer; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }
    .pool.col1 { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 7px; }
    .pool.col1 .tile.sm, .sort .bin .tile.sm { font-size: 19px; padding: 4px 10px; }
    .pool.row { width: 100%; min-height: 76px; }

    /* planet order track */
    .track { position: relative; width: 1152px; height: 214px; flex-shrink: 0; }
    .track > svg { position: absolute; left: 0; top: 0; }

    /* mnemonic */
    .mn { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; width: 100%; }
    .mcol { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .mcol .pn { font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mid-grey); }
    .mcol .ini { font-family: var(--cond); font-size: 54px; font-weight: 900; color: var(--pink); line-height: 1; margin-bottom: 6px; }
    .mcol .dslot { width: 136px; height: 52px; }

    /* sequence */
    .seqrow { display: flex; align-items: center; gap: 8px; }
    .chev { width: 22px; height: 30px; flex-shrink: 0; }

    /* cloze */
    .cloze { font-size: 25px; font-weight: 600; line-height: 2.25; flex: 1; }
    .bside { width: 320px; display: flex; flex-direction: column; gap: 10px; align-self: stretch; }
    .bside .pool { flex: 1; align-content: center; }

    /* scale table */
    .stab { display: grid; grid-template-columns: 170px 240px 220px; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; }
    .stab > div { display: flex; align-items: center; padding: 0 16px; height: 54px; border-top: 2px solid var(--light-grey); font-size: 23px; font-weight: 600; }
    .stab > .th { height: 40px; border-top: none; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .stab > .th { white-space: nowrap; font-size: 18px; }
    .stab > .pnm { font-weight: 800; }
    .stab .dslot { width: 168px; height: 44px; }
    .stab .dslot .tile { font-size: 21px; padding: 2px 12px; }

    /* calculate */
    .steps { flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .step { border-left: 8px solid var(--navy); padding: 4px 0 4px 18px; }
    .step .slbl { font-size: 23px; font-weight: 600; line-height: 1.3; }
    .step .srow { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 24px; font-weight: 700; }
    .num { font-family: inherit; font-size: 30px; font-weight: 800; color: var(--navy); width: 170px; height: 54px; border: 3px solid var(--navy); border-radius: 8px; text-align: center;
        -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s, color .2s; }
    .num:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.18); }
    .num.right { background: var(--pink); border-color: var(--pink); color: #fff; }
    .num.wrong { border-style: dashed; background: var(--tint); animation: shake .4s; }
    .unit { font-size: 22px; font-weight: 700; color: var(--mid-grey); }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 30px 60px; text-align: center; }
    .scorecard .big { font-family: var(--cond); font-size: 120px; font-weight: 900; color: var(--pink); line-height: 1; }
    .scorecard .dlbl { margin-top: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Checking <span>the Solar System</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', DT = '#b5b9c6', LT = '#f0f3f6', MG = '#9a9a9a';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }
/* runs fn(dt) every frame until the run changes */
function loop(fn) {
    const id = runId; let last = performance.now();
    const f = n => { if (id !== runId) return; const dt = Math.min(50, n - last); last = n; fn(dt); requestAnimationFrame(f); };
    requestAnimationFrame(f);
}
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
const lerp = (a, b, k) => a + (b - a) * k;
const fx = v => v.toFixed(1);

/* ---------- drawing helpers ---------- */
const DIR = { r: 0, l: Math.PI, u: -Math.PI / 2, d: Math.PI / 2 };
function arrowSVG(x, y, ang, len, o = {}) {
    const c = o.c || PK, sw = o.sw || 8, hw = o.hw || 13, hl = Math.min(o.hl || 22, len);
    if (len < 1) return '';
    const ux = Math.cos(ang), uy = Math.sin(ang), ex = x + ux * len, ey = y + uy * len, bx = ex - ux * hl, by = ey - uy * hl, px = -uy * hw, py = ux * hw;
    let s = len > hl ? `<line x1="${fx(x)}" y1="${fx(y)}" x2="${fx(bx)}" y2="${fx(by)}" stroke="${c}" stroke-width="${sw}"/>` : '';
    s += `<polygon points="${fx(ex)},${fx(ey)} ${fx(bx + px)},${fx(by + py)} ${fx(bx - px)},${fx(by - py)}" fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/>`;
    if (o.label) {
        const fs = o.fs || 24, est = o.label.length * fs * .48, full = o.full || len, op = o.lop === undefined ? 1 : o.lop, lc = o.lc ? ` style="font-size:${fs}px;fill:${o.lc}"` : ` style="font-size:${fs}px"`;
        let tx, ty, an;
        if (Math.abs(ux) > .9) {
            ty = y + (o.below ? (o.dy || 34) : -16);
            if (est <= full - 6) { tx = x + ux * full / 2; an = 'middle'; } else { tx = x + ux * 4; an = ux > 0 ? 'start' : 'end'; }
        } else if (Math.abs(uy) > .9) { tx = x + (o.left ? -18 : 18); ty = y + uy * full / 2 + 8; an = o.left ? 'end' : 'start'; }
        else { tx = x + ux * full / 2 + (o.left ? -20 : 20); ty = y + uy * full / 2 + 8; an = o.left ? 'end' : 'start'; }
        s += `<text class="flbl" x="${fx(tx)}" y="${fx(ty)}" text-anchor="${an}" opacity="${op}"${lc}>${o.label}</text>`;
    }
    return s;
}
function growArrow(g, x, y, ang, len, o = {}, dur = 450) {
    const tok = g._tok = (g._tok || 0) + 1;
    return play(dur, k => { g.innerHTML = arrowSVG(x, y, ang, len * easeOut(k), { ...o, full: len, lop: k }); }, () => g._tok === tok && document.body.contains(g));
}
function clearArrow(g) { g._tok = (g._tok || 0) + 1; g.innerHTML = ''; }

/* ---------- multiple choice core ---------- */
function mcCore(els, q, extra = {}) {
    let sel = null;
    els.forEach((b, i) => b.onclick = () => {
        if (mode !== 'check' || b.classList.contains('wrong')) return;
        els.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = i; refresh();
    });
    return {
        instr: extra.instr || 'Choose an answer, then press <b>Check</b>.',
        ready: () => sel !== null,
        check() {
            const b = els[sel];
            b.classList.remove('sel');
            if (sel === q.answer) { b.classList.add('right'); els.forEach(x => x.disabled = true); return { ok: true }; }
            b.classList.add('wrong'); b.disabled = true;
            const h = q.opts[sel].hint; sel = null; return { ok: false, hint: h };
        },
        done: extra.done
    };
}

/* ---------- slot-based drag tasks ---------- */
function slotTask(o) {
    const zPool = { el: o.pool, box: o.pool, cap: Infinity, pool: true };
    o.zones.forEach(z => {
        z.cap = 1;
        const p0 = z.onPut, t0 = z.onTake;
        z.onPut = t => { z.el.classList.add('filled'); if (p0) p0(t); };
        z.onTake = t => { z.el.classList.remove('filled'); if (t0) t0(t); };
    });
    const D = dnd(zPool, o.zones, () => { o.zones.forEach(z => z.el.classList.remove('wrong')); refresh(); });
    shuffle(o.tiles).forEach(d => { const t = D.tile(d.text, d.html); t.k = d.k; if (d.cls) t.classList.add(...d.cls.split(' ')); o.pool.appendChild(t); });
    return {
        instr: o.instr || 'Drag each tile into place (or tap a tile, then a gap), then press <b>Check</b>.',
        ready: () => o.zones.every(z => z.box.querySelector('.tile')),
        check() {
            let bad = 0, hint = null;
            o.zones.forEach(z => {
                const t = z.box.querySelector('.tile'); z.el.classList.remove('wrong');
                if (!t || z.locked) return;
                t.classList.remove('wrong'); void t.offsetWidth;
                if (o.valid(z, t)) { t.classList.add('right'); z.locked = true; }
                else { bad++; t.classList.add('wrong'); z.el.classList.add('wrong'); if (!hint) hint = o.hint(z, t); }
            });
            if (bad) return { ok: false, hint: (bad > 1 ? `${bad} ${o.unit || 'answers'} need changing. ` : '') + hint };
            return { ok: true, msg: o.msg ? o.msg() : null };
        },
        done: o.done
    };
}

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sel = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sel) sel.classList.remove('sel'); sel = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sel && !z.locked) put(sel, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(text, html) {
        const t = el('span', 'tile', html || text);
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right')) return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { put(t, pool); return; }
            if (sel === t) { deselect(); return; }
            deselect(); sel = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

/* =========================================================
   ANIMATED SCENES  (run(full, skipIntro))
   ========================================================= */
const SCENES = {
    formation(svg) {
        const cx = 330, cy = 188, FL = .3, N = 170, R = rng(42);
        const om = r => Math.min(.006, .0011 * Math.pow(110 / r, 1.5));
        const CL = [{ r: 96, a: .6, f: 7 }, { r: 152, a: 2.7, f: 12 }, { r: 212, a: 4.3, f: 18 }, { r: 270, a: 1.5, f: 11 }];
        const P = [];
        for (let i = 0; i < N; i++) {
            const r = 34 + 270 * Math.sqrt(R()), a = R() * 6.2832, u = Math.sqrt(R()), b = R() * 6.2832;
            P.push({ r, a, x0: 330 + 290 * u * Math.cos(b) + (R() - .5) * 30, y0: 168 + 118 * u * Math.sin(b), ph: R() * 6 });
        }
        P.forEach(p => { if (p.r >= 72) { let best = 0; CL.forEach((c, i) => { if (Math.abs(c.r - p.r) < Math.abs(CL[best].r - p.r)) best = i; }); p.cl = best; } });
        let parts = ''; P.forEach(() => parts += `<circle r="3.2" fill="${MG}"/>`);
        svg.innerHTML = `<rect width="660" height="330" fill="#fff"/><g class="orb"></g><g class="pp">${parts}</g><circle class="sun" cx="${cx}" cy="${cy}" r="0" fill="${PK}"/>
            <g class="cl">${CL.map(() => `<circle r="0" fill="${NV}"/>`).join('')}</g><text class="spd lab" x="22" y="40"></text>`;
        const pe = [...svg.querySelectorAll('.pp circle')], ce = [...svg.querySelectorAll('.cl circle')], sun = svg.querySelector('.sun'), lab = svg.querySelector('.lab'), orb = svg.querySelector('.orb');
        let T = 0, cK = 0, sK = 0, gK = 0, clR = 0;
        const dpos = (r, a) => { const th = a + om(r) * T; return [cx + r * Math.cos(th), cy + FL * r * Math.sin(th)]; };
        const draw = () => {
            const cpos = CL.map(c => dpos(c.r, c.a));
            P.forEach((p, i) => {
                let [x, y] = dpos(p.r, p.a), o = 1;
                if (cK < 1) { const e = easeInOut(cK); x = lerp(p.x0 + Math.sin(T * .0015 + p.ph) * 4, x, e); y = lerp(p.y0 + Math.cos(T * .0013 + p.ph) * 4, y, e); }
                if (p.r < 72 && sK > 0) { x = lerp(x, cx, sK); y = lerp(y, cy, sK); o = 1 - sK; }
                if (p.r >= 72 && gK > 0) { const [kx, ky] = cpos[p.cl]; x = lerp(x, kx, gK); y = lerp(y, ky, gK); o = 1 - Math.max(0, (gK - .55) / .45); }
                pe[i].setAttribute('cx', fx(x)); pe[i].setAttribute('cy', fx(y)); pe[i].setAttribute('opacity', fx(o));
            });
            ce.forEach((c, i) => { c.setAttribute('cx', fx(cpos[i][0])); c.setAttribute('cy', fx(cpos[i][1])); c.setAttribute('r', fx(lerp(clR, CL[i].f, gK))); });
        };
        const ph = (dur, f) => { const T0 = T; return play(dur, k => { T = T0 + k * dur; f(k); draw(); }); };
        const idle = () => loop(dt => { T += dt; draw(); });
        return {
            async run(full, skipIntro) {
                if (!skipIntro) {
                    this.introDone = false;
                    T = 0; cK = 0; sK = 0; gK = 0; clR = 0; orb.innerHTML = ''; sun.setAttribute('r', 0);
                    lab.textContent = 'A cloud of dust and gas'; draw();
                    await ph(1400, () => {});
                    lab.textContent = 'Gravity collapses it into a spinning disc';
                    await ph(2400, k => cK = k);
                    lab.textContent = 'The Sun forms at the centre';
                    await ph(1500, k => { sK = k; sun.setAttribute('r', fx(26 * easeOut(k))); });
                    lab.textContent = 'Clumps start to form in the disc';
                    await ph(1000, k => clR = 4.5 * easeOut(k));
                    this.introDone = true;
                }
                if (!full) { idle(); return; }
                await ph(skipIntro ? 100 : 400, () => {});
                lab.textContent = 'Clumps grow into planets';
                await ph(2800, k => gK = easeInOut(k));
                orb.innerHTML = CL.map(c => `<ellipse cx="${cx}" cy="${cy}" rx="${c.r}" ry="${fx(c.r * FL)}" fill="none" stroke="${GR}" stroke-width="2.5" stroke-dasharray="5 7"/>`).join('');
                orb.setAttribute('opacity', 0);
                await ph(500, k => orb.setAttribute('opacity', fx(k)));
                idle();
            }
        };
    },

    gravOff(svg) {
        const cx = 250, cy = 172, R = 110, per = 3200, I = 4800, v = R * 2 * Math.PI / per, mr = 15;
        svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="42" fill="${NV}"/><text class="oname" x="${cx}" y="${cy + 7}" text-anchor="middle" style="fill:#fff">Earth</text>
            <g class="tr"></g><g class="ag"></g><g class="mo"><circle r="${mr}" fill="#dde0e8" stroke="${NV}" stroke-width="3"/></g>
            <text class="spd lab" x="20" y="38"></text>${legend(16, 318)}`;
        const mo = svg.querySelector('.mo'), ag = svg.querySelector('.ag'), lab = svg.querySelector('.lab');
        const pos = T => { if (T <= I) { const th = Math.PI / 2 - 2 * Math.PI * T / per; return { x: cx + R * Math.cos(th), y: cy + R * Math.sin(th) }; } return { x: cx - v * (T - I), y: cy - R }; };
        const tr = mkTrail(svg.querySelector('.tr'), pos, 200);
        const arrow = p => { const a = Math.atan2(cy - p.y, cx - p.x); ag.innerHTML = arrowSVG(p.x + Math.cos(a) * (mr + 3), p.y + Math.sin(a) * (mr + 3), a, 46, { label: 'Gravity', sw: 7, hl: 18, hw: 12, fs: 22 }); };
        const set = T => { const p = pos(T); mo.setAttribute('transform', `translate(${fx(p.x)} ${fx(p.y)})`); tr.upto(T); return p; };
        return {
            async run(full, skipIntro) {
                if (!skipIntro) {
                    this.introDone = false;
                    tr.reset(); ag.setAttribute('opacity', 1); lab.textContent = 'The Moon orbiting Earth'; lab.style.fill = '';
                    await play(I, k => arrow(set(k * I)));
                    this.introDone = true;
                }
                if (!full) return;
                await wait(skipIntro ? 100 : 500);
                lab.textContent = 'Gravity switched off'; lab.style.fill = PK;
                await play(350, k => ag.setAttribute('opacity', fx(1 - k)));
                await play(1400, k => set(I + 1400 * k));
            }
        };
    },

    asteroid(svg) {
        const E = { x: 330, y: 214 }, MR = 84, per = 4200, CY = 4400, TR = 3600;
        svg.innerHTML = `<circle class="mor" cx="${E.x}" cy="${E.y}" r="${MR}" fill="none" stroke="${GR}" stroke-width="2.5" stroke-dasharray="5 7"/>
            <circle cx="${E.x}" cy="${E.y}" r="34" fill="${NV}"/><text class="tiny" x="${E.x}" y="${E.y + 6}" text-anchor="middle" style="fill:#fff">Earth</text>
            <g class="tr"></g><g class="as">${asteroidPath(1.1)}</g><text class="tiny al" text-anchor="middle">Asteroid</text>
            <g class="mo"><circle r="11" fill="#dde0e8" stroke="${NV}" stroke-width="3"/></g><text class="tiny ml" text-anchor="middle">Moon</text>
            <g class="tags"></g>${legend(16, 318, 'Dots show the asteroid\u2019s path every 0.3 seconds')}`;
        const as = svg.querySelector('.as'), al = svg.querySelector('.al'), mo = svg.querySelector('.mo'), ml = svg.querySelector('.ml'), tags = svg.querySelector('.tags'), mor = svg.querySelector('.mor');
        const path = T => { const s = Math.min(1, T / TR), x = -30 + 720 * s; return { x, y: 34 + 46 * s + 30 * Math.exp(-Math.pow((x - 330) / 120, 2)) }; };
        const tr = mkTrail(svg.querySelector('.tr'), path, 300);
        let t = 0, prev = 0;
        const moon = () => { const a = -2 * Math.PI * t / per + 1; const x = E.x + MR * Math.cos(a), y = E.y + MR * Math.sin(a); mo.setAttribute('transform', `translate(${fx(x)} ${fx(y)})`); ml.setAttribute('x', fx(x)); ml.setAttribute('y', fx(y - 18)); };
        const ast = T => { const p = path(T); as.setAttribute('transform', `translate(${fx(p.x)} ${fx(p.y)}) rotate(${fx(T * .08)})`); al.setAttribute('x', fx(p.x)); al.setAttribute('y', fx(p.y - 24)); };
        return {
            run(full) {
                this.introDone = true;
                if (!full) {
                    tags.innerHTML = ''; mor.setAttribute('stroke', GR); tr.reset(); prev = 0;
                    loop(dt => { t += dt; const c = t % CY; if (c < prev) tr.reset(); prev = c; tr.upto(Math.min(c, TR)); ast(Math.min(c, TR)); moon(); });
                    return;
                }
                tr.reset(); tr.upto(TR); ast(TR * .82); mor.setAttribute('stroke', PK);
                tags.innerHTML = `<text class="flbl" x="24" y="${E.y + 8}" text-anchor="start" style="fill:${PK};font-size:22px">Moon: orbits Earth</text>
                    <text class="flbl" x="500" y="122" text-anchor="middle" style="font-size:22px">Asteroid: only passes by</text>`;
                tags.setAttribute('opacity', 0); play(400, k => tags.setAttribute('opacity', fx(k)));
                loop(dt => { t += dt; moon(); });
            }
        };
    },

    poster(svg) {
        const Y = 168, PR = [6, 11, 12, 8, 38, 30, 20, 19], PXs = [90, 134, 180, 224, 296, 400, 495, 572];
        let s = `<rect width="660" height="330" fill="#fff"/><text class="spd ttl" x="22" y="38">The Solar System</text><circle class="sn" cx="-84" cy="${Y}" r="135" fill="${PK}"/>`;
        PLANETS.forEach((p, i) => {
            const below = i % 2 === 0, ly = below ? Y + PR[i] + (p.n === 'Saturn' ? 30 : 24) : Y - PR[i] - (p.n === 'Saturn' ? 22 : 12);
            s += `<g class="pg" transform="translate(${PXs[i]} ${Y}) scale(0)"><g class="full">${planetSVG(p.n, PR[i])}</g><circle class="dot" r="${p.n === 'Earth' ? 3.5 : 3}" fill="${NV}" opacity="0"/></g>
                <text class="tiny pl" x="${PXs[i]}" y="${ly}" text-anchor="middle" style="font-size:15px">${p.n}</text>`;
        });
        s += `<g class="ann"></g>`;
        svg.innerHTML = s;
        const pg = [...svg.querySelectorAll('.pg')], pl = [...svg.querySelectorAll('.pl')], sn = svg.querySelector('.sn'), ann = svg.querySelector('.ann'), ttl = svg.querySelector('.ttl');
        const TX = PLANETS.map(p => 30 + 600 * p.d / 4500);
        const put = (i, x, sc, e) => { pg[i].setAttribute('transform', `translate(${fx(x)} ${Y}) scale(${sc.toFixed(3)})`); pg[i].querySelector('.full').setAttribute('opacity', fx(1 - e)); pg[i].querySelector('.dot').setAttribute('opacity', fx(e)); pg[i].querySelector('.dot').setAttribute('r', fx((PLANETS[i].n === 'Earth' ? 3.5 : 3) / Math.max(sc, .001))); };
        return {
            async run(full, skipIntro) {
                if (!skipIntro) {
                    this.introDone = false;
                    ann.innerHTML = ''; ttl.textContent = 'The Solar System'; sn.setAttribute('cx', -84); sn.setAttribute('r', 135);
                    pl.forEach(t => t.setAttribute('opacity', 0)); pg.forEach((g, i) => put(i, PXs[i], 0, 0));
                    await play(1300, k => pg.forEach((g, i) => { const kk = Math.max(0, Math.min(1, (k * 1.3 - i * .06) / .6)); put(i, PXs[i], easeOut(kk), 0); pl[i].setAttribute('opacity', fx(kk)); }));
                    this.introDone = true;
                }
                if (!full) return;
                await wait(skipIntro ? 100 : 600);
                ttl.textContent = 'Same planets, real distances';
                await play(2200, k => {
                    const e = easeInOut(k);
                    sn.setAttribute('cx', fx(lerp(-84, 22, e))); sn.setAttribute('r', fx(lerp(135, 6, e)));
                    pg.forEach((g, i) => { const small = 1 / PR[i]; put(i, lerp(PXs[i], TX[i], e), lerp(1, small * 3, e), Math.min(1, e * 1.4)); });
                    pl.forEach(t => t.setAttribute('opacity', fx(1 - Math.min(1, e * 2))));
                });
                ann.innerHTML = `<line x1="${fx(TX[0])}" x2="${fx(TX[3])}" y1="${Y + 22}" y2="${Y + 22}" stroke="${PK}" stroke-width="3"/>
                    <text class="tiny" x="${fx(TX[0] - 4)}" y="${Y + 46}" style="font-size:15px;fill:${PK}">Mercury to Mars</text>
                    ${[4, 5, 6, 7].map(i => `<text class="tiny" x="${fx(TX[i])}" y="${Y - 16}" text-anchor="${i === 7 ? 'end' : 'middle'}" style="font-size:15px">${PLANETS[i].n}</text>`).join('')}
                    <text class="leg" x="330" y="300" text-anchor="middle">At true size, every planet would be too small to see.</text>`;
                ann.setAttribute('opacity', 0);
                await play(450, k => ann.setAttribute('opacity', fx(k)));
            }
        };
    },

    race(svg) {
        const S = { x: 178, y: 172 }, RR = [32, 56, 82, 112], PER = [964, 2466, 4000, 7529], PRs = [6, 9, 9, 7.5], AGE = [49.8, 19.5, 12.0, 6.4];
        const names = ['Mercury', 'Venus', 'Earth', 'Mars'];
        let s = `<text class="tiny" x="16" y="28" style="fill:${MG}">Not to scale</text>`;
        RR.forEach(r => s += `<circle cx="${S.x}" cy="${S.y}" r="${r}" fill="none" stroke="${GR}" stroke-width="2.5" stroke-dasharray="5 7"/>`);
        s += `<circle cx="${S.x}" cy="${S.y}" r="20" fill="${PK}"/>`;
        names.forEach((n, i) => s += `<g class="rp">${planetSVG(n, PRs[i])}</g><text class="tiny rl" style="font-size:15px">${n}</text>`);
        s += `<line x1="352" x2="352" y1="40" y2="300" stroke="${NV}" stroke-width="3"/><text class="spd hd" x="372" y="74">Orbits completed</text>`;
        names.forEach((n, i) => { const y = 124 + i * 50; s += `<g transform="translate(386 ${y - 9})">${planetSVG(n, 8)}</g><text class="flbl" x="406" y="${y}">${n}</text><text class="flbl val" x="640" y="${y + 2}" text-anchor="end" style="font-size:38px;fill:${PK}">0.0</text>`; });
        s += `<text class="leg tm" x="372" y="312"></text>`;
        svg.innerHTML = s;
        const rp = [...svg.querySelectorAll('.rp')], rl = [...svg.querySelectorAll('.rl')], val = [...svg.querySelectorAll('.val')], hd = svg.querySelector('.hd'), tm = svg.querySelector('.tm');
        let T = 0;
        const place = () => RR.forEach((r, i) => {
            const a = -2 * Math.PI * T / PER[i], x = S.x + r * Math.cos(a), y = S.y + r * Math.sin(a);
            rp[i].setAttribute('transform', `translate(${fx(x)} ${fx(y)})`);
            const d = r + PRs[i] + 6, lx = S.x + d * Math.cos(a), ly = S.y + d * Math.sin(a);
            rl[i].setAttribute('x', fx(lx)); rl[i].setAttribute('y', fx(ly + 5 + Math.sin(a) * 6)); rl[i].setAttribute('text-anchor', Math.cos(a) > .3 ? 'start' : Math.cos(a) < -.3 ? 'end' : 'middle');
        });
        return {
            async run(full, skipIntro) {
                if (!skipIntro) {
                    this.introDone = false;
                    T = 0; hd.textContent = 'Orbits completed'; val.forEach(v => v.style.fill = PK);
                    await play(4000, k => { T = 4000 * k; place(); val.forEach((v, i) => v.textContent = (T / PER[i]).toFixed(1)); tm.textContent = `Time passed: ${(T / 4000).toFixed(1)} Earth years`; });
                    this.introDone = true;
                }
                if (!full) return;
                await wait(skipIntro ? 100 : 500);
                hd.textContent = 'At 12 Earth years';
                const from = PER.map(p => 4000 / p);
                loop(dt => { T += dt * .5; place(); });
                await play(2400, k => { const e = easeInOut(k); val.forEach((v, i) => v.textContent = lerp(from[i], AGE[i], e).toFixed(1)); tm.textContent = `Time passed: ${lerp(1, 12, e).toFixed(0)} Earth years`; });
                await play(400, k => val.forEach((v, i) => { if (i) v.style.fill = k > .5 ? MG : PK; }));
            }
        };
    }
};

/* =========================================================
   SIDE PANELS  (mcside / calc)
   ========================================================= */
const SIDES = {

                <g opacity="${fx(e)}"><line x1="${C.x - 92}" x2="${C.x + 92}" y1="${C.y - 46}" y2="${C.y - 46}" stroke="${GR}" stroke-width="5"/><line x1="${C.x - 104}" x2="${C.x + 104}" y1="${C.y + 30}" y2="${C.y + 30}" stroke="${GR}" stroke-width="5"/>
                <text class="tiny" x="${C.x}" y="${C.y - 4}" text-anchor="middle">Jupiter</text><text class="flbl" x="${C.x}" y="${C.y + 20}" text-anchor="middle" style="fill:${PK}">14.3 cm</text></g>`;
        }, () => document.body.contains(jp)) };
    },
    samSide(side) {
        let lines = ''; for (let y = 64; y < 330; y += 50) lines += `<line x1="0" x2="250" y1="${y + 12}" y2="${y + 12}" stroke="#e3e7ee" stroke-width="2"/>`;
        side.innerHTML = `<svg viewBox="0 0 250 330" width="250" height="330"><line x1="40" x2="40" y1="0" y2="330" stroke="#f6c3df" stroke-width="2"/>${lines}
            <text class="tiny" x="52" y="40" style="fill:${MG}">Sam\u2019s working</text>
            <text class="hand" x="52" y="114">12 \u00d7 <tspan class="sw">225 \u00f7 365</tspan></text>
            <text class="hand" x="52" y="164">= 7.4 years</text>
            <g class="fix"></g></svg>`;
        const fix = side.querySelector('.fix'), sw = side.querySelector('.sw');
        return { done: () => {
            const b = sw.getBBox();
            fix.innerHTML = `<ellipse cx="${fx(b.x + b.width / 2)}" cy="${fx(b.y + b.height / 2 + 1)}" rx="${fx(b.width / 2 + 12)}" ry="${fx(b.height / 2 + 6)}" fill="none" stroke="${PK}" stroke-width="3.5"/>
                <line x1="48" x2="${fx(b.x + b.width + 6)}" y1="156" y2="156" stroke="${PK}" stroke-width="3"/>
                <text class="hand" x="52" y="214" style="fill:${PK}">12 \u00d7 365 \u00f7 225</text><text class="hand" x="52" y="264" style="fill:${PK}">= 19.5 years</text>`;
            fix.setAttribute('opacity', 0); play(450, k => fix.setAttribute('opacity', fx(k)), () => document.body.contains(fix));
        } };
    },
    saturnSide(side) {
        const k = .29, X = d => 26 + d * k, Y = 196, xe = X(150), xs = X(1430);
        side.innerHTML = `<svg viewBox="0 0 480 327" width="480" height="327">
            <text class="flbl" x="24" y="44" style="font-size:22px">Scale: 1 cm = 10 million km</text>
            <line x1="26" x2="${xs}" y1="${Y}" y2="${Y}" stroke="${GR}" stroke-width="3" stroke-dasharray="6 7"/>
            <circle cx="26" cy="${Y}" r="14" fill="${PK}"/>
            <g transform="translate(${xe} ${Y})">${planetSVG('Earth', 9)}</g><text class="tiny" x="${xe}" y="${Y - 20}" text-anchor="middle">Earth</text>
            <g transform="translate(${xs} ${Y})">${planetSVG('Saturn', 11)}</g><text class="tiny" x="${xs + 18}" y="${Y - 22}" text-anchor="end">Saturn</text>
            <path d="M26 ${Y + 30} v8 H${xe} v-8" fill="none" stroke="${NV}" stroke-width="2.5"/><text class="leg" x="22" y="${Y + 62}" style="font-size:17px">Sun to Earth: 150 million km</text>
            <path d="M26 ${Y + 82} v8 H${xs} v-8" fill="none" stroke="${NV}" stroke-width="2.5"/><text class="leg" x="${(26 + xs) / 2}" y="${Y + 114}" text-anchor="middle" style="font-size:17px">Sun to Saturn: 1,430 million km</text>
            <path class="gq" d="M${xe} ${Y - 46} v-8 H${xs} v8" fill="none" stroke="${GR}" stroke-width="2.5" stroke-dasharray="5 6"/><text class="flbl gq" x="${(xe + xs) / 2}" y="${Y - 64}" text-anchor="middle" style="fill:${MG}">?</text>
            <g class="br"></g></svg>`;
        const br = side.querySelector('.br');

                br.innerHTML = `<path d="M${xe} ${Y - 46} v-8 H${fx(x2)} v8" fill="none" stroke="${PK}" stroke-width="3.5"/><text class="flbl" x="${(xe + xs) / 2}" y="${Y - 64}" text-anchor="middle" opacity="${fx(e)}" style="fill:${PK};font-size:22px">1,280 million km = 128 cm</text>`;

    },
    marsSide(side) {
        const S = { x: 180, y: 236 };
        side.innerHTML = `<svg viewBox="0 0 360 327" width="360" height="327">
            <text class="flbl" x="22" y="42" style="font-size:22px">1 Earth year = 365 days</text>

            <text class="flbl" x="22" y="106" style="font-size:22px">Hana\u2019s age = 13 Earth years</text>
            <g class="res"></g>
            <circle cx="${S.x}" cy="${S.y}" r="44" fill="none" stroke="${GR}" stroke-width="2.5" stroke-dasharray="5 7"/>
            <circle cx="${S.x}" cy="${S.y}" r="72" fill="none" stroke="${GR}" stroke-width="2.5" stroke-dasharray="5 7"/>
            <circle cx="${S.x}" cy="${S.y}" r="13" fill="${PK}"/>
            <g transform="translate(${S.x + 31} ${S.y - 31})">${planetSVG('Earth', 7)}</g><text class="tiny" x="${S.x + 42}" y="${S.y - 34}" style="font-size:15px">Earth</text>
            <g transform="translate(${S.x - 51} ${S.y + 51})">${planetSVG('Mars', 6)}</g><text class="tiny" x="${S.x - 62}" y="${S.y + 74}" text-anchor="end" style="font-size:15px">Mars</text>
            <text class="tiny" x="344" y="318" text-anchor="end" style="fill:${MG};font-size:14px">Not to scale</text></svg>`;
        const res = side.querySelector('.res');
        return { done: () => {
            res.innerHTML = `<rect x="16" y="120" width="328" height="40" rx="6" fill="${PK}"/><text class="flbl" x="180" y="148" text-anchor="middle" style="fill:#fff;font-size:23px">About 6 years and 11 months</text>`;
            res.setAttribute('opacity', 0); play(450, k => res.setAttribute('opacity', fx(k)), () => document.body.contains(res));
        } };
    }
};

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); render(); });
</script>
