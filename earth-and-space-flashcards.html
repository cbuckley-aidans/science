<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth and Space Flashcards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='7' y='13' width='32' height='44' rx='5' fill='%231b1f45' stroke='%23fff' stroke-width='2.5' transform='rotate(-12 23 35)'/%3E%3Crect x='24' y='8' width='32' height='44' rx='5' fill='%23ea008a' stroke='%23fff' stroke-width='2.5' transform='rotate(9 40 30)'/%3E%3Crect x='31' y='17' width='15' height='4' rx='2' fill='%23fff' transform='rotate(9 40 30)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { gap: 24px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; height: 70px; }
    .sheet-title { white-space: nowrap; flex: 1; min-width: 0; overflow: hidden; font-family: var(--cond); font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .topr { display: flex; align-items: center; gap: 22px; }
    .counter { white-space: nowrap; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; display: flex; align-items: center; gap: 22px; }
    .counter b { color: var(--navy); }
    .snd { width: 40px; height: 40px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; color: var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .snd svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .snd.on { background: var(--navy); color: #fff; }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }
    .btns { display: flex; gap: 12px; flex-shrink: 0; }
    .next, .btn2 { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 8px; padding: 12px 30px; cursor: pointer; }
    .next { background: var(--pink); color: #fff; border: 3px solid var(--pink); }
    .next:disabled { background: #c3c6d0; border-color: #c3c6d0; cursor: default; }
    .btn2 { background: #fff; color: var(--navy); border: 3px solid var(--navy); }
    .btn2:hover { background: var(--blank); }
    button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* svg text */
    svg { display: block; }
    .vis { overflow: hidden; }
    .halo { paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    .num { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: var(--navy); }
    .lb { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .lbg { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--mid-grey); }
    .lbs { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: var(--navy); }
    .lg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: var(--navy); }
    .tiny { font-family: var(--cond); font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .bd { font-family: var(--cond); font-size: 19px; font-weight: 900; }
    .big { font-family: var(--cond); font-size: 44px; font-weight: 900; }
    .sm { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
    .qm { font-family: var(--cond); font-size: 28px; font-weight: 900; }
    .ax { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: var(--mid-grey); }
    .axp { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: var(--pink); }
    .bigl { font-family: var(--cond); font-size: 36px; font-weight: 900; fill: var(--navy); }

    /* home */
    .decks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; height: 100%; align-items: center; padding-right: 12px; }
    .deck { position: relative; height: 430px; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; color: var(--navy); text-align: left; }
    .deck::before, .deck::after { content: ''; position: absolute; inset: 0; border: 3px solid var(--navy); border-radius: 14px; transition: transform .35s var(--ease); }
    .deck::before { transform: translate(12px, 12px); background: var(--navy); }
    .deck::after { transform: translate(6px, 6px); background: #fff; }
    .dface { position: absolute; inset: 0; z-index: 1; border: 3px solid var(--navy); border-radius: 14px; background: #fff; padding: 20px 20px 18px; display: flex; flex-direction: column; transition: transform .35s var(--ease), border-color .2s; }
    .deck:hover .dface, .deck:focus-visible .dface { transform: translate(-4px, -10px) rotate(-1.5deg); border-color: var(--pink); }
    .deck:hover::after { transform: translate(9px, 4px) rotate(1.5deg); }
    .deck:focus-visible { outline: none; }
    .dface svg { width: 100%; height: 112px; }
    .dcode { font-family: var(--cond); font-size: 66px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: auto; }
    .dname { font-size: 25px; font-weight: 800; line-height: 1.15; margin-top: 4px; min-height: 58px; }
    .dmeta span { white-space: nowrap; }
    .dmeta { gap: 8px; font-size: 17px !important; display: flex; justify-content: space-between; border-top: 3px solid var(--navy); margin-top: 14px; padding-top: 10px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mid-grey); }

    /* deck screen */
    .dscreen { display: grid; grid-template-columns: 340px 1fr; gap: 48px; height: 100%; }
    .dscreen .deck { height: 470px; cursor: default; }
    .dscreen .deck:hover .dface { transform: none; border-color: var(--navy); }
    .dscreen .deck:hover::after { transform: translate(6px, 6px); }
    .dstate { font-size: 19px; font-weight: 600; line-height: 1.3; margin-top: 10px; }
    .sccol { display: flex; flex-direction: column; min-height: 0; }
    .sch { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .sch button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--navy); background: none; border: none; cursor: pointer; padding: 0; }
    .sclist { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding: 2px 8px 4px 2px; }
    .scrow { display: grid; grid-template-columns: 30px 60px 1fr auto auto; align-items: center; gap: 14px; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 14px; background: #fff; font-family: inherit;
        font-size: 17px; font-weight: 600; color: var(--navy); text-align: left; cursor: pointer; line-height: 1.2; min-height: 58px; transition: opacity .2s, background-color .2s; }
    .scrow:hover { background: #f6f7fb; }
    .scrow .box { width: 30px; height: 30px; border: 3px solid var(--navy); border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background-color .2s, border-color .2s; }
    .scrow .box svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .scrow.on .box { background: var(--pink); border-color: var(--pink); }
    .scrow.on .box svg { opacity: 1; }
    .scrow:not(.on) { opacity: .5; border-style: dashed; }
    .scrow .code { font-family: var(--cond); font-size: 25px; font-weight: 900; }
    .scrow .n { font-family: var(--cond); font-size: 18px; font-weight: 800; color: var(--mid-grey); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

    /* play */
    .play { display: grid; grid-template-columns: 612px 1fr; gap: 32px; height: 100%; align-items: center; }
    .cwrap { position: relative; width: 584px; height: 470px; perspective: 1800px; }
    .stk { position: absolute; inset: 0; border-radius: 14px; background: var(--navy); border: 3px solid var(--navy); transition: transform .4s var(--ease), opacity .3s; }
    .stk::after { content: ''; position: absolute; inset: 8px; border: 2px solid rgba(234,0,138,.5); border-radius: 8px; }
    .card { position: absolute; inset: 0; transform-style: preserve-3d; z-index: 5; }
    .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; border: 3px solid var(--navy); border-radius: 14px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
    .face.back { transform: rotateY(180deg); }
    .front { padding: 22px 28px 20px; }
    .fmeta { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
    .sctag { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--navy); border-radius: 6px; padding: 5px 12px 4px; line-height: 1; }
    .tchip { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 2px 10px 1px; }
    .lgc { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); }
    .fq { font-size: 26px; font-weight: 700; line-height: 1.25; margin-top: 14px; position: relative; z-index: 1; }
    .front.t .fq { font-size: 37px; font-weight: 800; line-height: 1.18; margin: auto 0; padding-bottom: 30px; }
    .ghost { position: absolute; right: 16px; bottom: -40px; font-family: var(--cond); font-weight: 900; font-size: 210px; color: var(--blank); line-height: 1; pointer-events: none; }
    .fvis { flex: 1; min-height: 0; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
    .fvis svg { width: 100%; height: 100%; }
    .pat { background: var(--navy); border-color: var(--navy); }
    .pat svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pcode { position: absolute; left: 30px; top: 22px; font-family: var(--cond); font-size: 70px; font-weight: 900; color: #fff; line-height: 1; }
    .bhead { display: flex; align-items: center; gap: 12px; padding: 14px 26px; color: #fff; font-family: var(--cond); font-size: 40px; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
    .bhead.ok { background: var(--pink); }
    .bhead.no { background: var(--navy); }
    .bhead svg { width: 36px; height: 36px; fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .bsc { margin-left: auto; font-size: 22px; letter-spacing: .08em; opacity: .85; }
    .bbody { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 28px 18px; }
    .alab { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mid-grey); }
    .ans { font-size: 28px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
    .bhead.ok + .bbody .ans { color: var(--pink); }
    .apic { height: 118px; margin-top: 6px; }
    .apic svg { height: 100%; width: auto; }
    .exp { font-size: 21px; font-weight: 500; line-height: 1.38; margin: 10px 0 0; }
    .bbody.nov .exp { font-size: 24px; }
    .bbody.nov .ans { font-size: 32px; }
    .back .ghost { z-index: 0; }
    .bbody { position: relative; z-index: 1; }
    .bvis { flex: 1; min-height: 0; margin-top: 10px; display: flex; justify-content: center; }
    .bvis svg { width: 100%; height: 100%; }

    /* options */
    .opts { display: flex; flex-direction: column; gap: 12px; justify-content: center; height: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 18px; min-height: 96px;
        font-family: inherit; font-size: 23px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .25s, box-shadow .2s; position: relative; }
    .opt.short { font-size: 28px; font-weight: 700; }
    .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .l svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .l svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .35s .12s var(--ease) forwards; }
    .opt:hover:not(:disabled), .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .opt:disabled, .pcard:disabled { cursor: default; }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .wrong { border-style: dashed !important; opacity: .5; animation: shake .4s; }
    .reveal { border-color: var(--pink) !important; box-shadow: 0 0 0 5px rgba(234,0,138,.18); }
    .reveal .l { background: var(--pink); }
    .dim { opacity: .3; }
    .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 8px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 214px;
        font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .25s, box-shadow .2s; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 36px; height: 36px; font-size: 22px; }
    .pcard svg.vis { width: 100%; height: 170px; }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 6px rgba(234,0,138,.22); }
    .pcard.right .l { background: var(--pink); color: #fff; }


    /* interactive cards */
    .fvis { position: relative; }
    .replay { position: absolute; right: 0; top: 0; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 4px 11px 3px 8px; cursor: pointer; }
    .replay svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }
    .tile { display: inline-flex; align-items: center; gap: 10px; font-family: inherit; font-size: 21px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 14px;
        line-height: 1.2; cursor: grab; touch-action: none; position: relative; z-index: 2; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; transition: box-shadow .2s, border-color .2s, background-color .2s; }
    .tile:hover { background: #f6f7fb; }
    .tile .mini { width: 32px; height: 32px; flex-shrink: 0; overflow: visible; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { cursor: grabbing; z-index: 40; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }
    .tile:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .pool { display: flex; flex-wrap: wrap; gap: 12px; align-content: center; justify-content: center; background: var(--blank); border-radius: 12px; padding: 16px; height: 100%; }
    .pool2 { display: grid; grid-template-columns: 1fr 1fr; align-content: center; gap: 14px; }
    .pool2 .tile { justify-content: flex-start; font-size: 22px; padding: 8px 14px; }
    .pool3 { display: grid; grid-template-columns: repeat(3, 1fr); align-content: center; justify-items: center; gap: 16px; }
    .mtile { padding: 6px; }
    .mtile svg { width: 92px; height: 92px; display: block; }
    .mtile.right svg circle[fill="#fbfbf7"], .mtile.right svg path[fill="#fbfbf7"] { fill: #fff; }
    .wtile { font-size: 26px; padding: 10px 24px; }
    .kz { flex-direction: column; align-items: stretch; justify-content: center; gap: 14px; }
    .ordtop { display: flex; align-items: center; gap: 10px; font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mid-grey); white-space: nowrap; }
    .ordtop i { flex: 1; height: 3px; background: linear-gradient(90deg, var(--pink), var(--light-grey)); }
    .ordtop .mini { width: 36px; height: 36px; overflow: visible; flex-shrink: 0; }
    .ogrid { display: grid; gap: 10px; }
    .slot { position: relative; border: 3px dashed #c3c6d0; border-radius: 10px; min-height: 96px; display: flex; align-items: center; justify-content: center; padding: 20px 4px 6px; transition: border-color .2s, background-color .2s, box-shadow .2s; }
    .slot > b { position: absolute; left: 8px; top: 3px; font-family: var(--cond); font-size: 16px; font-weight: 900; color: var(--mid-grey); letter-spacing: .04em; }
    .slot .sb { display: flex; justify-content: center; width: 100%; }
    .slot:has(.tile) { border-style: solid; border-color: var(--light-grey); }
    .slot .tile { box-shadow: none; flex-direction: column; gap: 2px; font-size: 15px; padding: 4px 6px; min-width: 100px; }
    .slot .tile .mini { width: 30px; height: 30px; }
    .slot .mtile { min-width: 0; padding: 4px; }
    .slot .mtile svg { width: 74px; height: 74px; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; height: 100%; }
    .bin { border: 3px solid var(--navy); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .2s; }
    .bin h3 { margin: 0; padding: 6px 14px 5px; font-family: var(--cond); font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--navy); }
    .bin.pk { border-color: var(--pink); }
    .bin.pk h3 { background: var(--pink); }
    .bin .sub { font-size: 15px; font-weight: 600; color: var(--mid-grey); padding: 5px 14px 0; }
    .bin .area { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; justify-content: center; padding: 8px; }
    .bin .mtile svg { width: 54px; height: 54px; }
    .stile { white-space: normal; text-align: center; justify-content: center !important; font-size: 20px; }
    .bin .stile { font-size: 16px; padding: 3px 9px; }
    .slot .stile { font-size: 15px; }
    .pool4 { display: grid; grid-template-columns: 1fr 1fr; align-content: center; justify-items: center; gap: 20px; }
    .ai.am svg { width: 60px; height: 60px; }
    .ai small { font-size: 14px; }
    .pair { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .pair svg { width: 48%; height: 100%; }
    .bin.hover, .bin.armed { box-shadow: 0 0 0 5px rgba(234,0,138,.18); cursor: pointer; }
    .ctext { font-size: 24px; font-weight: 600; line-height: 1.95; margin: 0; }
    .blank { display: inline-flex; vertical-align: middle; min-width: 112px; height: 48px; border: 3px dashed #c3c6d0; border-radius: 8px; margin: 0 3px; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .blank:has(.tile) { border-color: transparent; min-width: 0; }
    .blank .bb { display: flex; }
    .blank .tile { box-shadow: none; font-size: 22px; padding: 4px 12px; }

<script>
/* =====================================================================================
   EARTH AND SPACE FLASHCARDS: MAINTENANCE GUIDE
   This file doubles as the template for future flashcard resources. Read this before
   adding, editing or removing cards.

   1. BUCKLES (shared reward system)
      - Buckles are stored in localStorage under 'buckles-shared', the same record used by
        the other checking for understanding pages. Each entry is 'PAGE_ID:card-id': 1.
      - One buckle per card, awarded the first time the card is answered correctly and
        never again. A wrong answer awards nothing, so the card can still be earned later.
      - Every total on screen (deck tiles, SC rows, results) is counted from CARDS when the
        page loads, so adding or removing cards needs no other changes.
      - PAGE_ID must never change. Changing it would orphan every buckle already earned.
        When copying this file to make a NEW resource, give that resource its own PAGE_ID.

   2. CARD IDS (permanent)
      - The first argument of C() is the card's buckle ID, for example 'sc12-spin-earth-west-to-east'.
      - Use lowercase letters, numbers and hyphens. Start with the SC so IDs stay readable.
      - Once a card is published its ID is permanent. Labels, questions, options,
        explanations and visuals can all be edited freely without affecting buckles.
      - Adding a card: write a new C('new-id', ...) and add 'new-id' to RELEASED_IDS.
      - Deleting a card: remove the C(...) entry and add its ID to RETIRED_IDS. Leave it in
        RELEASED_IDS. Never reuse a retired ID.
      - If an ID ever has to change, add 'old-id': 'new-id' to ID_ALIASES. Earned buckles
        move across once and are never counted twice.

   3. DATA CHECK
      - validateCards() runs on every load. Problems and reminders are listed in the browser
        console, and a small strip appears at the top left of the page. Pink means a problem
        to fix before publishing. Navy means a reminder, such as registering a new ID.

   4. CARD TYPES (opts[0] is correct unless ans is given)
      Multiple choice:  C(id, sc, label, question, [4 options], explanation, { vis? , calc? , ordered?, ans? })
      Pick the picture: as above with { pic: true } and 4 SVG strings as options
      Predict:          as multiple choice with { scene: 'spin', vis: spinSVG() } (scene in SCENE)
      Put in order:     { kind: 'order', seq: [...keys in order], tile: key => html, cols, ordTop, slotLab?, instr, ansHTML }
      Sort:             { kind: 'sort', bins: [[title, hint], [title, hint]], items: [[html, 0 or 1], ...], instr, ansHTML }
      Fill the gaps:    { kind: 'cloze', text: 'Use [] for each gap', answers: [...], bank: [...answers plus spares], instr, ansHTML }
      Tap the diagram:  { kind: 'hotspot', hsSVG, correct: [indexes], instr, ansHTML }
      Spin the model:   { kind: 'spindrag', instr, ansHTML, backVis }
      New SCs or LGs: add the statement to SCT and the code to the matching LGS entry.

   5. HOUSE STYLE
      - Swiss design, navy #1b1f45 and pink #ea008a, Barlow / Helvetica, 1280 x 720 stage.
      - Australian English in all student-facing text. No em dashes.
      - Animations always play at full speed. Do not add prefers-reduced-motion rules or any
        code that shortens or disables animation (classroom laptops have reduced motion on).
      - Diagrams are inline SVG drawn from the shared helpers (globe, sunG, moonG, planet...).
   ===================================================================================== */

const $ = s => document.querySelector(s);

const f1 = v => (+v).toFixed(1);

    C('sc22-not-every-new-moon', 'SC22', 'Not every new moon', 'Why don’t we get a solar eclipse at every new moon?', ['The Moon’s orbit is tilted, so its shadow usually misses Earth', 'The Moon is too small to block the Sun', 'Earth’s shadow gets in the way', 'Eclipses only happen in summer'], 'The Moon’s orbit is tilted by about 5°. Most months its shadow passes above or below Earth.', { vis: tiltMoonOrbit() }),
    /* interactive cards */
    C('sc1-planets-in-order', 'SC1', 'Planets in order', 'Put the planets in order, starting closest to the Sun.', [], 'The mnemonic “My Very Eager Mother Just Served Us Noodles” gives the order from the Sun.', { kind: 'order', seq: PL.map(p => p[0]), cols: 4, tile: n => `${miniPlanet(n)}<span>${n}</span>`, tileCls: 'ptile', poolCls: 'pool2',
        ordTop: `<svg viewBox="-20 -20 40 40" class="mini">${sunG(0, 0, 12, '', { n: 12, spin: false })}</svg><span>Closest to the Sun</span><i></i><span>Furthest away</span>`,
        instr: 'Drag or tap each planet into place, then press <b>Check</b>.',
        ansHTML: '<div class="ans">Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune</div>', backVis: planetRow({ names: true }) }),
    C('sc16-waxing-or-waning', 'SC16', 'Waxing or waning', 'Seen from Brisbane, sort each Moon by whether its lit part is growing or shrinking.', [], 'In the southern hemisphere a waxing Moon is lit on the left side. A waning Moon is lit on the right side.', { kind: 'sort',
        bins: [['Waxing', 'Lit part growing'], ['Waning', 'Lit part shrinking']], items: [[.125, 0], [.25, 0], [.375, 0], [.625, 1], [.75, 1], [.875, 1]].map(([p, k]) => [mTile(p), k]),
        instr: 'Drag each Moon into a group, or tap a Moon then a group. Press <b>Check</b>.',
        ansHTML: `<div class="asort"><span>Waxing</span>${[.125, .25, .375].map(mTile).join('')}<span>Waning</span>${[.625, .75, .875].map(mTile).join('')}</div>` }),
    C('sc17-phases-after-a-new-moon', 'SC17', 'Phases after a new moon', 'It is a new moon. Put the phases in the order they appear from Brisbane over the next two weeks.', [], 'After a new moon the lit part grows from the left: waxing crescent, first quarter, waxing gibbous, then full moon about 15 days later.', { kind: 'order', seq: [.125, .25, .375, .5], cols: 4, tile: mTile, tileCls: 'mtile', poolCls: 'pool4',
        slotLab: ['Day 4', 'Day 7', 'Day 11', 'Day 15'],
        ordTop: `<svg viewBox="-34 -34 68 68" class="mini">${moonG(0, 30)}</svg><span>Day 0: new moon</span><i></i><span>Two weeks later</span>`,
        instr: 'Drag or tap each Moon into place, then press <b>Check</b>.',
        ansHTML: `<div class="arow">${[[.125, 'Waxing crescent'], [.25, 'First quarter'], [.375, 'Waxing gibbous'], [.5, 'Full moon']].map(([p, n]) => `<span class="ai am">${mTile(p)}<small>${n}</small></span>`).join('')}</div>` }),
    C('sc18-tap-a-high-tide', 'SC18', 'Tap a high tide', 'The Moon is on the right. Tap a place on Earth that is having a high tide right now.', [], 'The Moon pulls the oceans into two bulges, one facing the Moon and one on the far side. Both places have a high tide.', { kind: 'hotspot',
        hsSVG: hsSVG(false), correct: [0, 4], instr: 'Tap one of the places on the diagram.', ansHTML: '<div class="ans">Either place in line with the Moon</div>' }),
    C('sc22-comparing-eclipses', 'SC22', 'Comparing eclipses', 'Complete the comparison.', [], 'Both eclipses need a straight line-up. The object in the middle blocks the light.', { kind: 'cloze',
        text: 'In a solar eclipse, the [] is in the middle and its shadow falls on []. In a lunar eclipse, [] is in the middle and its shadow falls on the [].',
        answers: ['Moon', 'Earth', 'Earth', 'Moon'], bank: ['Moon', 'Moon', 'Earth', 'Earth', 'Sun'],
        instr: 'Drag or tap a word into each gap, then press <b>Check</b>.', backVis: `<div class="pair">${lineup({ type: 'new', shadow: 'solar' })}${lineup({ type: 'full', shadow: 'lunar' })}</div>`,
        ansHTML: '<p class="actext">In a solar eclipse, the <b>Moon</b> is in the middle and its shadow falls on <b>Earth</b>. In a lunar eclipse, <b>Earth</b> is in the middle and its shadow falls on the <b>Moon</b>.</p>' }),
    C('sc9-angle-and-intensity', 'SC9', 'Angle and intensity', 'Complete the sentence about sunlight.', [], 'Low-angle light spreads the same energy over a bigger patch of ground, so each part gets less energy.', { kind: 'cloze',
        text: 'When sunlight hits the ground at a [] angle, the same energy is spread over a [] area, so the light intensity is [].',
        answers: ['low', 'larger', 'lower'], bank: ['low', 'high', 'larger', 'smaller', 'lower', 'higher'],
        instr: 'Drag or tap a word into each gap, then press <b>Check</b>.', backVis: `<div class="pair">${beam(80)}${beam(20)}</div>`,
        ansHTML: '<p class="actext">When sunlight hits the ground at a <b>low</b> angle, the same energy is spread over a <b>larger</b> area, so the light intensity is <b>lower</b>.</p>' }),
    C('sc12-next-place-into-night', 'SC12', 'Next place into night', 'Watch the model of Earth spin. Which place will move into night first?', ['Place 1', 'Place 2', 'Place 3', 'Place 4'], 'Seen from above the South Pole, Earth spins clockwise, from west to east. This carries place 4 out of the lit half first. The same spin makes the Sun appear to move from east to west across our sky.', { scene: 'spin', vis: spinSVG(), ordered: true, ans: 3 }),
    C('sc12-spin-earth-west-to-east', 'SC12', 'Spin Earth west to east', 'Earth spins from west to east. Spin the model the same way until Brisbane reaches sunrise.', [], 'Earth turns towards the east, so Brisbane is carried out of the night and into the Sun’s light. That is why the Sun always appears to rise in the east and set in the west.', { kind: 'spindrag',
        instr: 'Drag the globe sideways, or hold an arrow button, to spin Earth.', ansHTML: '<div class="ans">Spin it towards the east, from west to east</div>', backVis: spinBack() }),
    /* additional cards (October 2026) */
    C('sc1-which-mnemonic-fails', 'SC1', 'Which mnemonic fails?', 'Students wrote new mnemonics for the planets. Which one would give the wrong order?', ['My Very Excellent Mum Served Jam Under Napkins', 'Many Vets Eat Mangoes Just Sitting Under Nets', 'My Very Easy Method Just Speeds Up Naming', 'Mean Velociraptors Eat Many Juicy Sausages Until Noon'], 'The first letters must follow M, V, E, M, J, S, U, N. In this one “Served” comes before “Jam”, which would put Saturn before Jupiter.'),
    C('sc1-two-m-planets', 'SC1', 'Two M planets', 'Mercury and Mars both start with M. How does a mnemonic stop you mixing them up?', ['The position of each word gives the order, so the first M is Mercury and the second M is Mars', 'Mercury is always the shorter word', 'You use a capital M for Mars only', 'It does not. You have to remember them separately'], 'A mnemonic works because of the order of its words. The 1st word is Mercury and the 4th word is Mars, even though both start with M.'),

    C('sc2-the-flat-disc', 'SC2', 'The flat disc', 'All eight planets orbit the Sun in the same direction, in roughly the same flat plane. What does this suggest about how they formed?', ['They formed from the same spinning, flattened disc of gas and dust', 'They were captured one at a time from other stars', 'Gravity pushed them into line after they formed', 'They broke off the Sun at different times'], 'As gravity pulled the cloud inwards it spun faster and flattened into a disc. The planets formed inside that disc, so they still share its direction and plane.'),
    C('sc2-most-of-the-mass', 'SC2', 'Most of the mass', 'The Sun holds more than 99% of all the mass in the Solar System. Why did most of the material end up in the Sun?', ['Gravity pulled most of the cloud into its centre', 'The Sun swallowed most of the planets', 'Heat from the Sun melted material into it', 'The planets lost most of their mass to space'], 'Gravity pulled the collapsing cloud towards its centre. Most of the gas and dust gathered there, leaving only a small amount to form the planets.'),
    C('sc2-order-the-formation', 'SC2', 'Order the formation', 'Put the stages of the Solar System’s formation in order.', [], 'Gravity drives every stage: it pulls the cloud together, forms the Sun at the centre and clumps the leftover material into planets.', { kind: 'order',
        seq: ['cloud', 'collapse', 'sun', 'planets'], cols: 4, tileCls: 'stile', poolCls: 'pool2',
        tile: k => sTile({ cloud: 'A huge cloud of gas and dust', collapse: 'Gravity pulls the cloud inwards', sun: 'The dense centre becomes the Sun', planets: 'Leftover dust and rock clump into planets' }[k]),
        ordTop: '<span>First</span><i></i><span>Last</span>',
        instr: 'Drag or tap each stage into place, then press <b>Check</b>.',
        ansHTML: '<p class="actext">A cloud of gas and dust, then gravity pulls it inwards, then the dense centre becomes the Sun, then leftover dust and rock clump into planets.</p>' }),

    C('sc3-ball-on-a-string', 'SC3', 'Ball on a string', 'You swing a ball on a string in a circle, then let go. How is this like a planet’s orbit?', ['The string pulls inwards like gravity. Without it, the ball flies off in a straight line', 'The string pushes the ball outwards, like the Sun pushes the planets', 'The ball stops when you let go, like a planet would without gravity', 'It is not like an orbit, because planets do not move in curves'], 'Gravity acts like the string, pulling the planet towards the centre. Without that pull, the planet would carry on in a straight line.'),
    C('sc3-why-astronauts-float', 'SC3', 'Why astronauts float', 'The space station orbits about 400 km up, where Earth’s gravity is still about 90% as strong as on the ground. Why don’t the astronauts fall to Earth?', ['They are falling, but they move sideways so fast that they keep missing Earth', 'There is no gravity in space', 'The station’s engines hold it up all the time', 'The air at that height holds the station up'], 'Gravity is still strong there. The station and astronauts fall together around Earth, which is why they float inside it.'),

    C('sc4-is-a-comet-a-satellite', 'SC4', 'Is a comet a satellite?', 'A comet travels around the Sun in a long, stretched orbit. Is it a satellite?', ['Yes. It orbits a larger object, so it is a natural satellite of the Sun', 'No. Its orbit is not a circle', 'No. Only objects that orbit planets are satellites', 'Yes. It is an artificial satellite'], 'A satellite is any object that orbits a larger object. The shape of the orbit does not matter.'),
    C('sc4-passing-the-moon', 'SC4', 'Passing the Moon', 'A space probe flies past the Moon on its way to Mars. Is it a satellite of the Moon?', ['No. It is passing by, not orbiting the Moon', 'Yes. Anything near the Moon is its satellite', 'Yes. All spacecraft are satellites', 'No. The Moon is too small to have satellites'], 'Being close to an object is not enough. To be a satellite, the probe would have to go around and around the Moon in an orbit.'),
    C('sc4-satellite-or-not', 'SC4', 'Satellite or not', 'Is each object a satellite? Sort them.', [], 'A satellite orbits a larger object. Objects that are passing by, flying in the air or falling to the ground are not orbiting anything.', { kind: 'sort',
        bins: [['Satellite', 'Orbits a larger object'], ['Not a satellite', 'Is not in orbit']], tileCls: 'stile', poolCls: 'pool2',
        items: [['The Moon', 0], ['Earth', 0], ['Halley’s Comet', 0], ['A weather satellite', 0], ['A plane over Sydney', 1], ['A rocket on the launch pad', 1], ['A probe flying past Jupiter', 1], ['A meteor burning up', 1]].map(([t, k]) => [sTile(t), k]),
        instr: 'Drag each object into a group, or tap an object then a group. Press <b>Check</b>.',
        ansHTML: '<p class="actext"><b>Satellite:</b> the Moon, Earth, Halley’s Comet, a weather satellite.<br><b>Not a satellite:</b> a plane, a rocket on the pad, a probe flying past Jupiter, a meteor.</p>' }),

    C('sc5-scaling-the-sun', 'SC5', 'Scaling the Sun', 'In a model, 1 cm stands for 1000 km. The Sun is about 1\u00a0400\u00a0000 km wide. How wide should the model Sun be?', ['1400 cm, which is 14 m', '140 cm, which is 1.4 m', '14 cm', '1.4 cm'], '1\u00a0400\u00a0000 km ÷ 1000 km per cm = 1400 cm. There are 100 cm in a metre, so that is 14 m, far too big for a classroom.', { calc: true }),
    C('sc5-finding-the-scale', 'SC5', 'Finding the scale', 'Students use a 3.5 cm ball for the Moon, which is really about 3500 km wide. What scale are they using?', ['1 cm = 1000 km', '1 cm = 100 km', '1 cm = 3500 km', '1 cm = 10\u00a0000 km'], '3500 km ÷ 3.5 cm = 1000 km per cm. Every centimetre in the model stands for 1000 km in space.', { calc: true }),
    C('sc5-placing-neptune', 'SC5', 'Placing Neptune', 'Neptune is about 30 AU from the Sun. In the playground model, 1 AU = 10 m. How far from the model Sun should Neptune go?', ['300 m', '30 m', '3 m', '3000 m'], '30 AU × 10 m per AU = 300 m. That is further than most school grounds, which shows how spread out the Solar System is.', { calc: true }),

    C('sc6-glued-in-place', 'SC6', 'Glued in place', 'A model has the planets glued onto sticks around a foam Sun. What is one limitation of this model?', ['It cannot show the planets orbiting and changing position', 'It has the wrong number of planets', 'It leaves out the Sun', 'It shows the planets moving too fast'], 'Real planets are always moving along their orbits. A fixed model shows just one moment and hides that movement.'),
    C('sc6-why-use-models', 'SC6', 'Why use models?', 'If every model of the Solar System has limitations, why do scientists still use them?', ['They help us understand and predict things too big or far away to study directly', 'They are exact copies of the Solar System', 'They are only used for decoration', 'Scientists do not use models'], 'A model is a simpler version of something real. Each one shows some features well and others badly, so scientists choose the model that suits the question.'),
    C('sc6-planets-in-a-line', 'SC6', 'Planets in a line', 'Most diagrams show all eight planets in a straight line from the Sun. What is misleading about this?', ['The planets are spread around their orbits and are almost never lined up', 'The planets are actually in a different order', 'The planets really do sit in a straight line', 'The diagram should show the planets in a circle around Earth'], 'Each planet travels around the Sun at its own speed, so at any moment they are scattered around their orbits.'),

    C('sc7-why-divide', 'SC7', 'Why divide?', 'To find your age on another planet, you divide your age by the length of that planet’s year. Why?', ['You are working out how many of that planet’s years fit into your age', 'Dividing always gives a smaller, neater number', 'Other planets spin more slowly', 'You multiply for planets further from the Sun'], 'Your age on Earth counts Earth years. Dividing by a planet’s year length tells you how many times that planet has gone around the Sun in the same time.'),
    C('sc7-age-on-venus', 'SC7', 'Age on Venus', 'A Venus year is about 0.62 Earth years. How old is a 13-year-old in Venus years, to the nearest year?', ['21', '20', '8', '13'], '13 ÷ 0.62 = 20.97, which rounds up to 21. Rounding to the nearest year means 20.97 is closer to 21 than to 20.', { calc: true }),
    C('sc7-age-on-saturn-in-months', 'SC7', 'Age on Saturn in months', 'A Saturn year is about 29.4 Earth years. How old is a 12-year-old in Saturn years, to the nearest month?', ['5 months', '4 months', '2 years and 5 months', '353 years'], '12 ÷ 29.4 = 0.41 of a Saturn year. 0.41 × 12 months = 4.9, which rounds to 5 months.', { calc: true }),
    C('sc7-bigger-or-smaller-age', 'SC7', 'Bigger or smaller age', 'Would your age be a bigger or smaller number on each planet? Sort them.', [], 'Planets closer to the Sun than Earth have shorter years, so you have had more of them. Planets further out have longer years, so you have had fewer.', { kind: 'sort',
        bins: [['Bigger number', 'Year shorter than Earth’s'], ['Smaller number', 'Year longer than Earth’s']], tileCls: 'stile', poolCls: 'pool2',
        items: [['Mercury', 0], ['Venus', 0], ['Mars', 1], ['Jupiter', 1], ['Saturn', 1], ['Neptune', 1]].map(([t, k]) => [sTile(t), k]),
        instr: 'Drag each planet into a group, or tap a planet then a group. Press <b>Check</b>.',
        ansHTML: '<p class="actext"><b>Bigger number:</b> Mercury, Venus.<br><b>Smaller number:</b> Mars, Jupiter, Saturn, Neptune.</p>' }),

    C('sc8-packing-for-canada', 'SC8', 'Packing for Canada', 'In January, Priya flies from Brisbane to Canada, in the northern hemisphere. What should she pack?', ['Warm clothes, because Canada is having winter', 'Summer clothes, because it is summer everywhere in January', 'Summer clothes, because Canada is closer to the Sun', 'Raincoats only, because January is the wet season everywhere'], 'In January the southern hemisphere leans towards the Sun and the northern hemisphere leans away, so Canada is having winter.'),
    C('sc8-seasons-near-the-equator', 'SC8', 'Seasons near the equator', 'Singapore is very close to the equator. Why does it have almost no difference between summer and winter?', ['The Sun stays high and day length stays close to 12 hours all year', 'It is always closest to the Sun', 'Earth’s tilt does not reach the equator', 'It is in both hemispheres at once'], 'As Earth orbits, the equator never leans much towards or away from the Sun. Its light angle and day length barely change, so its seasons are hardly different.'),

    C('sc9-torch-on-paper', 'SC9', 'Torch on paper', 'You shine a torch straight down onto paper, then tilt the torch to a low angle. What happens to the patch of light?', ['It gets bigger and dimmer', 'It gets smaller and brighter', 'It stays the same size but gets brighter', 'It stays exactly the same'], 'The same light is spread over a bigger area, so each part of the paper gets less light. This is just like sunlight at a low angle.'),
    C('sc9-solar-panels', 'SC9', 'Solar panels', 'Solar panels in Brisbane are usually tilted to face north. Why?', ['The Sun is in the northern part of our sky, so the light hits them more directly', 'North is the coldest direction', 'Panels only work when they face the equator at night', 'It stops rain from landing on them'], 'From Brisbane the Sun crosses the northern sky. Tilting panels towards it makes the light strike more squarely, giving higher light intensity and more electricity.'),
    C('sc9-cold-poles', 'SC9', 'Cold poles', 'Why are the polar regions much colder than the equator?', ['Sunlight hits them at a low angle, so it spreads over a larger area', 'They are much further from the Sun', 'They never get any sunlight', 'The ice there reflects all of the Sun’s heat'], 'Near the poles the Sun stays low, so its energy is spread thinly. The difference in distance to the Sun is tiny compared with the effect of the angle.'),

    C('sc10-closest-in-january', 'SC10', 'Closest in January', 'Earth is closest to the Sun in early January. Why isn’t it summer for the whole world then?', ['Seasons are caused by the tilt, not distance, so the north is having winter', 'Earth is not really closer in January', 'It is summer for the whole world in January', 'Being closer makes Earth colder'], 'Earth’s distance from the Sun changes only a little. The tilt decides which hemisphere gets direct light and long days, so the north has winter in January.'),
    C('sc10-a-bigger-tilt', 'SC10', 'A bigger tilt', 'Imagine Earth’s axis was tilted much more than it is now. How would the seasons change?', ['Summers would be hotter and winters would be colder', 'There would be no seasons', 'The seasons would stay exactly the same', 'Every season would become summer'], 'A bigger tilt would make each hemisphere lean further towards and away from the Sun. The changes in light angle and day length would be bigger, so the seasons would be more extreme.'),
    C('sc10-two-effects-of-the-tilt', 'SC10', 'Two effects of the tilt', 'Complete the explanation of how the tilt causes summer.', [], 'The tilt gives a hemisphere two things in summer: more direct sunlight and longer days.', { kind: 'cloze',
        text: 'When a hemisphere tilts towards the Sun, sunlight hits it at a [] angle and its days are []. It has [].',
        answers: ['higher', 'longer', 'summer'], bank: ['higher', 'lower', 'longer', 'shorter', 'summer', 'winter'],
        instr: 'Drag or tap a word into each gap, then press <b>Check</b>.', backVis: earthSide({ tilt: 'dec' }),
        ansHTML: '<p class="actext">When a hemisphere tilts towards the Sun, sunlight hits it at a <b>higher</b> angle and its days are <b>longer</b>. It has <b>summer</b>.</p>' }),

    C('sc11-describing-sunrise', 'SC11', 'Describing sunrise', 'We say the Sun “rises”. Which description is scientifically accurate?', ['Earth turns towards the Sun, so the Sun appears above the eastern horizon', 'The Sun climbs up from behind Earth', 'The Sun orbits Earth and comes back each morning', 'The Sun gets brighter at dawn'], 'The Sun does not move up. Earth’s spin carries your horizon down past the Sun, so it looks like the Sun is rising.'),
    C('sc11-perth-or-brisbane', 'SC11', 'Perth or Brisbane', 'Perth is about 3600 km west of Brisbane. Which city sees sunrise first?', ['Brisbane, because Earth spins towards the east', 'Perth, because it is further west', 'Both at the same time', 'It changes every day'], 'Earth spins from west to east, so places further east turn into the Sun’s light first. Perth sees sunrise about two to three hours after Brisbane.'),

    C('sc12-night-in-london', 'SC12', 'Night in London', 'It is midday in Brisbane. Why is it night in London at the same moment?', ['London is on the half of Earth facing away from the Sun', 'The Sun is shining on the other side of the Moon', 'London is further from the Sun', 'London has night during the Australian summer'], 'Only one half of Earth faces the Sun at a time. London is almost on the opposite side of Earth from Brisbane, so it is in the dark half.'),
    C('sc12-if-earth-stopped-spinning', 'SC12', 'If Earth stopped spinning', 'Imagine Earth stopped rotating but kept orbiting the Sun. What would happen to day and night?', ['Each place would have about six months of day, then six months of night', 'Nothing would change', 'It would be night everywhere forever', 'It would be day everywhere forever'], 'Day and night come from rotation. Without it, the side facing the Sun would only change slowly as Earth moved around its orbit over a year.'),

    C('sc13-longest-summer-day', 'SC13', 'Longest summer day', 'It is December. Which of these Australian cities has the most daylight hours?', ['Hobart', 'Darwin', 'Brisbane', 'They all get exactly 12 hours'], 'In summer, places further from the equator have longer days. Hobart is the furthest south, so it has the longest days in December and the shortest in June.'),
    C('sc13-moving-away-from-the-equator', 'SC13', 'Moving away from the equator', 'As you move further from the equator, what happens to the difference between summer and winter day lengths?', ['It gets bigger', 'It gets smaller', 'It stays the same', 'It disappears'], 'At the equator days stay close to 12 hours. Further towards the poles, summer days get longer and winter days get shorter, until there is 24-hour daylight or darkness.'),
    C('sc13-the-equinox', 'SC13', 'The equinox', 'Around 20 March and 23 September, Earth’s tilt points neither towards nor away from the Sun. How much daylight do Brisbane and Hobart get?', ['About 12 hours each', 'Brisbane gets more', 'Hobart gets more', 'Neither gets any'], 'At an equinox the day and night halves split every line of latitude evenly. Almost every place on Earth gets about 12 hours of daylight.'),

    C('sc14-summer-sunrise-and-sunset', 'SC14', 'Summer sunrise and sunset', 'Compared with winter, when does the Sun rise and set in Brisbane in summer?', ['It rises earlier and sets later', 'It rises later and sets earlier', 'It rises and sets at the same times', 'It rises earlier and sets earlier'], 'In summer Brisbane spends more of each spin in the lit half. The Sun rises earlier and sets later, giving more hours of daylight.'),
    C('sc14-shortest-day-in-june', 'SC14', 'Shortest day in June', 'Around 21 June, Brisbane has its shortest day of the year. Why?', ['The southern hemisphere tilts furthest away from the Sun', 'Earth spins faster in June', 'The Sun gives off less light in June', 'The Moon blocks some sunlight in June'], 'At the June solstice the south leans furthest away from the Sun. Less of Brisbane’s path is in the light, so its day is the shortest.'),
    C('sc14-explain-long-days', 'SC14', 'Explain long days', 'Complete the explanation of long summer days.', [], 'In summer the southern hemisphere leans towards the Sun, so places like Brisbane spend more of each 24-hour spin in the light.', { kind: 'cloze',
        text: 'In summer, the southern hemisphere tilts [] the Sun. More of Brisbane’s path as Earth spins is in the [], so Brisbane gets [] hours of daylight.',
        answers: ['towards', 'light', 'more'], bank: ['towards', 'away from', 'light', 'dark', 'more', 'fewer'],
        instr: 'Drag or tap a word into each gap, then press <b>Check</b>.', backVis: earthSide({ tilt: 'dec', lat: true, bris: 'day' }),
        ansHTML: '<p class="actext">In summer, the southern hemisphere tilts <b>towards</b> the Sun. More of Brisbane’s path as Earth spins is in the <b>light</b>, so Brisbane gets <b>more</b> hours of daylight.</p>' }),

    C('sc15-after-the-longest-day', 'SC15', 'After the longest day', 'Brisbane’s longest day is in December, but January and February are often hotter. Why?', ['The land and ocean keep gaining heat for weeks after the longest day', 'Earth is closest to the Sun in February', 'The Sun gets hotter in February', 'Days keep getting longer until February'], 'Days are still long in January and February, so the land and ocean keep gaining more heat than they lose. Temperatures keep climbing until the shorter days finally tip the balance.'),
    C('sc15-hottest-time-of-day', 'SC15', 'Hottest time of day', 'The Sun is highest around midday, but the hottest part of the day is usually mid-afternoon. Why?', ['The ground keeps gaining more heat than it loses until mid-afternoon', 'The Sun is closer to Earth in the afternoon', 'The Sun shines brighter after midday', 'Clouds always clear in the afternoon'], 'After midday the sunlight is still strong. The ground keeps building up heat until the Sun gets low enough that it starts losing heat faster than it gains it.'),
    C('sc15-winter-in-hobart', 'SC15', 'Winter in Hobart', 'Hobart has fewer daylight hours than Brisbane in winter. What would you predict about Hobart’s winter temperatures?', ['Colder, because it has less time to warm up and a longer night to cool down', 'Warmer, because it is closer to Antarctica', 'The same, because both cities are in Australia', 'Warmer, because short days trap heat'], 'Fewer daylight hours means less time for the Sun to heat the ground and air, and a longer night for heat to escape. Hobart’s winters are much colder than Brisbane’s.'),

    C('sc16-a-right-angle-moon', 'SC16', 'A right-angle Moon', 'The Moon is at right angles to the Sun, as seen from Earth. What would we see?', ['A quarter moon, with half of its face lit', 'A full moon', 'A new moon', 'A thin crescent moon'], 'From the side, we see half of the Moon’s sunlit half. That makes half of the face we see lit, which is a first or last quarter Moon.', { vis: lineup({ type: 'q1' }) }),
    C('sc16-full-moon-rising', 'SC16', 'Full moon rising', 'A full moon rises in the east at about the same time as the Sun sets in the west. Why?', ['The full moon is on the opposite side of Earth from the Sun', 'The Moon follows the Sun around the sky', 'The Moon only shines after the Sun sets', 'The Sun pushes the Moon up as it sets'], 'At full moon, Earth is between the Sun and the Moon. As your part of Earth turns away from the Sun, it turns towards the Moon.'),
    C('sc16-spot-the-waning-crescent', 'SC16', 'Spot the waning crescent', 'Seen from Brisbane, which picture shows a waning crescent Moon?', [moonPic(.875), moonPic(.125), moonPic(.625), moonPic(.75)], 'In the southern hemisphere a waning Moon is lit on the right. Crescent means less than half of it is lit.', { pic: true }),

/* IDs of cards that have been deleted. Keep them here (and in RELEASED_IDS) so they are never reused. */
const RETIRED_IDS = [];
/* Only if an ID ever has to change: 'old-id': 'new-id'. Earned buckles are moved across once, never doubled. */
const ID_ALIASES = {};
const Buckles = {
    key: 'buckles-shared',
    ns(id) { return PAGE_ID + ':' + id; },
    load() { try { const d = JSON.parse(localStorage.getItem(this.key)); return d && typeof d === 'object' && !Array.isArray(d) ? d : {}; } catch (e) { return {}; } },
    save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) {} },
    isDone(id) { return !!this.load()[this.ns(id)]; },
    award(id, n) { const d = this.load(); const k = this.ns(id); if (!d[k]) { d[k] = n; this.save(d); } },
    total() { return Object.values(this.load()).reduce((a, b) => a + (Number(b) || 0), 0); },
    /* moves buckles saved under an old ID to its new ID, so a renamed card is never earned twice */
    migrate() {
        const d = this.load(); let changed = false;
        Object.entries(ID_ALIASES).forEach(([from, to]) => {
            const kf = this.ns(from), kt = this.ns(to);
            if (d[kf] !== undefined) { if (d[kt] === undefined) d[kt] = d[kf]; delete d[kf]; changed = true; }
        });
        if (changed) this.save(d);
    }
};
Buckles.migrate();
const BK = '<img src="buckle.svg" alt="" onerror="this.style.display=\'none\'">';
const earnedIn = list => list.filter(c => Buckles.isDone(c.id)).length;

function celebrate(n) {
    const a = $('#award');
    $('#awardText').textContent = '+' + n + ' Buckle' + (n > 1 ? 's' : '') + '!';
    a.classList.remove('hide'); a.classList.add('show');
    burstConfetti();

}
function burstConfetti() {
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const colors = ['#ea008a', '#1b1f45', '#f7a8d4', '#c3c6d0'], cx = innerWidth / 2, cy = innerHeight / 2, parts = [];
    for (let i = 0; i < 150; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 4 + Math.random() * 10;
        parts.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 4, size: 5 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)], rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * .3, life: 0 });
    }
    const gravity = 0.22, drag = 0.992; let frame = 0;
    (function tick() {
        frame++;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        parts.forEach(p => {
            p.vx *= drag; p.vy = p.vy * drag + gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, 1 - p.life / 95);
            ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); ctx.restore();
        });
        if (frame < 95) requestAnimationFrame(tick); else canvas.remove();
    })();
}

    const ag = el('button', 'btn2', 'Play these cards again'); ag.onclick = () => start(S.all, S.label); left.appendChild(ag);
    const hm = el('button', 'btn2', 'Choose another deck'); hm.onclick = home; left.appendChild(hm);

    const scs = [...new Set(res.map(r => r.c.sc))].sort((a, b) => scNum(a) - scNum(b));
    const compact = scs.length > 8;
    const right = el('div', 'rright');
    right.innerHTML = `<div class="rhead"><span>Your cards by success criterion</span><i><span class="chip y">${TICK}Correct</span><span class="chip n">${CROSS}Revise</span></i></div>`;
    const list = el('div', 'rlist' + (compact ? ' three' : scs.length > 4 ? ' two' : ''));
    const blocks = scs.map(sc => {
        const rs = res.filter(r => r.c.sc === sc).sort((a, b) => b.ok - a.ok), k = rs.filter(r => r.ok).length, f = k / rs.length;
        const tag = f === 1 ? '<span class="tag sec">Secure</span>' : f >= .5 ? '<span class="tag near">Nearly</span>' : '<span class="tag rev">Revise</span>';
        const chips = rs.map(r => compact && r.ok ? `<span class="chip y dot" title="${r.c.label}">${TICK}</span>` : `<span class="chip ${r.ok ? 'y' : 'n'}">${r.ok ? TICK : CROSS}${r.c.label}</span>`).join('');
        const b = el('div', 'rblock', `<div class="rbh"><span class="rsc">${sc}</span>${tag}<b>${k} / ${rs.length}</b></div>${compact ? '' : `<div class="rtx">${SCT[sc]}</div>`}<div class="chips">${chips}</div>`);
        list.appendChild(b); return b;
    });
    right.appendChild(list);
    wrap.append(left, right); content.appendChild(wrap);
    let rsz = 1;
    while (list.scrollHeight > list.clientHeight + 1 && rsz > .62) { rsz -= .03; list.style.setProperty('--rs', rsz.toFixed(2)); }
    blocks.forEach((b, i) => A(b, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 250 + i * 60, fill: 'backwards' }));
    say('Take a screenshot of this screen and paste it into Stile as evidence of your work.');
    const ring = left.querySelector('.rg'), frac = N ? n / N : 0;
    A(ring, [{ strokeDashoffset: C2 }, { strokeDashoffset: C2 * (1 - frac) }], { duration: 1300, delay: 200, easing: 'cubic-bezier(.3,.7,.2,1)' });
    const rn = left.querySelector('#rn'), t0 = performance.now() + 200, tok = S.tok;
    const tick = t => { if (!S || S.tok !== tok || screen !== 'results') return; const k = Math.max(0, Math.min(1, (t - t0) / 1300)); rn.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); else if (frac >= .8) ringCelebrate(); };
    requestAnimationFrame(tick);
    tone([[523, .1], [659, .1], [784, .1], [1047, .3]]);
}
function ringCelebrate() {
    const r = local(document.querySelector('.ringw').getBoundingClientRect());
    burst(r.x + r.w / 2, r.y + r.h / 2, 40, 200);
}

/* keyboard */
document.addEventListener('keydown', e => {
    if (screen !== 'play' || !S) return;
    const k = '1234'.indexOf(e.key) >= 0 ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase());
    if (k >= 0 && !S.locked && e.key.length === 1) { e.preventDefault(); choose(k); }
});

/* ---------- scale to window ---------- */
function fit() {
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.transform = `scale(${scaleK})`;
    stage.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
/* ---------- data check: runs on every load and reports problems before students find them ---------- */
function validateCards() {
    const err = [], warn = [], seen = new Map(), labels = new Set(), idRx = /^[a-z0-9]+(-[a-z0-9]+)*$/;
    const released = new Set(RELEASED_IDS), retired = new Set(RETIRED_IDS);
    CARDS.forEach((c, i) => {
        const at = `Card ${i + 1} (${c.id || 'no id'})`;
        if (typeof c.id !== 'string' || !idRx.test(c.id)) err.push(`${at}: the ID must use lowercase letters, numbers and hyphens only.`);
        if (seen.has(c.id)) err.push(`${at}: duplicate ID, also used by card ${seen.get(c.id) + 1}. Both would share one buckle.`); else seen.set(c.id, i);
        if (retired.has(c.id)) err.push(`${at}: this ID was retired and must not be reused. Choose a new ID.`);
        if (!released.has(c.id)) warn.push(`${at}: new ID. Add '${c.id}' to RELEASED_IDS when you publish this card.`);
        if (!SCT[c.sc] || !LGOF[c.sc]) err.push(`${at}: ${c.sc} is not listed in SCT and LGS.`);
        if (!c.label || !c.q || !c.exp) err.push(`${at}: label, question and explanation are all required.`);
        const lk = c.sc + '|' + c.label; if (labels.has(lk)) warn.push(`${at}: another ${c.sc} card has the label "${c.label}", which makes the results screen confusing.`); labels.add(lk);
        if (c.scene && (!SCENE[c.scene] || !c.vis)) err.push(`${at}: scene "${c.scene}" needs a matching SCENE entry and a vis.`);
        if (c.kind) {
            if (!KIND[c.kind]) { err.push(`${at}: unknown kind "${c.kind}".`); return; }
            if (!c.instr) warn.push(`${at}: add an instr line so students know what to do.`);
            if (c.kind === 'order' && (!Array.isArray(c.seq) || c.seq.length < 2 || typeof c.tile !== 'function')) err.push(`${at}: order cards need seq (2 or more) and a tile function.`);
            if (c.kind === 'sort' && (!Array.isArray(c.bins) || c.bins.length !== 2 || !Array.isArray(c.items) || c.items.some(it => !(it[1] === 0 || it[1] === 1)))) err.push(`${at}: sort cards need 2 bins and items tagged 0 or 1.`);
            if (c.kind === 'cloze') {
                const gaps = (c.text.match(/\[\]/g) || []).length, bank = (c.bank || []).slice();
                if (gaps !== (c.answers || []).length) err.push(`${at}: the text has ${gaps} gaps but ${(c.answers || []).length} answers.`);
                (c.answers || []).forEach(a => { const k = bank.indexOf(a); if (k < 0) err.push(`${at}: the answer "${a}" is missing from the word bank.`); else bank.splice(k, 1); });
            }
            if (c.kind === 'hotspot' && (!c.hsSVG || !Array.isArray(c.correct) || !c.correct.length)) err.push(`${at}: hotspot cards need hsSVG and a correct list.`);
        } else {
            if (!Array.isArray(c.opts) || c.opts.length !== 4) err.push(`${at}: multiple choice cards need exactly 4 options.`);
            if (!Number.isInteger(c.ans) || c.ans < 0 || c.ans > 3) err.push(`${at}: ans must be 0, 1, 2 or 3.`);
        }
    });
    RELEASED_IDS.forEach(id => { if (!seen.has(id) && !retired.has(id) && !ID_ALIASES[id]) err.push(`Released ID '${id}' is missing. If the card was deleted, add it to RETIRED_IDS. If it was renamed, restore the old ID or add an ID_ALIASES entry.`); });
    Object.entries(ID_ALIASES).forEach(([a, b]) => { if (!seen.has(b)) err.push(`ID_ALIASES points '${a}' to '${b}', but no card has the ID '${b}'.`); });
    if (err.length || warn.length) {
        console.group(`Card data check: ${err.length} problem${err.length === 1 ? '' : 's'}, ${warn.length} reminder${warn.length === 1 ? '' : 's'}`);
        err.forEach(m => console.error(m)); warn.forEach(m => console.warn(m)); console.groupEnd();
        const b = el('button', 'devcheck' + (err.length ? ' bad' : ''), `Card data check: ${err.length ? `${err.length} problem${err.length === 1 ? '' : 's'}` : `${warn.length} reminder${warn.length === 1 ? '' : 's'}`}. Open the browser console for details.`);
        b.title = 'Click to hide'; b.onclick = () => b.remove(); stage.appendChild(b);
    }
    return { err, warn };
}
window.addEventListener('storage', e => { if (e.key === 'buckles-shared') refreshCount(); });
refreshCount();
validateCards();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); refreshCount(); home(); });
</script>
