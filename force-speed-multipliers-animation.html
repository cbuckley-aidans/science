<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force and Speed Multipliers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b1f45'/%3E%3Cpath d='M24 13L46 27L24 41Z' fill='%23fff'/%3E%3Crect x='12' y='50' width='40' height='5' rx='2.5' fill='%23fff' fill-opacity='.25'/%3E%3Crect x='12' y='50' width='26' height='5' rx='2.5' fill='%23ea008a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --white: #ffffff;
        --off-white: #f5f5f5;
        --light-grey: #e8e8e8;
        --mid-grey: #9a9a9a;
        --blank: #f0f3f6;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif;
        margin: 0; background: #eaeaea; color: var(--navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }
    .viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .stage {
        width: 1280px; height: 720px; background: var(--white); border-top: 6px solid var(--navy);
        position: relative; padding: 0; transform-origin: center center; flex-shrink: 0; overflow: hidden;
    }
    .ui-zoomer { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; padding: 36px 64px 0 64px; transform-origin: 0 0; }
    .ui-spot { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease); }
    .ui-spot.on { opacity: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: var(--mid-grey); }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption {
        position: absolute; left: 64px; right: 64px; bottom: 30px;
        font-size: 27px; font-weight: 500; line-height: 1.35;
        display: flex; align-items: center; gap: 16px; min-height: 60px;
    }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption b { font-weight: 800; color: var(--pink); }
    .caption.in { animation: capIn .45s var(--ease); }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; }

    .hide { opacity: 0; transform: translateY(14px); }
    .rev { transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .35s, color .35s, border-color .35s; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .hint { margin-top: 22px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg basics */
    .t { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: .03em; fill: var(--navy); }
    .t.mid { text-anchor: middle; } .t.end { text-anchor: end; }
    .t.pk { fill: var(--pink); } .t.gr { fill: var(--mid-grey); } .t.wh { fill: #fff; }
    .t.sm { font-size: 19px; } .t.lg { font-size: 34px; font-weight: 900; }
    .gnd { stroke: var(--navy); stroke-width: 4; }
    .plank, .fulc, .solid { fill: var(--navy); }
    .load { fill: var(--blank); stroke: var(--navy); stroke-width: 3; }
    .fa line { stroke: var(--pink); stroke-width: 7; } .fa polygon { fill: var(--pink); }
    .fn line { stroke: var(--navy); stroke-width: 7; } .fn polygon { fill: var(--navy); }
    .ti line { stroke-width: 4; }
    .fh line { stroke: #fff; stroke-width: 13; stroke-linecap: round; } .fh polygon { fill: #fff; stroke: #fff; stroke-width: 7; stroke-linejoin: round; }
    .armR { stroke: var(--navy); stroke-width: 5; } .armE { stroke: var(--pink); stroke-width: 5; }
    .gd { stroke: #b4b8c4; stroke-width: 2; stroke-dasharray: 5 6; fill: none; }
    .ln { fill: none; stroke: var(--navy); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .mkr circle { stroke-width: 3; }
    .mkr text { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; text-anchor: middle; }
    .mF circle { fill: var(--navy); stroke: var(--navy); } .mF text { fill: #fff; }
    .mL circle { fill: #fff; stroke: var(--navy); } .mL text { fill: var(--navy); }
    .mE circle { fill: var(--pink); stroke: var(--pink); } .mE text { fill: #fff; }
    .mlead { stroke: var(--navy); stroke-width: 2; stroke-dasharray: 3 4; }
    .snap, .snap * { transition: none !important; }

    /* motion */
    .tilt, .arm { transform-box: view-box; transition: transform 1.8s var(--ease); }
    .tilt { transform: rotate(-8deg); } .tilt.go { transform: rotate(8deg); }
    .arm { transform: rotate(var(--a0)); } .go .arm { transform: rotate(var(--a1)); }
    .trace { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.8s var(--ease); }
    .trace.p { stroke: var(--pink); } .trace.n { stroke: var(--navy); }
    .go .trace { stroke-dashoffset: 0; }
    .ghost { fill: none; stroke: #b4b8c4; stroke-width: 2.5; stroke-dasharray: 6 5; opacity: 0; transition: opacity .4s; }
    .go .ghost { opacity: 1; }

    /* shared blocks */
    .dcard { border: 3px solid var(--navy); border-radius: 8px; padding: 22px 26px; }
    .dcard.pink { border-color: var(--pink); }
    .dex { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase; }
    .dcard.pink .dex { color: var(--pink); }
    .dhow { font-size: 22px; font-weight: 600; line-height: 1.3; }
    .qn { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 24px; display: flex; align-items: center; justify-content: center; }
    .qn.p { background: var(--pink); }

    /* title + SC list */
    .lgoal { margin-top: 10px; border-left: 8px solid var(--pink); padding: 4px 0 4px 22px; }
    .lgt { font-size: 30px; font-weight: 700; margin-top: 4px; }
    .sclist { display: flex; flex-direction: column; gap: 18px; width: 1020px; }
    .scrow { display: flex; align-items: center; gap: 26px; font-size: 32px; font-weight: 500; line-height: 1.3; border-bottom: 2px solid var(--light-grey); padding-bottom: 16px; }
    .scrow .code { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 36px; color: var(--pink); width: 80px; flex-shrink: 0; }
    .scrow b { font-weight: 800; }

    /* levers */
    .cpanels { display: flex; gap: 24px; }
    .cpanel { width: 368px; border: 3px solid var(--navy); border-radius: 8px; padding: 14px 18px; }
    .cpanel svg { display: block; margin: 10px auto 6px; overflow: visible; }
    .chd { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 900; text-transform: uppercase; color: var(--pink); line-height: 1; }
    .csub { font-size: 22px; font-weight: 800; margin-top: 4px; }
    .cex { font-size: 20px; font-weight: 600; color: var(--mid-grey); margin-top: 4px; }
    .keyrow { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 20px; font-size: 22px; font-weight: 600; }
    .kl { display: inline-block; width: 40px; height: 5px; vertical-align: middle; margin-right: 10px; }
    .mnem { border: 3px solid var(--pink); border-radius: 8px; padding: 6px 18px; font-family: 'Barlow Condensed', sans-serif; font-size: 25px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; }
    .mnem b { color: var(--pink); }
    .ctag { display: inline-block; margin-top: 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--pink); border-radius: 6px; padding: 3px 14px; }
    .kmk { display: inline-flex; align-items: center; gap: 8px; }
    .kmk svg { overflow: visible; }

    /* multipliers */
    .mpanels { display: flex; gap: 28px; }
    .mpanel { width: 562px; border: 3px solid var(--navy); border-radius: 8px; padding: 12px 20px 14px; cursor: pointer; }
    .mpanel.pink { border-color: var(--pink); }
    .mpanel svg { display: block; overflow: visible; margin: 2px auto 4px; }
    .mline { font-size: 21px; font-weight: 600; line-height: 1.35; }
    .mline b { color: var(--pink); font-weight: 800; }
    .mex { font-size: 19px; color: var(--mid-grey); font-weight: 700; margin-top: 2px; }
    .trade { margin-top: 14px; width: 1152px; border-left: 8px solid var(--pink); padding: 6px 0 6px 20px; font-size: 24px; font-weight: 600; }
    .trade b { color: var(--pink); font-weight: 800; }

    /* illustrations */
    .il-o { stroke: var(--navy); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
    .il-thin { fill: none; stroke: var(--navy); stroke-width: 2; stroke-linecap: round; }
    .il-metal { fill: #dfe3ec; } .il-metal2 { fill: #c9cfdc; } .il-hi { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; opacity: .85; }
    .il-wood { fill: #f1e6d4; } .il-grain { fill: none; stroke: #d8c3a2; stroke-width: 2; stroke-linecap: round; }
    .il-grip { fill: var(--pink); } .il-gripl { fill: #f7b7da; }
    .il-navy { fill: var(--navy); } .il-white { fill: #fff; }
    .il-skin { fill: #f3f0ee; } .il-water { fill: #e4ecf6; } .il-soil { fill: #e6d6bd; }
    .il-gnd { stroke: var(--navy); stroke-width: 4; stroke-linecap: round; }
    .il-arm { stroke-width: 7; stroke-linecap: round; opacity: .9; }
    .il-arm.e { stroke: var(--pink); } .il-arm.r { stroke: var(--navy); }
    .il-arm.halo { stroke: #fff; stroke-width: 13; opacity: 1; }

    /* force or speed scenario cards */
    .fsgrid { display: flex; gap: 24px; }
    .fscard { width: 368px; border: 3px solid var(--navy); border-radius: 8px; padding: 12px 18px 14px; transition: border-color .35s; }
    .fscard.f { border-color: var(--navy); } .fscard.s { border-color: var(--pink); }
    .fshd { display: flex; align-items: center; gap: 12px; }
    .fshd .chd { color: var(--navy); font-size: 30px; }
    .fscard svg { display: block; margin: 8px auto 4px; overflow: visible; }
    .fsres { min-height: 96px; }
    .fstag { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; color: #fff; background: var(--navy); border-radius: 6px; padding: 3px 14px; }
    .fstag.s { background: var(--pink); }
    .fswhy { font-size: 19px; font-weight: 600; line-height: 1.3; margin-top: 6px; }
    .fswhy b { color: var(--pink); font-weight: 800; }
    .fskey { display: flex; align-items: center; justify-content: center; gap: 34px; margin-top: 18px; font-size: 22px; font-weight: 600; }
    .fskey .fstag { font-size: 20px; padding: 2px 12px; margin-right: 8px; }
    .fskey .kl { width: 34px; }

    /* lever simulator */
    .simwrap { display: flex; gap: 24px; align-items: flex-start; }
    .simleft { width: 860px; }
    .simleft svg { display: block; overflow: visible; user-select: none; -webkit-user-select: none; }
    .sim-fulc { cursor: ew-resize; touch-action: none; }
    .sim-fulc .sim-hit { fill: transparent; }
    .sim-fulc:hover polygon { fill: #2b3170; }
    .sim-fix .sim-fulc { cursor: default; }
    .sim-fix .sim-fulc:hover polygon { fill: var(--navy); }
    .sim-trace { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 7; }
    .sim-trace.p { stroke: var(--pink); } .sim-trace.n { stroke: var(--navy); }
    .sim-ghost { fill: none; stroke: #b4b8c4; stroke-width: 2.5; stroke-dasharray: 6 5; }
    .sim-dim line { stroke-width: 4; } .sim-dim.p line { stroke: var(--pink); } .sim-dim.n line { stroke: var(--navy); }
    .sim-dl { stroke: #b4b8c4; stroke-width: 2; stroke-dasharray: 4 5; }
    .sim-dv { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .sim-dv.p { fill: var(--pink); } .sim-dv.n { fill: var(--navy); }
    .simrow { display: flex; align-items: center; gap: 18px; margin-top: 0; height: 34px; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .simrow input { flex: 1; accent-color: var(--pink); height: 28px; cursor: pointer; }
    .simpanel { width: 268px; display: flex; flex-direction: column; gap: 10px; }
    .simverd { border-radius: 8px; padding: 10px 16px 12px; background: var(--light-grey); color: var(--navy); transition: background-color .3s, color .3s; }
    .simverd.f { background: var(--navy); color: #fff; } .simverd.s { background: var(--pink); color: #fff; }
    .simverd .vt { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; text-transform: uppercase; line-height: 1.05; }
    .simverd .vs { font-size: 17px; font-weight: 600; line-height: 1.25; margin-top: 4px; }
    .simstat { border: 3px solid var(--navy); border-radius: 8px; padding: 6px 14px 8px; }
    .simstat.pink { border-color: var(--pink); }
    .simstat .lb { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mid-grey); }
    .simstat .nv { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; white-space: nowrap; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .simstat.pink .nv { color: var(--pink); }
    .simstat .nv small { font-size: 20px; color: var(--mid-grey); font-weight: 800; margin-left: 6px; }
    .simbars { display: grid; grid-template-columns: 62px 1fr 64px; align-items: center; gap: 6px 8px; margin-top: 4px; }
    .simbars span { font-size: 17px; font-weight: 700; }
    .simbars .bar { height: 16px; background: var(--light-grey); border-radius: 3px; overflow: hidden; }
    .simbars .bar i { display: block; height: 100%; width: 0; background: var(--navy); }
    .simbars .bar.p i { background: var(--pink); }
    .simbars b { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
    .simbars b.p { color: var(--pink); }
    .simbtns { display: flex; gap: 10px; }
    .simbtn { flex: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border: 3px solid var(--navy); background: #fff; color: var(--navy); border-radius: 8px; padding: 8px 0; cursor: pointer; }
    .simbtn.pri { background: var(--pink); border-color: var(--pink); color: #fff; }
    .simbtn:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
    .simconc { border-left: 8px solid var(--pink); padding: 2px 0 2px 14px; font-size: 19px; font-weight: 600; line-height: 1.3; }
    .simconc b { color: var(--pink); font-weight: 800; }

    /* contrast table */
    .ctab { display: grid; grid-template-columns: 250px 440px 440px; width: 1130px; }
    .ctab > div { padding: 11px 18px; border-bottom: 2px solid var(--light-grey); font-size: 23px; font-weight: 600; line-height: 1.25; }
    .ctab .ch { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; text-transform: uppercase; color: #fff; background: var(--navy); border-radius: 8px 8px 0 0; border-bottom: none; }
    .ctab .ch.s { background: var(--pink); }
    .ctab .ch.blank { background: none; }
    .ctab .rl { font-family: 'Barlow Condensed', sans-serif; font-size: 23px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mid-grey); display: flex; align-items: center; }
    .ctab b { font-weight: 800; color: var(--pink); }

    /* stop and jot */
    .jotwrap { display: flex; flex-direction: column; gap: 18px; width: 1060px; }
    .jprompt { font-size: 30px; font-weight: 600; line-height: 1.3; }
    .jprompt b { color: var(--pink); font-weight: 800; }
    .jwords { display: flex; gap: 12px; align-items: center; }
    .jwords span:not(.dlbl) { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border: 3px solid var(--navy); border-radius: 30px; padding: 3px 18px; }
    .starter { font-size: 27px; color: var(--mid-grey); font-weight: 600; border-bottom: 3px dashed #c3c6d0; padding-bottom: 10px; line-height: 1.4; }
    .starter b { color: var(--navy); }
    .model { border: 3px solid var(--pink); border-radius: 8px; padding: 14px 22px; font-size: 24px; font-weight: 600; line-height: 1.4; }
    .model b { color: var(--pink); font-weight: 800; }

    /* summary */
    .sum4 { display: grid; grid-template-columns: repeat(2, 560px); gap: 22px 32px; }
    .sum4 .dcard { padding: 20px 26px; display: flex; gap: 22px; align-items: flex-start; }
    .sum4 svg { flex-shrink: 0; display: block; overflow: visible; }
    .sum4 .dex { font-size: 36px; line-height: 1.05; margin-bottom: 6px; }
    .sum4 .dhow { font-size: 24px; }
    .sum4 .dhow b { color: var(--pink); font-weight: 800; }

    /* controls */
    .controls { position: relative; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 24px; padding: 12px 20px 16px; width: 100%; font-family: 'Barlow Condensed', sans-serif; }
    .grp { display: flex; align-items: center; gap: 8px; }
    .controls [hidden] { display: none !important; }
    .controls button {
        font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2;
        display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--navy); border: none; border-radius: 6px; padding: 9px 13px; cursor: pointer;
    }
    .controls button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .controls button.on { background: var(--pink); color: var(--white); }
    .controls button.ui-pri { background: var(--navy); color: var(--white); }
    .controls button.ui-fs { background: var(--pink); color: var(--white); }
    .controls button.ui-fs.ui-isfs { background: var(--white); color: var(--navy); }
    .controls button.ui-fs.ui-nudge { animation: nudge 1.6s ease-out 1s 4; }
    @keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(234,0,138,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(234,0,138,0); } }
    .controls svg.ui-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .controls svg.ui-chev { width: 13px; height: 13px; stroke-width: 3; opacity: .6; transition: transform .2s var(--ease); }
    .ui-menu.ui-open > .ui-mt svg.ui-chev { transform: rotate(180deg); }
    .ui-mt .ui-pdot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px var(--white); }
    .controls .dots { display: flex; gap: 8px; margin: 0 8px 0 12px; }
    .controls .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #c9ccd6; }
    .controls .dots button.cur { background: var(--pink); }
    .steplbl { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); margin-left: 6px; min-width: 110px; }
    .controls kbd { margin-left: 2px; }

    /* menus */
    .ui-menu { position: relative; }
    .ui-pop { display: none; position: absolute; left: 0; bottom: calc(100% + 10px); min-width: 260px; flex-direction: column; gap: 2px; padding: 4px 8px 8px;
        background: var(--white); border-top: 6px solid var(--navy); border-radius: 10px; box-shadow: 0 10px 30px rgba(27,31,69,.25), 0 0 0 1px rgba(27,31,69,.08); }
    .ui-menu.ui-r .ui-pop { left: auto; right: 0; }
    .ui-menu.ui-open .ui-pop { display: flex; animation: popIn .18s var(--ease); }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .ui-ph { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 10px 6px; }
    .ui-pop .ui-mi { width: 100%; padding: 9px 10px; background: transparent; white-space: nowrap; }
    .ui-pop .ui-mi:hover { background: var(--off-white); }
    .ui-pop .ui-mi kbd { margin-left: auto; padding-left: 5px; }

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), caption = $('#caption'), titleEl = $('#title'), counter = $('#counter'), progress = $('#progress');
let timers = [], events = [], beats = [], idx = 0, beat = 0, autoplay = false;
let segFrom = 0, segTo = 0, segStart = 0;
let ptimers = [], cleanups = [];
const stage = document.getElementById('stage');

function at(ms, fn) { events.push({ t: ms, fn, done: false }); }
function beatAt(ms, html) { beats.push(ms); at(ms, () => say(html)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function show(e) { e.classList.remove('hide'); }
function say(html) { caption.innerHTML = '<span>' + html + '</span>'; caption.classList.remove('in'); void caption.offsetWidth; caption.classList.add('in'); }
function stopInteractive() { ptimers.forEach(clearTimeout); ptimers = []; cleanups.forEach(f => f()); cleanups = []; }

/* ---------- deck helpers ---------- */
const deg = a => a * Math.PI / 180;
const f1 = n => String(Math.round(n * 10) / 10);
const svgBox = (w, h, inner, cls = '') => el('div', cls, `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${inner}</svg>`);
const tx = (x, y, s, cls = '') => `<text class="t ${cls}" x="${f1(x)}" y="${f1(y)}">${s}</text>`;
const mark = (x, y, t) => `<g class="mkr m${t}"><circle cx="${f1(x)}" cy="${f1(y)}" r="17"/><text x="${f1(x)}" y="${f1(y + 7)}">${t}</text></g>`;
/* marker with a dotted leader back to the point it labels */
const markAt = (x, y, t, ax, ay) => `<line class="mlead" x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(x)}" y2="${f1(y)}"/><circle cx="${f1(ax)}" cy="${f1(ay)}" r="4" class="${t === 'E' ? 'il-grip' : 'il-navy'}"/>${mark(x, y, t)}`;
const q1 = (r, s) => r.querySelector(s), qa = (r, s) => [...r.querySelectorAll(s)];
function arrow(x1, y1, x2, y2, cls = 'fa', hw = 12) {
    const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1), hl = Math.min(hw * 1.6, L * 0.6);
    const bx = x2 - Math.cos(a) * hl, by = y2 - Math.sin(a) * hl, px = Math.sin(a) * hw, py = -Math.cos(a) * hw;
    return `<g class="${cls}"><line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(bx + Math.cos(a))}" y2="${f1(by + Math.sin(a))}"/><polygon points="${f1(x2)},${f1(y2)} ${f1(bx + px)},${f1(by + py)} ${f1(bx - px)},${f1(by - py)}"/></g>`;
}
/* arrow with a white halo, for drawing over coloured shapes */
const arrowH = (x1, y1, x2, y2, hw = 9) => arrow(x1, y1, x2, y2, 'fh', hw) + arrow(x1, y1, x2, y2, 'fa', hw);
/* arrow of length len ending at (x, y), arriving from direction angle a (degrees) */
const arrowTo = (x, y, a, len, cls = 'fa', hw = 10) => arrow(x - Math.cos(deg(a)) * len, y - Math.sin(deg(a)) * len, x, y, cls, hw);
function replayable(p) {
    p.addEventListener('click', () => {
        p.classList.add('snap'); p.classList.remove('go'); void p.offsetWidth;
        p.classList.remove('snap');
        requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('go')));
    });
}
/* tapered bar from (x1, y1) width w1 to (x2, y2) width w2 */
function taper(x1, y1, x2, y2, w1, w2, cls, r = true) {
    const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a), ny = Math.cos(a);
    const p = [[x1 + nx * w1 / 2, y1 + ny * w1 / 2], [x2 + nx * w2 / 2, y2 + ny * w2 / 2], [x2 - nx * w2 / 2, y2 - ny * w2 / 2], [x1 - nx * w1 / 2, y1 - ny * w1 / 2]];
    if (!r) return `<polygon class="${cls}" points="${p.map(q => q.map(f1).join(',')).join(' ')}"/>`;
    const c2 = w2 / 2, c1 = w1 / 2;
    return `<path class="${cls}" d="M${f1(p[0][0])} ${f1(p[0][1])} L${f1(p[1][0])} ${f1(p[1][1])} A${f1(c2)} ${f1(c2)} 0 0 0 ${f1(p[2][0])} ${f1(p[2][1])} L${f1(p[3][0])} ${f1(p[3][1])} A${f1(c1)} ${f1(c1)} 0 0 0 ${f1(p[0][0])} ${f1(p[0][1])} Z"/>`;
}
/* effort arm and resistance arm drawn as thick lines from the fulcrum */
const armLines = (F, E, L) => [[L, 'r'], [E, 'e']].map(([P, c]) => `<line class="il-arm halo" x1="${f1(F[0])}" y1="${f1(F[1])}" x2="${f1(P[0])}" y2="${f1(P[1])}"/><line class="il-arm ${c}" x1="${f1(F[0])}" y1="${f1(F[1])}" x2="${f1(P[0])}" y2="${f1(P[1])}"/>`).join('');

/* lever used in class diagrams */
function classDiag(fx, lx, ex, up) {
    const y = 86, ry = up ? 160 : 150, ey = up ? 174 : 150;
    const tick = (x, yy, c) => `<line class="${c}" x1="${x}" y1="${yy - 7}" x2="${x}" y2="${yy + 7}"/>`;
    return `<rect class="plank" x="18" y="${y - 10}" width="284" height="10" rx="2"/>
        <polygon class="fulc" points="${fx},${y} ${fx - 22},${y + 36} ${fx + 22},${y + 36}"/>
        <rect class="load" x="${lx - 24}" y="${y - 54}" width="48" height="44" rx="3"/>
        ${up ? arrow(ex, y + 60, ex, y + 4, 'fa', 10) : arrow(ex, y - 84, ex, y - 14, 'fa', 10)}
        <line class="armR" x1="${fx}" y1="${ry}" x2="${lx}" y2="${ry}"/>${tick(fx, ry, 'armR')}${tick(lx, ry, 'armR')}
        <line class="armE" x1="${fx}" y1="${ey}" x2="${ex}" y2="${ey}"/>${tick(fx, ey, 'armE')}${tick(ex, ey, 'armE')}`;
}

/* rotating lever with traced paths */
function leverArm(o) {
    const P = (d, a) => [o.fx + d * Math.cos(deg(a)), o.fy + d * Math.sin(deg(a))];
    const arc = (d, cls) => { const [x0, y0] = P(d, o.a0), [x1, y1] = P(d, o.a1), r = Math.abs(d); return `<path class="trace ${cls}" pathLength="1" d="M${f1(x0)} ${f1(y0)} A${r} ${r} 0 0 ${o.a1 > o.a0 ? 1 : 0} ${f1(x1)} ${f1(y1)}"/>`; };
    const w = o.px2 - o.px1;
    const eff = o.up ? arrow(o.ex, o.fy + 56, o.ex, o.fy + 4, 'fa', 11) + tx(o.ex + 14, o.fy + 44, o.et || 'Effort', 'pk sm')
        : arrow(o.ex, o.fy - 100, o.ex, o.fy - 16, 'fa', 11) + tx(o.ex - 14, o.fy - 70, o.et || 'Effort', 'pk sm end');
    return `<line class="gnd" x1="${o.gnd[0]}" y1="${o.fy + 60}" x2="${o.gnd[1]}" y2="${o.fy + 60}"/>
        <polygon class="fulc" points="${o.fx},${o.fy} ${o.fx - 28},${o.fy + 60} ${o.fx + 28},${o.fy + 60}"/>
        <rect class="ghost" x="${o.px1}" y="${o.fy - 12}" width="${w}" height="12" transform="rotate(${o.a0} ${o.fx} ${o.fy})"/>
        ${(o.arcs || []).map(([d, c]) => arc(d, c)).join('')}
        <g class="arm" style="--a0:${o.a0}deg;--a1:${o.a1}deg;transform-origin:${o.fx}px ${o.fy}px">
            <rect class="plank" x="${o.px1}" y="${o.fy - 12}" width="${w}" height="12" rx="2"/>
            <rect class="load" x="${o.lx - 24}" y="${o.fy - 56}" width="48" height="44" rx="3"/>${tx(o.lx, o.lt ? o.fy - 26 : o.fy - 64, o.lt || 'Load', 'mid sm')}
            ${eff}
        </g>`;
}

/* ---------- illustrations (each 340 x 220) ----------
   Every entry returns { art, ans, F, L, E } where ans is the reveal overlay. */
const ART = {};

ART.wheelbarrow = () => {
    const ax = 78, ay = 164, R = 32;
    const spokes = [0, 30, 60, 90, 120, 150].map(a => `<line class="il-thin" style="stroke-width:2.5" x1="${f1(ax + 20 * Math.cos(deg(a)))}" y1="${f1(ay + 20 * Math.sin(deg(a)))}" x2="${f1(ax - 20 * Math.cos(deg(a)))}" y2="${f1(ay - 20 * Math.sin(deg(a)))}"/>`).join('');
    const hy = x => ay + (x - ax) * (-50 / 222);
    const art = `
        <line class="il-gnd" x1="14" y1="${ay + R + 2}" x2="330" y2="${ay + R + 2}"/>
        <path class="il-o" style="fill:none;stroke-width:6" d="M${236} ${f1(hy(236))} L246 ${ay + R - 2} M234 ${ay + R} H258"/>
        <path class="il-o il-metal" d="M84 70 L266 70 L238 128 L140 148 Z"/>
        <path class="il-hi" d="M102 80 L146 136"/>
        <path class="il-o il-soil" d="M92 72 C110 48 136 34 170 32 C206 30 236 44 258 72 Z"/>
        <circle cx="132" cy="58" r="3.5" class="il-navy"/><circle cx="178" cy="46" r="3" class="il-navy"/><circle cx="214" cy="58" r="3.5" class="il-navy"/><circle cx="160" cy="62" r="2.5" class="il-navy"/>
        <line class="il-o" style="stroke-width:8" x1="78" y1="70" x2="272" y2="70"/>
        <path class="il-o" style="fill:none;stroke-width:4" d="M150 ${f1(hy(150))} L156 146 M220 ${f1(hy(220))} L226 130"/>
        <line class="il-o" style="stroke-width:9" x1="${ax}" y1="${ay}" x2="292" y2="${f1(hy(292))}"/>
        <line style="stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.5" x1="${ax + 30}" y1="${f1(hy(ax + 30) - 1)}" x2="286" y2="${f1(hy(286) - 1)}"/>
        ${taper(288, hy(288), 326, hy(326), 16, 16, 'il-o il-grip')}
        <circle cx="${ax}" cy="${ay}" r="${R}" class="il-navy"/>
        <circle cx="${ax}" cy="${ay}" r="21" class="il-white" style="stroke:var(--navy);stroke-width:2"/>

/* ---------- lever simulator ----------
   Class 1 lever, 2 m long. Load (300 N) at the left end, effort at the right end.
   Pushing turns the lever until each end has moved 0.2 x its arm length (vertically). */
function leverSim(o) {
    const S = 3, X0 = 130, Y = 262, H = 105, LOAD = 300, K = 0.2, LEN = 200, FMIN = 50, FMAX = 150;
    const sx = s => X0 + s * S;

    const root = el('div', 'simwrap' + (o.drag ? '' : ' sim-fix'));
    const left = el('div', 'simleft');
    const svg = svgBox(860, 440, `
        <line class="gnd" x1="20" y1="${Y + H}" x2="840" y2="${Y + H}"/>
        <g class="sim-g0"></g>
        <g class="sim-arms"></g>
        <rect class="sim-ghost" x="${sx(-15)}" y="${Y - 12}" width="${230 * S}" height="12" rx="2"/>
        <path class="sim-trace n"/><path class="sim-trace p"/>
        <g class="sim-lever">
            <rect class="plank" x="${sx(-15)}" y="${Y - 12}" width="${230 * S}" height="12" rx="3"/>
            <rect class="load" x="${sx(-13)}" y="${Y - 12 - 64}" width="${26 * S}" height="64" rx="4"/>
            ${tx(sx(0), Y - 12 - 38, '300 N', 'mid')}${tx(sx(0), Y - 12 - 16, 'Load', 'mid sm gr')}
            <g class="sim-eff"></g>
        </g>
        <g class="sim-fulc" tabindex="-1">
            <rect class="sim-hit" x="-50" y="${Y - 10}" width="100" height="${H + 14}"/>
            <polygon class="fulc" points="0,${Y} -38,${Y + H} 38,${Y + H}"/>
            <path d="M-16 ${Y + 76} h32 M-16 ${Y + 76} l7 -6 M-16 ${Y + 76} l7 6 M16 ${Y + 76} l-7 -6 M16 ${Y + 76} l-7 6" style="fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round${o.drag ? '' : ';display:none'}"/>
        </g>
        <g class="sim-d"></g>`);
    const sv = q1(svg, 'svg');
    left.appendChild(svg);
    let slider = null;
    if (o.drag) {
        const row = el('div', 'simrow', '<span>Fulcrum position</span>');
        slider = el('input'); slider.type = 'range'; slider.min = FMIN; slider.max = FMAX; slider.step = 10; slider.value = st.f;
        slider.setAttribute('aria-label', 'Fulcrum position');
        row.appendChild(slider); left.appendChild(row);
    }
    const panel = el('div', 'simpanel');
    const verd = el('div', 'simverd', '<div class="vt"></div><div class="vs"></div>');
    const sEa = el('div', 'simstat pink', '<div class="lb">Effort arm</div><div class="nv"></div>');
    const sRa = el('div', 'simstat', '<div class="lb">Resistance arm</div><div class="nv"></div>');
    const sFe = el('div', 'simstat pink', '<div class="lb">Effort force needed</div><div class="nv"></div>');
    const sD = el('div', 'simstat', '<div class="lb">Distance moved</div><div class="simbars"><span>Effort</span><div class="bar p"><i></i></div><b class="p">0 cm</b><span>Load</span><div class="bar"><i></i></div><b>0 cm</b></div>');
    panel.append(verd, sEa, sRa, sFe, sD);
    let btns = null;
    if (o.drag) {
        btns = el('div', 'simbtns', '<button class="simbtn pri" type="button">Push</button><button class="simbtn" type="button">Reset</button>');
        panel.appendChild(btns);
    }
    root.append(left, panel);

    const lever = q1(sv, '.sim-lever'), fulc = q1(sv, '.sim-fulc'), effG = q1(sv, '.sim-eff'), arms = q1(sv, '.sim-arms');
    const ghost = q1(sv, '.sim-ghost'), trN = q1(sv, '.sim-trace.n'), trP = q1(sv, '.sim-trace.p'), dG = q1(sv, '.sim-d');
    const force = f => LOAD * f / (LEN - f);
    const dims = () => {
        const f = st.f, fr = Math.round(f / 10) * 10, y = Y + H + 26, tk = (x, c) => `<line class="${c}" x1="${x}" y1="${y - 10}" x2="${x}" y2="${y + 10}"/>`;
        arms.innerHTML = `<line class="gd" x1="${sx(0)}" y1="${Y + 2}" x2="${sx(0)}" y2="${y}"/><line class="gd" x1="${sx(LEN)}" y1="${Y + 2}" x2="${sx(LEN)}" y2="${y}"/>

            <line class="armE" x1="${sx(f)}" y1="${y}" x2="${sx(LEN)}" y2="${y}"/>${tk(sx(f), 'armE')}${tk(sx(LEN), 'armE')}

    };
    function readouts() {
        const f = Math.round(st.f / 10) * 10, Ea = LEN - f, Fe = Math.round(force(f));
        verd.className = 'simverd' + (Ea > f ? ' f' : Ea < f ? ' s' : '');
        q1(verd, '.vt').textContent = Ea > f ? 'Force multiplier' : Ea < f ? 'Speed multiplier' : 'Equal arms';
        q1(verd, '.vs').textContent = Ea > f ? 'Less effort, but the effort moves further than the load.' : Ea < f ? 'More effort, but the load moves further and faster.' : 'Effort equals the load. Both ends move the same distance.';
        q1(sEa, '.nv').innerHTML = Ea + ' cm';
        q1(sRa, '.nv').innerHTML = f + ' cm';
        q1(sFe, '.nv').innerHTML = Fe + ' N<small>to lift 300 N</small>';
        const L = Fe * 0.25;
        const AL = Math.max(L, 22), ly1 = Math.min(Y - 14 - AL / 2 - 4, Y - 48);
        effG.innerHTML = arrow(sx(LEN), Y - 14 - AL, sx(LEN), Y - 13, 'fa', 13) + tx(sx(LEN) - 16, ly1, 'Effort', 'pk end') + tx(sx(LEN) - 16, ly1 + 22, Fe + ' N', 'pk end sm');
    }
    function draw() {
        const f = st.f, px = sx(f), a = st.th, sn = Math.sin(a), deg2 = a * 180 / Math.PI;
        lever.setAttribute('transform', `rotate(${deg2.toFixed(3)} ${px} ${Y})`);
        fulc.setAttribute('transform', `translate(${px} 0)`);
        const on = a > 0.0005;
        ghost.style.display = trN.style.display = trP.style.display = on ? '' : 'none';
        const rL = f * S, rE = (LEN - f) * S;
        const lx = px - rL * Math.cos(a), ly = Y - rL * sn, exx = px + rE * Math.cos(a), eyy = Y + rE * sn;
        trN.setAttribute('d', `M${sx(0)} ${Y} A${rL} ${rL} 0 0 1 ${f1(lx)} ${f1(ly)}`);
        trP.setAttribute('d', `M${sx(LEN)} ${Y} A${rE} ${rE} 0 0 1 ${f1(exx)} ${f1(eyy)}`);
        const dl = f * sn, de = (LEN - f) * sn;
        const xl = sx(-15) - 30, xe = sx(215) + 30;
        dG.innerHTML = on ? `<line class="sim-dl" x1="${xl - 10}" y1="${Y}" x2="${sx(-15)}" y2="${Y}"/><line class="sim-dl" x1="${xl - 10}" y1="${f1(ly)}" x2="${f1(lx - 40)}" y2="${f1(ly)}"/>
            <line class="sim-dl" x1="${sx(215)}" y1="${Y}" x2="${xe + 10}" y2="${Y}"/><line class="sim-dl" x1="${f1(exx)}" y1="${f1(eyy)}" x2="${xe + 10}" y2="${f1(eyy)}"/>
            <g class="sim-dim n"><line x1="${xl}" y1="${Y}" x2="${xl}" y2="${f1(ly)}"/><line x1="${xl - 9}" y1="${Y}" x2="${xl + 9}" y2="${Y}"/><line x1="${xl - 9}" y1="${f1(ly)}" x2="${xl + 9}" y2="${f1(ly)}"/></g>
            <g class="sim-dim p"><line x1="${xe}" y1="${Y}" x2="${xe}" y2="${f1(eyy)}"/><line x1="${xe - 9}" y1="${Y}" x2="${xe + 9}" y2="${Y}"/><line x1="${xe - 9}" y1="${f1(eyy)}" x2="${xe + 9}" y2="${f1(eyy)}"/></g>
            <text class="sim-dv n" x="${xl - 14}" y="${f1((Y + ly) / 2 + 10)}" text-anchor="end">${Math.round(dl)}</text><text class="t sm gr" x="${xl - 14}" y="${f1((Y + ly) / 2 + 32)}" text-anchor="end">cm</text>
            <text class="sim-dv p" x="${xe + 14}" y="${f1((Y + eyy) / 2 + 10)}">${Math.round(de)}</text><text class="t sm gr" x="${xe + 14}" y="${f1((Y + eyy) / 2 + 32)}">cm</text>` : '';
        const bars = qa(sD, '.bar i'), vals = qa(sD, 'b');
        bars[0].style.width = (de / 30 * 100).toFixed(1) + '%'; bars[1].style.width = (dl / 30 * 100).toFixed(1) + '%';
        vals[0].textContent = Math.round(de) + ' cm'; vals[1].textContent = Math.round(dl) + ' cm';
    }
    const TH = Math.asin(K);
    const instant = () => exporting || stage.classList.contains('instant');
    function stopAnim() { cancelAnimationFrame(st.raf); st.raf = 0; }
    function tween(dur, step, done) {
        stopAnim();
        if (instant()) { step(1); if (done) done(); return; }
        const t0 = performance.now();
        const fr = n => { const p = Math.min(1, (n - t0) / dur), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; step(e); if (p < 1) st.raf = requestAnimationFrame(fr); else { st.raf = 0; if (done) done(); } };
        st.raf = requestAnimationFrame(fr);
    }
    function reset() { stopAnim(); st.th = 0; draw(); }
    function push() { stopAnim(); st.th = 0; draw(); tween(1600, e => { st.th = TH * e; draw(); }); }
    function setF(v, animate) {
        v = Math.max(FMIN, Math.min(FMAX, Math.round(v / 10) * 10));
        stopAnim(); st.th = 0;
        const done = () => { st.f = v; if (slider) slider.value = v; dims(); readouts(); draw(); };
        if (!animate || instant()) { done(); return; }
        const a0 = st.f;
        tween(1100, e => { st.f = a0 + (v - a0) * e; if (slider) slider.value = Math.round(st.f / 10) * 10; dims(); readouts(); draw(); }, done);
    }
    if (o.drag) {
        const toS = e => { const r = sv.getBoundingClientRect(); return ((e.clientX - r.left) / r.width * 860 - X0) / S; };
        let dragging = false;
        fulc.addEventListener('pointerdown', e => { if (e.button !== 0) return; e.preventDefault(); dragging = true; fulc.setPointerCapture(e.pointerId); });
        fulc.addEventListener('pointermove', e => { if (!dragging) return; const v = Math.max(FMIN, Math.min(FMAX, Math.round(toS(e) / 10) * 10)); if (v !== Math.round(st.f)) setF(v); });
        ['pointerup', 'pointercancel'].forEach(t => fulc.addEventListener(t, () => { dragging = false; }));
        slider.addEventListener('input', () => setF(+slider.value));
        slider.addEventListener('change', () => slider.blur());
        const [bp, br] = qa(btns, 'button');
        bp.onclick = () => { bp.blur(); push(); };
        br.onclick = () => { br.blur(); reset(); };
        sv.addEventListener('click', e => { if (!e.target.closest('.sim-fulc')) push(); });
    } else {
        sv.style.cursor = 'pointer';
        sv.addEventListener('click', push);
    }
    cleanups.push(stopAnim);
    dims(); readouts(); draw();
    return { root, push, reset, setF, panel, verd, sEa, sRa, sFe, sD, svg };
}

/* scenario card: name, art key, verdict ('f' or 's'), reason */
function fsCard(n, name, key, kind, why) {
    const a = ART[key]();
    const p = el('div', 'fscard', `<div class="fshd"><span class="qn${kind === 's' ? ' p' : ''}">${n}</span><span class="chd">${name}</span></div>

    p.reveal = () => { show(q1(p, '.lab')); p.classList.add(kind); show(q1(p, '.fstag')); };
    p.why = () => show(q1(p, '.fswhy'));
    return p;
}

/* simulator panel tidy-up: arms side by side */
function simPanel(sim) {
    const row = el('div', '', ''); row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px';

    sim.sEa.querySelector('.lb').textContent = 'Effort arm'; sim.sRa.querySelector('.lb').textContent = 'Resist. arm';
    return row;
}

/* ---------- player ---------- */
const dots = $('#dots');
scenes.forEach((_, i) => { const d = el('button'); d.setAttribute('aria-label', 'Scene ' + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });

const stepLbl = $('#steplbl');
const dur = () => scenes[idx].dur;
const beatEnd = b => (b + 1 < beats.length ? beats[b + 1] : dur());
function label() { stepLbl.textContent = `Step ${beat + 1} of ${beats.length}`; }

function build(i) {
    clearTimers();
    stopInteractive();
    const ni = Math.max(0, Math.min(scenes.length - 1, i));
    if (ni !== idx) { saveInk(); idx = ni; loadInk(); zoomReset(); renderBadges(); }
    events = []; beats = [];
    const sc = scenes[idx];
    content.innerHTML = ''; caption.innerHTML = '';
    titleEl.innerHTML = sc.title;
    counter.innerHTML = `<b>${idx + 1}</b> / ${scenes.length}`;
    uiSetCfu(sc.cfu, sc.time); uiSetSC(sc.sc);
    [...dots.children].forEach((d, j) => d.classList.toggle('cur', j === idx));
    sc.run();
    beats = [...new Set(beats)].sort((a, b) => a - b);
}

function jumpTo(to) {
    stage.classList.add('instant');
    events.filter(e => !e.done && e.t < to).sort((a, b) => a.t - b.t).forEach(e => { e.done = true; e.fn(); });
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
}

function setProgress(from, to) {
    progress.style.transition = 'none';
    progress.style.width = (from / dur() * 100) + '%';
    void progress.offsetWidth;
    progress.style.transition = `width ${Math.max(0, to - from)}ms linear`;
    progress.style.width = (to / dur() * 100) + '%';
}

function play(from, to, onEnd) {
    clearTimers();
    segFrom = from; segTo = to; segStart = performance.now();
    events.filter(e => !e.done && e.t >= from && e.t < to)
        .forEach(e => timers.push(setTimeout(() => { e.done = true; e.fn(); }, e.t - from)));
    beats.forEach((bt, k) => { if (bt > from && bt < to) timers.push(setTimeout(() => { beat = k; label(); }, bt - from)); });
    if (onEnd) timers.push(setTimeout(onEnd, to - from));
    setProgress(from, to);
}

function now() { return Math.min(segTo, segFrom + performance.now() - segStart); }

function startBeat(b) {
    beat = b; label();
    jumpTo(beats[b]);
    if (autoplay) play(beats[b], dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    else play(beats[b], beatEnd(b));
}

function go(i, b = 0) {
    build(i);
    startBeat(b === 'last' ? beats.length - 1 : b);
}

function next() {
    if (autoplay) { if (idx < scenes.length - 1) go(idx + 1); return; }
    clearTimers();
    if (beat < beats.length - 1) { jumpTo(beatEnd(beat)); startBeat(beat + 1); }
    else if (idx < scenes.length - 1) go(idx + 1);
    else { jumpTo(dur()); setProgress(dur(), dur()); }
}

function back() {
    if (autoplay) { go(idx - 1); return; }
    if (beat > 0) go(idx, beat - 1);
    else if (idx > 0) go(idx - 1, 'last');
    else go(0);
}

function toggleAuto() {
    autoplay = !autoplay;
    autoBtn.classList.toggle('on', autoplay); autoBtn.setAttribute('aria-pressed', autoplay);
    const cur = now();
    clearTimers();
    if (autoplay) {
        play(cur, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    } else {
        let b = 0; beats.forEach((bt, k) => { if (bt <= cur) b = k; });
        beat = b; label();
        jumpTo(beatEnd(b));
        setProgress(beatEnd(b), beatEnd(b));
    }
}

const autoBtn = $('#auto');
$('#next').onclick = next;
$('#back').onclick = back;
$('#replay').onclick = () => { zoomReset(); go(idx); };
autoBtn.onclick = toggleAuto;
const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);
document.addEventListener('keydown', e => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (wbOpen) {
        if (e.key === 'ArrowRight') wbGo(wbPage + 1);
        if (e.key === 'ArrowLeft') wbGo(wbPage - 1);
        if (e.key === 'n' || e.key === 'N') wbNew();
        if (e.key === ' ') e.preventDefault();
        return;
    }
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') back();
    if (e.key === 'r' || e.key === 'R') { zoomReset(); go(idx); }
    if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

/* ---------- pen, highlighter and eraser ---------- */
const ink = $('#ink'), ctx = ink.getContext('2d'), hlc = $('#hl'), hctx = hlc.getContext('2d'), livec = $('#hllive'), lctx = livec.getContext('2d');
const penBtn = $('#pen'), hlBtn = $('#hlbtn'), eraserBtn = $('#eraser');
let tool = null, penColour = '#ea008a', hlColour = '#ffd60a', drawing = false, inkMarked = false, hlMarked = false, scaleK = 1, exporting = false;
const HL_ALPHA = 0.42, HL_W = 26;
const inkOps = {}, inkRedo = {};
const isTyping = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);

let wbOpen = false, wbPage = 0, wbPages = 1;
const curKey = () => wbOpen ? 'wb' + wbPage : idx;
const opsOf = k => (inkOps[k] = inkOps[k] || []), redoOf = k => (inkRedo[k] = inkRedo[k] || []);
let curStroke = null;

function setTool(t) {
    tool = t;
    ink.classList.toggle('active', !!t);
    ink.classList.toggle('erase', t === 'eraser');
    [[penBtn, 'pen'], [hlBtn, 'hl'], [eraserBtn, 'eraser']].forEach(([b, n]) => { b.classList.toggle('on', t === n); b.setAttribute('aria-pressed', t === n); });
    syncSwatches(); syncMenus();
}
function syncSwatches() {
    const c = tool === 'hl' ? hlColour : penColour;
    document.querySelectorAll('.swatch').forEach(x => x.classList.toggle('cur', x.dataset.c === c));
}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const targetsOf = op => op.t === 'eraser' ? [ctx, hctx] : op.t === 'hl' ? [hctx] : [ctx];
function brush(c, op) {
    const er = op.t === 'eraser';
    c.globalCompositeOperation = er ? 'destination-out' : 'source-over';
    c.globalAlpha = op.t === 'hl' ? HL_ALPHA : 1;
    c.strokeStyle = c.fillStyle = er ? '#000' : op.c;
    c.lineWidth = op.w;
}
function unbrush(c) { c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
function dotOn(c, op) { const p = op.pts[0]; c.beginPath(); c.arc(p.x, p.y, op.w / 2, 0, Math.PI * 2); c.fill(); }
function segOn(c, op, i) {
    const P = op.pts, a = P[i - 1], m0 = i > 1 ? mid(P[i - 2], a) : a, m1 = mid(a, P[i]);
    c.beginPath(); c.moveTo(m0.x, m0.y); c.quadraticCurveTo(a.x, a.y, m1.x, m1.y); c.stroke();
}
function tailOn(c, op) {
    const P = op.pts, n = P.length; if (n < 2) return;
    const m = mid(P[n - 2], P[n - 1]);
    c.beginPath(); c.moveTo(m.x, m.y); c.lineTo(P[n - 1].x, P[n - 1].y); c.stroke();
}
function pathOn(c, op) {
    const P = op.pts;
    if (P.length < 2) { dotOn(c, op); return; }
    c.beginPath(); c.moveTo(P[0].x, P[0].y);
    for (let i = 1; i < P.length; i++) { const m = mid(P[i - 1], P[i]); c.quadraticCurveTo(P[i - 1].x, P[i - 1].y, m.x, m.y); }
    c.lineTo(P[P.length - 1].x, P[P.length - 1].y); c.stroke();
}
function redrawInk() {
    [ctx, hctx, lctx].forEach(c => { unbrush(c); c.clearRect(0, 0, 1280, 720); });
    let mi = false, mh = false;
    opsOf(curKey()).forEach(op => {
        if (op.t === 'clear') { ctx.clearRect(0, 0, 1280, 720); hctx.clearRect(0, 0, 1280, 720); mi = mh = false; return; }
        targetsOf(op).forEach(c => { brush(c, op); pathOn(c, op); unbrush(c); });
        if (op.t === 'pen') mi = true;
        if (op.t === 'hl') mh = true;

}
function commit(op) { opsOf(curKey()).push(op); redoOf(curKey()).length = 0; }
function clearInk() { if (!inkMarked && !hlMarked) return; commit({ t: 'clear' }); redrawInk(); }
function saveInk() {}
function loadInk() { redrawInk(); }
function undoInk() { if (drawing) return; const o = opsOf(curKey()); if (!o.length) return; redoOf(curKey()).push(o.pop()); redrawInk(); }
function redoInk() { if (drawing) return; const r = redoOf(curKey()); if (!r.length) return; opsOf(curKey()).push(r.pop()); redrawInk(); }
function liveHL() { lctx.clearRect(0, 0, 1280, 720); brush(lctx, curStroke); pathOn(lctx, curStroke); unbrush(lctx); }

    curStroke = { t: tool, c: tool === 'hl' ? hlColour : penColour, w, pts: [pt(e)] };
    if (tool === 'hl') { liveHL(); hlMarked = true; return; }
    targetsOf(curStroke).forEach(c => { brush(c, curStroke); dotOn(c, curStroke); unbrush(c); });
    if (tool === 'pen') inkMarked = true;
});
ink.addEventListener('pointermove', e => {
    if (!drawing) return;
    curStroke.pts.push(pt(e));
    if (curStroke.t === 'hl') { liveHL(); return; }
    targetsOf(curStroke).forEach(c => { brush(c, curStroke); segOn(c, curStroke, curStroke.pts.length - 1); unbrush(c); });
});
['pointerup', 'pointercancel'].forEach(t => ink.addEventListener(t, () => {
    if (!drawing) return;

    else targetsOf(curStroke).forEach(c => { brush(c, curStroke); tailOn(c, curStroke); unbrush(c); });
    commit(curStroke); curStroke = null; drawing = false;
}));
penBtn.onclick = () => setTool(tool === 'pen' ? null : 'pen');
hlBtn.onclick = () => setTool(tool === 'hl' ? null : 'hl');
eraserBtn.onclick = () => setTool(tool === 'eraser' ? null : 'eraser');
$('#clear').onclick = clearInk;
document.querySelectorAll('.swatch').forEach(b => b.onclick = () => {
    if (tool === 'hl') hlColour = b.dataset.c; else { penColour = b.dataset.c; setTool('pen'); }
    syncSwatches(); syncMenus();
});

/* ---------- floating timer ---------- */
const ftEl = $('#ftimer'), ftV = $('#ftv'), ftF = $('#ftf'), ftStart = $('#ftstart'), ftBtn = $('#timerbtn');

const ftFmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function ftStop() { clearInterval(FT.iv); FT.iv = null; ftStart.textContent = 'Start'; }
function ftBeep() {
    try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        [0, .35, .7].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
            g.gain.setValueAtTime(.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, ac.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t + .25);
            o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .3); });
    } catch (e) {}
}

}
function ftSet(sec) { ftStop(); ftEl.classList.remove('done'); FT.total = FT.left = sec; ftDraw(); }

}
function ftShow(on) {

        const e = imgEl(o, true); ilayer.appendChild(e); selectImg(o);
    }
}
document.addEventListener('paste', e => {
    if (isTyping(e) || modal) return;
    const files = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile());
    if (!files.length) return;
    e.preventDefault();
    closeMenus(); setTool(null);
    addImages(files, ptrIn ? layerPt(ptrX, ptrY) : null);
});
const dropEl = el('div', 'ui-drop'); stage.appendChild(dropEl);
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; dropEl.classList.add('on'); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
    if (modal) return;
    setTool(null);
    addImages(e.dataTransfer.files, stage.contains(e.target) ? layerPt(e.clientX, e.clientY) : null);
});
$('#imgbtn').onclick = () => imgFile.click();
imgFile.addEventListener('change', () => { addImages(imgFile.files); imgFile.value = ''; });
document.addEventListener('pointerdown', e => { if (imgSel && !e.target.closest('.ui-img')) selectImg(null); });
document.addEventListener('keydown', e => {
    if (!imgSel || isTyping(e) || modal) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeImg(imgSel); }
    if (e.key === 'Escape') selectImg(null);
});

/* ---------- menus ---------- */
const menus = [...document.querySelectorAll('.ui-menu')], engMenu = $('#engmenu');
function closeMenus(except) {
    menus.forEach(m => { if (m !== except) { m.classList.remove('ui-open'); m.querySelector('.ui-mt').setAttribute('aria-expanded', 'false'); } });
}
function toggleMenu(m, force) {
    const open = force !== undefined ? force : !m.classList.contains('ui-open');
    closeMenus(m); m.classList.toggle('ui-open', open); m.querySelector('.ui-mt').setAttribute('aria-expanded', open);
}
menus.forEach(m => {
    m.querySelector('.ui-mt').addEventListener('click', e => { toggleMenu(m); e.currentTarget.blur(); });
    m.querySelector('.ui-pop').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) { b.blur(); closeMenus(); } });
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.ui-menu')) closeMenus(); });
function syncMenus() {
    $('#drawmenu .ui-mt').classList.toggle('on', !!tool);
    $('#focusmenu .ui-mt').classList.toggle('on', Z.on || SP.on);
    $('#pdot').style.background = tool === 'hl' ? hlColour : penColour;
}

/* ---------- fullscreen ---------- */
const fsBtn = $('#fsbtn'), fsIc = $('#fsic');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFS() {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const r = document.documentElement, f = r.requestFullscreen || r.webkitRequestFullscreen;
    if (!f) return;
    const p = f.call(r); if (p && p.catch) p.catch(() => {});
}
function syncFS() {
    const on = !!fsEl();
    fsBtn.classList.toggle('ui-isfs', on); fsBtn.classList.remove('ui-nudge');
    fsBtn.querySelector('.bl').textContent = on ? 'Exit fullscreen' : 'Fullscreen';
    fsIc.setAttribute('d', on ? 'M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5' : 'M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5');
    setUI(on);
    requestAnimationFrame(fit);
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(t => document.addEventListener(t, syncFS));
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true;
else fsBtn.classList.add('ui-nudge');
fsBtn.onclick = () => { toggleFS(); fsBtn.blur(); };

/* ---------- whiteboard ---------- */
const wbBtn = $('#wbbtn'), wbl = $('#wbl');
let wbPausedAt = 0;
function loadSurface() { redrawInk(); renderBadges(); }
function syncWB() {
    $('#wbpg').textContent = `Page ${wbPage + 1} of ${wbPages}`;
    wbl.innerHTML = `Whiteboard&nbsp;&nbsp;<b>${wbPage + 1}</b> / ${wbPages}`;
    $('#wbprev').disabled = wbPage === 0; $('#wbnext').disabled = wbPage >= wbPages - 1;
    wbBtn.classList.toggle('on', wbOpen); wbBtn.setAttribute('aria-pressed', wbOpen);
}
function toggleWB() {
    if (document.activeElement) document.activeElement.blur();
    closeMenus(); zoomReset();
    if (!wbOpen) {
        wbPausedAt = now(); clearTimers(); setProgress(wbPausedAt, wbPausedAt);
        wbOpen = true;
    } else {
        wbOpen = false;
    }
    document.body.classList.toggle('ui-wb', wbOpen);
    loadSurface(); syncWB(); fit();
    if (!wbOpen) {
        if (autoplay) play(wbPausedAt, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
        else play(wbPausedAt, beatEnd(beat));
    }
}
function wbGo(p) {
    p = clamp(p, 0, wbPages - 1); if (p === wbPage) return;
    if (document.activeElement) document.activeElement.blur();
    zoomReset(); wbPage = p; loadSurface(); syncWB();
}
function wbNew() { wbPages++; wbGo(wbPages - 1); }
wbBtn.onclick = () => { toggleWB(); wbBtn.blur(); };
$('#wbprev').onclick = () => wbGo(wbPage - 1);
$('#wbnext').onclick = () => wbGo(wbPage + 1);
$('#wbnew').onclick = () => { wbNew(); $('#wbnew').blur(); };
syncWB();

/* ---------- overlays: overview, shortcuts, blackout ---------- */
const modals = { ovw: $('#ovw'), keys: $('#keys'), blk: $('#blk') };
let modal = null;
function openModal(n) {
    if (modal) closeModal();
    closeMenus();
    if (document.activeElement) document.activeElement.blur();
    if (n === 'blk' && autoplay) toggleAuto();
    if (n === 'ovw') renderOverview();
    modal = n; modals[n].hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => modals[n].classList.add('on')));
    if (n === 'ovw') { const c = modals.ovw.querySelector('.ui-ovc.cur'); if (c) c.scrollIntoView({ block: 'center' }); }
}
function closeModal() {
    if (!modal) return;
    const m = modals[modal]; m.classList.remove('on'); m.hidden = true; modal = null;
}
window.addEventListener('keydown', e => {
    if (!modal || /^F\d+$/.test(e.key)) return;
    const k = e.key.toLowerCase();
    e.preventDefault(); e.stopImmediatePropagation();
    if (k === 'escape' || (modal === 'blk' && k === 'k') || (modal === 'ovw' && k === 'g') || (modal === 'keys' && (k === '?' || k === '/'))) closeModal();
}, true);
modals.blk.onclick = closeModal;
modals.keys.addEventListener('click', e => { if (!e.target.closest('.ui-kcard') || e.target.closest('#keysclose')) closeModal(); });
modals.ovw.addEventListener('click', e => { if (!e.target.closest('.ui-ovc')) closeModal(); });
$('#blkbtn').onclick = () => openModal('blk');
$('#keysbtn').onclick = () => openModal('keys');
$('#ovbtn').onclick = () => { openModal('ovw'); };

const thumbs = [];
function renderOverview() {
    const g = $('#ovg'); g.innerHTML = '';
    scenes.forEach((sc, i) => {
        const c = el('button', 'ui-ovc' + (i === idx ? ' cur' : ''));
        c.setAttribute('aria-label', 'Go to scene ' + (i + 1));
        const w = el('div', 'ui-thw'); if (thumbs[i]) w.appendChild(thumbs[i].cloneNode(true));
        c.append(w, el('div', 'ui-lb', `<span class="ui-n">${i + 1}</span><span class="ui-t">${sc.title}</span>`));
        c.onclick = () => { closeModal(); if (i !== idx) go(i); };
        g.appendChild(c);
    });
}

const SHORTCUTS = [
    ['Slides', [['&rarr;', 'Next'], ['&larr;', 'Previous'], ['R', 'Replay scene'], ['Space', 'Autoplay'], ['G', 'Slide overview']]],
    ['Draw', [['P', 'Pen'], ['Y', 'Highlighter'], ['E', 'Eraser'], ['B', 'Text box'], ['C', 'Clear ink'], ['Ctrl|Z', 'Undo'], ['Ctrl|Shift|Z', 'Redo'], ['Ctrl|V', 'Paste image'], ['Del', 'Delete selected image']]],
    ['Focus', [['Z', 'Zoom (scroll to adjust)'], ['L', 'Lock zoom'], ['H', 'Spotlight (scroll to resize)'], ['K', 'Blackout']]],
    ['Engage', [['M', 'Engagement methods'], ['1|5', 'Choose a method'], ['T', 'Timer']]],
    ['Whiteboard', [['W', 'Open or close'], ['&larr;|&rarr;', 'Change page'], ['N', 'New page']]],
    ['View', [['F', 'Fullscreen'], ['U', 'Hide or show UI'], ['S', 'Subtitles'], ['?', 'Shortcuts'], ['Esc', 'Close or stop tool']]]
];
$('#kgrid').innerHTML = SHORTCUTS.map(([h, rows]) => `<div class="ui-kgrp"><h3>${h}</h3>${rows.map(([k, l]) => {
    const keys = k === '1|5' ? '<kbd>1</kbd>to<kbd>5</kbd>' : k.split('|').map(x => `<kbd>${x}</kbd>`).join(k.includes('Ctrl') ? '+' : '');
    return `<div class="ui-krow"><span class="ui-ks">${keys}</span><span>${l}</span></div>`;
}).join('')}</div>`).join('');

/* ---------- export PDF ---------- */
const printBox = $('#print');
let snapN = 0;
function snapStage(boardOnly) {
    stage.querySelectorAll('input').forEach(n => n.setAttribute('value', n.value));
    const page = stage.cloneNode(true), imgs = [];
    page.removeAttribute('id'); page.removeAttribute('style'); page.classList.remove('instant');
    const sfx = '-s' + (++snapN), ren = {};
    page.querySelectorAll('[id]').forEach(n => { if (n.closest('defs')) { ren[n.id] = n.id + sfx; n.id += sfx; } else n.removeAttribute('id'); });
    if (Object.keys(ren).length) page.querySelectorAll('*').forEach(e => [...e.attributes].forEach(a => {
        const v = a.value.replace(/url\(\s*['"]?#([^)'"\s]+)['"]?\s*\)/g, (m, k) => ren[k] ? `url(#${ren[k]})` : m).replace(/^#(.+)$/, (m, k) => ren[k] && /href$/.test(a.name) ? '#' + ren[k] : m);
        if (v !== a.value) e.setAttribute(a.name, v);
    }));
    page.querySelectorAll('.ui-spot, canvas.hllive').forEach(n => n.remove());
    [['canvas.ink', ink, inkMarked, 'ink'], ['canvas.hlmain', hlc, hlMarked, 'ui-hlc']].forEach(([sel, src, marked, cls]) => {
        const cv = page.querySelector(sel); if (!cv) return;
        if (marked) { const img = new Image(); img.className = cls; img.alt = ''; img.src = src.toDataURL(); cv.replaceWith(img); imgs.push(img); }
        else cv.remove();
    });
    if (boardOnly) page.querySelectorAll('.top, .content, .caption, .progress').forEach(n => n.remove());
    return { page, imgs };
}
function runScene(i) {
    build(i);
    events.slice().sort((a, b) => a.t - b.t).forEach(e => { if (!e.done) { e.done = true; e.fn(); } });
    progress.style.transition = 'none'; progress.style.width = '100%';
}
function buildThumbs() {
    exporting = true;
    for (let i = 0; i < scenes.length; i++) {
        runScene(i);
        const { page } = snapStage(false);
        page.querySelectorAll('canvas, img.ink, img.ui-hlc, .ui-blayer').forEach(n => n.remove());
        thumbs[i] = page;
    }
    exporting = false;
}
async function exportPDF() {
    if (document.activeElement) document.activeElement.blur();
    zoomReset();
    printBox.innerHTML = '';
    const imgs = [];
    if (wbOpen) {
        const keep = wbPage;
        for (let p = 0; p < wbPages; p++) {
            wbPage = p; loadSurface(); syncWB();
            const r = snapStage(true); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        wbPage = keep; loadSurface(); syncWB();
    } else {
        const keepIdx = idx, keepBeat = beat;
        exporting = true;
        for (let i = 0; i < scenes.length; i++) {
            runScene(i);
            const r = snapStage(false); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        exporting = false;
        go(keepIdx, keepBeat);
    }
    await Promise.all([...imgs, ...printBox.querySelectorAll('img')].map(im => im.decode().catch(() => {})));
    window.print();
}
$('#pdf').onclick = exportPDF;
$('#wbpdf').onclick = () => { $('#wbpdf').blur(); exportPDF(); };
window.addEventListener('afterprint', () => { printBox.innerHTML = ''; });

document.addEventListener('keydown', e => {
    if (isTyping(e)) return;
    if (e.ctrlKey || e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); e.shiftKey ? redoInk() : undoInk(); }
        else if (k === 'y') { e.preventDefault(); redoInk(); }
        return;
    }
    if (e.altKey) return;
    if (e.key === 'p' || e.key === 'P') setTool(tool === 'pen' ? null : 'pen');
    if (e.key === 'e' || e.key === 'E') setTool(tool === 'eraser' ? null : 'eraser');
    if (e.key === 'c' || e.key === 'C') clearInk();
    if (e.key === 's' || e.key === 'S') toggleSubs();
    if (e.key === 't' || e.key === 'T') ftShow(ftEl.hidden);
    if (e.key === 'u' || e.key === 'U') setUI(!document.body.classList.contains('noui'));
    if (e.key === 'z' || e.key === 'Z') setZoom(!Z.on);
    if (e.key === 'l' || e.key === 'L') setLock(!Z.locked);
    if (e.key === 'h' || e.key === 'H') setSpot(!SP.on);
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'm' || e.key === 'M') toggleMenu(engMenu);
    if (e.key === 'b' || e.key === 'B') { e.preventDefault(); closeMenus(); addText(true); }
    if (e.key === 'y' || e.key === 'Y') setTool(tool === 'hl' ? null : 'hl');
    if (e.key === 'w' || e.key === 'W') toggleWB();
    if (e.key === 'k' || e.key === 'K') openModal('blk');
    if ((e.key === 'g' || e.key === 'G') && !wbOpen) openModal('ovw');
    if (e.key === '?' || e.key === '/') { e.preventDefault(); openModal('keys'); }
    if (/^[1-5]$/.test(e.key) && engMenu.classList.contains('ui-open')) { addBadge(ENG_KEYS[+e.key - 1]); closeMenus(); }
    if (e.key === 'Escape') closeMenus();
    if (e.key === 'Escape') setTool(null);
});

const controlsEl = document.querySelector('.controls');
function fit() {
    const st = $('#stage'), noui = document.body.classList.contains('noui');
    const vw = window.innerWidth - (noui ? 0 : 40), vh = window.innerHeight - (noui ? 0 : controlsEl.offsetHeight + 20);
    const k = Math.min(vw / 1280, vh / 720);
    scaleK = k;
    st.style.transform = `scale(${k})`;
    st.style.margin = `${(720 * k - 720) / 2}px ${(1280 * k - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); buildThumbs(); go(0); });
</script>
