<style>
    :root {

    * { box-sizing: border-box; }

        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* buckles */
    .hright { display: flex; align-items: flex-end; gap: 28px; }
    .bcount { display: flex; align-items: center; gap: 10px; }

    .bcount .num { font-family: var(--cond); font-size: 34px; font-weight: 900; line-height: 1; }
    .bcount .lbl { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }
    .award { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 30;
        background: #fff; border: 3px solid var(--pink); border-radius: 12px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        box-shadow: 0 20px 50px rgba(27,31,69,.25); transition: opacity .3s, transform .35s var(--ease); }

    .award-img { width: 140px; height: auto; }
    .award-text { font-family: var(--cond); font-size: 40px; font-weight: 900; color: var(--pink); text-transform: uppercase; letter-spacing: .04em; }

    /* question frame */

    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 22px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg basics */

    .olbl { font-family: var(--cond); font-size: 24px; font-weight: 900; fill: var(--navy); text-anchor: middle; }

    .vs { font-family: var(--cond); font-size: 34px; font-weight: 900; fill: #c3c6d0; text-anchor: middle; text-transform: uppercase; }
    .mtag rect { fill: #fff; stroke: var(--navy); stroke-width: 3; transition: fill .3s, stroke .3s; }
    .mtag text { font-family: var(--cond); font-size: 24px; font-weight: 900; fill: var(--navy); text-anchor: middle; transition: fill .3s; }
    .mtag.ok rect { fill: var(--pink); stroke: var(--pink); } .mtag.ok text { fill: #fff; }
    .rlb { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; fill: var(--mid-grey); }
    .rd { font-family: var(--cond); font-size: 30px; font-weight: 900; fill: #fff; }
    .fade { transition: opacity .6s; }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }
    .pred .opts { width: 390px; flex-shrink: 0; }
    .pred .opt { min-height: 72px; font-size: 22px; font-weight: 700; padding: 8px 16px; }

    /* picture choices */
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px; cursor: pointer;
        display: flex; align-items: center; gap: 14px; font-family: inherit; color: var(--navy); text-align: left; transition: background-color .2s, border-color .2s, opacity .2s; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }
    .wcol { flex: 1; display: flex; flex-direction: column; gap: 12px; height: 100%; justify-content: center; }
    .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .wgrid .pcard { padding: 8px 14px 8px 44px; }
    .wgrid .nm { font-size: 30px; font-weight: 800; line-height: 1.1; }
    .wgrid .gv { font-family: var(--cond); font-size: 24px; font-weight: 800; color: var(--pink); }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .col { display: flex; flex-direction: column; }
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .replay { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }

    /* quick fire */
    .qf { display: flex; gap: 26px; width: 100%; height: 100%; }
    .qwrap { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .qstack { position: relative; flex: 1; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; background: #fff; }
    .qc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 50px 20px; text-align: center; animation: qin .45s var(--ease); }
    .qc.out { animation: qout .32s var(--ease) forwards; }

    @keyframes qout { to { opacity: 0; transform: translateX(-80px); } }
    .qc .ask { position: absolute; left: 20px; top: 16px; }
    .qc .big { font-family: var(--cond); font-size: 136px; font-weight: 900; line-height: 1; letter-spacing: .01em; }
    .qc .txt { font-size: 42px; font-weight: 800; line-height: 1.2; max-width: 640px; }
    .stamp { position: absolute; right: 26px; top: 20px; font-family: var(--cond); font-size: 36px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--pink);
        border: 4px solid var(--pink); border-radius: 8px; padding: 4px 16px 1px; transform: rotate(-8deg); animation: stampIn .35s var(--ease); background: #fff; }
    @keyframes stampIn { from { opacity: 0; transform: rotate(-8deg) scale(1.9); } to { opacity: 1; transform: rotate(-8deg) scale(1); } }
    .pips { display: flex; gap: 8px; align-items: center; }
    .pips i { width: 26px; height: 10px; border-radius: 3px; background: var(--light-grey); transition: background-color .3s; }
    .pips i.on { background: var(--navy); } .pips i.ok { background: var(--pink); }
    .pips .pn { margin-left: auto; }
    .qchoices { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
    .qbtn { display: flex; align-items: center; gap: 18px; border: 3px solid var(--navy); border-radius: 10px; background: #fff; padding: 18px 22px; cursor: pointer;
        font-family: var(--cond); font-size: 46px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--navy); text-align: left; line-height: 1;
        box-shadow: 0 5px 0 #c3c6d0; transition: background-color .2s, border-color .2s, color .2s, box-shadow .2s; }
    .qbtn small { display: block; font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--mid-grey); margin-top: 6px; }
    .qbtn:hover:not(:disabled) { background: #f6f7fb; }
    .qbtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #c3c6d0; }
    .qbtn:disabled { cursor: default; }
    .qbtn.right, .qbtn.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: none; }
    .qbtn.right small { color: rgba(255,255,255,.85); }
    .qbtn.wrong { border-style: dashed; animation: shake .4s; }
    .qbtn .ic { width: 62px; height: 62px; flex-shrink: 0; }

    /* formula card + calculations */
    .fcard { border: 3px solid var(--navy); border-left: 12px solid var(--pink); border-radius: 8px; padding: 10px 20px 12px; background: #fff; }
    .fcard { display: flex; flex-wrap: wrap; align-items: center; column-gap: 18px; row-gap: 10px; }
    .fcard .fbody { flex: 1 1 auto; }
    .calc-cta { position: relative; display: flex; align-items: center; gap: 10px; flex-shrink: 0; font-family: var(--cond); font-size: 22px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
        background: var(--pink); color: #fff; border: 3px solid var(--pink); border-radius: 8px; padding: 9px 16px 8px 12px; cursor: pointer; line-height: 1.05; text-align: left;
        box-shadow: 0 4px 0 #b3006a; transition: background-color .2s, color .2s, box-shadow .2s; }
    .calc-cta small { display: block; font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0; text-transform: none; opacity: .9; margin-top: 2px; }
    .calc-cta svg { width: 30px; height: 30px; flex-shrink: 0; }
    .calc-cta:hover { background: #d1007b; }
    .calc-cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #b3006a; }
    .calc-cta:focus-visible { outline-color: var(--navy); }
    .calc-cta.on { background: #fff; color: var(--pink); box-shadow: 0 4px 0 #f3b9d8; }
    .fcard.cmp .calc-cta { font-size: 19px; padding: 7px 12px 6px 10px; }
    .fcard.cmp .calc-cta svg { width: 24px; height: 24px; }
    .fcard.cmp .calc-cta small { display: none; }
    .bside .pool { min-height: 0; padding: 10px; gap: 8px; }
    .bside .pool .tile { padding: 4px 12px; font-size: 22px; }
    .fcard .fm { font-size: 30px; font-weight: 800; line-height: 1.2; margin-top: 4px; white-space: nowrap; }
    .fcard .fu { white-space: nowrap; }
    .fcard .fu { font-family: var(--cond); font-size: 24px; font-weight: 800; letter-spacing: .03em; color: var(--mid-grey); margin-top: 2px; }
    .fcard .fu b { color: var(--navy); }
    .fcard .fm2 { border-top: 2px solid var(--light-grey); margin-top: 8px; padding-top: 6px; }
    .fcard.cmp { padding: 8px 14px 10px; border-left-width: 10px; }
    .fcard.cmp .fm { font-size: 23px; } .fcard.cmp .fu { font-size: 19px; }
    .ccol { flex: 1; display: flex; flex-direction: column; gap: 14px; height: 100%; justify-content: center; min-width: 0; }
    .arow { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 800; }
    .arow .vr { font-family: var(--cond); font-size: 36px; font-weight: 900; }
    .arow .un { font-family: var(--cond); font-size: 27px; font-weight: 800; color: var(--mid-grey); margin-left: -4px; }
    .arow .op { color: var(--mid-grey); }
    .num-in { width: 104px; height: 60px; border: 3px solid var(--navy); border-radius: 8px; font-family: var(--cond); font-size: 34px; font-weight: 800; color: var(--navy); text-align: center;
        background: #fff; -webkit-user-select: text; user-select: text; outline: none; padding: 0 6px; transition: background-color .2s, border-color .2s, color .2s, box-shadow .2s; }
    .num-in.wide { width: 170px; }
    .num-in:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.18); }
    .num-in.right, .num-in.right:disabled { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: none; }
    .num-in.wrong { border-style: dashed; animation: shake .4s; }
    .num-in:disabled { opacity: 1; -webkit-text-fill-color: currentColor; }
    .units { display: flex; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; }
    .ub { font-family: var(--cond); font-size: 28px; font-weight: 900; color: var(--navy); background: #fff; border: none; width: 72px; height: 54px; cursor: pointer; transition: background-color .2s, color .2s; }
    .ub + .ub { border-left: 3px solid var(--navy); }
    .ub:hover:not(:disabled) { background: #f6f7fb; }
    .ub.sel, .ub.sel:hover { background: var(--navy); color: #fff; }
    .units.right { border-color: var(--pink); } .units.right .ub.sel { background: var(--pink); }
    .units.right .ub + .ub { border-left-color: var(--pink); }
    .units.wrong { border-style: dashed; animation: shake .4s; }
    .ub:disabled { cursor: default; }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }

    /* sort */
    .sort { display: grid; grid-template-columns: 1fr 400px 1fr; gap: 18px; width: 100%; height: 100%; }

    /* scene + side panel */
    .bwrap { position: relative; width: 806px; height: 336px; border: 3px solid var(--navy); border-radius: 8px; flex-shrink: 0; background: #fff; }
    .bwrap > svg { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 6px; }
    .slot { position: absolute; height: 48px; border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.85); transition: border-color .2s, background-color .2s; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.08); }
    .slot.armed { border-color: #e7a3c9; cursor: pointer; }
    .slot.filled { border-color: transparent; background: none; }
    .slot.wrong { animation: shake .4s; }
    .slot .tile { box-shadow: none; padding: 5px 14px; font-size: 23px; }
    .bside { width: 324px; display: flex; flex-direction: column; gap: 10px; height: 336px; }
    .bside .pool { flex: 1; }

    /* cloze */
    .cz { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .crow { display: flex; align-items: center; gap: 22px; }
    .crow > svg { flex-shrink: 0; border: 3px solid var(--navy); border-radius: 8px; background: #fff; }
    .ctext { font-size: 26px; font-weight: 600; line-height: 1.3; }
    .ctext b { font-weight: 800; }
    .cslot { display: inline-flex; vertical-align: middle; min-width: 132px; height: 48px; border: 3px dashed #c3c6d0; border-radius: 8px; margin: 3px 4px; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .cslot.hover, .cslot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .cslot.armed { border-color: #e7a3c9; cursor: pointer; }
    .cslot.filled { border-color: transparent; }
    .cslot.wrong { animation: shake .4s; }
    .cslot .tile { box-shadow: none; padding: 4px 14px; font-size: 23px; }
    .cz .pool { flex-direction: row; margin-top: 4px; min-height: 70px; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 22px 60px 26px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .scorecard .big { font-family: var(--cond); font-size: 96px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: 8px; }
    .scorecard .dlbl { margin-top: 8px; }
    .scorecard .sub { margin-top: 18px; }
    .done-buckle { width: 90px; height: 90px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 22px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }
    /* calculator */
    .calc { position: absolute; z-index: 25; width: 284px; background: #fff; border: 3px solid var(--navy); border-radius: 10px; box-shadow: 0 18px 40px rgba(27,31,69,.22); overflow: hidden; outline: none; }
    .calc[hidden] { display: none; }
    .calc.pop { animation: calcIn .3s var(--ease); }
    @keyframes calcIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
    .calc:focus-visible { box-shadow: 0 0 0 4px rgba(234,0,138,.3), 0 18px 40px rgba(27,31,69,.22); }
    .calc-bar { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 7px 8px 7px 14px; cursor: grab; touch-action: none; }
    .calc-bar.grab { cursor: grabbing; }
    .calc-bar .ttl { font-family: var(--cond); font-size: 20px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; flex: 1; }
    .calc-bar .grip { width: 18px; height: 18px; opacity: .55; }
    .calc-x { width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .calc-x:hover { background: rgba(255,255,255,.15); }
    .calc-x:focus-visible { outline-color: #fff; }
    .calc-scr { padding: 6px 16px 6px; text-align: right; border-bottom: 3px solid var(--navy); background: var(--blank); }
    .calc-scr .ex { font-family: var(--cond); font-size: 20px; font-weight: 800; color: var(--mid-grey); min-height: 24px; white-space: pre; overflow: hidden; direction: rtl; }
    .calc-scr .ex span { direction: ltr; unicode-bidi: isolate; }
    .calc-scr .rs { font-family: var(--cond); font-size: 36px; font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; }
    .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 9px 10px; }
    .ck { height: 40px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; font-family: var(--cond); font-size: 26px; font-weight: 900; color: var(--navy); cursor: pointer;
        box-shadow: 0 3px 0 #c3c6d0; transition: background-color .15s; }
    .ck:hover { background: #f6f7fb; }
    .ck:active, .ck.hit { transform: translateY(2px); box-shadow: 0 1px 0 #c3c6d0; background: var(--tint); }
    .ck.op { color: var(--pink); }
    .ck.fn { font-size: 20px; letter-spacing: .06em; }
    .ck.eq { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 3px 0 #b3006a; grid-row: span 2; height: auto; }
    .ck.eq:active, .ck.eq.hit { background: #c90077; box-shadow: 0 1px 0 #b3006a; }
    .ck.zero { grid-column: span 2; }
    .calc-scr { position: relative; }
    .calc-ins { position: absolute; left: 8px; top: 7px; height: 30px; border: 2px solid var(--navy); border-radius: 6px; background: var(--navy); color: #fff; padding: 0 10px;
        font-family: var(--cond); font-size: 16px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    .calc-ins[hidden] { display: none; }
    .calc-ins:hover:not(:disabled) { background: var(--pink); border-color: var(--pink); }
    .calc-ins:disabled { background: transparent; color: #c3c6d0; border-color: #c3c6d0; cursor: default; }
    .calc-ins:not([hidden]) ~ .ex { padding-left: 120px; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Mass or <span>weight?</span></h1>
        <div class="hright">
            <div class="counter" id="counter"></div>
            <div class="bcount" title="Buckles earned">
                <img src="buckle.svg" alt="" class="counter-icon" onerror="this.style.visibility='hidden'">
                <div class="num" id="buckleCount">0</div>
                <div class="lbl">Buckles</div>
            </div>
        </div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
    <div class="calc" id="calc" role="dialog" aria-label="Calculator" tabindex="-1" hidden>
        <div class="calc-bar" id="calcBar"><svg class="grip" viewBox="0 0 18 18" fill="#fff"><circle cx="5" cy="4" r="1.6"/><circle cx="13" cy="4" r="1.6"/><circle cx="5" cy="9" r="1.6"/><circle cx="13" cy="9" r="1.6"/><circle cx="5" cy="14" r="1.6"/><circle cx="13" cy="14" r="1.6"/></svg><span class="ttl">Calculator</span><button class="calc-x" id="calcX" aria-label="Close calculator">&times;</button></div>
        <div class="calc-scr"><button class="calc-ins" id="calcIns" hidden>Put in answer</button><div class="ex" id="calcEx"></div><div class="rs" id="calcRs">0</div></div>
        <div class="calc-keys" id="calcKeys"></div>
    </div>
</div>

<div class="award" id="award" role="status" aria-live="polite">
    <img src="penguin-with-buckle.svg" alt="" class="award-img" onerror="this.style.display='none'">
    <div class="award-text" id="awardText">+1 Buckle!</div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const NS = 'http://www.w3.org/2000/svg';
const NV = '#1b1f45', PK = '#ea008a', GR = '#c9ccd6', LT = '#f0f3f6', MG = '#b8bcc8', SK = '#d7dae2';
let scaleK = 1, UID = 0;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t);
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }
/* settle from one value to another with a damped wobble, like a spring or a balance beam */
function damp(from, to, dur, apply) { return play(dur, k => apply(to + (from - to) * Math.exp(-5 * k) * Math.cos(k * Math.PI * 5))).then(() => apply(to)); }

/* ---------- drawing helpers ---------- */
const f1 = n => String(Math.round(n * 10) / 10);
const tx = (x, y, s, cls = '', st = '') => `<text class="t ${cls}" x="${f1(x)}" y="${f1(y)}"${st ? ` style="${st}"` : ''}>${s}</text>`;
const DIR = { r: 0, l: Math.PI, u: -Math.PI / 2, d: Math.PI / 2 };
function arrowSVG(x, y, ang, len, o = {}) {
    const c = o.c || PK, sw = o.sw || 8, hw = o.hw || 13, hl = Math.min(o.hl || 22, len);
    if (len < 1) return '';
    const ux = Math.cos(ang), uy = Math.sin(ang), ex = x + ux * len, ey = y + uy * len, bx = ex - ux * hl, by = ey - uy * hl, px = -uy * hw, py = ux * hw;
    let s = len > hl ? `<line x1="${f1(x)}" y1="${f1(y)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="${c}" stroke-width="${sw}"/>` : '';
    s += `<polygon points="${f1(ex)},${f1(ey)} ${f1(bx + px)},${f1(by + py)} ${f1(bx - px)},${f1(by - py)}" fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/>`;
    if (o.label) {
        const fs = o.fs || 24, full = o.full || len, op = o.lop === undefined ? 1 : o.lop;
        const lx = x + (o.left ? -18 : 18), ly = o.ly !== undefined ? o.ly : y + uy * full / 2 + 8;
        s += `<text class="flbl" x="${f1(lx)}" y="${f1(ly)}" text-anchor="${o.left ? 'end' : 'start'}" opacity="${op}" style="font-size:${fs}px">${o.label}</text>`;
    }
    return s;
}
function growArrow(g, x, y, ang, len, o = {}, dur = 450) {
    const tok = g._tok = (g._tok || 0) + 1;
    return play(dur, k => { g.innerHTML = arrowSVG(x, y, ang, len * easeOut(k), { ...o, full: len, lop: k }); }, () => g._tok === tok && document.body.contains(g));
}
function clearArrow(g) { g._tok = (g._tok || 0) + 1; g.innerHTML = ''; }
const mtag = (x, y, t, cls = '') => { const w = Math.round(t.length * 12 + 28); return `<g class="mtag ${cls}"><rect x="${x - w / 2}" y="${y - 19}" width="${w}" height="38" rx="6"/><text x="${x}" y="${y + 8}">${t}</text></g>`; };

/* ---------- planets (drawn at radius 50, then scaled) ---------- */
const WORLD = { Mercury: 3.7, Venus: 8.9, Earth: 9.8, Moon: 1.6, Mars: 3.8, Jupiter: 24.8, Saturn: 10.4, Uranus: 8.7, Neptune: 11.2 };
function planet(k, cx, cy, r) {
    const id = 'pc' + (++UID), s = (r / 50).toFixed(4);
    const C = (x, y, rr, f) => `<circle cx="${x}" cy="${y}" r="${rr}" fill="${f}"/>`;
    const B = (y, h, f) => `<rect x="-50" y="${y}" width="100" height="${h}" fill="${f}"/>`;
    let base = LT, body = '', back = '', front = '', dash = '';
    if (k === 'Earth') { base = NV; body = `<path d="M-34 -30 C-16 -44 6 -38 4 -22 C2 -8 -16 -6 -14 8 C-12 22 -30 22 -38 6 C-46 -8 -44 -22 -34 -30Z M14 2 C28 -4 44 6 38 22 C32 34 18 38 12 28 C6 18 4 8 14 2Z M10 -46 C22 -50 36 -42 30 -34 C24 -28 12 -34 10 -46Z" fill="#5560a8"/>`; }
    else if (k === 'Moon') { body = C(-18, -14, 12, SK) + C(16, 12, 16, SK) + C(-10, 26, 7, SK) + C(22, -24, 6, SK); }
    else if (k === 'Mercury') { base = '#b8bcc8'; body = C(-16, -18, 11, '#9ea3b2') + C(18, 8, 14, '#9ea3b2') + C(-20, 22, 8, '#9ea3b2') + C(14, -30, 5, '#9ea3b2'); }
    else if (k === 'Venus') { base = '#f2f3f8'; body = `<g fill="none" stroke="#c3c6d0" stroke-width="6" stroke-linecap="round"><path d="M-50 -22 Q-24 -34 2 -22 T52 -24"/><path d="M-52 2 Q-26 -10 0 2 T52 0"/><path d="M-50 26 Q-24 14 2 26 T52 24"/></g>`; }
    else if (k === 'Mars') { base = '#f5a2cd'; body = C(-14, -4, 9, '#e97cb5') + C(18, 16, 12, '#e97cb5') + C(6, -24, 6, '#e97cb5') + `<ellipse cx="0" cy="-49" rx="22" ry="8" fill="#fff"/>`; }
    else if (k === 'Jupiter') { base = '#f2f3f8'; body = B(-42, 10, '#c3c6d0') + B(-24, 12, '#8a8fa6') + B(-6, 8, '#c3c6d0') + B(8, 14, '#8a8fa6') + B(30, 9, '#c3c6d0') + `<ellipse cx="16" cy="15" rx="11" ry="6" fill="${PK}"/>`; }
    else if (k === 'Saturn') {
        base = '#eceef4'; body = B(-32, 8, '#c9ccd6') + B(-12, 10, SK) + B(8, 8, '#c9ccd6') + B(26, 8, SK);
        const ring = sw => `<path d="M-94 0 A94 22 0 0 ${sw} 94 0" fill="none" stroke="${NV}" stroke-width="9"/><path d="M-80 0 A80 16 0 0 ${sw} 80 0" fill="none" stroke="#c3c6d0" stroke-width="5"/>`;
        back = `<g transform="rotate(-14)">${ring(1)}</g>`; front = `<g transform="rotate(-14)">${ring(0)}</g>`;
    }
    else if (k === 'Uranus') {
        base = '#d6dcef'; body = B(-6, 6, '#c3cbe4');
        back = `<g transform="rotate(-80)"><path d="M-84 0 A84 14 0 0 1 84 0" fill="none" stroke="${NV}" stroke-width="4"/></g>`; front = `<g transform="rotate(-80)"><path d="M-84 0 A84 14 0 0 0 84 0" fill="none" stroke="${NV}" stroke-width="4"/></g>`;
    }
    else if (k === 'Neptune') { base = '#3a4290'; body = `<path d="M-44 -8 Q-10 -18 34 -10" fill="none" stroke="#8b93cf" stroke-width="6" stroke-linecap="round"/><path d="M-30 28 Q0 20 30 30" fill="none" stroke="#5a62ad" stroke-width="5" stroke-linecap="round"/><ellipse cx="-6" cy="10" rx="12" ry="6" fill="#262c6b"/>`; }
    else if (k === 'Mystery') { base = '#fff'; dash = ' stroke-dasharray="9 7"'; front = `<text x="0" y="24" text-anchor="middle" style="font-family:var(--cond);font-size:68px;font-weight:900" fill="${PK}">?</text>`; }
    return `<g transform="translate(${cx} ${cy}) scale(${s})"><defs><clipPath id="${id}"><circle r="50"/></clipPath></defs>${back}<circle r="50" fill="${base}"/><g clip-path="url(#${id})">${body}</g><circle r="50" fill="none" stroke="${NV}" stroke-width="3" vector-effect="non-scaling-stroke"${dash}/>${front}</g>`;
}
function badge(k, g, x = 14, y = 12, name) {
    return `<g transform="translate(${x} ${y})"><rect width="214" height="56" rx="8" fill="#fff" stroke="${NV}" stroke-width="3"/>${planet(k, 30, 28, 17)}
        <text class="bn" x="58" y="25">${name || k}</text><text class="bg" x="58" y="47">g = ${g} m/s²</text></g>`;
}

/* ---------- grounds ---------- */
const GND = {
    Earth: (w, gy) => `<rect x="0" y="${gy}" width="${w}" height="200" fill="#f4f5f8"/><line class="gnd" x1="0" x2="${w}" y1="${gy}" y2="${gy}"/>`,
    Mars: (w, gy) => `<rect x="0" y="${gy}" width="${w}" height="200" fill="#fdf1f7"/><line x1="0" x2="${w}" y1="${gy}" y2="${gy}" stroke="#f3bcd9" stroke-width="4"/>
        <ellipse cx="${w * .12}" cy="${gy + 26}" rx="18" ry="6" fill="#f8d3e6"/><ellipse cx="${w * .8}" cy="${gy + 46}" rx="26" ry="8" fill="#f8d3e6"/><ellipse cx="${w * .55}" cy="${gy + 60}" rx="12" ry="4" fill="#f8d3e6"/>`,
    Moon: (w, gy) => `<rect x="0" y="${gy}" width="${w}" height="200" fill="${LT}"/><line class="gnd" x1="0" x2="${w}" y1="${gy}" y2="${gy}"/>
        <ellipse cx="${w * .14}" cy="${gy + 30}" rx="30" ry="8" fill="none" stroke="${SK}" stroke-width="3"/><ellipse cx="${w * .82}" cy="${gy + 48}" rx="40" ry="10" fill="none" stroke="${SK}" stroke-width="3"/><ellipse cx="${w * .5}" cy="${gy + 66}" rx="18" ry="5" fill="none" stroke="${SK}" stroke-width="3"/>`
};

/* ---------- objects ---------- */
const TIN = (cx, by) => `<path d="M${cx - 44} ${by - 96} Q${cx} ${by - 160} ${cx + 44} ${by - 96}" fill="none" stroke="${NV}" stroke-width="4"/>
    <rect class="obj" x="${cx - 50}" y="${by - 100}" width="100" height="100" rx="6"/><rect x="${cx - 50}" y="${by - 104}" width="100" height="12" rx="4" fill="${NV}"/>
    <rect x="${cx - 50}" y="${by - 70}" width="100" height="40" fill="#fff" stroke="${NV}" stroke-width="2"/><text class="oname" x="${cx}" y="${by - 43}" text-anchor="middle">Paint</text>`;
const DUMBBELL = (cx, gy) => {
    const plate = (x, w, h) => `<rect x="${x}" y="${gy - (h + 80) / 2}" width="${w}" height="${h}" rx="5" fill="${NV}"/>`;
    return `<rect x="${cx - 100}" y="${gy - 46}" width="200" height="12" rx="4" fill="${MG}" stroke="${NV}" stroke-width="2"/>
        ${plate(cx - 104, 24, 80)}${plate(cx - 80, 18, 58)}${plate(cx + 80, 24, 80)}${plate(cx + 62, 18, 58)}`;
};
const CAMERA = (cx, cy) => `<rect x="${cx - 30}" y="${cy - 52}" width="44" height="18" rx="4" fill="${NV}"/><rect class="obj" x="${cx - 64}" y="${cy - 38}" width="128" height="80" rx="12"/>
    <circle cx="${cx}" cy="${cy + 2}" r="28" fill="#fff" stroke="${NV}" stroke-width="4"/><circle cx="${cx}" cy="${cy + 2}" r="15" fill="${NV}"/><circle cx="${cx - 5}" cy="${cy - 3}" r="4" fill="#fff"/>
    <rect x="${cx + 36}" y="${cy - 28}" width="18" height="10" rx="2" fill="${PK}"/>`;
function rover(x, y, s) {
    const wheel = cx => `<circle cx="${cx}" cy="-12" r="12" fill="${NV}"/><circle cx="${cx}" cy="-12" r="4" fill="#fff"/>`;
    return `<g transform="translate(${x} ${y}) scale(${s})"><line x1="28" y1="-46" x2="28" y2="-76" stroke="${NV}" stroke-width="4"/><rect x="16" y="-88" width="30" height="14" rx="3" fill="${NV}"/>
        <rect x="-66" y="-60" width="70" height="8" rx="2" fill="${NV}"/><line x1="-32" y1="-52" x2="-32" y2="-46" stroke="${NV}" stroke-width="4"/>
        <rect class="obj" x="-52" y="-48" width="104" height="30" rx="5"/>${wheel(-38)}${wheel(0)}${wheel(38)}</g>`;
}
function astro(x, y, s) {
    return `<g transform="translate(${x} ${y}) scale(${s})"><g stroke="${NV}" stroke-width="7" stroke-linecap="round"><line x1="-8" y1="0" x2="-6" y2="-26"/><line x1="8" y1="0" x2="6" y2="-26"/>
        <line x1="-12" y1="-48" x2="-22" y2="-30"/><line x1="12" y1="-48" x2="22" y2="-32"/></g>
        <rect x="-24" y="-56" width="12" height="26" rx="3" fill="${LT}" stroke="${NV}" stroke-width="3"/><rect x="-15" y="-58" width="30" height="34" rx="9" fill="#fff" stroke="${NV}" stroke-width="4"/>
        <circle cx="0" cy="-70" r="13" fill="#fff" stroke="${NV}" stroke-width="4"/><ellipse cx="3" cy="-70" rx="8" ry="6" fill="${NV}"/></g>`;
}
/* things that hang from a spring scale hook at (0, 0) */
const SACK = lbl => `<line x1="0" y1="0" x2="0" y2="12" stroke="${NV}" stroke-width="4"/>
    <path d="M-32 18 Q-40 62 -36 88 Q0 98 36 88 Q40 62 32 18 Q0 24 -32 18 Z" class="obj"/><path d="M-16 18 L0 9 L16 18" fill="none" stroke="${NV}" stroke-width="4" stroke-linejoin="round"/>
    <text class="oname" x="0" y="46" text-anchor="middle" style="font-size:16px">Flour</text><text class="olbl" x="0" y="76">${lbl}</text>`;
const SUITCASE = `<line x1="0" y1="0" x2="0" y2="8" stroke="${NV}" stroke-width="4"/><path d="M-24 28 V16 Q-24 8 -16 8 H16 Q24 8 24 16 V28" fill="none" stroke="${NV}" stroke-width="7"/>
    <rect class="obj" x="-66" y="28" width="132" height="88" rx="10"/><line x1="-34" y1="28" x2="-34" y2="116" stroke="${GR}" stroke-width="4"/><line x1="34" y1="28" x2="34" y2="116" stroke="${GR}" stroke-width="4"/>
    <circle cx="-46" cy="121" r="6" fill="${NV}"/><circle cx="46" cy="121" r="6" fill="${NV}"/>`;
const CRATE = `<line x1="0" y1="0" x2="0" y2="10" stroke="${NV}" stroke-width="4"/><path d="M-30 24 L0 10 L30 24" fill="none" stroke="${NV}" stroke-width="3"/>
    <rect class="obj" x="-40" y="24" width="80" height="66" rx="4"/><path d="M-40 24 L40 90 M40 24 L-40 90" stroke="${GR}" stroke-width="3"/>
    <rect x="-26" y="44" width="52" height="28" rx="4" fill="#fff" stroke="${NV}" stroke-width="2"/><text class="olbl" x="0" y="66" style="font-size:22px">4 kg</text>`;

/* ---------- spring scale ---------- */
function springPath(y1, y2) {
    const n = 10, a = 8, top = y1 + 3, bot = y2 - 3, h = (bot - top) / n;
    let d = `M0 ${f1(y1)} L0 ${f1(top)}`;
    for (let i = 0; i < n; i++) d += ` L${i % 2 ? -a : a} ${f1(top + h * (i + .5))}`;
    return d + ` L0 ${f1(bot)} L0 ${f1(y2)}`;
}
function sscale(cls, x, y, s, obj, left) {
    let ticks = '';
    for (let i = 0; i <= 11; i++) { const yy = 46 + i * 10; ticks += `<line x1="-24" x2="${i % 5 === 0 ? -12 : -17}" y1="${yy}" y2="${yy}" stroke="${MG}" stroke-width="2"/>`; }
    const rx = left ? -146 : 34;
    return `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})">
        <rect x="-46" y="-10" width="92" height="9" rx="2" fill="${NV}"/><circle cx="0" cy="8" r="7" fill="none" stroke="${NV}" stroke-width="4"/>
        <rect x="-24" y="15" width="48" height="158" rx="10" fill="#fff" stroke="${NV}" stroke-width="3.5"/><rect x="-11" y="24" width="22" height="140" rx="3" fill="${LT}"/>${ticks}

        <g class="hang"><line x1="0" y1="0" x2="0" y2="132" stroke="${NV}" stroke-width="5"/><circle cx="0" cy="140" r="8" fill="none" stroke="${NV}" stroke-width="4"/><g class="hobj" transform="translate(0 148)">${obj}</g></g>
        <text class="rlb" x="${rx + 56}" y="94" text-anchor="middle">Reading</text><rect x="${rx}" y="102" width="112" height="50" rx="6" fill="${NV}"/><text class="rd" x="${rx + 56}" y="138" text-anchor="middle"></text></g>`;
}
function setSS(g, ext, txt) {
    g.querySelector('.spr').setAttribute('d', springPath(24, 46 + ext));
    g.querySelector('.ptr').setAttribute('y', f1(43 + ext));
    g.querySelector('.hang').setAttribute('transform', `translate(0 ${f1(46 + ext)})`);

}

function diagW(v, m, g, where) {
    if (near(v, m)) return 'That is the mass. Weight is the mass multiplied by gravity.';
    if (g !== 9.8 && near(v, m * 9.8)) return `That uses Earth’s gravity. Use the gravity on ${where} (${g} m/s²).`;
    if (near(v, m / g) || near(v, g / m)) return 'Multiply the mass by gravity. Don’t divide.';
    if (near(v, m + g)) return 'Multiply the mass by gravity. Don’t add them.';
    return `Multiply the mass (${m} kg) by the gravity on ${where} (${g} m/s²).`;
}

            b.classList.add('wrong'); b.disabled = true;

        shuffle(q.tiles).forEach(t => pool.appendChild(D.tile(t)));
        return {
            instr: 'Drag a weight under each world (or tap a weight, then a box), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check() {
                let hint = null, bad = 0;
                zones.forEach(z => {
                    const t = z.box.querySelector('.tile'), v = t.dataset.v; z.el.classList.remove('wrong');
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (v === z.ans) { t.classList.add('right'); z.locked = true; return; }
                    bad++; t.classList.add('wrong'); z.el.classList.add('wrong');
                    if (!hint) hint = v === '10 kg' ? 'That is the rover’s mass, which is the same everywhere. Each box needs a weight in newtons.'
                        : v === '10 N' ? 'Multiply the mass by gravity. On every one of these worlds, 10 kg weighs more than 10 N.'
                        : `On ${z.k === 'Moon' ? 'the Moon' : z.k}, the weight is 10 kg × ${z.g} m/s².`;
                });
                return bad ? { ok: false, hint: (bad > 1 ? `${bad} boxes need changing. ` : '') + hint } : { ok: true };
            },
            done() { svg.querySelector('.after').setAttribute('opacity', 1); }
        };
    },

    /* fill the gaps from a word bank */
    cloze(q, body) {
        body.style.flexDirection = 'column'; body.style.alignItems = 'stretch';
        const wrap = el('div', 'cz'), zones = [];
        q.rows.forEach(r => {
            const row = el('div', 'crow'); row.insertAdjacentHTML('beforeend', r.pic);
            const p = el('div', 'ctext');
            p.innerHTML = r.text.replace(/\{([^}]+)\}/g, (_, w) => `<span class="cslot" tabindex="0" data-a="${w}"></span>`);
            row.appendChild(p); wrap.appendChild(row);
        });
        const pool = el('div', 'pool'); wrap.appendChild(pool); body.appendChild(wrap);
        wrap.querySelectorAll('.cslot').forEach(s => zones.push({ el: s, box: s, cap: 1, ans: s.dataset.a, onPut: () => s.classList.add('filled'), onTake: () => s.classList.remove('filled') }));
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => { zones.forEach(z => z.el.classList.remove('wrong')); refresh(); });
        shuffle(q.bank).forEach(w => pool.appendChild(D.tile(w)));
        return {
            instr: 'Drag a word into each gap (or tap a word, then a gap), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check() {
                let hint = null, bad = 0;
                zones.forEach((z, i) => {
                    const t = z.box.querySelector('.tile'); t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.dataset.v === z.ans) { t.classList.add('right'); z.locked = true; }
                    else { bad++; t.classList.add('wrong'); z.el.classList.add('wrong'); if (!hint) hint = q.hints[i]; }
                });
                return bad ? { ok: false, hint: (bad > 1 ? `${bad} gaps need changing. ` : '') + hint } : { ok: true };
            }
        };
    },

    sort(q, body) {
        const wrap = el('div', 'sort');
        const mk = (cls, h, sub) => { const b = el('div', 'bin ' + cls, `<h3>${h}</h3><div class="sub">${sub}</div><div class="area"></div>`); b.tabIndex = 0; return b; };
        const [b1, b2] = q.bins;
        const bc = mk('', b1[1], b1[2]), bn = mk('pk', b2[1], b2[2]);
        const pool = el('div', 'pool');
        wrap.append(bc, pool, bn); body.appendChild(wrap);
        const zones = [{ el: bc, box: bc.querySelector('.area'), cap: Infinity, key: b1[0] }, { el: bn, box: bn.querySelector('.area'), cap: Infinity, key: b2[0] }];
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
        shuffle(q.items).forEach(([t, k, h]) => { const tl = D.tile(t); tl.classList.add('sm'); tl.k = k; tl.h = h; pool.appendChild(tl); });
        return {
            instr: 'Drag each tile into a group (or tap a tile, then a group), then press <b>Check</b>.',
            ready: () => !pool.querySelector('.tile'),
            check() {
                const wrong = [];
                zones.forEach(z => z.box.querySelectorAll('.tile').forEach(t => {
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.k === z.key) t.classList.add('right'); else { t.classList.add('wrong'); wrong.push(t.h); }
                }));
                return wrong.length ? { ok: false, hint: (wrong.length > 1 ? `${wrong.length} tiles need moving. ` : '') + wrong[0] } : { ok: true };
            }
        };
    }
};

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sel = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sel) sel.classList.remove('sel'); sel = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sel && !z.locked) put(sel, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(text) {
        const t = el('span', 'tile', text);
        t.dataset.v = text;
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right')) return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { put(t, pool); return; }
            if (sel === t) { deselect(); return; }
            deselect(); sel = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}


/* ---------- floating calculator ---------- */
window.Calc = (() => {
    const box = $('#calc'), bar = $('#calcBar'), keys = $('#calcKeys'), exEl = $('#calcEx'), rsEl = $('#calcRs'), ins = $('#calcIns');
    const POS = 'calc-pos-' + PAGE_ID, W = 284;
    const SYM = { '/': '÷', '*': '×', '-': '−', '+': '+' };
    let toks = [], entry = '0', fresh = true, justEq = false, lastIn = null;
    const LAYOUT = [['C', 'fn'], ['⌫', 'fn', 'Backspace'], ['÷', 'op', '/'], ['×', 'op', '*'], ['7'], ['8'], ['9'], ['−', 'op', '-'], ['4'], ['5'], ['6'], ['+', 'op', '+'],
        ['1'], ['2'], ['3'], ['=', 'eq', '='], ['0', 'zero'], ['.']];
    LAYOUT.forEach(([t, cls, k]) => {
        const b = el('button', 'ck' + (cls ? ' ' + cls : ''), t);
        b.dataset.k = k || t; b.setAttribute('aria-label', { '÷': 'Divide', '×': 'Multiply', '−': 'Subtract', '+': 'Add', '⌫': 'Delete', C: 'Clear', '=': 'Equals' }[t] || t);
        b.addEventListener('mousedown', e => e.preventDefault());
        b.onclick = () => press(b.dataset.k);
        keys.appendChild(b);
    });
    const fmt = v => { if (!isFinite(v)) return 'Error'; const r = parseFloat(v.toPrecision(10)); return String(r); };
    function evaluate(t) {
        /* multiply and divide first, then add and subtract, left to right */
        const a = [t[0]];
        for (let i = 1; i < t.length; i += 2) {
            const op = t[i], n = t[i + 1];
            if (op === '*') a[a.length - 1] *= n; else if (op === '/') a[a.length - 1] /= n; else a.push(op, n);
        }
        let v = a[0];
        for (let i = 1; i < a.length; i += 2) v = a[i] === '+' ? v + a[i + 1] : v - a[i + 1];
        return v;
    }
    const setEx = s => { exEl.innerHTML = ''; exEl.appendChild(el('span', '', '')).textContent = s; };
    const show = () => {
        setEx(toks.map(x => typeof x === 'number' ? fmt(x) : ` ${SYM[x]} `).join('') || '\u00a0');
        rsEl.textContent = entry;
        refreshIns();
    };
    function press(k) {
        if (entry === 'Error' && k !== 'C') { toks = []; entry = '0'; fresh = true; }
        if (/^[0-9]$/.test(k)) {
            if (justEq) { toks = []; justEq = false; }
            if (fresh) { entry = k; fresh = false; } else if (entry.replace(/[^0-9]/g, '').length < 12) entry = entry === '0' ? k : entry + k;
        } else if (k === '.') {
            if (justEq) { toks = []; justEq = false; }
            if (fresh) { entry = '0.'; fresh = false; } else if (!entry.includes('.')) entry += '.';
        } else if (k === 'Backspace') {
            if (justEq) { toks = []; justEq = false; }
            else if (!fresh) { entry = entry.length > 1 ? entry.slice(0, -1) : '0'; if (entry === '0') fresh = true; }
        } else if (k === 'C') { toks = []; entry = '0'; fresh = true; justEq = false; }
        else if ('+-*/'.includes(k)) {
            if (justEq) { toks = []; justEq = false; }
            if (fresh && toks.length && typeof toks[toks.length - 1] === 'string') toks[toks.length - 1] = k;
            else {
                toks.push(parseFloat(entry));
                /* running value: whole sum for + and −, just the current × ÷ chain for × and ÷ */
                let from = 0; if ('*/'.includes(k)) for (let i = toks.length - 1; i > 0; i--) if (toks[i] === '+' || toks[i] === '-') { from = i + 1; break; }
                entry = fmt(evaluate(toks.slice(from))); toks.push(k);
            }
            fresh = true;
        } else if (k === '=') {
            if (justEq || !toks.length) return show();
            if (fresh && typeof toks[toks.length - 1] === 'string') toks.pop();
            else toks.push(parseFloat(entry));
            entry = fmt(evaluate(toks)); toks.push('=');
            justEq = true; fresh = true;
            setEx(toks.slice(0, -1).map(x => typeof x === 'number' ? fmt(x) : ` ${SYM[x]} `).join('') + ' =');
            rsEl.textContent = entry; refreshIns(); return;
        }
        show();
    }
    /* keyboard, only while the calculator has focus */
    const KEYMAP = { Enter: '=', '=': '=', Escape: 'C', Delete: 'C', x: '*', X: '*', ',': '.' };
    box.addEventListener('keydown', e => {
        if (e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
        const k = KEYMAP[e.key] || e.key;
        if (/^[0-9]$/.test(k) || ['+', '-', '*', '/', '.', '=', 'Backspace', 'C'].includes(k)) {
            e.preventDefault(); press(k);
            const b = keys.querySelector(`[data-k="${CSS.escape(k)}"]`); if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); }
        }
    });
    /* put the result into the answer box the student last used (or the first empty one) */
    document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('num-in')) lastIn = e.target; });
    const target = () => {
        const open = [...document.querySelectorAll('.num-in')].filter(i => !i.disabled);
        if (!open.length) return null;
        return open.includes(lastIn) ? lastIn : open.find(i => !i.value.trim()) || open[0];
    };
    function refreshIns() { const any = document.querySelector('.num-in'); ins.hidden = !any; ins.disabled = !target() || entry === 'Error'; }
    ins.onclick = () => {
        const t = target(); if (!t) return;
        t.value = entry; t.dispatchEvent(new Event('input', { bubbles: true })); t.focus();
    };
    /* position: dragged by the title bar, kept inside the page, remembered */
    const clamp = (x, y) => [Math.max(0, Math.min(1280 - W, x)), Math.max(0, Math.min(720 - box.offsetHeight, y))];
    const place = (x, y) => { [x, y] = clamp(x, y); box.style.left = x + 'px'; box.style.top = y + 'px'; return [x, y]; };
    const load = () => { try { const p = JSON.parse(localStorage.getItem(POS)); if (p && isFinite(p.x) && isFinite(p.y)) return [p.x, p.y]; } catch (e) {} const sc = document.querySelector('#content .bwrap, #content .scene'), st = $('#stage').getBoundingClientRect();
        if (sc) { const r = sc.getBoundingClientRect(); return [Math.max(10, (r.right - st.left) / scaleK - W - 12), (document.querySelector('#content .body').getBoundingClientRect().top - st.top) / scaleK - 4]; }
        return [1280 - W - 40, 190]; };
    const save = (x, y) => { try { localStorage.setItem(POS, JSON.stringify({ x, y })); } catch (e) {} };
    bar.addEventListener('pointerdown', e => {
        if (e.button > 0 || e.target.closest('.calc-x')) return;
        e.preventDefault(); bar.setPointerCapture(e.pointerId); bar.classList.add('grab');
        const sx = e.clientX, sy = e.clientY, x0 = box.offsetLeft, y0 = box.offsetTop;
        const mv = ev => place(x0 + (ev.clientX - sx) / scaleK, y0 + (ev.clientY - sy) / scaleK);
        const up = () => { bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); bar.classList.remove('grab'); save(box.offsetLeft, box.offsetTop); };
        bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
    });
    /* the call-to-action buttons live in each formula card */
    function syncCta() {
        document.querySelectorAll('.calc-cta').forEach(b => {
            const on = !box.hidden;
            b.classList.toggle('on', on);
            b.setAttribute('aria-expanded', String(on));
            b.querySelector('.cl').innerHTML = on ? 'Close calculator<small>Hide it again</small>' : 'Open calculator<small>Do the sum here</small>';
        });
    }
    function open() {
        box.hidden = false; box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
        place(...load()); syncCta(); refreshIns(); box.focus();
    }
    function close() { box.hidden = true; syncCta(); const c = document.querySelector('.calc-cta'); if (c) c.focus(); }
    document.addEventListener('click', e => { if (e.target.closest('.calc-cta')) box.hidden ? open() : close(); });
    $('#calcX').onclick = close;
    show();
    const hasSaved = () => { try { return !!localStorage.getItem(POS); } catch (e) { return false; } };
    return {
        refresh: () => { syncCta(); if (!box.hidden) refreshIns(); },
        /* new question: if the student hasn't moved it yet, move it clear of the new layout */
        moved: () => { if (!box.hidden && !hasSaved()) place(...load()); }
    };
})();

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
window.addEventListener('storage', e => { if (e.key === 'buckles-shared') refreshCount(); });
fit(); refreshCount();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    fit(); refreshCount();
    const pos = Buckles.getPos();
    if (pos >= TOTAL) { qi = TOTAL - 1; finish(); } else { qi = Math.max(0, pos); render(); }
});
