<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Phases: Checking for Understanding</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%231b1f45"/><path d="M15 31 L27 43 L49 19" fill="none" stroke="%23ea008a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="52" width="40" height="5" rx="2.5" fill="%23fff" opacity=".25"/><rect x="12" y="52" width="26" height="5" rx="2.5" fill="%23fff"/></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* svg classes */
    svg { overflow: visible; display: block; }
    .oname { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .flbl { font-family: var(--cond); font-size: 24px; font-weight: 800; fill: var(--navy); }
    .spd { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; fill: var(--mid-grey); }
    .leg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }
    .nlbl { font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; fill: #fff; }
    .nsm { font-size: 17px; }
    .halo { paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
    .iq { font-family: var(--cond); font-size: 96px; font-weight: 900; fill: #fff; }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opts.g2 { grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opts.g2 .opt { min-height: 104px; font-size: 30px; font-weight: 700; padding: 16px 24px; }
    .opts.big .opt, .col .opts.big .opt { font-size: 29px; font-weight: 700; padding: 14px 20px; min-height: 70px; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }
    .gly { flex-shrink: 0; }
    .gs { fill: none; stroke: var(--navy); stroke-width: 3; }
    .opt.right .gs { stroke: #fff; }
    .pred .opts { width: 380px; }
    .pred .opt { min-height: 76px; font-size: 25px; font-weight: 700; padding: 10px 18px; }

    /* picture choices */
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; width: 100%; }
    .pgrid.g22 { grid-template-columns: 1fr 1fr; gap: 14px; width: 500px; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 16px 4px 12px; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .2s; }
    .pgrid.g22 .pcard { padding: 10px 8px 8px; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 23px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s; }
    .pcard .cap { font-size: 22px; font-weight: 700; line-height: 1.2; text-align: center; }
    .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .pcard.sel { background: var(--tint); }
    .pcard.sel .l { background: var(--pink); }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 5px rgba(234,0,138,.18); opacity: 1; }
    .pcard.right .l { background: var(--pink); }
    .pcard.wrong { border-style: dashed; opacity: .45; animation: shake .4s; cursor: default; }
    .pcard:disabled { cursor: default; }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .col { display: flex; flex-direction: column; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .replay { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }

    /* orbit positions */
    .opos { cursor: pointer; }
    .opos .ring { fill: #fff; stroke: #b9bdcb; stroke-width: 3; stroke-dasharray: 6 5; transition: fill .2s, stroke .2s; }
    .opos:hover .ring { stroke: var(--pink); fill: #fdf0f7; }
    .opos.sel .ring { stroke: var(--pink); stroke-dasharray: none; stroke-width: 4; fill: rgba(234,0,138,.16); }
    .opos.wrong { opacity: .3; cursor: default; }
    .opos.wrong .ring { stroke: var(--navy); fill: #fff; }
    .opos.right .ring { stroke: none; fill: rgba(234,0,138,.18); }
    .opos:focus { outline: none; }
    .opos:focus-visible .ring { stroke: var(--pink); stroke-width: 5; }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.pic { padding: 6px; line-height: 0; }
    .tile.mt { width: 128px; white-space: normal; font-size: 21px; line-height: 1.15; padding: 6px 8px; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }

    /* sort */
    .sort { display: grid; grid-template-columns: 1fr 360px 1fr; gap: 18px; width: 100%; height: 100%; }
    .bin { border: 3px solid var(--navy); border-radius: 8px; display: flex; flex-direction: column; overflow: visible; transition: box-shadow .2s; }
    .bin.pk { border-color: var(--pink); }
    .bin h3 { margin: 0; padding: 8px 16px 7px; font-family: var(--cond); font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--navy); }
    .bin.pk h3 { background: var(--pink); }
    .bin .sub { font-size: 18px; font-weight: 600; color: var(--mid-grey); padding: 8px 16px 0; }
    .bin .area { flex: 1; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; border-radius: 0 0 6px 6px; transition: background-color .2s; }
    .bin.hover .area, .bin.armed:hover .area { background: rgba(234,0,138,.06); }
    .bin.armed { box-shadow: 0 0 0 4px rgba(234,0,138,.15); cursor: pointer; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }

    /* drop slots */
    .dslot { border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; flex-shrink: 0; }
    .dslot.hover, .dslot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .dslot.armed { border-color: #e7a3c9; cursor: pointer; }
    .dslot.filled { border-color: transparent; background: none; }
    .dslot .tile { box-shadow: none; }

    /* match */
    .match { display: flex; gap: 30px; align-items: center; justify-content: center; width: 100%; }
    .mgrid { display: grid; grid-template-columns: repeat(4, 140px); gap: 16px 24px; }
    .mcell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .mslot { width: 140px; height: 70px; }
    .mpool { width: 318px; height: 340px; }

    /* order */
    .order { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
    .orow { display: flex; gap: 8px; align-items: flex-start; }
    .ocell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .onum { font-family: var(--cond); font-size: 20px; font-weight: 800; color: var(--mid-grey); line-height: 22px; }
    .oslot { width: 108px; height: 104px; }
    .oarr { margin-top: 68px; flex-shrink: 0; }
    .opool { width: 820px; min-height: 118px; flex-wrap: nowrap; }

    /* cloze */
    .clz { display: flex; flex-direction: column; gap: 18px; width: 100%; align-items: center; }
    .cloze { font-size: 26px; font-weight: 600; line-height: 1.95; max-width: 1080px; border-left: 8px solid var(--navy); padding-left: 24px; }
    .blank { display: inline-flex; vertical-align: middle; width: 150px; height: 48px; margin: 0 4px; }
    .blank .tile { font-size: 22px; padding: 4px 12px; }
    .cpool { width: 1080px; min-height: 72px; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 30px 60px; text-align: center; }
    .scorecard .big { font-family: var(--cond); font-size: 120px; font-weight: 900; color: var(--pink); line-height: 1; }
    .scorecard .dlbl { margin-top: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Checking <span>moon phases</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', SUN = '#f5b400', NS = 'http://www.w3.org/2000/svg';
const MOON = { lit: '#eef0f5', mare: '#d5d9e4', dark: '#30355f', darkMare: '#2b305a' };
const NIGHT = { dark: '#3a4072', darkMare: '#363b6c', edge: '#6a70a0' };
let scaleK = 1, uid = 0;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }

/* ---------- drawing helpers ---------- */
function arrowSVG(x, y, ang, len, o = {}) {
    const c = o.c || PK, sw = o.sw || 8, hw = o.hw || 13, hl = Math.min(o.hl || 22, len);
    if (len < 1) return '';
    const ux = Math.cos(ang), uy = Math.sin(ang), ex = x + ux * len, ey = y + uy * len, bx = ex - ux * hl, by = ey - uy * hl, px = -uy * hw, py = ux * hw;
    const f = v => v.toFixed(1);
    let s = len > hl ? `<line x1="${f(x)}" y1="${f(y)}" x2="${f(bx)}" y2="${f(by)}" stroke="${c}" stroke-width="${sw}"/>` : '';
    s += `<polygon points="${f(ex)},${f(ey)} ${f(bx + px)},${f(by + py)} ${f(bx - px)},${f(by - py)}" fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/>`;
    return s;
}
const replayIcon = `<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>`;

/* Moon as seen from Australia (Southern Hemisphere).
   p: 0 New, .25 First Quarter, .5 Full, .75 Third Quarter. Waxing is lit on the left. */
function litPath(p, r) {
    p = ((p % 1) + 1) % 1;
    const c = Math.cos(2 * Math.PI * p);
    if (c > .9995) return '';
    const litLeft = p < .5, cres = c > 0, rx = Math.abs(c) * r;
    const sL = litLeft ? 0 : 1, sT = (litLeft === cres) ? 1 : 0;
    return `M0 ${-r} A${r} ${r} 0 0 ${sL} 0 ${r} A${rx.toFixed(2)} ${r} 0 0 ${sT} 0 ${-r}Z`;
}
const MARIA = [[-.3, -.32, .24], [.18, -.4, .16], [.32, .02, .22], [-.12, .24, .16], [.1, .54, .11], [-.54, .16, .11], [-.04, -.04, .09]];
const maria = r => MARIA.map(([x, y, s]) => `<circle cx="${(x * r).toFixed(1)}" cy="${(y * r).toFixed(1)}" r="${(s * r).toFixed(1)}"/>`).join('');
function moonG(p, r, o = {}) {
    const id = 'mg' + (++uid), d = litPath(p, r), C = o.night ? NIGHT : MOON, edge = o.night ? NIGHT.edge : NV;
    return `<circle r="${r}" fill="${C.dark}"/><g fill="${C.darkMare}">${maria(r)}</g>` +
        (d ? `<clipPath id="${id}"><path d="${d}"/></clipPath><path d="${d}" fill="${MOON.lit}"/><g clip-path="url(#${id})" fill="${MOON.mare}">${maria(r)}</g>` : '') +
        `<circle r="${r}" fill="none" stroke="${edge}" stroke-width="${o.sw || Math.max(2, Math.min(3.5, r / 16)).toFixed(1)}"/>`;
}
function moonLive(g, r, o = {}) {
    const id = 'ml' + (++uid), C = o.night ? NIGHT : MOON, edge = o.night ? NIGHT.edge : NV;
    g.innerHTML = `<circle r="${r}" fill="${C.dark}"/><g fill="${C.darkMare}">${maria(r)}</g><clipPath id="${id}"><path class="cp"/></clipPath><path class="lp" fill="${MOON.lit}"/>
        <g clip-path="url(#${id})" fill="${MOON.mare}">${maria(r)}</g><circle r="${r}" fill="none" stroke="${edge}" stroke-width="3"/>`;
    const cp = g.querySelector('.cp'), lp = g.querySelector('.lp');
    return p => { const d = litPath(p, r) || 'M0 0'; cp.setAttribute('d', d); lp.setAttribute('d', d); };
}
const moonSvg = (p, r, w) => `<svg viewBox="${-w / 2} ${-w / 2} ${w} ${w}" width="${w}" height="${w}">${moonG(p, r)}</svg>`;
/* Moon seen from above: the half facing the Sun (left) is always lit */
const topMoon = r => `<circle r="${r}" fill="${MOON.dark}"/><path d="M0 ${-r} A${r} ${r} 0 0 0 0 ${r}Z" fill="${MOON.lit}"/><circle r="${r}" fill="none" stroke="${NV}" stroke-width="2.5"/>`;
const earth = (x, y, r) => `<g transform="translate(${x} ${y})"><circle r="${r}" fill="#2b3a70"/><path d="M0 ${-r} A${r} ${r} 0 0 0 0 ${r}Z" fill="#cfe1f6"/>
    <path d="M-14 -16 q8 -6 14 2 q-2 8 -9 9 q-6 -3 -5 -11Z M-22 6 q6 -2 9 4 q-1 7 -7 9 q-4 -6 -2 -13Z" fill="#9fc0e6"/><circle r="${r}" fill="none" stroke="${NV}" stroke-width="3"/></g>`;
function stars(w, h, n, seed) {
    let x = seed, s = '';
    const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < n; i++) s += `<circle cx="${(rnd() * w).toFixed(1)}" cy="${(rnd() * h).toFixed(1)}" r="${(.8 + rnd() * 1.4).toFixed(1)}" fill="#fff" opacity="${(.25 + rnd() * .5).toFixed(2)}"/>`;
    return s;
}
function nightPanel(p, w, h, title, r) {
    const cy = h / 2 + 6;

function mcCore(els, q, extra = {}) {

            els.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = i; refresh();
        };
        if (b.tagName.toLowerCase() !== 'button') b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.onclick(); } });
    });
    return {
        instr: extra.instr || 'Choose an answer, then press <b>Check</b>.',
        ready: () => sel !== null,
        check() {
            const b = els[sel];
            b.classList.remove('sel');
            if (sel === q.answer) { b.classList.add('right'); els.forEach(x => x.disabled = true); return { ok: true }; }
            b.classList.add('wrong'); b.disabled = true;
            const h = q.opts[sel].hint; sel = null; return { ok: false, hint: h };
        },
        done: extra.done

}

        const els = q.opts.map((o, i) => { const b = el('button', 'opt', `<span class="l">${L[i]}</span><span>${o.t}</span>`); g.appendChild(b); return b; });
        body.appendChild(g);
        return mcCore(els, q);
    },
    mcpic(q, body) {
        const g = el('div', 'pgrid');
        const els = q.opts.map((o, i) => { const b = el('button', 'pcard', `<span class="l">${L[i]}</span>${o.svg}${o.t ? `<span class="cap">${o.t}</span>` : ''}`); g.appendChild(b); return b; });
        body.appendChild(g);
        return mcCore(els, q);
    },
    mcside(q, body) {
        const side = el('div', 'scene', q.side);
        const col = el('div', 'col'); col.style.flex = '1';
        if (q.quote) col.appendChild(el('div', 'quote', q.quote));
        const g = el('div', 'opts' + (q.big ? ' big' : ''));
        const els = q.opts.map((o, i) => { const b = el('button', 'opt', `<span class="l">${L[i]}</span><span>${o.t}</span>`); g.appendChild(b); return b; });
        col.appendChild(g); body.append(side, col);
        body.style.justifyContent = 'flex-start';
        return mcCore(els, q, { done: () => q.reveal && q.reveal(side) });
    },
    match(q, body) {
        const wrap = el('div', 'match'), grid = el('div', 'mgrid'), pool = el('div', 'pool mpool');
        wrap.append(grid, pool); body.appendChild(wrap);
        const zones = shuffle(PH).map(ph => {
            const cell = el('div', 'mcell', moonSvg(ph.p, 46, 100));
            const s = el('div', 'dslot mslot'); s.tabIndex = 0; s.setAttribute('aria-label', 'Name box');
            cell.appendChild(s); grid.appendChild(cell);
            return { ...slotZone(s), key: ph.k };
        });
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
        shuffle(PH).forEach(ph => { const t = D.tile(ph.n); t.classList.add('mt'); t.k = ph.k; pool.appendChild(t); });
        return {
            instr: 'Drag a name under each Moon (or tap a name, then a box), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check: () => slotCheck(zones, (z, t) => P(t.k).d, 'names')
        };
    },
    orbit(q, body) {
        const sc = el('div', 'scene');
        sc.innerHTML = `<svg viewBox="0 0 600 330" width="600" height="330"></svg>`;
        const rp = el('button', 'replay', `${replayIcon}<span>Replay</span>`); sc.appendChild(rp);
        let g, els;
        if (q.opts[0].p !== undefined) {
            g = el('div', 'pgrid g22');
            els = q.opts.map((o, i) => { const b = el('button', 'pcard', `<span class="l">${L[i]}</span>${moonSvg(o.p, 54, 124)}`); g.appendChild(b); return b; });
        } else {
            g = el('div', 'opts big'); g.style.width = '500px';
            els = q.opts.map((o, i) => { const b = el('button', 'opt', `<span class="l">${L[i]}</span><span>${o.t}</span>`); g.appendChild(b); return b; });
        }
        body.append(sc, g);
        const S = orbitScene(sc.querySelector('svg'), { W: 600, H: 330, ex: 250, ey: 160, R: 112, mr: 17, inset: { x: 410, w: 180 } });
        let solved = false;
        const reveal = () => { S.setP(q.to); S.look(true); S.inset('fade', q.to); S.name(P(q.key).n); fadeIn(S.imG); };
        const go = async () => {
            runId++;
            S.look(false); S.inset('hidden'); S.name(''); S.setP(q.from);
            await wait(500);
            await play(2600, k => S.setP(q.from + (q.to - q.from) * easeInOut(k)));
            if (solved) reveal();
        };
        rp.onclick = go;
        go();
        return mcCore(els, q, { instr: 'Watch the Moon, choose an answer, then press <b>Check</b>.', done: () => { solved = true; runId++; reveal(); } });
    },
    tap(q, body) {
        const sc = el('div', 'scene');
        sc.innerHTML = `<svg viewBox="0 0 620 330" width="620" height="330"></svg>`;
        const night = el('div', 'scene', nightPanel(P(q.key).p, 280, 330, 'Tonight', 86));
        body.append(sc, night);
        const S = orbitScene(sc.querySelector('svg'), { W: 620, H: 330, ex: 340, ey: 160, R: 116, mr: 18 });
        S.moonVis(0);
        const els = PH.map((ph, i) => {
            const pt = S.pos(ph.p), g = document.createElementNS(NS, 'g');
            g.setAttribute('class', 'opos'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', `Orbit position ${i + 1}`);
            g.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
            g.innerHTML = `<circle class="ring" r="24"/>`;
            S.ghosts.appendChild(g); return g;
        });
        const qq = { answer: PH.findIndex(x => x.k === q.key), opts: PH.map(ph => ({ hint: `From there we would see ${ph.a}. ${q.tip}` })) };
        return mcCore(els, qq, { instr: 'Tap a spot on the orbit, then press <b>Check</b>.', done: () => {
            S.setP(P(q.key).p); S.look(true); fadeIn(night.querySelector('.pn')); night.querySelector('.pn').textContent = P(q.key).n;
            play(400, k => S.moonVis(k));
        } });
    },
    predict(q, body) {
        body.classList.add('pred');
        const sc = el('div', 'scene');
        sc.innerHTML = `<svg viewBox="0 0 600 330" width="600" height="330"></svg>`;
        const rp = el('button', 'replay', `${replayIcon}<span>Replay</span>`); sc.appendChild(rp);
        const g = el('div', 'opts');
        const els = q.opts.map(o => { const b = el('button', 'opt', `${glyph(o.g)}<span>${o.t}</span>`); g.appendChild(b); return b; });
        body.append(sc, g);
        const S = orbitScene(sc.querySelector('svg'), { W: 600, H: 330, ex: 250, ey: 160, R: 112, mr: 17, inset: { x: 410, w: 180 } });
        let solved = false, introDone = false;
        const run = async (full, skipIntro) => {
            if (!skipIntro) {
                introDone = false;
                S.inset('live'); S.setP(0); S.look(true); S.name('New Moon');
                await wait(900);
                S.name('');
                await play(3000, k => S.setP(.25 * easeInOut(k)));
                S.name('First Quarter');
                introDone = true;
            }
            if (!full) return;
            await wait(skipIntro ? 150 : 700);
            S.name('');
            await play(3000, k => S.setP(.25 + .25 * easeInOut(k)));
            S.name('Full Moon');
        };
        rp.onclick = () => { runId++; run(solved); };
        run(false);
        return mcCore(els, q, { instr: 'Watch, then choose what happens next and press <b>Check</b>.', done: () => { solved = true; const skip = introDone; runId++; run(true, skip); } });
    },
    sort(q, body) {
        const wrap = el('div', 'sort');
        const mk = (cls, h, sub) => { const b = el('div', 'bin ' + cls, `<h3>${h}</h3><div class="sub">${sub}</div><div class="area"></div>`); b.tabIndex = 0; return b; };
        const bx = mk('', q.bins[0][0], q.bins[0][1]), bn = mk('pk', q.bins[1][0], q.bins[1][1]);
        const pool = el('div', 'pool');
        wrap.append(bx, pool, bn); body.appendChild(wrap);
        const zones = [{ el: bx, box: bx.querySelector('.area'), cap: Infinity, key: 'x' }, { el: bn, box: bn.querySelector('.area'), cap: Infinity, key: 'n' }];
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
        shuffle(q.items).forEach(it => { const t = D.tile(it.html); t.classList.add('pic'); t.k = it.k; t.h = it.h; pool.appendChild(t); });
        return {
            instr: 'Drag each Moon into a group (or tap a Moon, then a group), then press <b>Check</b>.',
            ready: () => !pool.querySelector('.tile'),
            check() {
                const wrong = [];
                zones.forEach(z => z.box.querySelectorAll('.tile').forEach(t => {
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.k === z.key) t.classList.add('right'); else { t.classList.add('wrong'); wrong.push(t.h); }
                }));
                return wrong.length ? { ok: false, hint: (wrong.length > 1 ? `${wrong.length} Moons need moving. ` : '') + wrong[0] } : { ok: true };
            }
        };
    },
    order(q, body) {
        const wrap = el('div', 'order'), row = el('div', 'orow'), pool = el('div', 'pool opool');
        const zones = PH.map((ph, i) => {
            if (i) row.insertAdjacentHTML('beforeend', `<svg class="oarr" viewBox="0 0 20 20" width="20" height="20"><path d="M2 10 H16 M11 5 L16 10 L11 15" fill="none" stroke="${NV}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
            const cell = el('div', 'ocell', `<div class="onum">${i + 1}</div>`);
            const s = el('div', 'dslot oslot'); s.tabIndex = 0; s.setAttribute('aria-label', `Spot ${i + 1}`);
            cell.appendChild(s); row.appendChild(cell);
            return { ...slotZone(s), key: ph.k };
        });
        wrap.append(row, el('div', 'dlbl', 'One full cycle takes about a month'), pool);
        body.appendChild(wrap);
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
        const mk = ph => { const t = D.tile(moonSvg(ph.p, 34, 72)); t.classList.add('pic'); t.k = ph.k; return t; };
        const first = mk(PH[0]); first.classList.add('right'); zones[0].box.appendChild(first); zones[0].locked = true; zones[0].el.classList.add('filled');
        shuffle(PH.slice(1)).forEach(ph => pool.appendChild(mk(ph)));
        return {
            instr: 'Drag each Moon into a spot (or tap a Moon, then a spot), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check: () => slotCheck(zones, z => ORDER_HINT[z.key], 'Moons')
        };
    },
    cloze(q, body) {
        const wrap = el('div', 'clz'), para = el('div', 'cloze'), pool = el('div', 'pool cpool');
        para.innerHTML = q.text.replace(/\{(\d)\}/g, (_, i) => `<span class="dslot blank" data-i="${i}" tabindex="0" aria-label="Gap ${+i + 1}"></span>`);
        wrap.append(para, pool); body.appendChild(wrap);
        const zones = [...para.querySelectorAll('.blank')].map(s => { const i = +s.dataset.i; return { ...slotZone(s), key: q.answers[i], hint: q.hints[i] }; });
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
        shuffle(q.words).forEach(w => { const t = D.tile(w); t.k = w; pool.appendChild(t); });
        return {
            instr: 'Drag a word into each gap (or tap a word, then a gap), then press <b>Check</b>.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check: () => slotCheck(zones, z => z.hint, 'words')
        };
    }
};

/* predict glyphs: three small Moons show the change */
function glyph(k) {
    const seq = { grow: [.1, .25, .4], shrink: [.4, .25, .1], same: [.25, .25, .25], swap: [.25, null, .75] }[k];
    let s = '';
    seq.forEach((p, i) => {
        const x = 12 + i * 32;
        if (p === null) s += `<path class="gs" d="M${x - 9} 20 H${x + 7} M${x + 2} 14 L${x + 8} 20 L${x + 2} 26" stroke-linecap="round" stroke-linejoin="round" style="stroke-width:2.6"/>`;
        else s += `<g transform="translate(${x} 20)">${moonG(p, 11, { sw: 2 })}</g>`;
    });
    return `<svg class="gly" viewBox="0 0 88 40" width="74" height="34">${s}</svg>`;
}

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sel = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sel) sel.classList.remove('sel'); sel = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sel && !z.locked) put(sel, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(html) {
        const t = el('span', 'tile', html);
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right')) return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { put(t, pool); return; }
            if (sel === t) { deselect(); return; }
            deselect(); sel = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); render(); });
</script>
